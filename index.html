  </div>`;
}
/* ---------- 生涯時間軸：輸出成可下載圖片 ---------- */
function _tlHonorRows(){
  const stints=careerStints();
  const ORDER=["MVP","FMVP","冠軍","DPOY","ROTY","得分王","籃板王","助攻王",
    "年度一隊","年度二隊","年度三隊","最佳陣容","新秀一隊","新秀二隊","本土MVP","國內MVP","明星賽"];
  const MAJOR=new Set(["MVP","FMVP","冠軍","DPOY","得分王","年度一隊"]);
  const rank=a=>{const i=ORDER.indexOf(a);return i<0?999:i;};
  return stints.map(st=>{
    const map={}; st.awards.forEach(a=>{ if(!a||/報銷|復健/.test(a))return; map[a]=(map[a]||0)+1; });
    const honors=Object.keys(map).sort((a,b)=>rank(a)-rank(b))
      .map(a=>({name:a+(map[a]>1?` ×${map[a]}`:""),major:MAJOR.has(a)}));
    const yr = st.startYear===st.endYear ? `${st.startYear}` : `${st.startYear}~${st.endYear}`;
    return {st,honors,yr};
  });
}
// 中華隊列（供時間軸圖用）：白/藍球衣，附配色
function _tlNationalRows(){
  return nationalStints().map((s,i)=>({
    natl:true, team:s.team, white:s.white, yr:s.yr, apps:s.apps, honors:s.honors,
    col:nationalColors(s.white), _sec:i===0
  }));
}
// 把一列榮譽做自動換行排版，回傳每個 pill 的相對座標與行數
function _tlPillLayout(x,honors,x0,maxRight){
  x.font="700 22px 'Noto Sans TC',sans-serif";
  const pgap=10; let px=x0,line=0; const out=[];
  honors.forEach(h=>{
    const w=x.measureText(h.name).width+30;
    if(px+w>maxRight && px>x0){px=x0;line++;}
    out.push({name:h.name,major:h.major,x:px,line,w});
    px+=w+pgap;
  });
  return {pills:out,lines:honors.length?line+1:0};
}
function drawCareerTimeline(cv){
  const clubRows=_tlHonorRows();
  const natRows=_tlNationalRows();
  const rows=[...clubRows,...natRows];
  const W=900, x=cv.getContext("2d");
  const OSW=(w,s)=>`${w} ${s}px Oswald`;
  const NF=(w,s)=>`${w} ${s}px 'Noto Sans TC',sans-serif`;
  const spineX=112, contentX=182, contentR=W-54, pillH=40, pgap=10;
  const headTop=200; // 表頭高度
  const bannerH=52;  // 退休球衣旗幟預留高度
  const sectionH=56; // 中華隊分段標題預留高度
  // 該隊是否為你退休球衣（以 聯盟|隊名 比對，回鍋同隊的每一段都算）
  const retiredSet=new Set((G._jerseyTeams||[]).map(j=>j.league+"|"+j.team));
  const isRetired=st=>retiredSet.has(st.league+"|"+st.team);
  // --- 版面量測（先算總高） ---
  let y=headTop;
  rows.forEach(r=>{
    const lo=_tlPillLayout(x,r.honors,contentX,contentR);
    r._ret = !r.natl && isRetired(r.st);
    const bh=r._ret?bannerH:0;
    const sh=r._sec?sectionH:0;
    r._top=y;
    r._secY=y+sh;                          // 分段標題下緣（節點區起點）
    r._node=y+sh+bh+42;                    // 球衣節點中心
    const pillBlock = lo.lines? (lo.lines*pillH+(lo.lines-1)*pgap) : 26;
    r._height = sh + bh + 12 + 84 + 10 + pillBlock + 22;
    y += r._height;
  });
  const H = Math.max(y+70, headTop+180);
  cv.width=W; cv.height=H;
  // --- 背景 / 邊框 / 頂帶 ---
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#16233d");g.addColorStop(.5,"#0d1626");g.addColorStop(1,"#0a0f1a");
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle="#2A3A57";x.lineWidth=6;x.strokeRect(12,12,W-24,H-24);
  const g2=x.createLinearGradient(0,0,W,0);g2.addColorStop(0,"#FF6A2C");g2.addColorStop(1,"#E4551B");
  x.fillStyle=g2;x.fillRect(12,12,W-24,10);
  x.textBaseline="alphabetic";x.textAlign="left";
  // --- 表頭 ---
  x.fillStyle="#F2B84B";x.font=OSW(700,26);x.fillText("HARDWOOD LIFE · 生涯時間軸",50,66);
  x.fillStyle="#F4F2EC";x.font=NF(900,46);
  x.fillText(`${G.name}`,50,124);
  const nameW=x.measureText(G.name).width;
  x.fillStyle="#FF6A2C";x.font=OSW(700,34);x.fillText("#"+G.jersey,50+nameW+18,124);
  x.fillStyle="#9DB0CC";x.font=NF(500,26);
  const natApps=natRows.reduce((s,r)=>s+r.apps,0);
  const subtitle=`${POSITIONS[G.pos].name} · ${archetype()}　|　出身 ${G.home}　|　效力 ${clubRows.length} 支球隊`+(natApps?`　|　中華隊 ${natApps} 次`:"");
  x.fillText(subtitle,50,164);
  x.strokeStyle="#2A3A57";x.lineWidth=2;x.beginPath();x.moveTo(50,184);x.lineTo(W-50,184);x.stroke();
  // --- 時間軸主線（俱樂部：木色 / 中華隊：藍色） ---
  const spineSeg=(a,b,col)=>{ if(b<=a)return; x.strokeStyle=col;x.globalAlpha=.55;x.lineWidth=4;
    x.beginPath();x.moveTo(spineX,a);x.lineTo(spineX,b);x.stroke();x.globalAlpha=1; };
  if(clubRows.length>1) spineSeg(clubRows[0]._node, clubRows[clubRows.length-1]._node, "#C8873F");
  if(natRows.length>1)  spineSeg(natRows[0]._node,  natRows[natRows.length-1]._node,  "#4DA3FF");
  // --- 逐段繪製 ---
  rows.forEach(r=>{
    const cy=r._node;
    // 中華隊分段標題（第一列中華隊時畫一次）
    if(r._sec){
      const sy=r._secY-18;
      x.strokeStyle="#2A3A57";x.lineWidth=2;x.beginPath();x.moveTo(50,sy);x.lineTo(W-50,sy);x.stroke();
      x.fillStyle="#4DA3FF";x.font=OSW(700,22);x.textAlign="left";
      x.fillText("國際賽 · 中華隊",50,sy-8);
    }
    if(r.natl){
      // ===== 中華隊球衣 =====
      const c=r.col;
      roundRect(x,spineX-42,cy-42,84,84,14);
      x.fillStyle=c.p;x.fill();x.strokeStyle=c.s;x.lineWidth=5;x.stroke();
      x.fillStyle=c.ink;x.font=OSW(700,40);x.textAlign="center";
      x.fillText(""+G.jersey,spineX,cy+14);x.textAlign="left";
      x.fillStyle="#F4F2EC";x.font=NF(900,36);x.fillText(r.team,contentX,cy-2);
      const tnW=x.measureText(r.team).width;
      x.fillStyle="#4DA3FF";x.font=OSW(600,22);x.fillText(r.white?"瓊斯盃":"國際賽",contentX+tnW+16,cy-4);
      x.fillStyle="#9DB0CC";x.font=OSW(600,24);x.fillText(`${r.yr}  ·  ${r.apps} 次`,contentX,cy+30);
    }else{
      // ===== 俱樂部球衣 =====
      const st=r.st, c=teamColors(st.team);
      const ink=isLightColor(c.p)?"#17171C":"#FFFFFF";
      if(r._ret){
        x.save();
        x.shadowColor="rgba(242,184,75,.85)";x.shadowBlur=22;
        x.strokeStyle="#F2B84B";x.lineWidth=3;
        roundRect(x,spineX-49,cy-49,98,98,18);x.stroke();
        x.restore();
      }
      roundRect(x,spineX-42,cy-42,84,84,14);
      x.fillStyle=c.p;x.fill();x.strokeStyle=r._ret?"#F2B84B":c.s;x.lineWidth=5;x.stroke();
      x.fillStyle=ink;x.font=OSW(700,40);x.textAlign="center";
      x.fillText(""+G.jersey,spineX,cy+14);x.textAlign="left";
      if(r._ret){
        x.textAlign="center";
        x.font=NF(700,20);
        const label="退休球衣";
        const bw=x.measureText(label).width+34, bx=spineX-bw/2, bh2=34;
        const byTop=cy-42-46, byBot=byTop+bh2;
        x.strokeStyle="#C8873F";x.lineWidth=2;x.beginPath();x.moveTo(spineX,byBot);x.lineTo(spineX,cy-42);x.stroke();
        const gb=x.createLinearGradient(0,byTop,0,byBot);gb.addColorStop(0,"#FFD98A");gb.addColorStop(1,"#F2B84B");
        x.beginPath();
        x.moveTo(bx+8,byTop);x.arcTo(bx+bw,byTop,bx+bw,byTop+8,8);x.lineTo(bx+bw,byBot);
        x.lineTo(spineX+7,byBot);x.lineTo(spineX,byBot+8);x.lineTo(spineX-7,byBot);
        x.lineTo(bx,byBot);x.lineTo(bx,byTop+8);x.arcTo(bx,byTop,bx+8,byTop,8);x.closePath();
        x.fillStyle=gb;x.fill();x.strokeStyle="#C8873F";x.lineWidth=2;x.stroke();
        x.fillStyle="#3A2A05";x.fillText("★ "+label,spineX,byTop+23);
        x.textAlign="left";
      }
      x.fillStyle="#F4F2EC";x.font=NF(900,36);x.fillText(st.team,contentX,cy-2);
      const tnW=x.measureText(st.team).width;
      x.fillStyle="#FF6A2C";x.font=OSW(600,22);x.fillText(lname(st.league),contentX+tnW+16,cy-4);
      x.fillStyle="#9DB0CC";x.font=OSW(600,24);x.fillText(`${r.yr}  ·  ${st.seasons} 季`,contentX,cy+30);
    }
    // 榮譽 pills（俱樂部與中華隊共用；以節點為基準）
    const pillTop=r._node+64;
    if(r.honors.length){
      const lo=_tlPillLayout(x,r.honors,contentX,contentR);
      x.font=NF(700,22);
      lo.pills.forEach(p=>{
        const py=pillTop+p.line*(pillH+pgap);
        if(p.major){ x.fillStyle="rgba(242,184,75,.14)";x.strokeStyle="rgba(242,184,75,.5)"; }
        else       { x.fillStyle="#0d1626";x.strokeStyle="#2A3A57"; }
        roundRect(x,p.x,py,p.w,pillH,10);x.lineWidth=2;x.fill();x.stroke();
        x.fillStyle=p.major?"#F2B84B":"#9DB0CC";
        x.fillText(p.name,p.x+15,py+27);
      });
    }else{
      x.fillStyle="#6B7F9E";x.font=NF(500,22);x.fillText("—",contentX,pillTop+24);
    }
  });
  // --- 頁尾 ---
  x.fillStyle="#6B7F9E";x.font=OSW(500,20);x.textAlign="center";
  x.fillText("籃球人生 · Hardwood Life　—　背號 "+G.jersey+" 的生涯足跡",W/2,H-30);
  x.textAlign="left";
}

function roundRect(x,rx,ry,w,h,r){x.beginPath();x.moveTo(rx+r,ry);x.arcTo(rx+w,ry,rx+w,ry+h,r);
  x.arcTo(rx+w,ry+h,rx,ry+h,r);x.arcTo(rx,ry+h,rx,ry,r);x.arcTo(rx,ry,rx+w,ry,r);x.closePath();}
function drawRadar(x,cx,cy,R){
  const keys=ATTR_KEYS,n=keys.length;
  const ang=i=>-Math.PI/2 + i*2*Math.PI/n;
  // grid
  x.strokeStyle="#2A3A57";x.lineWidth=1.5;
  for(let ring=1;ring<=3;ring++){x.beginPath();
    for(let i=0;i<=n;i++){const r=R*ring/3,a=ang(i%n);const px=cx+r*Math.cos(a),py=cy+r*Math.sin(a);
      i===0?x.moveTo(px,py):x.lineTo(px,py);}x.stroke();}
  // value
  x.beginPath();
  for(let i=0;i<=n;i++){const v=G.attr[keys[i%n]]/99,a=ang(i%n);const r=R*v;
    const px=cx+r*Math.cos(a),py=cy+r*Math.sin(a);i===0?x.moveTo(px,py):x.lineTo(px,py);}
  x.closePath();x.fillStyle="rgba(255,106,44,.28)";x.fill();x.strokeStyle="#FF6A2C";x.lineWidth=3;x.stroke();
  // labels
  x.fillStyle="#9DB0CC";x.font="600 18px 'Noto Sans TC',sans-serif";x.textAlign="center";
  keys.forEach((k,i)=>{const a=ang(i),r=R+24;x.fillText(ATTR_LABEL[k],cx+r*Math.cos(a),cy+r*Math.sin(a)+6);});
  x.textAlign="left";
}
function drawCareerChart(x,ox,oy,w,h){
  const data=G.seasonHistory;
  x.fillStyle="#9DB0CC";x.font="700 24px 'Noto Sans TC',sans-serif";x.textAlign="left";
  x.fillText("生涯每季平均（得分／籃板／助攻）",ox,oy-14);
  // frame
  x.fillStyle="#0d1626";x.strokeStyle="#2A3A57";x.lineWidth=2;roundRect(x,ox,oy,w,h,10);x.fill();x.stroke();
  if(data.length<1)return;
  const maxV=Math.max(12,...data.map(s=>Math.max(s.ppg,s.rpg,s.apg)));
  const pad=14; const gx=ox+pad,gw=w-pad*2,gy=oy+pad,gh=h-pad*2-16;
  const X=i=>data.length<=1?gx+gw/2:gx+gw*i/(data.length-1);
  const Y=v=>gy+gh-(v/maxV)*gh;
  const series=[["ppg","#FF6A2C"],["rpg","#4DA3FF"],["apg","#3FBF7F"]];
  series.forEach(([key,col])=>{
    x.beginPath();data.forEach((s,i)=>{const px=X(i),py=Y(s[key]);i===0?x.moveTo(px,py):x.lineTo(px,py);});
    x.strokeStyle=col;x.lineWidth=3;x.stroke();
    data.forEach((s,i)=>{x.beginPath();x.arc(X(i),Y(s[key]),3.5,0,7);x.fillStyle=col;x.fill();});
  });

  const leg=[["得分","#FF6A2C"],["籃板","#4DA3FF"],["助攻","#3FBF7F"]];

/* ---------- 各聯盟累積數據 ---------- */
function leagueAggregates(){
  const byLg={}; const order=[];
  G.seasonHistory.filter(s=>s.stage==="pro").forEach(s=>{
    if(!byLg[s.league]){byLg[s.league]={league:s.league,yrs:0,gp:0,sp:0,pts:0,reb:0,ast:0,stl:0,blk:0,fgN:0,tpN:0,fgD:0};order.push(s.league);}
    const b=byLg[s.league]; b.yrs++; b.gp+=s.gp; b.pts+=s.ppg*s.gp; b.reb+=s.rpg*s.gp; b.ast+=s.apg*s.gp;
    b.stl+=s.spg*s.gp; b.blk+=s.bpg*s.gp; b.fgN+=s.fg*s.gp; b.tpN+=s.tp*s.gp; b.fgD+=s.gp;
  });
  return order.map(l=>{const b=byLg[l];const g=b.gp||1;
    return {league:l,yrs:b.yrs,gp:b.gp,ppg:round(b.pts/g,1),rpg:round(b.reb/g,1),apg:round(b.ast/g,1),
      spg:round(b.stl/g,1),bpg:round(b.blk/g,1),fg:Math.round(b.fgN/b.fgD),tp:Math.round(b.tpN/b.fgD)};});
}
function intlAggregate(){
  const h=G.intlHistory; if(!h.length)return null;
  const g=h.length; const avg=k=>round(h.reduce((a,r)=>a+r[k],0)/g,1);
  return {events:g, ppg:avg("ppg"),rpg:avg("rpg"),apg:avg("apg"),medals:G.intlMedals};
}

  const phaseBtns=defaultPhaseActions();
  const acts=_actions.length?_actions:phaseBtns;
  acts.forEach((a,i)=>{html+=`<button class="btn ${a.cls||""}" data-act="${i}">${a.t}</button>`;});
  if(showStatsBtn) html=`<button class="iconbtn" data-stats="1">📊</button>`+html;
  bar.innerHTML=html;
  bar.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>acts[parseInt(b.dataset.act)].fn()));
  const sb=bar.querySelector("[data-stats]");if(sb)sb.addEventListener("click",()=>{G._prevPhase=G.phase;G.phase="stats";render();});
  // 各 phase 專屬事件（offer/決策等）
  bindPhaseSpecific();
}
function defaultPhaseActions(){
  if(!G)return [];
  switch(G.phase){
    case "intro": return [{t:"踏上球場，開始高中生涯 ▶",cls:"gold",fn:startSeason}];
    case "decline": return [{t:"接受現實，繼續前進 ▶",cls:"gold",fn:afterDeclineCard}];
    case "commit": return [{t:"開始新篇章 ▶",cls:"gold",fn:afterCommitCard}];
    case "allocate": return [{t:"完成分配，開始賽季 ▶",cls:"gold",fn:commitAllocation}];
    case "review": return [{t:"繼續 ▶",cls:"gold",fn:afterReview}];
    case "surgery": return G._surgeryDone?surgeryContinueAction():[];
    case "draftDeclare": return [{t:"確認參加選秀 ▶",cls:"gold",fn:confirmDraft}];
    case "nbaCombine": {
      const d=G._combineData, step=G._combineStep||0;
      if(!d)return [];
      if(step<d.tests.length)return [{t:`🎲 進行 ${d.tests[step].name}`,cls:"gold",fn:runNextCombineTest}];
      return [{t:"帶著成績單進入選秀會 ▶",cls:"gold",fn:finishNbaCombine}];
    }
    case "nbaCombineRejected": return [{t:"返回職業選秀，改選其他聯盟 ▶",cls:"gold",fn:continueAfterCombineRejection}];
    case "rookieOption": return [{t:G._rookieOptionCard&&G._rookieOptionCard.exercise?"接受球隊決定，準備新球季 ▶":"進入自由市場 ▶",cls:"gold",fn:continueRookieOption}];
    case "nbaUndrafted": return [{t:"查看選秀夜後的職業機會 ▶",cls:"gold",fn:continueAfterNbaUndrafted}];
    case "overseasOffer": return [];
    case "trade": return [{t:"了解，繼續 ▶",cls:"",fn:processOffseason}];
    case "intl": return G._intlResult?[{t:"繼續 ▶",cls:"gold",fn:intlContinue}]:[];
    case "jones": return jonesActions();
    default: return [];
  }
}
function bindPhaseSpecific(){
  const s=$("#stage");if(!s)return;
  if(G.phase==="allocate") bindAllocate();
  // 手術抉擇
  if(G.phase==="surgery"){
    const go=s.querySelector("#doSurgery"); if(go) go.addEventListener("click",startSurgery);
    const sk=s.querySelector("#skipSurgery"); if(sk) sk.addEventListener("click",skipSurgery);
  }
  // 賽季回顧的治療手術按鈕
  const es=s.querySelector("#electiveSurgery"); if(es) es.addEventListener("click",electiveSurgery);
  // 交易謠言：兩個選項
  if(G.phase==="tradeRumor") s.querySelectorAll("[data-rumor]").forEach(b=>b.addEventListener("click",()=>resolveTradeRumor(parseInt(b.dataset.rumor))));
  // 高中決策
  s.querySelectorAll("[data-offer]").forEach(b=>b.addEventListener("click",()=>{
    const i=parseInt(b.dataset.offer);
    if(G.phase==="hsDecision") chooseCollege(G._hsOffers[i]);
    else if(G.phase==="freeAgency") signOffer(G._offers[i]);
  }));
  const pb=s.querySelector("[data-pro]");if(pb)pb.addEventListener("click",goProFromHS);
  const db=s.querySelector("[data-declare]");if(db)db.addEventListener("click",declareFromCollege);
  const st=s.querySelector("[data-stay]");if(st)st.addEventListener("click",stayInCollege);
  const kp=s.querySelector("[data-keep]");if(kp)kp.addEventListener("click",()=>{keepPlaying();});
  const htw=s.querySelector("[data-hometw]");if(htw)htw.addEventListener("click",returnToTaiwan);
  const rt=s.querySelector("[data-retire]");if(rt)rt.addEventListener("click",confirmRetire);
  const pi=s.querySelector("#playIntl");if(pi)pi.addEventListener("click",playIntl);
  const di=s.querySelector("#declineIntl");if(di)di.addEventListener("click",declineIntl);
  if(G.phase==="jones") jonesBind();
  // 選秀：台灣聯盟複選
  s.querySelectorAll("[data-dleague]").forEach(b=>b.addEventListener("click",()=>toggleDraftLeague(b.dataset.dleague)));
  // 選秀結果：加盟
  s.querySelectorAll("[data-draft]").forEach(b=>b.addEventListener("click",()=>signDraft(G._offers[parseInt(b.dataset.draft)])));
  // 海外報價
  const ao=s.querySelector("#acceptOverseas");if(ao)ao.addEventListener("click",acceptOverseas);
  const dor=s.querySelector("#declineOverseas");if(dor)dor.addEventListener("click",declineOverseas);
}

/* ---------- Start screen ---------- */
let _startPos="SG";
function renderStart(){
  app.innerHTML=`
    <div class="ver-badge">${VERSION}</div>
    <div class="hero">
      <div class="hero-glow"></div>
      <h1>籃球<br>人生</h1>
      <div class="en">HARDWOOD LIFE</div>
      <p class="sub">從台灣高中或美國高中出發，用骰子與抉擇打造一位球員的完整生涯——高中、大學、台灣職籃、韓國、日本、中國、美國，直到名人堂。</p>
      <div class="hero-floor"><svg viewBox="0 0 400 160" preserveAspectRatio="xMidYMax slice">
        <defs>
          <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3a2a16"/><stop offset="1" stop-color="#1a1108"/>
          </linearGradient>
          <clipPath id="fl"><path d="M150 6 L250 6 L440 160 L-40 160 Z"/></clipPath>
        </defs>
        <g clip-path="url(#fl)">
          <path d="M150 6 L250 6 L440 160 L-40 160 Z" fill="url(#wood)"/>
          <g stroke="#000" stroke-opacity=".22" stroke-width="1">
            <line x1="170" y1="6" x2="70" y2="160"/><line x1="190" y1="6" x2="150" y2="160"/>
            <line x1="210" y1="6" x2="250" y2="160"/><line x1="230" y1="6" x2="330" y2="160"/>
          </g>
          <g stroke="#000" stroke-opacity=".18" stroke-width="1">
            <line x1="-40" y1="60" x2="440" y2="60"/><line x1="-40" y1="100" x2="440" y2="100"/>
            <line x1="-40" y1="132" x2="440" y2="132"/>
          </g>
          <g fill="none" stroke="#FF6A2C" stroke-opacity=".55" stroke-width="2">
            <path d="M182 6 L218 6 L246 96 L154 96 Z"/>
            <ellipse cx="200" cy="96" rx="46" ry="13"/>
          </g>
          <path d="M182 6 L218 6 L246 96 L154 96 Z" fill="#FF6A2C" fill-opacity=".07"/>
        </g>
      </svg></div>
    </div>
    <div class="wrap">
      <div class="panel">
        <div class="field"><label class="label">球員名字</label>
          <div class="name-row">
            <input type="text" id="pName" placeholder="輸入你的球員名字" maxlength="10" value="林逐夢">
            <button class="dice-btn" id="nameDice" title="隨機名字">🎲</button>
          </div></div>
        <div class="field"><label class="label">背號（0–99）</label>
          <div class="name-row">
            <input type="number" id="pJersey" min="0" max="99" value="7" style="max-width:110px">
            <button class="dice-btn" id="jerseyDice" title="隨機背號">🎲</button>
          </div></div>
          <div class="field">
        <label>球員背景</label>
        <select id="iptBg" style="width:100%; background:#0d1626; border:1px solid var(--line); border-radius:10px; padding:12px 14px; color:var(--ink); font-size:16px; font-family:inherit;">
          <option value="local">本土生 (台灣高中出發)</option>
          <option value="asian_american">華裔球員（美國高中出發）</option>
        </select>
      </div>
        <div class="field"><label class="label" id="homeLabel">出身地</label>
          <div class="chips" id="homeChips"></div></div>
        <div class="field"><label class="label">場上位置</label>
          <div class="chips" id="posChips"></div>
          <p class="small mt8" id="posDesc"></p></div>
        <div class="field"><label class="label">種子碼（可分享／重現同一份運氣，留空＝隨機）</label>
          <div class="name-row">
            <input type="text" id="pSeed" placeholder="留空隨機，或貼上朋友的種子碼" maxlength="12">
            <button class="dice-btn" id="seedDice" title="隨機種子碼">🎲</button>
          </div>
          <p class="small mt8" style="color:var(--faint)">相同的種子碼＋相同的選擇，會得到完全一樣的生涯發展。</p></div>
      </div>
      <button class="btn gold" id="startBtn">開始籃球人生 🏀</button>
      <p class="small center mt12">每個決定都會改變你的生涯軌跡。準備好了嗎？</p>
      <p class="small center" style="padding-bottom:24px;color:var(--faint)">聯絡我：<a href="https://www.threads.com/@twbasketball__life" target="_blank" rel="noopener" style="color:var(--orange);text-decoration:none;font-weight:700">twbasketball__life</a></p>
    </div>`;
  let home="";
  const hc=$("#homeChips");
  function rebuildHomeChips(){
    const bg=$("#iptBg").value;
    const homes=START_HOMES[bg]||START_HOMES.local;
    home=homes[0]; hc.innerHTML="";
    const hl=$("#homeLabel"); if(hl)hl.textContent=bg==="asian_american"?"美國成長地":"出身地";
    homes.forEach((h,i)=>{const el=document.createElement("button");el.className="chip"+(i===0?" on":"");
      el.textContent=h;el.onclick=()=>{home=h;hc.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));el.classList.add("on");};hc.appendChild(el);});
  }
  $("#iptBg").addEventListener("change",rebuildHomeChips);
  rebuildHomeChips();
  const pc=$("#posChips");
  Object.entries(POSITIONS).forEach(([k,v])=>{const el=document.createElement("button");
    el.className="chip"+(k===_startPos?" on":"");el.textContent=`${v.abbr} ${v.name}`;
    el.onclick=()=>{_startPos=k;pc.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));el.classList.add("on");updatePosDesc();};pc.appendChild(el);});
  function updatePosDesc(){const v=POSITIONS[_startPos];
    const strong=ATTR_KEYS.filter(k=>v.w[k]>=1.2).map(k=>ATTR_LABEL[k]);
    $("#posDesc").textContent=`起手側重：${strong.join("、")}。位置會影響能力權重與籃板/助攻上限。`;}
  updatePosDesc();
  $("#nameDice").addEventListener("click",()=>{ $("#pName").value=randomName(); });
  $("#jerseyDice").addEventListener("click",()=>{ $("#pJersey").value=rint(0,99); });
  $("#seedDice").addEventListener("click",()=>{ $("#pSeed").value=makeSeed(); });
$("#startBtn").addEventListener("click",()=>{
    const name=($("#pName").value||"").trim()||randomName();
    let jn=parseInt($("#pJersey").value); if(isNaN(jn)) jn=rint(0,99); jn=clamp(jn,0,99);
    const seed=($("#pSeed").value||"").trim();
    
    // 👇 新增這行：抓取玩家選擇的背景 (bg)
    const bg = $("#iptBg").value; 
    
    // 👇 修改這行：將 bg 作為第六個參數傳入 newGame
    newGame(name,_startPos,home,jn,seed, bg); 
  });
  window.scrollTo(0,0);
}

/* ---------- Boot ---------- */
render();
</script>
