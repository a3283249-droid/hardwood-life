function hasTitle(id){ return (G.titles||[]).some(t=>t.id===id); }
function grantTitle(id){
  if(!TITLE_DEFS[id]||hasTitle(id))return;
  const d=TITLE_DEFS[id];
  G.titles=G.titles||[];
  G.titles.push({id,name:d.name,good:d.good,cssClass:d.cssClass,desc:d.desc,effect:d.effect||""});
  if(d.buff){ for(const k in d.buff){
    if(k==="pot"){ G.potential=clamp(G.potential+d.buff[k],72,99); }
    else if(k in G.attr) G.attr[k]=clamp(G.attr[k]+d.buff[k],15,99);
    else if(k==="fame") G.fame=clamp(G.fame+d.buff[k],0,100);
    else if(k==="morale") G.morale=clamp(G.morale+d.buff[k],0,100); } }
  G._newTitle=d.name; // 供賽季回顧提示
}
function titleBadgesHTML(){
  if(!G.titles||!G.titles.length)return "";
  return `<div class="title-wrap">`+G.titles.map((t,i)=>`<span class="title-badge ${t.cssClass ? t.cssClass : (t.good?"good":"bad")}" data-title-idx="${i}" onclick="showTitleInfo(${i})">${t.name}</span>`).join("")+`<span class="title-hint">（點稱號看說明）</span></div>`;
}
function showTitleInfo(i){
  const t=G.titles&&G.titles[i]; if(!t)return;
  const msg=`${t.name}｜${t.desc}${t.effect&&t.effect!=="—"?"（"+t.effect+"）":""}`;
  toast(msg,4200);
}
// 各種情境檢查
function teamCityMatchesHome(team,home){ return team && home && team.indexOf(home)===0; }
function checkSeasonTitles(s){
  // 隊魂 / 一人一城：同隊效力賽季數
  if(s.stage==="pro"){
    G._teamTenure=G._teamTenure||{};
    G._teamTenure[s.team]=(G._teamTenure[s.team]||0)+1;
    if(G._teamTenure[s.team]>10) grantTitle("teamSoul");
    if(G._teamTenure[s.team]>12) grantTitle("oneCity");
  }
  // 鐵人：職業季全勤（未因傷減量）且健康高
  if(s.stage==="pro" && s.gp>=leagueGP(s.league) && G.health>=85) grantTitle("ironman");
  // 打鐵匠：整季命中率極低
  if(s.stage==="pro" && s.fg<=38 && s.gp>=leagueGP(s.league)*.6) grantTitle("bricklayer");
  // 更衣室隱憂：士氣長期低迷
  if(G.morale<=28) grantTitle("locker");
  // HBL 封王
  if(s.stage==="高中" && s.tourney && s.tourney.champ) grantTitle("hsKing");
  // 冠軍基因（職業奪冠）
  if(s.stage==="pro" && s.champion) grantTitle("champDNA");
  // 玻璃人：兩次以上重傷；薄玻璃：三次以上
  if((G.majorInjuries||0)>=2) grantTitle("glass");
  if((G.majorInjuries||0)>=3) grantTitle("fragile");
  // NCAA 之光 / 全美第一
  if(s.usRank){ if(s.usRank<=25) grantTitle("ncaaStar"); if(s.usRank===1) grantTitle("usaTop"); }
  // 累積榮譽型稱號
  const c=G.careerAwards;
  if((c["得分王"]||0)>=2) grantTitle("scoringMachine");
  if((c["助攻王"]||0)>=2) grantTitle("dimeKing");
  if((c["籃板王"]||0)>=2) grantTitle("glassCleaner");
  if((c.DPOY||0)>=1) grantTitle("ironWall");
  if((c["冠軍"]||0)>=3) grantTitle("ringCollector");
  if((G.intlMedals||0)>=2) grantTitle("goldGen");
  // 日職巨星：在日職有明星等級評價
  if(s.stage==="pro" && s.league==="日職 B.League"){ const ev=leagueEval("日職 B.League");
    if(ev && (ev.label.indexOf("當家")>=0||ev.label.indexOf("明星")>=0||ev.label.indexOf("傳奇")>=0)) grantTitle("jpStar"); }
  // 世界舞台：NBA + 日職 + 任一台灣聯盟都打過
  const played=new Set(G.seasonHistory.filter(x=>x.stage==="pro").map(x=>x.league));
  if(played.has("NBA")&&played.has("日職 B.League")&&(played.has("SBL")||played.has("P+")||played.has("TPBL"))) grantTitle("worldStage");
  // 人氣王：名氣曾破 95
  if(G.fame>=95) grantTitle("fanFavorite");
  // 關鍵先生：職業聯賽、奪冠、且該季場均得分 >= 26
  if(s.stage === "pro" && s.champion && s.ppg >= 26) grantTitle("clutchAssassin");
  // 銅牆鐵壁：單季抄截 >= 2.0 且 阻攻 >= 1.5
  if(s.stage === "pro" && s.spg >= 2.0 && s.bpg >= 1.5) grantTitle("defensiveAnchor");
  // 行走印鈔機：生涯金錢大於等於 50000 萬 (5億)
  if(G.money >= 50000) grantTitle("cashCow");
  // 不老神木：年齡 >= 38 歲，且出賽場次大於聯盟總場次的 60%
  if(s.stage === "pro" && G.age >= 38 && s.gp >= leagueGP(s.league) * 0.6) grantTitle("evergreen");
  // 薪水小偷：領「頂薪」合約 (cType === "max")，但賽季表現分 (seasonScore) 低於 60
  if(s.stage === "pro" && G.contract && G.contract.cType === "max" && s.seasonScore < 60) grantTitle("overpaid");
  // 氣氛大師：士氣極低 (<= 15)
  if(G.morale <= 15) grantTitle("toxic");
  // 大滿貫：高中、大學、職業三階段皆奪冠
  const wonHS = G.seasonHistory.some(h => h.stage === "高中" && h.champion);
  const wonCollege = G.seasonHistory.some(h => h.stage === "大學" && h.champion);
  const wonPro = G.seasonHistory.some(h => h.stage === "pro" && h.champion);
  if (wonHS && wonCollege && wonPro) grantTitle("grandSlam");
}
/* ---------- 全美排名（旅美 NCAA 球員） ---------- */
function computeUsRank(){
  if(!(G.league==="NCAA D1"||G.league==="NCAA D2"))return null;
  const ps=overall()+ (G.league==="NCAA D1"?6:0) + clamp((recentProd()-16)*.5,0,12);
  const poolTop = G.league==="NCAA D1"?1:60; // D1 從第1名起算，D2 名次較後
  let rank=Math.round(poolTop + 240 - (ps-58)*7 + rnd(-8,8));
  rank=clamp(rank,1,360);
  G.usRankBest=Math.min(G.usRankBest||999,rank);
  return rank;
}
function hofScore(){
  const c=G.careerAwards, t=careerTotals();
  const prestige=bestLeaguePrestige();
  const tierBonus=[0,0,18,42,75][prestige]||0; // 打到的最高殿堂
  let sc=tierBonus + c.MVP*24 + c.FMVP*9 + c["明星賽"]*2.6 + c["冠軍"]*11 + c.DPOY*8 + c.ROTY*5
    + c["最佳陣容"]*2 + (c["得分王"]+c["籃板王"]+c["助攻王"])*3
    + (c["年度一隊"]||0)*10 + (c["年度二隊"]||0)*7 + (c["年度三隊"]||0)*5 + ((c["新秀一隊"]||0)+(c["新秀二隊"]||0))*3
    + Math.max(0,(t.peakOv-80))*4 + t.totalPts/1500 + G.intlMedals*5;
  return Math.round(sc);
}
/* ---------- 分聯盟名人堂 ---------- */
function computeHallOfFame(){
  const ev={}; allLeagueEvals().forEach(e=>ev[e.league]=e.score);
  const tw=(ev["SBL"]||0)+(ev["P+"]||0)+(ev["TPBL"]||0);
  const twClubAwards=(G.awardLog||[]).filter(a=>["SBL","P+","TPBL"].includes(a.league)).length;
  // 中華隊貢獻：依獎牌/榮譽加權（正式賽 > 瓊斯盃邀請賽），大幅提高國家隊份量——
  // 讓「就算不在台灣打球，也能靠代表國家隊拿下名人堂」成為可行路線
  let natlScore=0;
  (G.awardLog||[]).filter(a=>a.league==="中華隊").forEach(a=>{
    const w=a.award;
    natlScore += w==="金牌"?175 : w==="銀牌"?125 : w==="銅牌"?90 : w==="賽會MVP"?75 :
      w==="瓊斯盃金牌"?60 : w==="瓊斯盃銀牌"?42 : w==="瓊斯盃銅牌"?30 :
      (w.indexOf("瓊斯盃MVP")>=0?38 : 12);
  });
  const taiwanScore=Math.round(tw + natlScore + twClubAwards*10 + (G.madeNBA?160:0));
  const nba=ev["NBA"]||0;
  const nbaSeasons=G.seasonHistory.filter(s=>s.league==="NBA").length;
  const naismithScore=Math.round(nba + (G.awardLog||[]).filter(a=>a.league==="NBA").reduce((s,a)=>
    s+(a.award==="MVP"?130:a.award==="FMVP"?90:a.award==="冠軍"?60:a.award==="年度一隊"?55:a.award==="年度二隊"?35:a.award==="年度三隊"?24:a.award.includes("明星賽")?26:a.award.includes("王")?30:12),0));
  // 中國籃球名人堂：以 CBL 資歷與榮譽為主
  const cbl=ev["CBL"]||0;
  const cblSeasons=G.seasonHistory.filter(s=>s.league==="CBL").length;
  const chinaScore=Math.round(cbl + (G.awardLog||[]).filter(a=>a.league==="CBL").reduce((s,a)=>
    s+(a.award==="MVP"?90:a.award==="FMVP"?55:a.award==="冠軍"?45:a.award==="本土MVP"?40:a.award.includes("明星賽")?18:a.award.includes("王")?22:a.award==="DPOY"?24:a.award==="ROTY"?14:10),0));
  // 韓國籃球名人堂：以 KRBL 資歷與榮譽為主
  const krbl=ev["KRBL"]||0;
  const krblSeasons=G.seasonHistory.filter(s=>s.league==="KRBL").length;
  const koreaScore=Math.round(krbl + (G.awardLog||[]).filter(a=>a.league==="KRBL").reduce((s,a)=>
    s+(a.award==="MVP"?90:a.award==="FMVP"?55:a.award==="冠軍"?45:a.award==="國內MVP"?40:a.award.includes("明星賽")?18:a.award.includes("王")?22:a.award==="DPOY"?24:a.award==="ROTY"?14:10),0));
  return {
    taiwanScore, taiwan: taiwanScore>=880,
    naismithScore, nbaSeasons, naismith: G.madeNBA && nbaSeasons>=5 && naismithScore>=850,
    chinaScore, cblSeasons, china: cblSeasons>=4 && chinaScore>=560,
    koreaScore, krblSeasons, korea: krblSeasons>=4 && koreaScore>=560,
  };
}

function retirementTier(){
  const sc=G._hofScore||0;
  if((G._hallOfFame&&G._hallOfFame.naismith) || sc>=340) return "legend";
  if(sc>=200) return "star";
  if(sc>=110) return "role";
  if(sc>=50) return "journey";
  return "obscure";
}

/* ---------- 球衣退休：依「各隊」效力年資 × 戰績 × 榮譽 判定 ---------- */
function jerseyRetiredTeams(){
  const pro=G.seasonHistory.filter(s=>s.stage==="pro");
  if(!pro.length)return [];
  const byTeam={};
  pro.forEach(s=>{ const k=s.league+"|"+s.team;
    if(!byTeam[k]) byTeam[k]={team:s.team,league:s.league,seasons:0,ssSum:0,star:0,champ:0};
    const b=byTeam[k]; b.seasons++; b.ssSum+=(s.seasonScore||0);
    const starTh=(s.league==="NBA"||s.league==="日職 B.League"||s.league==="CBL"||s.league==="KRBL")?76:73;
    if((s.seasonScore||0)>=starTh) b.star++;
    if(s.champion) b.champ++;
  });
  const result=[];
  Object.values(byTeam).forEach(b=>{
    const avg=b.ssSum/b.seasons;
    // 資格：長期效力(≥6季) 且 在該隊有成就（奪冠 / 多次明星級 / 平均影響力高）
    const qualifies = b.seasons>=6 && (b.champ>=1 || b.star>=3 || avg>=(b.league==="NBA"?82:72));
    // 或：該隊生涯代表隊(≥8季)即使成就普通也退休球衣
    const loyalty = b.seasons>=8 && avg>=(b.league==="NBA"?70:60);
    if(qualifies||loyalty) result.push({team:b.team,league:b.league,seasons:b.seasons});
  });
  // 最多顯示 3 隊，年資高的優先
  return result.sort((a,b)=>b.seasons-a.seasons).slice(0,3);
}
function endCareer(){
  G.retired=true;
  // 隱藏稱號結算
  const proSeasons=G.seasonHistory.filter(s=>s.stage==="pro").length;
  const collegeSeasons=G.seasonHistory.filter(s=>s.stage==="大學").length;
  if(proSeasons<=1 && collegeSeasons>=1 && !G.madeNBA) grantTitle("flashPan"); // 大學後隨即退休
  if(proSeasons>10 && (G.careerAwards["冠軍"]||0)===0) grantTitle("ringless"); // 無冕之王
  const sc=hofScore();
  G._hofScore=sc;
  G._hallOfFame=computeHallOfFame();
  G._jerseyTeams=jerseyRetiredTeams();
  G._jerseyRetired = G._jerseyTeams.length>0 || (G._hallOfFame&&G._hallOfFame.naismith);
  G._hof=G._hallOfFame.taiwan||G._hallOfFame.naismith||G._hallOfFame.china;
  let tier=retirementTier();
  if(G._undrafted) tier="undrafted"; // 落選轉跑道專屬
  // 發展聯盟長期打拼、始終沒能真正在 NBA 站穩 → 專屬「農場老兵」退休劇情
  const devSeasons=G.seasonHistory.filter(s=>s.league==="發展聯盟").length;
  G._devGrindSeasons=devSeasons;
  if(!G.madeNBA && devSeasons>=4 && tier!=="undrafted") tier="devgrind";
  G._retireScene=pick(RETIRE_SCENES[tier]||RETIRE_SCENES.obscure);
  G._retireTier=tier;
  G._fanForum=fanForum();
  G.phase="retireScene"; render();
}

  };

  for(let i=0;i<3;i++){ let c=pick(base); let g=0; while(used.has(c)&&g<8){c=pick(base);g++;} used.add(c);

/* ---------- 能力加點（養成） ---------- */
function allocateHTML(){

  const ovNow=overall(prev,G.pos);

    G.stage==="大學"?`${lname(G.league)} ${["大一","大二","大三","大四"][Math.min(G.collegeYears-1,3)]}`:lname(G.league);
  const rows=ATTR_KEYS.map(k=>{
    const v=cur(k), c=allocCost(v), added=al.add[k];
    const canPlus=v<allocCap()&&al.spLeft>=c, canMinus=added>0;
    return `<div class="alloc-row">
      <div class="alloc-name">${ATTR_LABEL[k]}</div>

      <div class="alloc-cost">${c}點/級</div>
      <div class="alloc-btns">
        <button class="stp" data-minus="${k}" ${canMinus?"":"disabled"}>−</button>

  }).join("");
  return `<div class="season-hd"><span class="stage">${stageName} · 季前特訓</span><span class="yr">${G.year} 賽季</span></div>
    <div class="team-line"><span class="team-dot" style="background:${teamColors(G.team).p}"></span>${G.team} ${getContractText()} <span class="arche">${archetype()}</span></div>
    ${al.bonus?`<div class="usrank-line" style="color:var(--gold);border-color:rgba(242,184,75,.4);background:rgba(242,184,75,.08)">🏆 上季大賽表現優異，獲得 <b>+${al.bonus}</b> 額外訓練點！</div>`:""}
    <div class="panel">
      <div class="alloc-top">
        <div class="alloc-sp"><div class="v">${al.spLeft}</div><div class="l">剩餘訓練點</div></div>
        <div class="alloc-ov"><div class="v">${ovNow}<span class="ovd">${ovNow>ovBase?` ▲${ovNow-ovBase}`:""}</span></div><div class="l">預估 OVR</div></div>
      </div>
      <p class="small" style="margin:2px 0 12px">把訓練點投入想強化的能力，親手養成你的球員。數值越高、或超過潛力（${G.potential}）後，每級花費越貴。</p>
      <div class="alloc-list">${rows}</div>
      <div class="alloc-actions">
        <button class="btn ghost small" id="allocAuto">⚡ 自動分配</button>
        <button class="btn ghost small" id="allocReset">↺ 重置</button>
      </div>
    </div>

}
function bindAllocate(){
  const s=$("#stage");if(!s)return;
  s.querySelectorAll("[data-plus]").forEach(b=>b.addEventListener("click",()=>allocChange(b.dataset.plus,1)));
  s.querySelectorAll("[data-minus]").forEach(b=>b.addEventListener("click",()=>allocChange(b.dataset.minus,-1)));
  const au=s.querySelector("#allocAuto");if(au)au.addEventListener("click",allocAuto);
  const rs=s.querySelector("#allocReset");if(rs)rs.addEventListener("click",allocReset);
}
function renderAllocateInPlace(){
  // 只就地更新加點面板，不重建整頁、不捲動 → 點下方能力值時不會跳回頂端
  const s=$("#stage"); if(!s){ render(); return; }
  s.innerHTML=allocateHTML();
  bindAllocate();
}
function allocCap(){ return Math.min(99, G.potential+4); } // 加點天花板：潛力+4
function allocChange(k,dir){
  const al=G._alloc, cur=al.base[k]+al.add[k];
  if(dir>0){ if(cur>=allocCap())return; const c=allocCost(cur); if(al.spLeft<c)return; al.add[k]++; al.spLeft-=c; }
  else { if(al.add[k]<=0)return; const c=allocCost(cur-1); al.add[k]--; al.spLeft+=c; }
  renderAllocateInPlace();
}
function allocAuto(){
  const w=POSITIONS[G.pos].w, order=[...ATTR_KEYS].sort((x,y)=>w[y]-w[x]);
  let guard=0;
  while(guard++<800){ let done=true;
    for(const k of order){ const cur=G._alloc.base[k]+G._alloc.add[k], c=allocCost(cur);
      if(cur<allocCap() && G._alloc.spLeft>=c){ G._alloc.add[k]++; G._alloc.spLeft-=c; done=false; break; } }
    if(done)break; }
  renderAllocateInPlace();
}
function allocReset(){ ATTR_KEYS.forEach(k=>G._alloc.add[k]=0); G._alloc.spLeft=G._alloc.sp; renderAllocateInPlace(); }
function commitAllocation(){
  ATTR_KEYS.forEach(k=>G.attr[k]=clamp(G.attr[k]+G._alloc.add[k],15,99));
  G._alloc=null; beginTraining();
}

    </div>`;

function bindTraining(){
  const ev=G.seasonEvents[G.eventIdx];
  if(!ev){ setAction([{t:"開始賽季 ▶",cls:"gold",fn:playSeason}]); return; }
  setAction([]); // 訓練時無底部按鈕
  $("#stage").querySelectorAll(".opt").forEach(b=>{
    b.addEventListener("click",()=>resolveOption(parseInt(b.dataset.opt)));
  });
}
function resolveOption(i){
  const ev=G.seasonEvents[G.eventIdx];
  const opt=ev.o[i];
  const panel=$("#evpanel");
  // 顯示骰子
  panel.innerHTML=`<div class="label">命運骰</div>
    <div class="dice-stage">
      <div class="die rolling" id="die">${pipHTML(1)}</div>
      <div class="roll-caption" id="rollcap">擲骰中…</div>
    </div>`;
  const die=$("#die");
  let ticks=0;
  const iv=setInterval(()=>{ die.innerHTML=pipHTML(1+Math.floor(rawRnd()*6)); if(++ticks>10){/*noop*/} },70);
  setTimeout(()=>{
    clearInterval(iv);
    const roll=rint(1,6);
    die.classList.remove("rolling");
    die.innerHTML=pipHTML(roll);
    const before={...G.attr};
    const outcome=opt.f(roll);
    // 低骰懲罰：骰到 1–2 時，正屬性加成歸零，且有機率倒扣（讓爛運真的有代價）
    if(roll<=2 && outcome.attr){
      for(const k in outcome.attr){ if(outcome.attr[k]>0){ outcome.attr[k]= chance(.5)?-1:0; } }
    }
    applyEffects(outcome);
    // 轉學劇情：實際換了學校 → 於結果文本帶入新學校名，提高沉浸感
    if(outcome.transfer && G._transferredTo){ outcome.text += " " + transferFlavor(G._transferredTo); }
    const deltas=[];
    if(outcome.attr) for(const k in outcome.attr){const d=outcome.attr[k]; if(!d) continue;
      deltas.push(`<span class="delta ${d>=0?"pos":"neg"}">${ATTR_LABEL[k]} ${d>=0?"+":""}${d}</span>`);}
    if(outcome.health)deltas.push(`<span class="delta ${outcome.health>=0?"pos":"neg"}">健康 ${outcome.health>=0?"+":""}${outcome.health}</span>`);
    if(outcome.money){
  const isPos = outcome.money > 0;
  // 如果是正數加上 + 號，如果是負數，fmtMoney 已經自帶 - 號了
  deltas.push(`<span class="delta ${isPos ? "pos" : "neg"}">$ ${isPos ? "+" : ""}${fmtMoney(outcome.money)}</span>`);
}
    if(outcome.fame)deltas.push(`<span class="delta ${outcome.fame>=0?"pos":"neg"}">名氣 ${outcome.fame>=0?"+":""}${outcome.fame}</span>`);
    if(outcome.morale)deltas.push(`<span class="delta ${outcome.morale>=0?"pos":"neg"}">士氣 ${outcome.morale>=0?"+":""}${outcome.morale}</span>`);
    const good=tier(roll)==="high", bad=tier(roll)==="low";
    $("#rollcap").innerHTML=`擲出 <b class="oswald" style="color:var(--gold);font-size:18px">${roll}</b>`;
    const oc=document.createElement("div");
    oc.className="outcome "+(good?"good":bad?"bad":"");
    oc.innerHTML=`<div class="ot">${outcome.text}</div>${deltas.length?`<div class="deltas">${deltas.join("")}</div>`:""}`;
    panel.appendChild(oc);
    // 更新 HUD 數值（重繪整頁 hud）
    refreshHUD();
    // 下一步按鈕
    const isLast=G.eventIdx>=G.seasonEvents.length-1;
    setAction([{t:isLast?"完成訓練 ✓":"下一個事件 ▶",cls:isLast?"gold":"",fn:()=>{
      G.eventIdx++; G.lastAttr={...G.attr}; render();
    }}]);
  },850);
}
function pipHTML(n){
  const map={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};

  let h="";for(let i=0;i<9;i++)h+=`<span class="pip ${on.includes(i)?"on":""}"></span>`;return h;
}

function resolveTradeRumor(choice){
  const panel=$("#evpanel"); if(!panel) return;
  panel.innerHTML=`<div class="label">命運骰</div>
    <div class="dice-stage">
      <div class="die rolling" id="die">${pipHTML(1)}</div>
      <div class="roll-caption" id="rollcap">流言擴散中…</div>
    </div>`;
  const die=$("#die"); let ticks=0;
  const iv=setInterval(()=>{ die.innerHTML=pipHTML(1+Math.floor(rawRnd()*6)); if(++ticks>10){} },70);
  setTimeout(()=>{
    clearInterval(iv);
    const roll=rint(1,6), t=tier(roll);
    die.classList.remove("rolling"); die.innerHTML=pipHTML(roll);
    // 骰高 → 降低被交易機率；骰低 → 提高（詢問高層波動較大）
    const swing = choice===1 ? 0.13 : 0.08;
    const tradeProb = clamp(0.5 - (roll-3.5)*swing, 0.05, 0.95);
    const deltas=[];
    if(choice===1){
      if(t==="high"){ G.morale=clamp(G.morale+4,0,100); deltas.push(`<span class="delta pos">士氣 +4</span>`); }
      else if(t==="low"){ G.morale=clamp(G.morale-4,0,100); deltas.push(`<span class="delta neg">士氣 -4</span>`); }
    }
    const willTrade = chance(tradeProb);
    const head = choice===1
      ? (t==="high"?"你直接找上球團高層對質，對方拍胸脯保證：「你是我們的建隊核心，別理那些網路流言。」"
        : t==="low"?"你氣沖沖地質問管理層，換來的卻是一陣尷尬的沉默與閃爍的眼神。"
        : "你私下向教練打聽，只得到模稜兩可的答覆。")
      : (t==="high"?"你選擇冷處理，照常出現在訓練館，彷彿什麼都沒發生。"
        : t==="low"?"你嘴硬說不知情，但更衣室裡那股微妙的氣氛，騙不了任何人。"
        : "你嘴上說沒聽過，心裡卻七上八下。");
    const tail = willTrade ? "然而幾天後，交易還是敲定了——" : "最終，這只是一場虛驚，你留了下來。";
    $("#rollcap").innerHTML=`擲出 <b class="oswald" style="color:var(--gold);font-size:18px">${roll}</b>`;
    const oc=document.createElement("div");
    oc.className="outcome "+(willTrade?"bad":"good");
    oc.innerHTML=`<div class="ot">${head} ${tail}</div>${deltas.length?`<div class="deltas">${deltas.join("")}</div>`:""}`;
    panel.appendChild(oc);
    refreshHUD();
    if(willTrade){ setAction([{t:"面對交易 ▶",cls:"gold",fn:doTrade}]); }
    else { G._tradeRumor=null; setAction([{t:"繼續 ▶",cls:"gold",fn:processOffseason}]); }
  },850);
}

function jonesKeyPlay(res){
  const l = res.line, big = [];
  const diff = Math.abs(res.us - res.them); // 計算真實分差
  
  // 個人表現描述 (增加更浮誇與多元的級距)
  if(l.p >= 30) big.push("宛如砍分機器般無解");
  else if(l.p >= 24) big.push("得分火力全開");
  
  if(l.a >= 10) big.push("傳球出神入化");
  else if(l.a >= 7) big.push("精準串聯全隊");
  
  if(l.rb >= 15) big.push("稱霸禁區籃板");
  else if(l.rb >= 10) big.push("籃板卡位兇猛");
  
  if(l.s >= 4) big.push("防守端頻頻神抄截");
  else if(l.s >= 3) big.push("抄截如影隨形");
  
  if(l.b >= 4) big.push("化身禁區守護神");
  else if(l.b >= 3) big.push("送出精彩火鍋");

  // 組合個人評語
  const hi = big.length ? `此役你${big.join("、")}，` : "此役你穩紮穩打、默默做出貢獻，";
  const teamName = `中華${G._jones.team==="中華藍"?"藍":"白"}`;
  
  // 賽果描述 (依據真實分差給予不同情境)
  let tone = "";
  if (res.win) {
    if (diff >= 20) tone = `秋風掃落葉般以 ${diff} 分之差狂勝對手`;
    else if (diff >= 10) tone = `穩穩掌控局勢，以 ${diff} 分之差順利收下勝利`;
    else if (diff >= 4) tone = `在激烈拉鋸中頂住壓力，以 ${diff} 分差驚險勝出`;
    else tone = `在讀秒階段展現強大抗壓性，以 ${diff} 分之差驚險氣走對手`;
  } else {
    if (diff >= 20) tone = `全隊攻防失序，以 ${diff} 分之差慘遭對手血洗`;
    else if (diff >= 10) tone = `一路落居下風，最終以 ${diff} 分之差不敵對手`;
    else if (diff >= 4) tone = `與對手纏鬥至末節，可惜仍以 ${diff} 分之差遺憾落敗`;
    else if (diff === 1) tone = `在最後關頭錯失逆轉機會，以 1 分之差飲恨痛失好局`;
    else tone = `激戰到最後一刻，僅以 ${diff} 分之差惜敗`;
  }
  
  return `${hi}${teamName}最終${tone}。`;
}

    const rewardTxt = senior

function jonesActions(){
  const J=G._jones; if(!J) return [];

      {t:"婉拒徵召（保護身體）",cls:"ghost",fn:declineJones},
    ];

    case "groupResult": return [{t:J.groupSeed<=2?"前進四強 ▶":"查看最終名次 ▶",cls:"gold",fn:jonesAdvance}];

function jonesBind(){
  const J=G._jones; if(!J) return;
  const s=$("#stage"); if(!s) return;
  if(J.step==="event"||J.step==="koEvent"){
    s.querySelectorAll("[data-jopt]").forEach(b=>b.addEventListener("click",()=>jonesResolveOption(parseInt(b.dataset.jopt))));
  }
}
function jonesResolveOption(i){
  const J=G._jones, ev=J.event, opt=ev.o[i];
  const panel=$("#jevpanel");
  panel.innerHTML=`<div class="label">命運骰</div>
    <div class="dice-stage"><div class="die rolling" id="jdie">${pipHTML(1)}</div>
      <div class="roll-caption" id="jrollcap">擲骰中…</div></div>`;
  const die=$("#jdie"); let ticks=0;
  const iv=setInterval(()=>{ die.innerHTML=pipHTML(1+Math.floor(rawRnd()*6)); if(++ticks>10){} },70);
  setTimeout(()=>{
    clearInterval(iv);
    const roll=rint(1,6);
    die.classList.remove("rolling"); die.innerHTML=pipHTML(roll);
    const outcome=opt.f(roll);
    if(roll<=2 && outcome.attr){ for(const k in outcome.attr){ if(outcome.attr[k]>0) outcome.attr[k]=chance(.5)?-1:0; } }
    applyEffects(outcome);
    if(typeof outcome.jb==="number") J.boost=clamp((J.boost||0)+outcome.jb, -.15, .22);
    const deltas=[];
    if(outcome.attr) for(const k in outcome.attr){const d=outcome.attr[k]; if(!d) continue;
      deltas.push(`<span class="delta ${d>=0?"pos":"neg"}">${ATTR_LABEL[k]} ${d>=0?"+":""}${d}</span>`);}
    if(outcome.health)deltas.push(`<span class="delta ${outcome.health>=0?"pos":"neg"}">健康 ${outcome.health>=0?"+":""}${outcome.health}</span>`);
    if(outcome.fame)deltas.push(`<span class="delta ${outcome.fame>=0?"pos":"neg"}">名氣 ${outcome.fame>=0?"+":""}${outcome.fame}</span>`);
    if(outcome.morale)deltas.push(`<span class="delta ${outcome.morale>=0?"pos":"neg"}">士氣 ${outcome.morale>=0?"+":""}${outcome.morale}</span>`);
    if(typeof outcome.jb==="number"&&outcome.jb)deltas.push(`<span class="delta ${outcome.jb>=0?"pos":"neg"}">氣勢 ${outcome.jb>=0?"+":""}${Math.round(outcome.jb*100)}%</span>`);
    const good=tier(roll)==="high", bad=tier(roll)==="low";
    $("#jrollcap").innerHTML=`擲出 <b class="oswald" style="color:var(--gold);font-size:18px">${roll}</b>`;
    const oc=document.createElement("div");
    oc.className="outcome "+(good?"good":bad?"bad":"");
    oc.innerHTML=`<div class="ot">${outcome.text}</div>${deltas.length?`<div class="deltas">${deltas.join("")}</div>`:""}`;
    panel.appendChild(oc);
    refreshHUD();
    setAction([{t:"進入比賽 ▶",cls:"gold",fn:jonesAdvance}]);
  },850);
}

  const head=`<tr><th class="l">賽季</th><th class="l">隊伍</th><th>出賽</th><th>得分</th><th>籃板</th><th>助攻</th><th>抄截</th><th>阻攻</th><th>FG%</th><th>3P%</th><th class="l">榮譽</th></tr>`;

  return `<table class="stats">${head}${body}</table>`;

function roundRect(x,rx,ry,w,h,r){x.beginPath();x.moveTo(rx+r,ry);x.arcTo(rx+w,ry,rx+w,ry+h,r);
  x.arcTo(rx+w,ry+h,rx,ry+h,r);x.arcTo(rx,ry+h,rx,ry,r);x.arcTo(rx,ry,rx+w,ry,r);x.closePath();}
function drawRadar(x,cx,cy,R){
  const keys=ATTR_KEYS,n=keys.length;
  const ang=i=>-Math.PI/2 + i*2*Math.PI/n;
  // grid
  x.strokeStyle="#2A3A57";x.lineWidth=1.5;
  for(let ring=1;ring<=3;ring++){x.beginPath();
    for(let i=0;i<=n;i++){const r=R*ring/3,a=ang(i%n);const px=cx+r*Math.cos(a),py=cy+r*Math.sin(a);
      i===0?x.moveTo(px,py):x.lineTo(px,py);}x.stroke();}
  // value
  x.beginPath();
  for(let i=0;i<=n;i++){const v=G.attr[keys[i%n]]/99,a=ang(i%n);const r=R*v;
    const px=cx+r*Math.cos(a),py=cy+r*Math.sin(a);i===0?x.moveTo(px,py):x.lineTo(px,py);}
  x.closePath();x.fillStyle="rgba(255,106,44,.28)";x.fill();x.strokeStyle="#FF6A2C";x.lineWidth=3;x.stroke();
  // labels
  x.fillStyle="#9DB0CC";x.font="600 18px 'Noto Sans TC',sans-serif";x.textAlign="center";
  keys.forEach((k,i)=>{const a=ang(i),r=R+24;x.fillText(ATTR_LABEL[k],cx+r*Math.cos(a),cy+r*Math.sin(a)+6);});
  x.textAlign="left";
}
function drawCareerChart(x,ox,oy,w,h){
  const data=G.seasonHistory;
  x.fillStyle="#9DB0CC";x.font="700 24px 'Noto Sans TC',sans-serif";x.textAlign="left";
  x.fillText("生涯每季平均（得分／籃板／助攻）",ox,oy-14);
  // frame
  x.fillStyle="#0d1626";x.strokeStyle="#2A3A57";x.lineWidth=2;roundRect(x,ox,oy,w,h,10);x.fill();x.stroke();
  if(data.length<1)return;
  const maxV=Math.max(12,...data.map(s=>Math.max(s.ppg,s.rpg,s.apg)));
  const pad=14; const gx=ox+pad,gw=w-pad*2,gy=oy+pad,gh=h-pad*2-16;
  const X=i=>data.length<=1?gx+gw/2:gx+gw*i/(data.length-1);
  const Y=v=>gy+gh-(v/maxV)*gh;
  const series=[["ppg","#FF6A2C"],["rpg","#4DA3FF"],["apg","#3FBF7F"]];
  series.forEach(([key,col])=>{
    x.beginPath();data.forEach((s,i)=>{const px=X(i),py=Y(s[key]);i===0?x.moveTo(px,py):x.lineTo(px,py);});
    x.strokeStyle=col;x.lineWidth=3;x.stroke();
    data.forEach((s,i)=>{x.beginPath();x.arc(X(i),Y(s[key]),3.5,0,7);x.fillStyle=col;x.fill();});
  });
  // legend

/* ---------- 各聯盟累積數據 ---------- */
function leagueAggregates(){
  const byLg={}; const order=[];
  G.seasonHistory.filter(s=>s.stage==="pro").forEach(s=>{
    if(!byLg[s.league]){byLg[s.league]={league:s.league,yrs:0,gp:0,sp:0,pts:0,reb:0,ast:0,stl:0,blk:0,fgN:0,tpN:0,fgD:0};order.push(s.league);}
    const b=byLg[s.league]; b.yrs++; b.gp+=s.gp; b.pts+=s.ppg*s.gp; b.reb+=s.rpg*s.gp; b.ast+=s.apg*s.gp;
    b.stl+=s.spg*s.gp; b.blk+=s.bpg*s.gp; b.fgN+=s.fg*s.gp; b.tpN+=s.tp*s.gp; b.fgD+=s.gp;
  });
  return order.map(l=>{const b=byLg[l];const g=b.gp||1;
    return {league:l,yrs:b.yrs,gp:b.gp,ppg:round(b.pts/g,1),rpg:round(b.reb/g,1),apg:round(b.ast/g,1),
      spg:round(b.stl/g,1),bpg:round(b.blk/g,1),fg:Math.round(b.fgN/b.fgD),tp:Math.round(b.tpN/b.fgD)};});
}
function intlAggregate(){
  const h=G.intlHistory; if(!h.length)return null;
  const g=h.length; const avg=k=>round(h.reduce((a,r)=>a+r[k],0)/g,1);
  return {events:g, ppg:avg("ppg"),rpg:avg("rpg"),apg:avg("apg"),medals:G.intlMedals};
}

function saveCanvasPng(cv, filename){

/* ---------- Action bar 綁定 ---------- */
let _actions=[];
function setAction(actions){_actions=actions;const bar=$("#abar");if(bar)bindActionbar();}
function bindActionbar(){
  const bar=$("#abar");if(!bar)return;
  let html="";
  // 統一的「數據總表」入口
  const showStatsBtn=(G&&G.phase!=="stats"&&G.phase!=="end"&&(G.seasonHistory.length>0));
  // 依 phase 決定主要按鈕
  const phaseBtns=defaultPhaseActions();
  const acts=_actions.length?_actions:phaseBtns;
  acts.forEach((a,i)=>{html+=`<button class="btn ${a.cls||""}" data-act="${i}">${a.t}</button>`;});
  if(showStatsBtn) html=`<button class="iconbtn" data-stats="1">📊</button>`+html;
  bar.innerHTML=html;
  bar.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>acts[parseInt(b.dataset.act)].fn()));
  const sb=bar.querySelector("[data-stats]");if(sb)sb.addEventListener("click",()=>{G._prevPhase=G.phase;G.phase="stats";render();});
  // 各 phase 專屬事件（offer/決策等）
  bindPhaseSpecific();
}
function defaultPhaseActions(){
  if(!G)return [];
  switch(G.phase){
    case "intro": return [{t:"踏上球場，開始高中生涯 ▶",cls:"gold",fn:startSeason}];
    case "decline": return [{t:"接受現實，繼續前進 ▶",cls:"gold",fn:afterDeclineCard}];
    case "commit": return [{t:"開始新篇章 ▶",cls:"gold",fn:afterCommitCard}];
    case "allocate": return [{t:"完成分配，開始賽季 ▶",cls:"gold",fn:commitAllocation}];
    case "review": return [{t:"繼續 ▶",cls:"gold",fn:afterReview}];
    case "draftDeclare": return [{t:"確認參加選秀 ▶",cls:"gold",fn:confirmDraft}];
    case "overseasOffer": return [];
    case "trade": return [{t:"了解，繼續 ▶",cls:"",fn:processOffseason}];
    case "intl": return G._intlResult?[{t:"繼續 ▶",cls:"gold",fn:intlContinue}]:[];
    case "jones": return jonesActions();
    default: return [];
  }
}
function bindPhaseSpecific(){
  const s=$("#stage");if(!s)return;
  if(G.phase==="allocate") bindAllocate();
  // 交易謠言：兩個選項
  if(G.phase==="tradeRumor") s.querySelectorAll("[data-rumor]").forEach(b=>b.addEventListener("click",()=>resolveTradeRumor(parseInt(b.dataset.rumor))));
  // 高中決策
  s.querySelectorAll("[data-offer]").forEach(b=>b.addEventListener("click",()=>{
    const i=parseInt(b.dataset.offer);
    if(G.phase==="hsDecision") chooseCollege(G._hsOffers[i]);
    else if(G.phase==="freeAgency") signOffer(G._offers[i]);
  }));
  const pb=s.querySelector("[data-pro]");if(pb)pb.addEventListener("click",goProFromHS);
  const db=s.querySelector("[data-declare]");if(db)db.addEventListener("click",declareFromCollege);
  const st=s.querySelector("[data-stay]");if(st)st.addEventListener("click",stayInCollege);
  const kp=s.querySelector("[data-keep]");if(kp)kp.addEventListener("click",()=>{keepPlaying();});
  const htw=s.querySelector("[data-hometw]");if(htw)htw.addEventListener("click",returnToTaiwan);
  const rt=s.querySelector("[data-retire]");if(rt)rt.addEventListener("click",confirmRetire);
  const pi=s.querySelector("#playIntl");if(pi)pi.addEventListener("click",playIntl);
  const di=s.querySelector("#declineIntl");if(di)di.addEventListener("click",declineIntl);
  if(G.phase==="jones") jonesBind();
  // 選秀：台灣聯盟複選
  s.querySelectorAll("[data-dleague]").forEach(b=>b.addEventListener("click",()=>toggleDraftLeague(b.dataset.dleague)));
  // 選秀結果：加盟
  s.querySelectorAll("[data-draft]").forEach(b=>b.addEventListener("click",()=>signDraft(G._offers[parseInt(b.dataset.draft)])));
  // 海外報價
  const ao=s.querySelector("#acceptOverseas");if(ao)ao.addEventListener("click",acceptOverseas);
  const dor=s.querySelector("#declineOverseas");if(dor)dor.addEventListener("click",declineOverseas);
}

      <h1>籃球<br>人生</h1>
      <div class="en">HARDWOOD LIFE</div>
      <p class="sub">從台灣高中出發，用骰子與抉擇打造一位球員的完整生涯——高中、大學、台灣職籃、韓國、日本、中國、美國，直到名人堂。</p>
    </div>
    <div class="wrap">
      <div class="panel">
        <div class="field"><label class="label">球員名字</label>
          <div class="name-row">
            <input type="text" id="pName" placeholder="輸入你的球員名字" maxlength="10" value="林逐夢">
            <button class="dice-btn" id="nameDice" title="隨機名字">🎲</button>
          </div></div>
        <div class="field"><label class="label">背號（0–99）</label>
          <div class="name-row">
            <input type="number" id="pJersey" min="0" max="99" value="7" style="max-width:110px">
            <button class="dice-btn" id="jerseyDice" title="隨機背號">🎲</button>
          </div></div>
        <div class="field"><label class="label">出身地</label>
          <div class="chips" id="homeChips"></div></div>
        <div class="field"><label class="label">場上位置</label>
          <div class="chips" id="posChips"></div>
          <p class="small mt8" id="posDesc"></p></div>
        <div class="field"><label class="label">種子碼（可分享／重現同一份運氣，留空＝隨機）</label>
          <div class="name-row">
            <input type="text" id="pSeed" placeholder="留空隨機，或貼上朋友的種子碼" maxlength="12">
            <button class="dice-btn" id="seedDice" title="隨機種子碼">🎲</button>
          </div>
          <p class="small mt8" style="color:var(--faint)">相同的種子碼＋相同的選擇，會得到完全一樣的生涯發展。</p></div>
      </div>
      <button class="btn gold" id="startBtn">開始籃球人生 🏀</button>
      <p class="small center mt12">每個決定都會改變你的生涯軌跡。準備好了嗎？</p>
      <p class="small center" style="padding-bottom:24px;color:var(--faint)">聯絡我：<a href="https://www.threads.com/@twbasketball__life" target="_blank" rel="noopener" style="color:var(--orange);text-decoration:none;font-weight:700">twbasketball__life</a></p>
    </div>`;
  const homes=["台北","新北","基隆","宜蘭","桃園","新竹","苗栗","台中","彰化","雲林","嘉義","台南","高雄","屏東","花蓮","台東"];
  let home=homes[0];
  const hc=$("#homeChips");
  homes.forEach((h,i)=>{const el=document.createElement("button");el.className="chip"+(i===0?" on":"");
    el.textContent=h;el.onclick=()=>{home=h;hc.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));el.classList.add("on");};hc.appendChild(el);});
  const pc=$("#posChips");
  Object.entries(POSITIONS).forEach(([k,v])=>{const el=document.createElement("button");
    el.className="chip"+(k===_startPos?" on":"");el.textContent=`${v.abbr} ${v.name}`;
    el.onclick=()=>{_startPos=k;pc.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));el.classList.add("on");updatePosDesc();};pc.appendChild(el);});
  function updatePosDesc(){const v=POSITIONS[_startPos];
    const strong=ATTR_KEYS.filter(k=>v.w[k]>=1.2).map(k=>ATTR_LABEL[k]);
    $("#posDesc").textContent=`起手側重：${strong.join("、")}。位置會影響能力權重與籃板/助攻上限。`;}
  updatePosDesc();
  $("#nameDice").addEventListener("click",()=>{ $("#pName").value=randomName(); });
  $("#jerseyDice").addEventListener("click",()=>{ $("#pJersey").value=rint(0,99); });
  $("#seedDice").addEventListener("click",()=>{ $("#pSeed").value=makeSeed(); });
  $("#startBtn").addEventListener("click",()=>{
    const name=($("#pName").value||"").trim()||randomName();
    let jn=parseInt($("#pJersey").value); if(isNaN(jn)) jn=rint(0,99); jn=clamp(jn,0,99);
    const seed=($("#pSeed").value||"").trim();
    newGame(name,_startPos,home,jn,seed);
  });
  window.scrollTo(0,0);
}

/* ---------- Boot ---------- */
render();
</script>
</body>
</html>
