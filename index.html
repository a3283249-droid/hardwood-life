<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>籃球人生 · Hardwood Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220; --surface:#131E33; --surface2:#1B2842; --line:#2A3A57;
  --ink:#F4F2EC; --dim:#9DB0CC; --faint:#6B7F9E;
  --orange:#FF6A2C; --orange2:#E4551B; --gold:#F2B84B; --wood:#C8873F;
  --green:#3FBF7F; --red:#F2545B; --blue:#4DA3FF;
  --card-radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #16233d 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC",system-ui,sans-serif;
  font-weight:400; line-height:1.5; letter-spacing:.01em;
  min-height:100vh;
}
.num,.stat-num,.oswald{font-family:"Oswald",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:96px}
.wrap{padding:10px 14px}
h1,h2,h3{margin:0;font-weight:900;line-height:1.15}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none !important}

/* ---------- Title / start ---------- */
.hero{padding:40px 20px 20px;text-align:center;position:relative;overflow:hidden}
.hero .court-line{position:absolute;inset:0;pointer-events:none;opacity:.20}
.hero .court-line svg{width:100%;height:100%}
.hero h1{font-size:15vw;max-width:520px;line-height:.9;letter-spacing:-.01em;
  background:linear-gradient(180deg,#fff 0%, #FFD9AE 55%, var(--orange) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;position:relative}
@media(min-width:520px){.hero h1{font-size:76px}}
.hero .en{font-family:"Oswald";font-weight:700;letter-spacing:.28em;color:var(--orange);
  font-size:13px;margin-top:10px;text-transform:uppercase;position:relative}
.hero .sub{color:var(--dim);font-size:14px;margin-top:14px;position:relative;max-width:340px;margin-left:auto;margin-right:auto}

.panel{background:linear-gradient(180deg,var(--surface) 0%,#101a2d 100%);
  border:1px solid var(--line);border-radius:var(--card-radius);padding:12px;margin:8px 0}
.label{font-family:"Oswald";font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  font-size:11px;color:var(--faint)}
.field{margin:10px 0}
.field label{display:block;margin-bottom:8px}
input[type=text]{width:100%;background:#0d1626;border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;color:var(--ink);font-size:16px;font-family:inherit}
input[type=text]:focus{outline:none;border-color:var(--orange)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#0d1626;color:var(--dim);border-radius:999px;
  padding:9px 14px;font-size:14px;font-weight:500;transition:.15s}
.chip.on{background:var(--orange);border-color:var(--orange);color:#1a0d05;font-weight:700}
.chip:active{transform:scale(.96)}

.btn{display:block;width:100%;background:var(--orange);color:#1c0d04;font-weight:700;
  font-size:16px;border-radius:12px;padding:12px;text-align:center;transition:.12s;
  box-shadow:0 6px 20px -8px var(--orange)}
.btn:active{transform:translateY(1px) scale(.995)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn.gold{background:var(--gold);color:#241a05;box-shadow:0 6px 20px -8px var(--gold)}
.btn.small{padding:9px;font-size:14px}
.btn:disabled{opacity:.4;filter:grayscale(.4)}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:30;background:rgba(11,18,32,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.hud-top{display:flex;align-items:center;gap:10px;padding:10px 14px}
.jersey{flex:0 0 auto;width:46px;height:46px;border-radius:11px;
  background:linear-gradient(135deg,var(--orange),var(--orange2));
  display:flex;align-items:center;justify-content:center;font-family:"Oswald";font-weight:700;
  font-size:22px;color:#1c0d04;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.hud-name{flex:1;min-width:0}
.hud-name .nm{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-name .meta{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-ov{flex:0 0 auto;text-align:center;padding:2px 8px;border-left:1px solid var(--line)}
.hud-ov .v{font-family:"Oswald";font-weight:700;font-size:26px;line-height:1;color:var(--gold)}
.hud-ov .l{font-size:9px;color:var(--faint);letter-spacing:.1em}
.hud-stats{display:flex;gap:0;border-top:1px solid var(--line)}
.hud-stats .hs{flex:1;text-align:center;padding:6px 2px;border-right:1px solid var(--line)}
.hud-stats .hs:last-child{border-right:none}
.hud-stats .hs .v{font-family:"Oswald";font-weight:600;font-size:15px}
.hud-stats .hs .l{font-size:9px;color:var(--faint);letter-spacing:.06em}
.hud-stats .hs.money .v{color:var(--gold)}
.hud-stats .hs.health .v{color:var(--green)}

/* ---------- Attribute bars ---------- */
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.attr{}
.attr .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.attr .an{font-size:12.5px;color:var(--dim)}
.attr .av{font-family:"Oswald";font-weight:600;font-size:14px}
.bar{height:7px;background:#0c1526;border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--orange2),var(--orange));transition:width .5s cubic-bezier(.3,1,.4,1)}
.attr.up .av{color:var(--green)}
.attr.down .av{color:var(--red)}

/* ---------- Season header ---------- */
.season-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.season-hd .stage{font-family:"Oswald";font-weight:700;letter-spacing:.1em;color:var(--orange);font-size:13px;text-transform:uppercase}
.season-hd .yr{font-family:"Oswald";font-size:13px;color:var(--faint)}
.team-line{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--dim);margin-bottom:2px}
.team-dot{width:9px;height:9px;border-radius:50%;background:var(--orange)}

/* ---------- Event / dice ---------- */
.event-title{font-size:20px;font-weight:900;margin:4px 0 8px}
.event-text{color:var(--dim);font-size:14.5px;line-height:1.6;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px;
  text-align:left;font-size:15px;transition:.12s;display:flex;gap:10px;align-items:center}
.opt:active{transform:scale(.99);border-color:var(--orange)}
.opt .ico{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:#0d1626;
  display:flex;align-items:center;justify-content:center;font-size:18px}
.opt .ot{flex:1}
.opt .oh{font-size:11px;color:var(--faint);margin-top:2px}

.dice-stage{text-align:center;padding:10px 0}
.die{width:88px;height:88px;margin:6px auto;border-radius:18px;
  background:linear-gradient(145deg,#fff,#e7e2d6);position:relative;
  box-shadow:0 10px 24px -10px rgba(0,0,0,.7), inset 0 -6px 12px rgba(0,0,0,.15);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:12px;gap:2px}
.die.rolling{animation:shake .5s ease-in-out infinite}
@keyframes shake{0%{transform:rotate(-12deg) translateY(0)}25%{transform:rotate(10deg) translateY(-8px)}
  50%{transform:rotate(-8deg) translateY(0)}75%{transform:rotate(12deg) translateY(-6px)}100%{transform:rotate(0) translateY(0)}}
.pip{width:14px;height:14px;border-radius:50%;background:#1a1208;align-self:center;justify-self:center;opacity:0}
.pip.on{opacity:1}
.roll-caption{color:var(--dim);font-size:13px;margin-top:6px;min-height:20px}

.outcome{background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--orange);
  border-radius:10px;padding:14px;margin-top:6px}
.outcome.good{border-left-color:var(--green)}
.outcome.bad{border-left-color:var(--red)}
.outcome .ot{font-size:15px;line-height:1.6}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.delta{font-family:"Oswald";font-weight:600;font-size:12px;padding:3px 8px;border-radius:6px;
  background:#0d1626;border:1px solid var(--line)}
.delta.pos{color:var(--green);border-color:rgba(63,191,127,.4)}
.delta.neg{color:var(--red);border-color:rgba(242,84,91,.4)}

.turn-track{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}
.turn-track .t{width:22px;height:6px;border-radius:3px;background:var(--line)}
.turn-track .t.done{background:var(--orange)}

/* ---------- Season review ---------- */
.review-record{text-align:center;padding:8px 0}
.review-record .rec{font-family:"Oswald";font-weight:700;font-size:40px;line-height:1}
.review-record .rec .w{color:var(--green)}.review-record .rec .l{color:var(--red)}
.review-record .rl{font-size:12px;color:var(--faint);letter-spacing:.1em;margin-top:2px}
.statline{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.statline .s{background:#0d1626;border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.statline .s .v{font-family:"Oswald";font-weight:700;font-size:20px}
.statline .s .l{font-size:10px;color:var(--faint);margin-top:1px}
.awards-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(180deg,#2a2411,#1a1608);
  border:1px solid rgba(242,184,75,.45);color:var(--gold);border-radius:999px;padding:6px 12px;
  font-size:12.5px;font-weight:700}
.badge.champ{background:linear-gradient(180deg,#2a1810,#1a0e08);border-color:rgba(255,106,44,.5);color:var(--orange)}
.comments{margin-top:8px}
.cmt{display:flex;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.cmt .av{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:15px}
.cmt .cb{flex:1}
.cmt .cu{font-size:12px;color:var(--blue);font-weight:700}
.cmt .ct{font-size:13.5px;color:var(--ink);margin-top:1px}
.cmt .cl{font-size:11px;color:var(--faint);margin-top:3px}

/* ---------- Offers ---------- */
.offer{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}
.offer.reco{border-color:var(--gold)}
/* NBA 專屬報價外框：金色光框＋流光，讓玩家一眼認出最高殿堂 */
.offer.nba{border:2px solid var(--gold);background:linear-gradient(150deg,#1b1608 0%,var(--surface2) 42%,rgba(242,184,75,.14) 100%);box-shadow:0 0 0 1px rgba(242,184,75,.35),0 10px 30px -10px rgba(242,184,75,.55);position:relative;overflow:hidden}
.offer.nba::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;background:linear-gradient(115deg,transparent 32%,rgba(255,233,168,.22) 48%,transparent 64%);background-size:250% 100%;animation:nbaShine 3.4s linear infinite}
.offer.nba > *{position:relative;z-index:1}
@keyframes nbaShine{0%{background-position:160% 0}100%{background-position:-160% 0}}
.offer.nba .offer-lg{color:var(--gold)}
.offer.nba .offer-team{text-shadow:0 0 12px rgba(242,184,75,.45)}
.nba-crown{display:inline-block;margin-left:7px;font-family:"Oswald";font-size:9.5px;font-weight:700;letter-spacing:.06em;color:#241a05;background:linear-gradient(180deg,#FFE9A8,var(--gold));padding:2px 7px;border-radius:6px;box-shadow:0 2px 8px -2px rgba(242,184,75,.7);vertical-align:middle}
.offer-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.offer-team{font-weight:900;font-size:16px}
.offer-lg{font-family:"Oswald";font-size:11px;letter-spacing:.1em;color:var(--orange);text-transform:uppercase}
.offer-tag{font-size:10px;padding:2px 7px;border-radius:6px;background:rgba(242,184,75,.15);color:var(--gold);font-weight:700}
.offer-body{display:flex;gap:14px;margin:7px 0;font-size:13px;color:var(--dim)}
.offer-body b{font-family:"Oswald";color:var(--ink);font-weight:600;font-size:15px}

/* ---------- Tables / stats ---------- */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table.stats{border-collapse:collapse;width:100%;font-size:12px;min-width:520px}
table.stats th,table.stats td{padding:7px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.stats th{font-family:"Oswald";font-weight:600;color:var(--faint);letter-spacing:.05em;font-size:10.5px;
  position:sticky;top:0;background:var(--bg)}
table.stats td.l,table.stats th.l{text-align:left}
table.stats td{font-family:"Oswald";font-variant-numeric:tabular-nums}
table.stats tr.champ td{background:rgba(255,106,44,.07)}
.tab-bar{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;text-align:center;padding:9px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--dim)}
.tab.on{background:var(--orange);color:#1c0d04;border-color:var(--orange);font-weight:700}

/* ---------- Bottom action bar ---------- */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:linear-gradient(180deg,transparent,rgba(11,18,32,.95) 30%);padding:12px 16px 18px}
.actionbar .inner{max-width:520px;margin:0 auto;display:flex;gap:10px}
.actionbar .btn{flex:1}
.iconbtn{flex:0 0 auto;width:52px;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:20px}

/* ---------- End screen ---------- */
.hof-stamp{text-align:center;margin:14px 0}
.hof-stamp .st{display:inline-block;border:3px solid var(--gold);color:var(--gold);
  font-family:"Oswald";font-weight:700;letter-spacing:.15em;padding:10px 20px;border-radius:10px;
  transform:rotate(-4deg);font-size:20px;text-transform:uppercase;
  box-shadow:0 0 30px -8px var(--gold)}
.hof-stamp.no .st{border-color:var(--faint);color:var(--faint);box-shadow:none}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;
  background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;
  font-size:14px;box-shadow:0 10px 30px -8px #000;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}

.divider{height:1px;background:linear-gradient(90deg,transparent,var(--wood),transparent);margin:14px 0;opacity:.5}
.center{text-align:center}
.muted{color:var(--dim);font-size:14px}
.small{font-size:12px;color:var(--faint)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
canvas{max-width:100%;border-radius:12px;border:1px solid var(--line)}

/* 球員類型標籤 */
.arche{display:inline-block;font-size:11px;font-weight:700;color:var(--gold);
  border:1px solid rgba(242,184,75,.5);background:rgba(242,184,75,.08);
  border-radius:999px;padding:1px 8px;vertical-align:middle;margin-left:4px;letter-spacing:.3px}

/* 能力加點面板 */
.alloc-top{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.alloc-top>div{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:7px;text-align:center}
.alloc-sp .v{font-family:"Oswald";font-weight:700;font-size:26px;color:var(--orange);line-height:1}
.alloc-ov .v{font-family:"Oswald";font-weight:700;font-size:26px;color:var(--gold);line-height:1}
.alloc-ov .ovd{font-size:14px;color:var(--green);font-weight:600}
.alloc-top .l{font-size:11px;color:var(--dim);margin-top:4px}
.alloc-list{display:flex;flex-direction:column;gap:5px}
.alloc-row{display:grid;grid-template-columns:52px 1fr auto auto auto;align-items:center;gap:8px}
.alloc-name{font-size:13px;color:var(--ink);font-weight:600}
.alloc-bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.alloc-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#ff9a5c)}
.alloc-val{font-family:"Oswald";font-weight:600;font-size:15px;min-width:44px;text-align:right}
.alloc-val .up{color:var(--green);font-size:11px;margin-left:2px}
.alloc-cost{font-size:10.5px;color:var(--faint);min-width:44px;text-align:right}
.alloc-btns{display:flex;gap:5px}
.stp{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);
  color:var(--ink);font-size:18px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stp.plus{background:rgba(255,106,44,.14);border-color:rgba(255,106,44,.5);color:var(--orange)}
.stp:disabled{opacity:.3;cursor:not-allowed}
.alloc-actions{display:flex;gap:8px;justify-content:center;margin-top:10px}
.btn.small{padding:8px 14px;font-size:13px;width:auto}

/* 錦標賽之路 */
.tour-list{display:flex;flex-direction:column;gap:6px}
.tour-row{display:grid;grid-template-columns:auto 1fr auto 34px;align-items:center;gap:8px;
  font-size:13px;padding:8px 10px;border-radius:9px;background:var(--surface2);border-left:3px solid var(--line)}
.tour-row.win{border-left-color:var(--green)}
.tour-row.lose{border-left-color:var(--red)}
.tr-round{color:var(--dim);font-size:12px;white-space:nowrap}
.tr-opp{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-score{font-family:"Oswald";font-weight:600;font-size:14px}
.tr-score .dash{color:var(--faint);margin:0 3px}
.tr-res{text-align:center;font-weight:700;font-size:12px;color:var(--dim)}
.tour-row.win .tr-res{color:var(--green)}
.tour-row.lose .tr-res{color:var(--red)}
.tour-result{margin-top:10px;text-align:center;font-weight:700;font-size:15px;color:var(--dim)}
.tour-result.champ{color:var(--gold);font-size:17px}

/* 選秀複選 chips / 海外提示 */
.dchips{display:flex;gap:8px;flex-wrap:wrap}
.dchip{flex:1;min-width:90px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;
  padding:12px 10px;color:var(--dim);font-weight:700;font-size:15px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.dchip.on{border-color:var(--orange);background:rgba(255,106,44,.12);color:var(--orange)}
.dchip-sub{font-size:10px;font-weight:500;color:var(--faint)}
.dchip.on .dchip-sub{color:var(--orange)}
.over-note{background:rgba(242,184,75,.08);border:1px solid rgba(242,184,75,.4);border-radius:10px;
  padding:10px 12px;font-size:13px;color:var(--gold);display:flex;flex-direction:column;gap:4px}
.tour-hero{margin-top:8px;font-size:12.5px;color:var(--orange);text-align:center}
.tour-awards{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.name-row{display:flex;gap:8px;align-items:center}
.name-row input{flex:1}
.dice-btn{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);
  background:var(--surface2);font-size:20px;cursor:pointer;line-height:1}
.dice-btn:active{transform:scale(.94)}

/* 稱號 / 全美排名 / 里程碑 */
.title-badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 8px;margin:0;flex:0 0 auto;vertical-align:middle;cursor:pointer;-webkit-tap-highlight-color:transparent}
.title-badge:active{transform:scale(.94);opacity:.8}
.title-badge.good{color:#7BE0A3;border:1px solid rgba(63,191,127,.5);background:rgba(63,191,127,.1)}
.title-badge.bad{color:#FF8A8A;border:1px solid rgba(216,50,63,.5);background:rgba(216,50,63,.1)}
/* 彩蛋專屬稱號顏色 */
.title-badge.legend-yellow { color: #F2C230; border: 1px solid rgba(242,194,48,.5); background: rgba(242,194,48,.1); }
.title-badge.legend-red { color: #FF6666; border: 1px solid rgba(255,102,102,.5); background: rgba(255,102,102,.1); }
.title-badge.legend-blue { color: #4DA3FF; border: 1px solid rgba(77,163,255,.5); background: rgba(77,163,255,.1); }

const SCHOOLS={
  "高中":["松山高中","南山高中","能仁家商","泰山高中","東山高中","光復高中","普門中學","三民家商","永仁高中","高苑工商","再興中學","南湖高中","東泰高中","穀保家商"],
  "UBA":["國立政治大學","健行科大","國立臺灣師範大學","輔仁大學","中國文化大學","義守大學","臺北市立大學","國立體育大學","銘傳大學","開南大學"],
  "NCAA D1":["UCLA","Duke","Kansas","Kentucky","North Carolina","Gonzaga","Michigan State","Arizona","Villanova","Baylor","UConn","Houston","Indiana","Michigan"],
  "NCAA D2":["Nova Southeastern","Northwest Missouri State","West Texas A&M","Cal Poly Pomona","Lincoln Memorial","Fort Hays State","Augustana (SD)","Ferris State","Barry University","Minnesota State","Colorado Mesa","Nova SE"],
};
function schoolPick(lg, exclude) { 
  // 檢查 exclude 是不是陣列，不是的話包成陣列
  const ex = Array.isArray(exclude) ? exclude : [exclude]; 
  let pool = (SCHOOLS[lg]||TEAMS[lg]||["學校"]).filter(t => !ex.includes(t)); 
  // 如果可選池空了（例如學校太少），就退而求其次只排除自己
  if(!pool.length) pool = (SCHOOLS[lg]||TEAMS[lg]||["學校"]).filter(t => t !== G.team);
  return pick(pool.length ? pool : (SCHOOLS[lg]||["學校"])); 
}
/* ---------- 球員類型（依屬性判定） ---------- */
function archetype(attr=G.attr,pos=G.pos){
  const a=attr, ov=overall(attr,pos);
  const sorted=[...ATTR_KEYS].sort((x,y)=>a[y]-a[x]);
  const t1=sorted[0];
  const vals=ATTR_KEYS.map(k=>a[k]).sort((x,y)=>y-x);
  const highCount=vals.filter(v=>v>=vals[0]-6).length;
  // 全能：至少五項能力都貼近最高值，且整體夠強
  if(highCount>=5 && ov>=72) return "全能型";
  // 3D 側翼：防守＋三分雙高
  if((pos==="SF"||pos==="SG") && a.defense>=70 && a.three>=70) return "3D型";
  // 雙能衛：得分＋組織雙高
  if((pos==="PG"||pos==="SG") && a.pass>=72 && a.shooting>=72) return "雙能衛";
  // 組織型長人：長人(C/PF)把組織練高，成為策應型中軸
  if((pos==="C"||pos==="PF") && a.pass>=78) return "組織型長人";
  // 射手：三分明顯突出
  if(t1==="three" || (a.three>=vals[0]-2 && a.three>=72)) return "射手型";
  const map={shooting:"得分型",three:"射手型",rebound:"籃板型",pass:"組織型",defense:"防守型",athletic:"運動型",iq:"智控型"};
  return map[t1]||"潛力型";
}

/* ---------- 錦標賽賽制（HBL / UBA / NCAA 三月瘋） ---------- */
function tourneyRoundsFor(lg){
  if(lg==="高中") return ["資格賽","分區預賽","複賽（16強）","八強賽","準決賽（四強）","冠軍賽 @ 小巨蛋"];
  if(lg==="UBA")  return ["預賽","複賽","八強賽","準決賽（四強）","冠軍賽 @ 小巨蛋"];
  if(lg==="NCAA D1"||lg==="NCAA D2") return ["第一輪（64強）","第二輪（32強）","甜蜜16強","八強（Elite 8）","四強（Final Four）","全國冠軍賽"];
  return null;
}
function simulateTournament(ov,teamStr,season){
  const lg=G.league, rounds=tourneyRoundsFor(lg);
  if(!rounds) return null;
  season=season||{ppg:0,rpg:0,apg:0,attr:G.attr,m:posMult()};
  const chengchi = (lg==="UBA" && G.team==="國立政治大學");
  const tb=(G._seasonMods&&G._seasonMods.tourneyBoost)||0;
  const strength=chengchi?0.99:clamp(teamStr*.6 + (ov-55)*.012 + .12 + tb, .2, .97);
  const log=[]; let alive=true, champ=false;
  let facedTeams = [G.team]; // 建立一個陣列，先放入自己的球隊

  // 【請找到迴圈內的這幾行】：
  for(let i=0;i<rounds.length;i++){
    const deep=i/rounds.length;
    const pWin=chengchi?0.99:clamp(strength - deep*.28 + rnd(-.08,.08), .06, .96);
    // 將 const win=chance(pWin); 改成以下這段
    
    let win = chance(pWin);
    
    // --- 新增：若有事件強制介入，覆蓋隨機勝負 ---
    if (G._seasonMods) {
      if (G._seasonMods.tourneyMinIdx !== undefined && i < G._seasonMods.tourneyMinIdx) win = true; // 強制晉級到指定輪次
      if (G._seasonMods.tourneyMaxIdx !== undefined && i === G._seasonMods.tourneyMaxIdx) win = false; // 強制在該輪淘汰
    }
    // --------------------------------------

    const base=rint(58,78);
    const us = base + (win?rint(1,16):-rint(1,14));
    const them = base + (win?-rint(1,10):rint(1,15));
    
    // 抽籤時，傳入 facedTeams 陣列來排除已經遇過的學校
    const opp = schoolPick(lg, facedTeams); 
    facedTeams.push(opp); // 打完後，把這個對手加入已交手名單
    
    log.push({round:rounds[i], opp, us:Math.max(40,us), them:Math.max(40,them), win});
    if(!win){ alive=false; break; }
  }
  champ = alive;
  const reachIdx = log.length-1;
  let result = champ ? (lg.startsWith("NCAA")?"🏆 全國冠軍！":"🏆 冠軍！小巨蛋封王！") : `止步「${rounds[reachIdx]}」`;
  // 賽會結果 → 少量升級點數（1~3；台灣大賽收穫不多）
  let bonusSP=0;
  if(champ) bonusSP=3; else { const r=rounds[reachIdx]||"";
    if(/四強|準決賽|Final Four|全國冠軍/.test(r)) bonusSP=2;
    else if(/八強|Elite|甜蜜16|複賽|16強/.test(r)) bonusSP=1; }
  if(bonusSP>0){ G._pendingSP=(G._pendingSP||0)+bonusSP; }
  // 單場代表作：以「球員能力值」推估的單場數據（高變異，但合理反映能力）
  // 一場好球約為賽季場均的 1.3~1.9 倍，且各項受對應能力上限約束
  let hero=null;
  const wins=log.filter(r=>r.win);
  const mkHero=(rr,lost)=>{
    const mult=lost?rnd(1.1,1.5):rnd(1.35,1.95);
    const p=Math.round(clamp(season.ppg*mult, 5, Math.round(season.attr.shooting*.42+10)));
    const rb=Math.round(clamp(season.rpg*mult, 1, Math.round(season.attr.rebound*.14+2)));
    const a=Math.round(clamp(season.apg*mult, 0, Math.max(1,Math.round(season.attr.pass*.10)))); // 組織差就給不出助攻
    // 描述依實際亮點決定（避免組織差卻說一手包）
    let clutch;
    if(champ && rr.indexOf("冠軍")>=0) clutch=pick(["絕殺封王","延長賽制霸","單節接管"]);
    else if(lost) clutch="雖敗猶榮";
    else { const opts=[]; if(p>=season.attr.shooting*.4)opts.push("得分爆發"); if(a>=6)opts.push("組織全隊");
      if(rb>=9)opts.push("籃板怪獸"); if(season.attr.defense>=72)opts.push("防守鎖鏈");
      opts.push("個人秀","打滿全場"); clutch=pick(opts); }
    return {round:rr, line:`${p} 分 ${rb} 籃板 ${a} 助攻`, clutch, p, rb, a, lost:!!lost};
  };
  if(wins.length>=1 && (champ||chance(.55))) hero=mkHero(wins[wins.length-1].round,false);
  else if(!champ && log.length && chance(.4)) hero=mkHero(log[log.length-1].round,true);
  // 學生個人獎項：依「賽季場均」與現實標準（非單場），並考量球隊戰績
  const awards=[];
  const lvl = lg.startsWith("NCAA")?"NCAA":lg==="UBA"?"UBA":"HBL";
  const eliteA = chengchi?.6:1; // 政大出場少，門檻更嚴
  // 各聯盟得分王門檻（場均）
  const scTh = lg==="高中"?18 : lg==="UBA"?16 : 17;
  const bestFive = season.ppg>=(lg==="高中"?13:12) && ov>=66;
  if(bestFive && (champ||chance(.55)) && chance(eliteA)) awards.push(`${lvl} 最佳五人`);
  if(season.ppg>=scTh && chance(.7) && chance(eliteA)) awards.push(`${lvl} 得分王`);
  if(season.apg>=(lg==="高中"?6:6.5) && chance(.6) && chance(eliteA)) awards.push(`${lvl} 助攻王`);
  if(season.rpg>=(lg==="高中"?10:11) && chance(.6) && chance(eliteA)) awards.push(`${lvl} 籃板王`);
  const mvp = champ && ov>=(chengchi?82:72) && season.ppg>=13 && chance(chengchi?.3:.55);
  if(mvp) awards.push(`${lvl} MVP`);
  awards.forEach(a=>{ G.amateurAwards=G.amateurAwards||[]; G.amateurAwards.push({year:G.year,award:a}); logAward(lvl,a,G.year); });
  return {rounds:log, champ, result, mvp, hero, awards, bonusSP, chengchi};
}

  const w=POSITIONS[pos].w;let s=0,sw=0;
  for(const k of ATTR_KEYS){s+=attr[k]*w[k];sw+=w[k];}
  return Math.round(s/sw);
}
function fmtMoney(wan){ // wan = 萬
  if(wan === 0) return "0";
  const sign = wan < 0 ? "-" : "";
  const val = Math.abs(wan); // 取絕對值來計算單位
  if(val>=10000) return sign + (val/10000).toFixed(2).replace(/\.?0+$/,"")+"億";
  if(val>=1) return sign + Math.round(val).toLocaleString()+"萬";
  return "0";
}

function posMult(){ // 依位置調整籃板/助攻/阻攻
  const p=G.pos;
  // 基礎助攻乘數（依位置）
  let ast = p==="PG"?1.5:p==="SG"?1.0:p==="SF"?.85:p==="PF"?.6:.5;
  // 組織型長人：長人(C/PF)把「組織」練高時，助攻效率從 75 起逐步提升
  //（模擬策應型中軸；75→無加成、99→接近後衛級策應）
  if(p==="C"||p==="PF"){
    const pass=(G.attr&&G.attr.pass)||0;
    const t=clamp((pass-75)/24,0,1);      // 75→0，99→1（平滑漸進，非硬門檻）
    const maxBoost = p==="C"?0.6:0.45;    // C:0.5→1.1；PF:0.6→1.05
    ast += maxBoost*t;
  }
  return {
    reb: p==="C"?1.5:p==="PF"?1.3:p==="SF"?1:p==="SG"?.7:.55,
    ast,
    blk: p==="C"?1.6:p==="PF"?1.2:p==="SF"?.75:.4,
    stl: p==="PG"?1.2:p==="SG"?1.1:1,
  };
}
function leagueGP(lg){return {"高中":24,"UBA":28,"NCAA D2":30,"NCAA D1":32,"發展聯盟":50,"SBL":30,"P+":40,"TPBL":40,"日職 B.League":56,"CBL":46,"KRBL":54,"NBA":74}[lg]||30;}

function simulateSeason(){
  const a=G.attr, diff=DIFF[G.league]||1, m=posMult(), ov=overall();
  let usage=clamp((ov-45)/45,.25,1.15); // 明星使用率高
  let gp=leagueGP(G.league);
  // 彩蛋：政大是超級強權，上場時間較少，個人數據下修
  const chengchi=(G.league==="UBA" && G.team==="國立政治大學");
  if(chengchi){ usage*=.72; gp=Math.round(gp*.82); }
  // 受傷影響出賽
  if(G.health<70) gp=Math.round(gp*clamp(G.health/85,.4,1));
  gp=clamp(gp,8,gp);
  
  const noise=()=>rnd(.85,1.15);
  const hFactor = clamp((G.height - 195) / 100, -0.25, 0.25);

  let ppg=( (a.shooting*.5 + a.three*.32 + a.athletic*.18)/diff )*.48*usage*noise();
  let rpg=( (a.rebound*.72 + a.athletic*.22)/diff )*.135*m.reb*noise() * (1 + hFactor * 1.5);
  let apg=( (a.pass*.7 + a.iq*.3)/diff )*.078*m.ast*noise();
 let spg=( (a.defense*.5 + a.athletic*.3 + a.iq*.2)/diff )*.027*m.stl*noise() * (1 - hFactor * 0.5);
  let bpg=( (a.defense*.5 + a.athletic*.5)/diff )*.032*m.blk*noise() * (1 + hFactor * 1.8);
  const fg=clamp(.36 + (a.shooting-40)*.0028 + (hFactor*0.05) + rnd(-.02,.02),.33,.62); // 高個子離框近，FG%略高
  const tp=clamp(.20 + (a.three-40)*.0038 - (Math.max(0, hFactor)*0.03) + rnd(-.03,.03),.16,.44); // 太高會微扣三分基礎率

  ppg=clamp(ppg,1.5,40); rpg=clamp(rpg,.5,17); apg=clamp(apg,.3,11.5);
  spg=clamp(spg,.1,2.8); bpg=clamp(bpg,0,3.8);

  // 隊伍強度與戰績（含事件影響：交易補強、內鬨、關鍵戰等）
  const mods=G._seasonMods||{winBoost:0,champBoost:0,playoffForce:false,playoffOut:false};
  // 檢查合約是否為「爭冠球隊」，若是，整支球隊實力會自帶巨大 Buff
  const contractBuff = (G.contract && G.contract.cType === "contender") ? 0.16 : 0;
  const teamStr=clamp(rnd(.32,.68)+ (ov-60)*.006 + (mods.winBoost||0) + contractBuff, .15,.95);
  const winPct=clamp(teamStr+rnd(-.08,.08),.12,.9);
  const w=Math.round(gp*winPct), l=gp-w;

  // 綜合季表現分（給獎項/薪資用）
  const prod=(ppg + rpg*1.15 + apg*1.4 + spg*2.4 + bpg*2.2);
  const seasonScore=clamp( prod*diff*1.15 + (ov-50)*.5 + winPct*12 + rnd(-4,4), 0, 130);

  // 冠軍判定
  let playoff=false,champion=false,fmvp=false,tourney=null;
  if(isPro()){
    if(mods.playoffForce || winPct>.5){ playoff = mods.playoffForce || chance(clamp(winPct,.3,.9));
      if(mods.playoffOut){ /* 事件導致季後賽止步，晉了但沒奪冠 */ }
      else if(playoff&&chance(clamp((winPct-.45)*.9 + (ov-70)*.01 + (mods.champBoost||0),.02,.75))){ champion=true;
        if(seasonScore>60&&chance(.55)) fmvp=true; } }
  } else {
    // 學生時期打錦標賽（HBL / UBA / NCAA 三月瘋）
    tourney=simulateTournament(ov,teamStr,{ppg:round(ppg),rpg:round(rpg),apg:round(apg),spg:round(spg,1),bpg:round(bpg,1),fg:Math.round(fg*100),tp:Math.round(tp*100),attr:a,m});
    if(tourney){ champion=tourney.champ; if(champion&&tourney.mvp) fmvp=true; }
  }

  return {gp,ppg:round(ppg),rpg:round(rpg),apg:round(apg),spg:round(spg,1),bpg:round(bpg,1),
    fg:Math.round(fg*100),tp:Math.round(tp*100),w,l,winPct,seasonScore,ov,
    playoff,champion,fmvp,tourney,league:G.league,team:G.team,stage:G.stage,age:G.age,year:G.year,
    grade:G.grade,arche:archetype(),
    usRank:computeUsRank(),

/* ---------- 獎項判定 ---------- */
function computeAwards(s){
  const aw=[]; const pro=isPro();
  const isRookie=pro&&!G.rookieDone;
  const ss=s.seasonScore;
  const lg=G.league, yr=G.year;
  const rec=(name)=>{ aw.push(name); logAward(lg,name,yr); };
  
  // 高階聯盟門檻更高
  const eliteLg=(G.league==="NBA"||G.league==="日職 B.League"||G.league==="CBL"||G.league==="KRBL");
  const starTh=pro?(eliteLg?76:73):62, mvpTh=pro?(eliteLg?103:112):92, dpoyTh=84;
  
  // 1. 先判定是否為 MVP
  let isMVP = false;
  if(ss>=mvpTh&&s.winPct>.58){ G.careerAwards.MVP++; rec("MVP"); isMVP = true; }
  
  // 2. 明星賽與最佳陣容 (只要是 MVP 必定入選)
  if(ss>=starTh){ G.careerAwards["明星賽"]++; rec("明星賽"); }
  // 排除 NBA，因為 NBA 在下方有專屬的「年度一/二/三隊」
  if((ss>=starTh+9 || isMVP) && G.league !== "NBA"){ G.careerAwards["最佳陣容"]++; rec("最佳陣容"); }
  
  if(G.attr.defense>=dpoyTh&&ss>=starTh+3&&chance(.5)){ G.careerAwards.DPOY++; rec("DPOY"); }
  if(isRookie&&ss>=(pro?60:0)&&chance(.7)){ G.careerAwards.ROTY++; rec("ROTY"); }
  if(pro){
    if(s.ppg>=(eliteLg?24:27) && chance(.4)){ G.careerAwards["得分王"]++; rec("得分王"); grantTitle("sniper"); }
    if(s.rpg>=(eliteLg?11:13) && chance(.4)){ G.careerAwards["籃板王"]++; rec("籃板王"); }
    if(s.apg>=(eliteLg?8.5:10) && chance(.4)){ G.careerAwards["助攻王"]++; rec("助攻王"); }
  }
  
  // NBA 專屬：年度球隊（MVP 強制年度一隊）
  if(G.league==="NBA"){
    const team = (ss>=104 || isMVP) ? "年度一隊" : ss>=92 ? "年度二隊" : ss>=82 ? "年度三隊" : null;
    if(team){ G.careerAwards[team]=(G.careerAwards[team]||0)+1; rec(team); }
    if(isRookie){
      const rk = ss>=80?"新秀一隊": ss>=62?"新秀二隊": null;
      if(rk){ G.careerAwards[rk]=(G.careerAwards[rk]||0)+1; rec(rk); }
    }
  }
  
  // CBL 專屬：本土 MVP
  if(G.league==="CBL" && ss>=starTh+6 && s.winPct>.5 && chance(.5)){ G.careerAwards["本土MVP"]=(G.careerAwards["本土MVP"]||0)+1; rec("本土MVP"); }
  // KRBL 專屬：國內 MVP（韓國聯賽本土球員 MVP 傳統）
  if(G.league==="KRBL" && ss>=starTh+6 && s.winPct>.5 && chance(.5)){ G.careerAwards["國內MVP"]=(G.careerAwards["國內MVP"]||0)+1; rec("國內MVP"); }
  if(s.champion){ G.careerAwards["冠軍"]++; rec("冠軍"); if(s.fmvp){G.careerAwards.FMVP++; rec("FMVP");} }
  if(pro) G.rookieDone=true;
  return aw;
}

/* =========================================================================
   國際賽（中華隊徵召）
   ========================================================================= */
function intlEventForYear(y){
  // 依年份循環：瓊斯盃幾乎每年，其餘四年一輪
  const evs=[];

  const c=y%4;
  if(c===0){evs.push({name:"亞洲盃",th:72,games:5,medalP:.22,prestige:2});}
  if(c===1){evs.push({name:"亞運",th:74,games:5,medalP:.25,prestige:2});}
  if(c===2){evs.push({name:"世界盃資格賽",th:76,games:6,medalP:.2,prestige:2});}
  if(c===3 && G._qualifiedWorldCup){evs.push({name:"世界盃",th:82,games:5,medalP:.12,prestige:3});}
  // 奧運：極難，需超高能力
  if(c===0&&overall()>=88){evs.push({name:"奧運",th:88,games:5,medalP:.1,prestige:4});}
  return evs;
}
function pendingIntl(){
  const ov=overall();if(ov<64)return null;if(G.age<17||G.age>36)return null;
  const evs=intlEventForYear(G.year).filter(e=>ov>=e.th);
  if(!evs.length)return null;
  // 取最高等級的一項
  evs.sort((a,b)=>b.prestige-a.prestige);
  return evs[0];
}
function simulateIntl(ev){
  const a=G.attr,ov=overall(),diff=1.2,m=posMult();
  const usage=clamp((ov-55)/40,.35,1.2);
  const ppg=clamp(((a.shooting*.5+a.three*.32+a.athletic*.18)/diff)*.56*usage*rnd(.85,1.15),1,34);
  const rpg=clamp(((a.rebound*.72+a.athletic*.22)/diff)*.145*m.reb*rnd(.85,1.15),.5,15);
  const apg=clamp(((a.pass*.7+a.iq*.3)/diff)*.118*m.ast*rnd(.85,1.15),.3,12);
  const perf=ppg+rpg*1.1+apg*1.4+(ov-60)*.4;
  // 團隊強度（中華隊整體 + 你的貢獻）
  const teamPow=clamp(.4+(ov-70)*.012+rnd(-.12,.12),.15,.95);
  const medal=chance(ev.medalP+clamp((ov-75)*.01,0,.25));
  // 名次 / 晉級
  const advanced = medal || teamPow>.5 || chance(clamp(teamPow,.1,.8));
  let place;
  if(medal){ place=pick(["🥇 冠軍","🥈 亞軍","🥉 季軍"]); }
  else if(advanced){ place=pick(["第 4 名","第 5 名","第 6 名","八強"]); }
  else { place=pick(["分組未晉級","小組賽止步","第 9 名","第 10 名"]); }
  const mvp=medal&&perf>26&&chance(.4);
  if(medal){ G.intlMedals++; logAward("中華隊",(place.includes("冠")?"金牌":place.includes("亞")?"銀牌":"銅牌"),G.year); grantTitle("twhero"); }
  if(mvp) logAward("中華隊","賽會MVP",G.year);
  // 受傷風險（國際賽較操，略增受傷機率）
  let injuryNote="";
  const pInj=clamp(.06+Math.max(0,(G.age-30))*.01,.06,.3);
  if(chance(pInj)){
    const career=chance(clamp(.04+(G.age-30)*.03,.02,.35));
    ATTR_KEYS.forEach(k=>{const fast=(k==="athletic"||k==="defense")?1.5:1;
      G.attr[k]=clamp(Math.round(G.attr[k]-rnd(1,4)*fast),15,99);});
    G.health=clamp(G.health-rnd(10,28),5,100);
    injuryNote=career?"國際賽嚴重受傷，恐影響生涯…":"國際賽期間受了點傷。";
    if(career) G._intlCareerInjury=true;
  } else {
    G.health=clamp(G.health-rnd(2,8),0,100);
  }
  const rec={year:G.year,event:ev.name,ppg:round(ppg),rpg:round(rpg),apg:round(apg),
    medal:medal?place.replace(/^[^\s]+\s/,""):"",place,advanced,mvp,age:G.age,injuryNote};
  G.intlHistory.push(rec);
  if (ev.name === "世界盃資格賽") G._qualifiedWorldCup = advanced;
  G.fame+=medal?ev.prestige*3:ev.prestige;
  return rec;
}

/* 第一次參賽的預設分組（之後每年改為亂數） */
const JONES_GROUPS={
  A:["日本","韓國原州DB新世代","菲律賓SGA","中華藍"],
  B:["約旦","馬來西亞","美國加州大學爾灣分校","中華白"],
};
/* 之後每年抽選外隊的池子（兩支美國隊最多只會出現一支） */
const JONES_FOREIGN_POOL=[
  "日本","菲律賓SGA","韓國原州DB新世代","約旦","美國加州大學爾灣分校","馬來西亞",
  "澳洲聯隊","卡達","阿聯","巴林","伊朗","美國業餘聯隊","加拿大","立陶宛","埃及聯隊",
];
/* 本屆實際採用的分組：開賽時寫入 G._jones.groups，其餘一律沿用預設 */
function curJonesGroups(){ return (G._jones && G._jones.groups) ? G._jones.groups : JONES_GROUPS; }
/* 建立本屆分組：第一次＝預設；之後＝亂數抽 6 外隊（最多 1 支美國隊）＋兩支中華隊分屬不同組 */
function buildJonesGroups(myTeam, otherTeam){
  if(!G.jonesHistory || G.jonesHistory.length===0){
    return { A:JONES_GROUPS.A.slice(), B:JONES_GROUPS.B.slice() };
  }
  let pool=JONES_FOREIGN_POOL.slice();
  for(let i=pool.length-1;i>0;i--){ const j=rint(0,i); const t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  const chosen=[]; let usaUsed=false;
  for(const t of pool){
    if(chosen.length>=6) break;
    const isUSA=(JONES_TEAMS[t]||{}).usa;
    if(isUSA && usaUsed) continue; // 已有一支美國隊就不再放第二支
    chosen.push(t); if(isUSA) usaUsed=true;
  }
  const chineseInA=chance(.5);
  const gA=[ chineseInA?myTeam:otherTeam ];
  const gB=[ chineseInA?otherTeam:myTeam ];
  for(let i=0;i<6;i++){ (i<3?gA:gB).push(chosen[i]); }
  return { A:gA, B:gB };
}
function jonesTeamName(){ return G.age>=27 ? "中華藍" : "中華白"; }
function jonesGroupOf(team){ return curJonesGroups().A.includes(team) ? "A" : "B"; }
/* 我方（中華）整體戰力：白隊底子較弱但玩家影響大；藍隊底子強 */
function jonesOurStrength(){
  const ov=overall();
  const base = G._jones.team==="中華藍" ? .64 : .50;
  const playerFactor = clamp((ov-70)*.0075, -.10, .19);
  const teammates = G._jones.team==="中華藍" ? rnd(-.02,.05) : rnd(-.05,.03);
  return clamp(base + playerFactor + teammates, .18, .93);
}
/* 玩家單場數據（高變異；瓊斯盃節奏快、球權多） */
function jonesPlayerLine(boost){
  const a=G.attr, ov=overall(), diff=1.14, m=posMult();
  const usage=clamp((ov-55)/42,.36,1.15) * (1+(boost||0)*.4);
  const p=clamp(((a.shooting*.5+a.three*.32+a.athletic*.18)/diff)*.47*usage*rnd(.72,1.38),0,40);
  const rb=clamp(((a.rebound*.72+a.athletic*.22)/diff)*.15*m.reb*rnd(.65,1.5),0,19);
  const as=clamp(((a.pass*.7+a.iq*.3)/diff)*.095*m.ast*rnd(.6,1.6),0,14);
  const st=clamp(((a.defense*.42+a.iq*.3)/diff)*.05*m.stl*rnd(.4,1.9),0,7);
  const bk=clamp(((a.athletic*.4+a.rebound*.32)/diff)*.044*m.blk*rnd(.3,2.1),0,7);
  return {p:Math.round(p),rb:Math.round(rb),a:Math.round(as),s:Math.round(st),b:Math.round(bk)};
}
/* 兩隊之間單場勝負與比數（回傳 {win,us,them,line,perf}）；ourLine 只在玩家上場時給 */
function jonesSimGame(oppName, opts={}){
  opts=opts||{};
  const boost=G._jones.boost||0;
  const ourStr=jonesOurStrength();
  const oppStr=(JONES_TEAMS[oppName]||{str:.5}).str + rnd(-.06,.06);
  const line=jonesPlayerLine(boost);
  const perf=line.p+line.rb*1.1+line.a*1.4+line.s*1.8+line.b*1.6;
  // 玩家發揮回饋到我方戰力
  const perfEdge=clamp((perf-24)*.004, -.05, .08);
  let pWin=clamp(.5 + (ourStr-oppStr)*1.35 + perfEdge + boost*.12 + rnd(-.12,.12), .05, .95);
  const win=chance(pWin);
  // 國家比數（勝方分數較高，差距合理）
  const ourBase=rint(74,92);
  const spread=rint(2,19);
  const us = win ? ourBase : ourBase - rint(0,7);
  const them = win ? Math.max(40, us - spread) : us + spread;
  return {win, us, them, line, perf, pWin};
}
/* 只算勝負（他隊之間、背景模擬用） */
function jonesSimAI(aName,bName){
  const aStr=(JONES_TEAMS[aName]||{str:.5}).str + rnd(-.08,.08);
  const bStr=(JONES_TEAMS[bName]||{str:.5}).str + rnd(-.08,.08);
  const pA=clamp(.5+(aStr-bStr)*1.4+rnd(-.1,.1),.05,.95);
  const aWin=chance(pA);
  const base=rint(70,90), sp=rint(2,18);
  const as=aWin?base:base-rint(0,6), bs=aWin?Math.max(40,as-sp):as+sp;
  return {aWin, as, bs};
}
/* 建立分組戰績表 */
function jonesInitStandings(){
  const st={};
  Object.keys(JONES_TEAMS).forEach(t=>{ st[t]={w:0,l:0,pf:0,pa:0}; });
  return st;
}
function jonesRecord(st, team, opp, us, them){
  st[team].pf+=us; st[team].pa+=them; st[opp].pf+=them; st[opp].pa+=us;
  if(us>them){ st[team].w++; st[opp].l++; } else { st[team].l++; st[opp].w++; }
}
/* 產生某組「不含玩家隊」的其餘循環賽（背景模擬） */
function jonesSimGroupAI(group, st, exclude){
  const teams=curJonesGroups()[group];
  for(let i=0;i<teams.length;i++) for(let j=i+1;j<teams.length;j++){
    const a=teams[i], b=teams[j];
    if(a===exclude||b===exclude) continue; // 玩家的比賽另外逐場打
    const r=jonesSimAI(a,b);
    jonesRecord(st, a, b, r.as, r.bs);
  }
}
/* 排序：勝場 → 得失分差 → 得分 */
function jonesRank(group, st){
  return curJonesGroups()[group].slice().sort((x,y)=>{
    if(st[y].w!==st[x].w) return st[y].w-st[x].w;
    const dy=st[y].pf-st[y].pa, dx=st[x].pf-st[x].pa;
    if(dy!==dx) return dy-dx;
    return st[y].pf-st[x].pf;
  });
}

/* ---------- 瓊斯盃：徵召判定與啟動 ---------- */
function pendingJones(){
  const ov=overall();
  if(!isPro() && G.stage!=="大學") { if(ov<58) return false; } // 高中生一般不徵召白隊
  if(G.age<18||G.age>35) return false;
  const th = G.age>=27 ? 68 : 58; // 藍隊門檻較高
  return ov>=th;
}
function startJonesCup(){
  const team=jonesTeamName();
  const other= team==="中華藍" ? "中華白" : "中華藍";
  // 本屆分組：第一次用預設，之後亂數；兩支中華隊固定分屬不同組
  const groups=buildJonesGroups(team, other);
  const group = groups.A.includes(team) ? "A" : "B";
  // 玩家在該組的對手（其餘三隊），依序出戰
  const opponents=groups[group].filter(t=>t!==team);
  // 稍微打亂出場順序
  for(let i=opponents.length-1;i>0;i--){ const j=rint(0,i); const tmp=opponents[i]; opponents[i]=opponents[j]; opponents[j]=tmp; }
  G._jones={
    team, group, groups, opponents, gameIdx:0,
    st:jonesInitStandings(),
    results:[],
    tot:{p:0,rb:0,a:0,s:0,b:0,g:0},
    step:"intro", event:null, eventResolved:false, boost:0,
    ko:null, finalPlace:"", medal:false, mvp:false, usedEvents:[],
    lastGame:null, aiSimmed:false,
  };
  G.phase="jones"; render();
}
function declineJones(){ toast("婉拒中華隊瓊斯盃徵召，專注於球隊。"); G.fame=clamp(G.fame-2,0,100); G._jones=null; processOffseason(); }

/* 抽一個尚未用過的場間事件 */
function jonesDrawEvent(special){
  if(special) return special;
  const J=G._jones;
  let pool=JONES_EVENTS.filter(e=>!J.usedEvents.includes(e.t));
  if(!pool.length){ pool=JONES_EVENTS.slice(); J.usedEvents=[]; }
  const base=pick(pool);
  J.usedEvents.push(base.t);
  return base.noRisk ? {t:base.t,x:base.x,o:base.o} : withRiskOption(base);
}

/* 進到「下一步」：事件→比賽→（下一場事件 or 分組結算）→四強→冠/季軍→結束 */
function jonesAdvance(){
  const J=G._jones;
  if(J.step==="intro"){
    // 背景模擬：每組各只跑一次循環賽。玩家所在組排除玩家（那幾場玩家自己逐場打），另一組完整模擬。
    if(J.group==="A"){
      jonesSimGroupAI("A", J.st, J.team); // 玩家組：排除玩家
      jonesSimGroupAI("B", J.st, null);   // 對手組：完整
    }else{
      jonesSimGroupAI("B", J.st, J.team);
      jonesSimGroupAI("A", J.st, null);
    }
    J.aiSimmed=true;
    J.step="event"; J.event=jonesDrawEvent(); J.eventResolved=false; J.boost=0;
    render(); return;
  }
  if(J.step==="event"){ // 事件已解，進比賽
    const opp=J.opponents[J.gameIdx];
    const g=jonesSimGame(opp);
    jonesRecord(J.st, J.team, opp, g.us, g.them);
    J.results.push({stage:`預賽 第${J.gameIdx+1}戰`, opp, ...g});
    J.tot.p+=g.line.p; J.tot.rb+=g.line.rb; J.tot.a+=g.line.a; J.tot.s+=g.line.s; J.tot.b+=g.line.b; J.tot.g++;
    J.lastGame=J.results[J.results.length-1];
    jonesMinorInjury();
    J.step="gameReport"; render(); return;
  }
  if(J.step==="gameReport"){
    J.gameIdx++;
    if(J.gameIdx<J.opponents.length){ // 還有預賽
      J.boost=0; J.step="event"; J.event=jonesDrawEvent(); J.eventResolved=false; render(); return;
    }
    // 【修正】在進入 groupResult 畫面前，先計算好分組排名與 seed
    const rankA=jonesRank("A",J.st), rankB=jonesRank("B",J.st);
    J._rankA=rankA; J._rankB=rankB;
    const myRank=(J.group==="A"?rankA:rankB).indexOf(J.team); // 0-based
    J.groupSeed=myRank+1;

    J.step="groupResult"; render(); return;
  }
  if(J.step==="groupResult"){
    // 點擊下一步時，直接使用已計算好的 J.groupSeed 判定晉級或落選
    const myRank = J.groupSeed - 1;
    if(myRank<=1){ // 前二晉級
      // 交叉：A1 vs B2、B1 vs A2
      let opp;
      if(J.group==="A") opp = myRank===0 ? J._rankB[1] : J._rankB[0];
      else opp = myRank===0 ? J._rankA[1] : J._rankA[0];
      J.ko={round:"semi", opp};
      J.step="koEvent"; J.boost=0;
      J.event=(opp==="中華白"||opp==="中華藍")?jonesSiblingEvent(opp):jonesDrawEvent();
      J.eventResolved=false; render(); return;
    } else { // 未晉級 → 5~8 名分類
      J.finalPlace=jonesClassifyNonAdvancer();
      J.step="done"; jonesFinalize(); render(); return;
    }
  }
  if(J.step==="koEvent"){ // 淘汰賽事件已解 → 打淘汰賽
    const g=jonesSimGame(J.ko.opp);
    J.results.push({stage:J.ko.round==="semi"?"準決賽":(J.ko.round==="final"?"冠軍戰":"季軍戰"), opp:J.ko.opp, ...g});
    J.tot.p+=g.line.p; J.tot.rb+=g.line.rb; J.tot.a+=g.line.a; J.tot.s+=g.line.s; J.tot.b+=g.line.b; J.tot.g++;
    J.lastGame=J.results[J.results.length-1];
    jonesMinorInjury();
    J.ko.win=g.win;
    J.step="koReport"; render(); return;
  }
  if(J.step==="koReport"){
    if(J.ko.round==="semi"){
      // 另一場準決賽（玩家沒打的那組交叉）AI 模擬，決定冠/季軍戰對手
      const other=jonesOtherSemiWinner();
      if(J.ko.win){ // 進冠軍戰
        J.ko={round:"final", opp:other.loserPathIsFinal?other.winner:other.winner};
        J.ko.opp=other.winner; J.ko.win=undefined;
      } else { // 打季軍戰
        J.ko={round:"bronze", opp:other.loser}; J.ko.win=undefined;
      }
      J.boost=0; J.step="koEvent";
      J.event=(J.ko.opp==="中華白"||J.ko.opp==="中華藍")?jonesSiblingEvent(J.ko.opp):jonesDrawEvent();
      J.eventResolved=false; render(); return;
    }
    // 冠軍戰 / 季軍戰結束 → 定名次
    if(J.ko.round==="final"){ J.finalPlace=J.ko.win?"🥇 冠軍":"🥈 亞軍"; J.medal=J.ko.win; J.silver=!J.ko.win; }
    else { J.finalPlace=J.ko.win?"🥉 季軍":"第 4 名"; J.medal=J.ko.win; }
    J.step="done"; jonesFinalize(); render(); return;
  }
  if(J.step==="done"){
    jonesApplyRewards();
    G._jones=null;
    return processOffseason();
  }
}
/* 另一半準決賽勝負（AI），回傳 winner / loser 供冠軍戰、季軍戰配對 */
function jonesOtherSemiWinner(){
  const J=G._jones;
  const rankA=J._rankA, rankB=J._rankB;
  // 玩家在自己這條交叉線；另一條線是「另一組第1 vs 我組第2」或反之
  let x,y;
  if(J.group==="A"){ // 玩家線用了 A?,B?; 另一線是剩下的 A 種子 vs B 種子
    if(J.groupSeed===1){ x=rankB[0]; y=rankA[1]; } else { x=rankB[1]; y=rankA[0]; }
  } else {
    if(J.groupSeed===1){ x=rankA[0]; y=rankB[1]; } else { x=rankA[1]; y=rankB[0]; }
  }
  const r=jonesSimAI(x,y);
  return { winner:r.aWin?x:y, loser:r.aWin?y:x };
}
/* 未晉級的 5~8 名分類（兩組第3、第4合併排序） */
function jonesClassifyNonAdvancer(){
  const J=G._jones, st=J.st;
  const a3=J._rankA?J._rankA[2]:jonesRank("A",st)[2], a4=J._rankA?J._rankA[3]:jonesRank("A",st)[3];
  const b3=J._rankB?J._rankB[2]:jonesRank("B",st)[2], b4=J._rankB?J._rankB[3]:jonesRank("B",st)[3];
  const diff=t=>st[t].pf-st[t].pa;
  const thirds=[a3,b3].sort((x,y)=> st[y].w-st[x].w || diff(y)-diff(x));
  const fourths=[a4,b4].sort((x,y)=> st[y].w-st[x].w || diff(y)-diff(x));
  const order=[thirds[0],thirds[1],fourths[0],fourths[1]]; // 5,6,7,8
  const idx=order.indexOf(J.team);
  return `第 ${5+idx} 名`;
}
/* 瓊斯盃輕度疲勞/受傷（表演性質，不會生涯報銷） */
function jonesMinorInjury(){
  const p=clamp(.05+Math.max(0,(G.age-30))*.008,.05,.2);
  if(chance(p)){
    ATTR_KEYS.forEach(k=>{ if(chance(.5)) G.attr[k]=clamp(Math.round(G.attr[k]-rnd(1,3)),15,99); });
    G.health=clamp(G.health-rnd(8,18),15,100);
    G._jones.injuryNote="賽中受了點傷，帶傷奮戰。";
  } else {
    G.health=clamp(G.health-rnd(2,7),0,100);
    G._jones.injuryNote="";
  }
}
/* 賽會場均、名次、MVP、獎牌判定與紀錄 */
function jonesFinalize(){
  const J=G._jones, g=Math.max(1,J.tot.g);
  J.avg={ p:round(J.tot.p/g), rb:round(J.tot.rb/g), a:round(J.tot.a/g), s:round(J.tot.s/g), b:round(J.tot.b/g) };
  const podium = /冠軍|亞軍|季軍/.test(J.finalPlace);
  // MVP：登上頒獎台 + 場均夠亮眼 + 一點運氣
  const perf=J.avg.p+J.avg.rb*1.1+J.avg.a*1.4+J.avg.s*1.8+J.avg.b*1.6;
  J.mvp = podium && perf>=26 && chance(J.finalPlace.includes("冠")?.55:.3);
  // 國家排名（本屆 8 隊名次數字）
  const placeNum=(J.finalPlace.match(/\d+/)||[ J.finalPlace.includes("冠")?"1":J.finalPlace.includes("亞")?"2":J.finalPlace.includes("季")?"3":"4" ])[0];
  J.placeNum=parseInt(placeNum);
  // 賽會最佳五人（中間偏上難度）：MVP 必入選；否則以名次為基礎機率、依 perf 微調，並設基本表現門檻。
  let bf5Base;
  if(J.placeNum===1)      bf5Base=.52;  // 冠軍
  else if(J.placeNum<=3)  bf5Base=.38;  // 亞軍 / 季軍
  else if(J.placeNum===4) bf5Base=.24;  // 第 4 名
  else if(J.placeNum<=6)  bf5Base=.09;  // 5～6 名：要有亮眼表現才有機會
  else                    bf5Base=.035; // 7～8 名：幾乎要超猛個人秀
  const bf5PerfBonus=clamp((perf-35)*.02, -.15, .16); // 賽會綜合表現越高越容易入選
  const bf5FloorOK = perf>=30;                          // 基本貢獻門檻，避免打得差也僥倖入選
  J.bestFive = J.mvp || (bf5FloorOK && chance(clamp(bf5Base+bf5PerfBonus, 0, .85)));
}
function jonesApplyRewards(){
  const J=G._jones;
  const senior=(J.team==="中華藍");
  const podium=/冠軍|亞軍|季軍/.test(J.finalPlace);
  // 名氣
  G.fame=clamp(G.fame + (podium? (senior?9:6) : 3) + (J.mvp?6:0) + (J.bestFive&&!J.mvp?3:0), 0,100);
  G.morale=clamp(G.morale + (podium?6:2), 0,100);
  // 白隊：重養成 → 給下季額外訓練點；藍隊登台 → 正式國際獎牌
  if(senior && podium){
    G.intlMedals++;
    logAward("中華隊", J.finalPlace.includes("冠")?"瓊斯盃金牌":J.finalPlace.includes("亞")?"瓊斯盃銀牌":"瓊斯盃銅牌", G.year);
    grantTitle("twhero");
  } else if(!senior){
    // 白隊培養：依表現給 1~3 點訓練點，冠軍/MVP/最佳五人 更多
    let sp=1; if(podium) sp+=1; if(J.finalPlace.includes("冠")||J.mvp||J.bestFive) sp+=1;
    G._pendingSP=(G._pendingSP||0)+sp;
    if(podium) logAward("中華隊", "瓊斯盃白隊之星", G.year);
  } else if(senior && !podium){
    // 藍隊但未登台，仍記錄一屆經歷
  }
  if(J.mvp) logAward("中華隊", J.team==="中華藍"?"瓊斯盃MVP":"瓊斯盃白隊MVP", G.year);
  // 最佳五人：MVP 已是更高榮譽（且本就涵蓋最佳五人），故 MVP 當屆不再另記一行，避免重複。
  if(J.bestFive && !J.mvp) logAward("中華隊", J.team==="中華藍"?"瓊斯盃最佳五人":"瓊斯盃白隊最佳五人", G.year);
  // 記入國際賽歷史表
  G.intlHistory.push({
    year:G.year, event:`瓊斯盃(${J.team})`,
    ppg:J.avg.p, rpg:J.avg.rb, apg:J.avg.a,
    medal: podium? J.finalPlace.replace(/^[^\s]+\s?/,"") : "",
    place:J.finalPlace, advanced: J.placeNum<=4, mvp:J.mvp, bestFive:J.bestFive, age:G.age, injuryNote:""
  });
  if(!G.jonesHistory) G.jonesHistory=[];
  G.jonesHistory.push({year:G.year, team:J.team, place:J.finalPlace, mvp:J.mvp, bestFive:J.bestFive, avg:J.avg});
  // 多屆獎牌 → 黃金世代
  if(G.intlMedals>=2) grantTitle("goldGen");
}

/* =========================================================================
   年齡成長 / 退化
   ========================================================================= */
function applyAging(){
  const age=G.age, pot=G.potential, ov=overall();
  // --- 身高體重發育系統 ---
  if(age <= 19) {
    // 基礎長高機率隨年紀遞減，加上事件帶來的隱藏 buff
    let growthChance = 0.5 - (age - 16) * 0.15 + (G._growthBoost || 0);
    if(chance(growthChance)) {
      let gainH = rint(1, 4); // 長高 1~4 公分
      let gainW = Math.round(gainH * 0.8) + rint(1, 2); // 變壯
      G.height += gainH;
      G.weight += gainW;
      toast(`發育期！你長高了 ${gainH} 公分！目前 ${G.height}cm`, 3500);
    }
  } else if (age <= 24) {
    // 20~24 歲不會長高，但會自然增肌
    if(chance(0.4)) G.weight += rint(1, 2);
  }
  G._growthBoost = 0; // 結算後歸零
  // --- 發育系統結束 ---
  let base;
  if(age<=19) base=1.8; else if(age<=22) base=1.5; else if(age<=25) base=1.0;
  else if(age<=28) base=.75; else if(age<=30) base=.4;
  else if(age<=32) base=-.6; else if(age<=34) base=-1.0;
  else if(age===35) base=-1.5; else if(age===36) base=-2.3;
  else if(age===37) base=-3.1; else base=-3.9; // 38+ 斷崖式下滑
  const envBonus = G.league==="NCAA D1"?.26 : G.league==="NCAA D2"?.12 : 0;
  // 狀態（士氣/健康）會影響訓練成效：低落時成長明顯變慢
  const cond = clamp(.58 + G.morale/260 + G.health/420, .58, 1.12);
  if(base>0) base=base*.82*cond + envBonus;
  const gap=pot-ov;
  ATTR_KEYS.forEach(k=>{
    if(base>0){
      if(gap<=0) return; // 已達潛力，自然成長停止（潛力＝天花板）
      const factor=clamp(.85+gap*.045,.5,2.8);
      let g=base*factor*rnd(.5,1.25)*(k==="iq"?1.1:1);
      G.attr[k]=clamp(Math.round(G.attr[k]+g),15,99);
    } else if(base<0){
      const fast=(k==="athletic"||k==="defense"||k==="rebound")?1.5:(k==="iq"||k==="three")?.55:1;
      let d=Math.abs(base)*rnd(.5,1.25)*fast;
      // 士氣/健康低落 → 退化加速
      if(G.morale<40) d*=1.2; if(G.health<50) d*=1.2;
      G.attr[k]=clamp(Math.round(G.attr[k]-d),15,99);
    }
  });
  // 長期低士氣/低健康：即使還在成長年紀也會流失少量能力
  if(base>0 && (G.morale<32 || G.health<45)){
    const k=pick(ATTR_KEYS); G.attr[k]=clamp(G.attr[k]-1,15,99);
  }
  // 生涯下滑階段偵測：僅職業、且處於下滑年份(base<0)，跨入新階段時記錄一張劇情卡（供季前顯示）
  if(isPro() && base<0){
    const stage = age>=37?4 : age>=35?3 : age>=33?2 : 1;
    if(stage > (G._declineStage||0)){
      const ovAfter=overall();
      G._declineCard={stage, drop:Math.max(0, ov-ovAfter), age};
      G._declineStage=stage;
    }
  }
}

/* =========================================================================
   Offer / 合約 / 自由市場
   ========================================================================= */
function makeContract(league,team,years,ovForPay,cType="normal"){
  const [lo,hi]=PAY[league]||[100,500];
  const t=clamp((ovForPay-58)/40,0,1.4);
  let base=lo+(hi-lo)*Math.pow(t,1.6);
  let mult=isNBAstar(league,ovForPay)?rnd(.9,1.3):rnd(.8,1.1);
  
  // 依照合約種類動態調整薪資倍率
  if (cType === "max") mult = rnd(1.15, 1.4); 
  else if (cType === "contender") mult = rnd(0.7, 0.85); // 降薪
  else if (cType === "veteran") mult = rnd(0.5, 0.7); 
  
  let salary=Math.round(base*mult);
  salary=Math.max(lo,salary);
  return {league,team,years,yearsLeft:years,salary,cType};
}
function isNBAstar(lg,ov){return lg==="NBA"&&ov>=85;}

// 選秀行情：在美國 NCAA 打球有加成（更容易挑戰更高殿堂 / NBA）
function draftStock(){
  const ov=overall();
  const bonus = G.league==="NCAA D1"?3 : G.league==="NCAA D2"?1 : 0;
  return ov + bonus;
}

function proTargetLeagues(ov){
  const t=[];
  if(ov>=90) t.push("NBA"); // NBA 自由市場門檻：需真實 OVR 90 以上
  if(ov>=80) t.push("日職 B.League","CBL"); // 【修改】從 82 下修
  if(ov>=78) t.push("KRBL");
  if(ov>=74) t.push("發展聯盟");
  if(ov>=68) t.push("TPBL","P+");
  if(ov>=54) t.push("SBL");
  return t; 
}
/* 各聯盟「競爭水準線」：低於此線一截就有被釋出風險 */
const LEAGUE_STANDARD={"SBL":54,"P+":64,"TPBL":64,"發展聯盟":72,"日職 B.League":78,"CBL":77,"KRBL":76,"NBA":84};
/* 近期產出（給選秀 / 海外報價參考） */
function lastSeason(){ const h=G.seasonHistory; return h.length? h[h.length-1] : null; }
function recentProd(){ const s=lastSeason(); return s? (s.prodScore||0) : 0; }
/* 戰力行情：能力 + 美國加成 + 亮眼數據加成 + 身高紅利 */
function prospectScore(){
  const prod=recentProd();
  // 【修改】降低純靠大學刷數據帶來的虛假行情，最多 +10
  const prodBonus=clamp((prod-20)*.35, 0, 5); 
  
  let heightBonus = 0;
  if(G.height >= 208) heightBonus = 4; 
  else if(G.height >= 200) heightBonus = 2;
  else if(G.height <= 180) heightBonus = -3; 
  else if(G.height <= 173) heightBonus = -7; 
  
  return draftStock() + prodBonus + heightBonus;
}
/* 市場身價：近兩季若打出明星等級表現，即使 OVR 略降，行情仍維持高檔 */
function marketValue(){
  const ov=overall();
  const recent=G.seasonHistory.filter(s=>s.stage==="pro").slice(-2);
  const bestSS=recent.length?Math.max(...recent.map(s=>s.seasonScore||0)):0;
  const perfFloor = bestSS>=104?93 : bestSS>=92?90 : bestSS>=80?88 : bestSS>=72?85 : bestSS>=62?80 : 0;
  return Math.max(ov, perfFloor);
}

/* 自由市場：更加擬真的多維度報價邏輯 */
function proOffers(ovArg){
  const ov=overall(), mv=marketValue();
  const eff=Math.round(mv + clamp((recentProd()-24)*.32,0,5));
  let targets=proTargetLeagues(eff).filter(lg=>mv >= (LEAGUE_STANDARD[lg]||0)-6);
  // NBA 特例：自由市場不能只靠 perfFloor 灌高身價跳進來，必須有真實 OVR 撐腰
  targets=targets.filter(lg=>lg!=="NBA" || ov>=88);
  
  if(isPro()){
    const curRank=LEAGUE_RANK[G.league]||0;
    const notLower=targets.filter(lg=>(LEAGUE_RANK[lg]||0)>=curRank-1);
    if(notLower.length) targets=notLower;
  }
  const offers=[];
  const age = G.age;
  
  // 決定合約年限基準：年輕人長約，老將短約
  const getYears = (lg, isVet) => {
    if(isVet || age >= 34) return rint(1,2);
    if(age <= 25) return lg==="NBA"?rint(3,4):rint(2,3);
    return lg==="NBA"?rint(2,4):rint(1,3);
  };

  // 1. 母隊續約邏輯：考量士氣與戰績
  let resignChance = 1;
  if (G.morale < 40) resignChance -= 0.5; // 氣氛差，不想續
  if (G.lastReview && !G.lastReview.playoff) resignChance -= 0.3; // 戰績爛，不想留
  
  if(isPro() && mv>=(LEAGUE_STANDARD[G.league]||0)-6 && chance(clamp(resignChance, 0.2, 1))){
    let cType = "normal";
    let tag = "母隊續約";
    // 奪冠且氣氛好，球隊願意砸頂薪
    if (G.morale > 75 && G.lastReview && G.lastReview.champion) { cType = "max"; tag = "母隊頂薪留人"; }
    offers.push({type:"pro",league:G.league,team:G.team,years:getYears(G.league),resign:true,tag,cType});
  }
  
  const seen=new Set();
  targets.forEach((lg,i)=>{
    if(seen.has(lg))return; seen.add(lg);
    
    if(i===0) { 
      // 最高殿堂的報價，根據身價細分策略
      if(mv >= (LEAGUE_STANDARD[lg]||0) + 5) {
        offers.push({type:"pro",league:lg,team:randTeam(lg,isPro()?G.team:null),years:getYears(lg),tag:"頂薪挖角",cType:"max"});
        // 老將巔峰期後，會有降薪加盟強隊的抉擇
        if(age >= 28) offers.push({type:"pro",league:lg,team:randTeam(lg,isPro()?G.team:null),years:getYears(lg, true),tag:"爭冠球隊（降薪）",cType:"contender"});
      } else {
        offers.push({type:"pro",league:lg,team:randTeam(lg,isPro()?G.team:null),years:getYears(lg),tag:"輪替陣容",cType:"normal"});
      }
    } else {
      // 降級聯盟的報價 (去較低聯盟通常會給核心地位與高薪)
      const tag = lg==="發展聯盟"?"🇺🇸 發展聯盟" : "主力核心";
      offers.push({type:"pro",league:lg,team:randTeam(lg,isPro()?G.team:null),years:getYears(lg),tag,cType:"max"});
    }
  });
  
  const uniq=[];const key=new Set();
  offers.forEach(o=>{
    const k=o.league+"|"+o.team+"|"+o.resign;
    if(!key.has(k)){
      key.add(k);
      // ★ 關鍵修正：在產生報價時直接固定薪水寫入物件，避免 UI 與實際簽約不同步
      o.salary = makeContract(o.league, o.team, o.years, ov, o.cType).salary;
      uniq.push(o);
    }
  });
  
  // 排序：母隊續約永遠排第一，其餘依年薪由高到低
  uniq.sort((a,b)=>{
    if(a.resign && !b.resign) return -1;
    if(!a.resign && b.resign) return 1;
    return (b.salary||0)-(a.salary||0);
  });
  return uniq.slice(0,5);
}
/* ---------- 選秀計算 ---------- */
function draftPick(league, ps){
  const L=DRAFT_LEAGUES[league]; if(!L) return null;
  if(ps < L.bar - 7) return null; // 行情遠低於門檻 → 該聯盟落選
  const slot = L.teams - (ps - L.bar)*.6 + rnd(-1.5,1.5);
  return Math.round(clamp(slot, 1, L.teams*2));
}
function pickLabel(pick){ return pick===1?"狀元":pick===2?"榜眼":pick===3?"探花":`第 ${pick} 順位`; }
function draftSalary(league,pick,ov){
  const [lo,hi]=ROOKIE_PAY[league]||[100,500];
  const teams=(DRAFT_LEAGUES[league]&&DRAFT_LEAGUES[league].teams)||(league==="NBA"?30:12);
  const pf=clamp(1-(pick-1)/(teams*1.3),.12,1), of=clamp((ov-58)/40,0,1.2);
  return Math.round((lo+(hi-lo)*(pf*.75+of*.25))*rnd(.92,1.08));
}

/* ---------- 賽季啟動：先進入「能力加點」，再進入事件 ---------- */
function startSeason(){
  // 生涯中後期：跨入新的下滑階段時，先播放劇情卡，再進季前特訓
  if(G._declineCard){ G.phase="decline"; render(); return; }
  beginAllocate();
}
function beginAllocate(){
  let sp=computeSP();
  const bonus=G._pendingSP||0; G._pendingSP=0;
  sp+=bonus; G._spBonus=bonus;
  const add={};ATTR_KEYS.forEach(k=>add[k]=0);
  G._alloc={base:{...G.attr}, add, sp, spLeft:sp, bonus};
  G.lastAttr={...G.attr};
  G.phase="allocate"; render();
}
function afterDeclineCard(){ G._declineCard=null; startSeason(); }
function computeSP(){
  const age=G.age;
  let base = age<=17?6 : age<=19?6 : age<=22?5 : age<=25?4 : age<=28?3 : age<=31?3 : 2;
  // 士氣高、健康好會略增訓練效率
  base += (G.morale>=75?1:0) + (G.health>=80?1:0);
  return base + rint(0,2);
}
function allocCost(cur){ // 升 1 點所需訓練點：越高越貴；超過潛力後極貴（潛力決定天花板）
  let c = cur<65?1 : cur<78?2 : cur<88?3 : 4;
  if(cur>=G.potential) c = c*2 + 1;
  return c;
}
function beginTraining(){
  // 準備本季事件（依聯盟條件過濾、不重複），並為每個事件加入專屬高風險選項
  let pool=EVENTS[eventPoolKey()].slice().filter(e=>!e.cond || e.cond(G.league));
  const full=pool.slice();
  const n=4; const evs=[];
  for(let i=0;i<n;i++){ if(!pool.length) pool=full.slice();
    const idx=rint(0,pool.length-1); const base=pool.splice(idx,1)[0];
    evs.push(base.noRisk ? {t:base.t,x:base.x,o:base.o} : withRiskOption(base)); }
  G.seasonEvents=evs; G.eventIdx=0; G.phase="training"; G.lastAttr={...G.attr};
  G._memInjury=null;
  G._seasonMods={winBoost:0, champBoost:0, tourneyBoost:0, playoffForce:false, playoffOut:false};
  render();
}

function withRiskOption(ev){

    if(r===5){ const a={};a[top[0]]=2;a[randAttr()]=(a[randAttr()]||0)+1;return mk("表現不錯，小有斬獲。",a,{morale:3,fame:2}); }

function applyEffects(e){
  if(e.attr) for(const k in e.attr){ if(!(k in G.attr)) continue;
    let d=e.attr[k];
    if(d>0){
      const cap=Math.min(99,G.potential+4);
      if(G.attr[k]>=G.potential) d=(_rng()<.5?1:0); // 已達潛力，幾乎練不動
      
      // 確保當前屬性如果已經超過 cap，不會被強制往下拉
      const actualCap = Math.max(G.attr[k], cap); 
      const nv=clamp(G.attr[k]+d, 15, actualCap);
      
      d=nv-G.attr[k]; G.attr[k]=nv;
    } else {
      const nv=clamp(G.attr[k]+d,15,99); d=nv-G.attr[k]; G.attr[k]=nv;
    }
    e.attr[k]=d; // 反映實際套用值，供 UI 顯示（潛力已滿時可能顯示較少或 0）
  }
  if(e.health) G.health=clamp(G.health+e.health,0,100);
  if(e.money) G.money+=e.money;
  if(e.morale) G.morale=clamp(G.morale+(e.morale||0),0,100);
  if(e.fame) G.fame=clamp(G.fame+(e.fame||0),0,100);
  if(e.injure) G._memInjury=e.injure; // "season" | "career"
  if(e.title) grantTitle(e.title);
  // 影響戰績/季後賽/賽會的效果（不只加能力值）
  if(G._seasonMods){
    if(e.win) G._seasonMods.winBoost += e.win;
    if(e.champ) G._seasonMods.champBoost += e.champ;
    if(e.tourney) G._seasonMods.tourneyBoost += e.tourney;
    
    // --- 新增：強制錦標賽晉級與淘汰機制 ---
    if(e.tourneyMin !== undefined) G._seasonMods.tourneyMinIdx = e.tourneyMin;
    if(e.tourneyMax !== undefined) G._seasonMods.tourneyMaxIdx = e.tourneyMax;
    // ----------------------------------
    
    if(e.playoff) G._seasonMods.playoffForce = true;
    if(e.playoffOut) G._seasonMods.playoffOut = true;
  }
  if(e.transfer){ // 真正轉學：換一所同級的學校
    const lvl = e.transfer===true ? (G.stage==="高中"?"高中":G.league) : e.transfer;
    const nt=schoolPick(lvl, G.team);
    if(nt && nt!==G.team){ G._transferredTo=nt; G.team=nt; }
  }
}

function playSeason(){
  G._newTitle=null;
  const s=simulateSeason();
  const awards=computeAwards(s);
  s.awards=awards;
  G.seasonHistory.push(s);
  G.lastReview=s;
  if(isPro()&&G.contract){ G.money+=G.contract.salary; }
  // 賽季受傷檢定（可能重傷提前退休）
  s.injury=seasonInjuryCheck();
  if(s.injury&&s.injury.major){ G.majorInjuries=(G.majorInjuries||0)+1; if(!s.injury.career) G._recovering=true; }
  else if(G._recovering){ G._recovering=false; grantTitle("phoenix"); } // 重傷後成功復出
  // 里程碑與稱號
  checkMilestones(s);
  checkSeasonTitles(s);
  G.phase="review"; render();
}

function seasonInjuryCheck(){
  const age=G.age;
  // 由事件觸發的強制受傷（如地貼滑倒賽季報銷）
 if(G._memInjury){
    const forced=G._memInjury; G._memInjury=null;
    if(forced === "drunk_driving") {
      return {major: true, career: true, text: "【生涯告終】你因為酒駕被逮，球團祭出重罰開除，永不錄用！你的籃球生涯就此身敗名裂。"};
    }
    ATTR_KEYS.forEach(k=>{const fast=(k==="athletic"||k==="defense")?1.6:1;
      G.attr[k]=clamp(Math.round(G.attr[k]-rnd(2,5)*fast),15,99);});
    G.health=clamp(G.health-rnd(25,45),5,100);
    const career=forced==="career"&&isPro();
    return {major:true,career,text:career?"這一摔傷得太重，恐得高掛球鞋…":"賽季報銷的重傷，能力明顯下滑。"};
  }
  let pMajor=.02 + Math.max(0,(age-30))*.012 + (G.health<60?.05:0);
  pMajor=clamp(pMajor,.02,.28);
  if(chance(pMajor)){
    ATTR_KEYS.forEach(k=>{const fast=(k==="athletic"||k==="defense")?1.6:1;
      G.attr[k]=clamp(Math.round(G.attr[k]-rnd(2,6)*fast),15,99);});
    G.health=clamp(G.health-rnd(20,45),5,100);
    const career=isPro()&&chance(clamp(.1+(age-30)*.05,.05,.7));
    return {major:true, career, text:career?"【重大傷病警告】醫生判定你的傷勢嚴重，無法再負荷高強度的職業賽事！本賽季結束後你將被迫退休...":"【嚴重受傷】賽季報銷的重傷！你將缺席剩餘賽事，能力也受到影響而明顯下滑。"};
  }
  if(chance(.25)){ G.health=clamp(G.health-rnd(6,16),20,100);
    return {major:false,text:"小傷不斷，影響了部分出賽。"}; }
  G.health=clamp(G.health+rnd(4,10),0,100);
  return null;
}

/* ---------- 賽季回顧後 → 進入休賽期流程 ---------- */
function afterReview(){
  // 建立休賽期待辦
  const q=[];
  const s=G.lastReview;
  // 重傷退休
  if(s.injury&&s.injury.career){ G.retireReason="生涯重傷，忍痛退役"; return endCareer(); }
  // 高齡硬上限
  if(isPro()&&G.age>=42){ G.retireReason="年事已高，正式高掛球鞋"; return endCareer(); }
  // 瓊斯盃（每年夏季的沉浸式賽事）
  if(pendingJones()) q.push("jones");
  // 其他國際賽（亞洲盃／亞運／世界盃等）
  if(pendingIntl()) q.push("intl");
  // 階段轉換
  if(G.stage==="高中"){
    if(G.grade>=3) q.push("hsDecision"); else q.push("advanceHS");
  } else if(G.stage==="大學"){
    q.push("collegeDecision");
  } else { // 職業
    // 釋出檢定：能力明顯低於聯盟水準線 → 有機率被球隊釋出（需重找下家，找不到就退休）
    const ov=overall(), std=LEAGUE_STANDARD[G.league]||60, mv=marketValue();
    let waived=false;
    if(G.contract && mv < std-3){
      const gap=std-3-mv;
      const poorSeason = s.seasonScore<40;
      const wChance=clamp(.16 + gap*.08 + (poorSeason?.15:0), .16, .9);
      if(chance(wChance)){ waived=true; }
    }
    if(waived){ G._waived=true; G.contract=null; }
    else if(G.contract) G.contract.yearsLeft--;
    const contractDone = waived || !G.contract || G.contract.yearsLeft<=0;
    if(contractDone){
      // 合約到期（或被釋出）才是「老將十字路口」的時機，且排在自由市場之前
      if(isPro()&&G.age>=35) q.push("retireOption");
      q.push("freeAgency");
    } else {
      // 合約還在（多年約）：不會被要求退休，也不會吃掉剩餘年限
      if(overseasJumpAvailable()) q.push("overseasOffer");
      else if(chance(.22)) q.push("tradeRumor");
    }
  }
  q.push("nextSeason");
  G.offseason=q; processOffseason();
}
/* 角色球員球探報告：找出球員最頂尖、NBA 願意買單的「即戰專長」 */
function scoutRoleReport(){
  const a=G.attr;
  // 各專長的「NBA 即戰門檻」：達標才會被列入球探報告
  const specs=[
    {k:"defense", bar:83, tag:"鎖式防守"},
    {k:"three",   bar:84, tag:"外線投射"},
    {k:"rebound", bar:85, tag:"籃板卡位"},
    {k:"athletic",bar:85, tag:"運動能力"},
    {k:"iq",      bar:84, tag:"防守判讀"},
    {k:"pass",    bar:85, tag:"組織串聯"},
  ];
  const hit=specs.filter(s=>a[s.k]>=s.bar).sort((x,y)=>(a[y.k]-y.bar)-(a[x.k]-x.bar));
  if(!hit.length) return null;
  const top=hit.slice(0,2);
  return {
    keys: top.map(s=>s.k),
    labels: top.map(s=>ATTR_LABEL[s.k]),
    tags: top.map(s=>s.tag),
    margin: Math.max(...top.map(s=>a[s.k]-s.bar)), // 最突出專長超過門檻多少
  };
}

/* 海外報價：合約中、非最高聯盟、戰力/數據達標時，有機會收到往上一級的邀約 */
function overseasJumpAvailable(){
  if(!isPro())return false;
  const rank=LEAGUE_RANK;
  const cur=rank[G.league]||1; if(cur>=5)return false;
  const ps=prospectScore();
  // 發展聯盟是 NBA 的直接跳板：表現好就有機會被「call up」上 NBA，門檻較低、機率隨近期產出提升
  if(G.league==="發展聯盟"){
    const prod=recentProd(), ov=overall();
    // 路線一：統治級數據 → 明星型 call-up（能得分、能扛球隊）
    if(ov >= 84 && prod >= 26){
      const callChance = clamp(0.1 + (ov - 84) * 0.05 + (prod - 26) * 0.04, 0.1, 0.65);
      if(chance(callChance)){
        G._overseasTargets=["NBA"]; G._callUp=true; G._callUpRole=false; G._scoutReport=null;
        return true;
      }
    }
    // 路線二：角色球員 call-up（數據不漂亮，但某項 NBA 需要的專長頂尖）
    const rep=scoutRoleReport();
    if(rep && ov >= 78){
      // 專長越突出、整體越穩，被相中機率越高（但整體仍低於明星路線）
      const roleChance = clamp(0.05 + rep.margin*0.028 + (ov-78)*0.018, 0.05, 0.42);
      if(chance(roleChance)){
        G._overseasTargets=["NBA"]; G._callUp=true; G._callUpRole=true; G._scoutReport=rep;
        return true;
      }
    }
  }
  const targets=proTargetLeagues(Math.round(overall()*.5+ps*.5)).filter(l=>(rank[l]||0)>cur);
  if(!targets.length)return false;
  G._overseasTargets=targets; G._callUp=false; G._callUpRole=false; G._scoutReport=null; return chance(.5);
}
function processOffseason(){
  if(!G.offseason.length){ return; }
  const step=G.offseason.shift();
  switch(step){
    case "jones": return startJonesCup();
    case "intl": return doIntl();
    case "advanceHS": G.grade++; G.age++; G.year++; applyAging(); return processOffseason();
    case "hsDecision": return hsDecision();
    case "collegeDecision": return collegeDecision();
    case "freeAgency": return freeAgency();
    case "tradeRumor": return doTradeRumor();
    case "trade": return doTrade();
    case "overseasOffer": return doOverseasOffer();
    case "retireOption": return retireOption();
    case "nextSeason": return advanceToNextSeason();
  }
}
function advanceToNextSeason(){
  // 進職業/大學後的一般年份推進（高中在 advanceHS 已處理）
  if(G.stage!=="高中"){ G.age++; G.year++; applyAging(); }
  if(G.stage==="大學") G.collegeYears++;
  startSeason();
}

function careerTotals(){
  const pro=G.seasonHistory.filter(s=>s.stage==="pro");
  const all=G.seasonHistory;
  const sum=(arr,f)=>arr.reduce((a,s)=>a+f(s),0);
  const gpAll=sum(all,s=>s.gp);
  const proGP=sum(pro,s=>s.gp);
  const totalPts=Math.round(sum(all,s=>s.ppg*s.gp));
  const avg=(arr,key)=>{const g=sum(arr,s=>s.gp);return g?round(sum(arr,s=>s[key]*s.gp)/g,1):0;};
  const peakOv=Math.max(...all.map(s=>s.ov),overall());
  return {
    seasons:all.length, proSeasons:pro.length, gpAll, proGP, totalPts,
    ppg:avg(all,"ppg"),rpg:avg(all,"rpg"),apg:avg(all,"apg"),
    proPpg:avg(pro,"ppg"),proRpg:avg(pro,"rpg"),proApg:avg(pro,"apg"),
    peakOv,
  };
}
function bestLeaguePrestige(){
  const rank={"SBL":1,"P+":2,"TPBL":2,"日職 B.League":3,"NBA":4};
  let best=0;G.seasonHistory.forEach(s=>{if(s.stage==="pro")best=Math.max(best,rank[s.league]||0);});
  return best;
}

   榮譽紀錄（含聯盟/年份）、里程碑、分聯盟評價、稱號、全美排名

function logAward(league,award,year){ G.awardLog=G.awardLog||[]; G.awardLog.push({league,award,year}); }
// 依「聯盟＋獎項」聚合，回傳 [{league,award,years:[...],n}]
function groupedAwards(){
  const map={};
  (G.awardLog||[]).forEach(a=>{const k=a.league+"|"+a.award; (map[k]=map[k]||{league:a.league,award:a.award,years:[]}).years.push(a.year);});
  return Object.values(map).map(o=>({...o,n:o.years.length})).sort((a,b)=>a.years[0]-b.years[0]);
}
// 連續年份壓縮：[2028..2035,2038] → "2028~2035,2038"
function compressYears(years){
  const ys=[...new Set(years)].sort((a,b)=>a-b);
  const parts=[]; let i=0;
  while(i<ys.length){ let j=i; while(j+1<ys.length && ys[j+1]===ys[j]+1) j++;
    if(j-i>=2) parts.push(`${ys[i]}~${ys[j]}`); else for(let k=i;k<=j;k++) parts.push(""+ys[k]);
    i=j+1; }
  return parts.join(",");
}
// 里程碑（各聯盟累積得分等）
function checkMilestones(s){
  if(s.stage!=="pro")return;
  G.leaguePts=G.leaguePts||{}; G.milestones=G.milestones||[];
  const lg=s.league;
  const before=G.leaguePts[lg]||0, after=before+Math.round(s.ppg*s.gp);
  G.leaguePts[lg]=after;
  [1000,3000,5000,10000].forEach(th=>{ if(before<th&&after>=th){
    G.milestones.push({league:lg,text:`${lname(lg)} ${th} 分`,year:s.year}); logAward(lg,`${th}分`,s.year);
  }});
  // 生涯抄截/阻攻/助攻里程碑（跨聯盟）
  G.careerCum=G.careerCum||{ast:0,stl:0,blk:0};
  const cb={ast:s.apg*s.gp,stl:s.spg*s.gp,blk:s.bpg*s.gp};
  ["ast","stl","blk"].forEach(k=>{const bf=G.careerCum[k],af=bf+cb[k];G.careerCum[k]=af;
    const th={ast:2500,stl:1000,blk:800}[k], lab={ast:"生涯 2500 助攻",stl:"生涯 1000 抄截",blk:"生涯 800 阻攻"}[k];
    if(bf<th&&af>=th){G.milestones.push({league:"生涯",text:lab,year:s.year});}});
}
// 分聯盟評價
const LEAGUE_LABELS={
  "NBA":["一日球員","板凳邊緣","輪替戰力","稱職先發","明星球員","當家球星","聯盟門面","傳奇巨星"],
  "日職 B.League":["一日球員","板凳邊緣","輪替戰力","稱職先發","明星球員","當家球星","聯盟招牌","傳奇球星"],
  "發展聯盟":["飲水機管理員","開發中新秀","輪替戰力","農場主力","農場王牌","準即戰力","召喚待命","農場傳奇"],
  "TPBL":["一日球員","板凳角色","輪替戰力","稱職先發","明星球員","當家球星","聯盟看板","本土傳奇"],
  "P+":["一日球員","板凳角色","輪替戰力","稱職先發","明星球員","當家球星","聯盟看板","本土傳奇"],
  "SBL":["一日球員","板凳角色","輪替戰力","稱職先發","明星球員","當家球星","聯盟看板","本土傳奇"],
  "CBL":["一日球員","板凳邊緣","輪替戰力","稱職先發","明星球員","當家球星","聯盟招牌","聯賽傳奇"],
  "KRBL":["一日球員","板凳邊緣","輪替戰力","稱職先發","明星球員","當家球星","聯盟招牌","聯賽傳奇"],
};
function leagueEval(lg){
  const ss=G.seasonHistory.filter(s=>s.stage==="pro"&&s.league===lg);
  if(!ss.length)return null;
  const n=ss.length, gp=ss.reduce((a,s)=>a+s.gp,0);
  const scores=ss.map(s=>s.seasonScore||0).sort((a,b)=>b-a);
  const avgSS=scores.reduce((a,v)=>a+v,0)/n;            // 生涯平均（名人堂分數沿用，門檻不變）
  // 巔峰品質：取表現最好的約 60%（至少 3 季，或全部）平均，避免菜鳥季／傷季／暮年季稀釋輝煌生涯
  const primeN=clamp(Math.ceil(n*0.6), Math.min(3,n), n);
  const primeSS=scores.slice(0,primeN).reduce((a,v)=>a+v,0)/primeN;
  const qualitySS=primeSS*0.65 + avgSS*0.35;           // 綜合品質（標籤用，以巔峰為主）
  const la=(G.awardLog||[]).filter(a=>a.league===lg);
  const cnt=name=>la.filter(a=>a.award===name).length;
  const inc=sub=>la.filter(a=>a.award.includes(sub)).length;
  const mvp=cnt("MVP"), champ=cnt("冠軍"), allStar=cnt("明星賽");
  const localMvp=mvp+cnt("本土MVP")+cnt("國內MVP");     // 各聯盟 MVP 都算「分量」（僅供標籤，不影響名人堂分）
  const allNBA1=cnt("年度一隊"), allNBAany=inc("年度")+cnt("最佳陣容");
  const scoringTitles=cnt("得分王")+cnt("籃板王")+cnt("助攻王");
  const awardPts= mvp*70 + champ*40 + allNBA1*40 + cnt("年度二隊")*28 + cnt("年度三隊")*18
    + allStar*16 + inc("王")*16 + cnt("DPOY")*22 + cnt("ROTY")*14 + (inc("新秀")&&inc("隊"))*8;
  // 評價分（名人堂沿用）：維持以生涯平均為基準，門檻不受標籤改動影響
  const score=Math.round(clamp(avgSS-30,0,90)*5 + n*7 + awardPts);
  const labels=LEAGUE_LABELS[lg]||LEAGUE_LABELS["SBL"];
  const elite=(lg==="NBA"||lg==="日職 B.League"||lg==="CBL"||lg==="KRBL");
  const T = elite ? [44,56,66,78,88,100] : [40,52,62,72,82,92]; // 分界（略降頂層，讓真正的明星／門面可及）
  // (1) 品質級別：由巔峰加權品質決定
  let qIdx = qualitySS<T[0]?0 : qualitySS<T[1]?1 : qualitySS<T[2]?2 : qualitySS<T[3]?3 : qualitySS<T[4]?4 : qualitySS<T[5]?5 : 6;
  // (2) 榮譽級別：由實際成就決定，可往上抬（讓戰績輝煌者不被平均稀釋）
  let aIdx=0;
  if(allStar>=1 || allNBAany>=1 || scoringTitles>=1) aIdx=Math.max(aIdx,3);        // 有過明星/最佳陣容/單項王 → 至少稱職先發
  if(allStar>=2 || allNBAany>=1) aIdx=Math.max(aIdx,4);                             // 常態明星 → 明星球員
  if(allStar>=3 || localMvp>=1 || allNBA1>=1 || (champ>=1&&allStar>=2)) aIdx=Math.max(aIdx,5); // 有分量 → 當家球星
  if(localMvp>=1 && (allStar>=4 || allNBA1>=1 || champ>=1)) aIdx=Math.max(aIdx,6);  // 重大榮譽 → 聯盟門面
  if(mvp>=2 || (mvp>=1&&champ>=1) || allNBA1>=3) aIdx=Math.max(aIdx,7);             // 傳奇巨星
  // (3) 取品質與榮譽的較高者
  let idx=Math.max(qIdx,aIdx);
  // (4) 資歷保護：頂層標籤需足夠樣本，避免短暫客串被灌成傳奇（同時提高門檻可信度）
  if(n<2) idx=Math.min(idx, aIdx>=5?4:3);                    // 只打 1 季：頂多明星球員（無重大榮譽則封在先發）
  if(n<3 && aIdx<5) idx=Math.min(idx,4);                     // 2 季且無重大榮譽：頂多明星球員
  if(idx>=6 && n<4 && !(localMvp>=1||allNBA1>=1)) idx=5;     // 聯盟門面需 ≥4 季或硬榮譽
  if(idx>=7 && n<5 && mvp<2) idx=6;                          // 傳奇需 ≥5 季或多座 MVP
  idx=clamp(idx,0,labels.length-1);
  return {league:lg, score, label:labels[idx], seasons:n, avgSS:Math.round(avgSS)};
}
function allLeagueEvals(){
  const order=["NBA","CBL","KRBL","日職 B.League","發展聯盟","TPBL","P+","SBL"];
  const seen=[]; G.seasonHistory.forEach(s=>{if(s.stage==="pro"&&!seen.includes(s.league))seen.push(s.league);});
  return order.filter(l=>seen.includes(l)).map(leagueEval).filter(Boolean);
}
