  // 1. 母隊續約邏輯：考量士氣與戰績
  let resignChance = 1;
  if (G.morale < 40) resignChance -= 0.5; // 氣氛差，不想續
  if (G.lastReview && !G.lastReview.playoff) resignChance -= 0.3; // 戰績爛，不想留
  
  if(isPro() && mv>=(LEAGUE_STANDARD[G.league]||0)-6 && chance(clamp(resignChance, 0.2, 1))){
    let cType = "normal";
    let tag = "母隊續約";
    // 奪冠且氣氛好，球隊願意砸頂薪
    if (G.morale > 75 && G.lastReview && G.lastReview.champion) { cType = "max"; tag = "母隊頂薪留人"; }
    offers.push({type:"pro",league:G.league,team:G.team,years:getYears(G.league),resign:true,tag,cType});
  }
  
  // 2. NBA 已站穩腳跟：依市場地位產生 2–4 支不同 NBA 球隊競價。
  const nbaDemand=nbaFreeAgencyDemand();
  if(G.madeNBA && (G.league==="NBA" || targets.includes("NBA")) && (nbaDemand.established||nbaDemand.elite)){
    const wanted=nbaDemand.count;
    const used=new Set([G.team]);
    for(let i=0;i<wanted;i++){
      let team=randTeam("NBA",G.team), guard=0;
      while(used.has(team)&&guard++<40) team=randTeam("NBA",G.team);
      used.add(team);
      const cType=nbaDemand.elite?(i===0?"max":i===1?"contender":"normal"):(i===0?"normal":"contender");
      const tag=nbaDemand.elite?(i===0?"NBA 多隊競價 · 頂薪挖角":i===1?"NBA 爭冠強隊招募":"NBA 多隊競價"):(i===0?"NBA 多隊競價 · 先發承諾":"NBA 多隊競價 · 輪替角色");
      offers.push({type:"pro",league:"NBA",team,years:getYears("NBA",cType==="contender"),tag,cType});
    }
  }

  const seen=new Set();
  targets.forEach((lg,i)=>{
    if(seen.has(lg))return; seen.add(lg);
    if(lg==="NBA" && offers.some(o=>o.league==="NBA"&&!o.resign)) return;
    
    if(i===0) { 
      // 最高殿堂的報價，根據身價細分策略
      if(mv >= (LEAGUE_STANDARD[lg]||0) + 5) {
        offers.push({type:"pro",league:lg,team:randTeam(lg,isPro()?G.team:null),years:getYears(lg),tag:"頂薪挖角",cType:"max"});
        // 老將巔峰期後，會有降薪加盟強隊的抉擇
        if(age >= 28) offers.push({type:"pro",league:lg,team:randTeam(lg,isPro()?G.team:null),years:getYears(lg, true),tag:"爭冠球隊（降薪）",cType:"contender"});
      } else {
        offers.push({type:"pro",league:lg,team:randTeam(lg,isPro()?G.team:null),years:getYears(lg),tag:"輪替陣容",cType:"normal"});
      }
    } else {
      // 降級聯盟的報價 (去較低聯盟通常會給核心地位與高薪)
      const tag = lg==="發展聯盟"?"🇺🇸 發展聯盟" : "主力核心";
      offers.push({type:"pro",league:lg,team:randTeam(lg,isPro()?G.team:null),years:getYears(lg),tag,cType:"max"});
    }
  });
  
  // 生涯末期若一般 NBA 市場已關門，仍給長年 NBA 老將一張底薪競爭名額。
  if(G.madeNBA && G.league==="NBA" && age>=34 && nbaDemand.nbaSeasons>=5 && !offers.some(o=>o.league==="NBA")){
    offers.push({type:"pro",league:"NBA",team:randTeam("NBA",G.team),years:1,tag:"老將底薪 · 最後一搏",cType:"vetmin",salary:veteranMinimum(age)});
  }

  const uniq=[];const key=new Set();
  offers.forEach(o=>{
    const k=o.league+"|"+o.team+"|"+o.resign;
    if(!key.has(k)){
      key.add(k);
      // ★ 關鍵修正：在產生報價時直接固定薪水寫入物件，避免 UI 與實際簽約不同步
      if(o.cType!=="vetmin") o.salary = makeContract(o.league, o.team, o.years, ov, o.cType).salary;
      uniq.push(o);
    }
  });
  
  // 排序：母隊續約優先；若玩家原本就在 NBA，NBA 合約（含老將底薪）必須排在海外報價前，避免最後機會被 slice 掉。
  uniq.sort((a,b)=>{
    if(a.resign && !b.resign) return -1;
    if(!a.resign && b.resign) return 1;
    if(G.league==="NBA" && a.league!==b.league){
      if(a.league==="NBA") return -1;
      if(b.league==="NBA") return 1;
    }
    return (b.salary||0)-(a.salary||0);
  });
  return uniq.slice(0,5);
}
/* ---------- 選秀計算 ---------- */
function draftPick(league, ps){
  const L=DRAFT_LEAGUES[league]; if(!L) return null;
  if(ps < L.bar - 7) return null; // 行情遠低於門檻 → 該聯盟落選
  const slot = L.teams - (ps - L.bar)*.6 + rnd(-1.5,1.5);
  return Math.round(clamp(slot, 1, L.teams*2));
}
function pickLabel(pick){ return pick===1?"狀元":pick===2?"榜眼":pick===3?"探花":`第 ${pick} 順位`; }
function draftSalary(league,pick,ov){
  const [lo,hi]=ROOKIE_PAY[league]||[100,500];
  const teams=(DRAFT_LEAGUES[league]&&DRAFT_LEAGUES[league].teams)||(league==="NBA"?30:12);
  const pf=clamp(1-(pick-1)/(teams*1.3),.12,1), of=clamp((ov-58)/40,0,1.2);
  return Math.round((lo+(hi-lo)*(pf*.75+of*.25))*rnd(.92,1.08));
}
function nbaRookieContractTerms(pick,rngFn=_rng){
  const roundNo=nbaDraftRound(pick);
  if(roundNo===1){
    return {years:4,guaranteedYears:2,rookieScale:true,draftRound:1,teamOptions:{3:null,4:null},structure:"2+1+1"};
  }
  if(roundNo===2){
    const years=rngFn()<.5?2:3;
    return {years,guaranteedYears:years,rookieScale:false,draftRound:2,teamOptions:null,structure:`${years} 年`};
  }
  return {years:1,guaranteedYears:1,rookieScale:false,draftRound:null,teamOptions:null,structure:"1 年"};
}
function rookieOptionDue(contract){
  if(!contract||!contract.rookieScale||contract.league!=="NBA"||contract.draftRound!==1)return null;
  if(contract.yearsLeft===3)return 3;
  if(contract.yearsLeft===2)return 4;
  return null;
}
function evaluateRookieTeamOption(s,optionYear,rngFn=_rng){
  const ov=overall(), ss=(s&&s.seasonScore)||0, gp=(s&&s.gp)||0, aw=(s&&s.awards)||[];
  const major=aw.some(a=>/MVP|DPOY|年度|ROTY|新秀|得分王|助攻王|籃板王/.test(a));
  let p=optionYear===3?.90:.78;
  p += clamp((ov-70)*.018,-.18,.22) + clamp((ss-55)*.006,-.15,.20);
  if(gp<45)p-=.12; if(major)p+=.16; if((s&&s.champion))p+=.08;
  p=clamp(p,.12,.99);
  const exercise=(ov>=82 || ss>=82 || major) ? true : rngFn()<p;
  const reason=exercise
    ? (major||ss>=75?"球隊認為你已證明自己值得繼續投資。":ov>=74?"球團仍看好你的成長曲線與輪替價值。":"球隊願意再給一年觀察與養成空間。")
    : (gp<45?"出勤與健康風險讓管理層選擇停止投入。":ss<48?"前一季表現未達球隊對首輪新秀的預期。":"球隊決定把薪資與輪替空間留給其他人。");
  return {optionYear,exercise,chance:p,reason,ov,seasonScore:ss,gp};
}

/* ---------- NBA 選秀 / Draft Combine 專屬 ---------- */
function nbaDraftRound(pick){ return pick>=1&&pick<=30?1:pick>=31&&pick<=60?2:null; }
function shuffleWithRng(arr,rngFn=_rng){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rngFn()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function makeNbaDraftOrder(rngFn=_rng){
  const teams=TEAMS.NBA.slice();
  return shuffleWithRng(teams,rngFn).concat(shuffleWithRng(teams,rngFn));
}
function nbaDraftStoryTier(pick){
  if(pick===1)return {key:"first",title:"狀元之夜",tag:"NO. 1 OVERALL PICK",emoji:"👑"};
  if(pick<=5)return {key:"top5",title:"前五順位 · 天之驕子",tag:"TOP 5 PICK",emoji:"🌟"};
  if(pick<=14)return {key:"lottery",title:"樂透區 · 聚光燈下的新星",tag:"LOTTERY PICK",emoji:"🎰"};
  if(pick<=30)return {key:"round1",title:"首輪上岸 · 正式踏進 NBA",tag:"FIRST ROUND",emoji:"🎟️"};
  if(pick<=45)return {key:"round2early",title:"次輪前段 · 等待後被叫到名字",tag:"SECOND ROUND",emoji:"📞"};
  if(pick<=60)return {key:"round2late",title:"次輪末段 · 最後一張入場券",tag:"LATE SECOND ROUND",emoji:"🔥"};
  return null;
}
function combineBiasedDie(attrScore,rngFn=_rng){
  const score=clamp(attrScore,20,99);
  const raw=1+Math.floor(rngFn()*6);
  const shift=score>=90?2:score>=75?1:score<45?-1:0;
  return clamp(raw+shift,1,6);
}
function combineAttrScore(key,g=G){
  const a=g.attr;
  if(key==="vertical") return clamp(a.athletic*.78+a.rebound*.22,20,99);
  if(key==="sprint") return clamp(a.athletic*.9+a.iq*.1,20,99);
  if(key==="agility") return clamp(a.athletic*.46+a.defense*.32+a.iq*.22,20,99);
  if(key==="bench"){
    const size=clamp((g.weight-72)*1.05,0,25);
    return clamp(a.athletic*.6+a.rebound*.2+size,20,99);
  }
  if(key==="shooting") return clamp(a.three*.5+a.shooting*.38+a.iq*.12,20,99);
  return 50;
}
function combineRankFromQuality(q,rngFn=_rng,fieldSize=75){
  const noise=(rngFn()-.5)*8;
  return clamp(Math.round(fieldSize+1-q*.72+noise),1,fieldSize);
}
const NBA_COMBINE_TESTS=[
  {key:"vertical",name:"最高摸高／垂直彈跳",desc:"爆發力、起跳高度與籃板能力",unit:"",better:"high"},
  {key:"sprint",name:"四分之三球場衝刺",desc:"全速加速與直線速度",unit:"秒",better:"low"},
  {key:"agility",name:"禁區敏捷度測試",desc:"變向、橫移、防守腳步與反應",unit:"秒",better:"low"},
  {key:"bench",name:"臥推測試",desc:"上肢力量與對抗基礎",unit:"下",better:"high"},
  {key:"shooting",name:"投籃測試",desc:"25 球定點／移動綜合投射",unit:"/25",better:"high"},
];
function simulateNbaCombine(rngFn=_rng){
  const fieldSize=75;
  const tests=NBA_COMBINE_TESTS.map(meta=>{
    const attrScore=combineAttrScore(meta.key,G);
    const die=combineBiasedDie(attrScore,rngFn);
    const quality=clamp(attrScore*.72+(die/6)*28,20,100);
    let value, display, extra="";
    if(meta.key==="vertical"){
      const inches=round(22+quality*.23,1);
      const reach=round(G.height*1.27+(G.pos==="C"?5:G.pos==="PF"?3:0),0);
      const touch=round(reach+inches*2.54,0);
      value=inches; display=`${touch} cm`; extra=`Max Vert ${inches} in`;
    }else if(meta.key==="sprint"){
      value=round(3.68-quality*.0064,2); display=`${value.toFixed(2)} 秒`;
    }else if(meta.key==="agility"){
      value=round(12.75-quality*.022,2); display=`${value.toFixed(2)} 秒`;
    }else if(meta.key==="bench"){
      value=clamp(Math.round((quality-30)/4.2),0,24); display=`${value} 下`;
    }else{
      value=clamp(Math.round(6+quality*.19),6,25); display=`${value}/25`;
    }
    const rank=combineRankFromQuality(quality,rngFn,fieldSize);
    return {...meta,attrScore:round(attrScore,1),die,quality:round(quality,1),value,display,extra,rank};
  });
  const score=round(tests.reduce((sum,t)=>sum+t.quality,0)/tests.length,1);
  const overallRank=combineRankFromQuality(score,rngFn,fieldSize);
  const stockDelta=overallRank<=5?-5:overallRank<=15?-3:overallRank<=30?-1:overallRank<=50?0:overallRank<=65?2:4;
  return {fieldSize,tests,score,overallRank,stockDelta};
}
function nbaCombineStockText(d){

function withRiskOption(ev){

  const stockEvent=!!th.stock || /選秀|球探|招募|prospect|測試會|Big Board|Combine/.test((ev.t||"")+(ev.x||""));

    if(th.fame) extra.fame=Math.round(th.fame*magnitude);
    else if(good) extra.fame=r===6?3:r===5?1:0;
    if(th.morale) extra.morale=Math.round(th.morale*magnitude);
    else extra.morale=good?(r===6?5:r===5?2:0):(r<=2?-5:r===3?-2:0);
    if(th.healthRisk && !good) extra.health=-Math.max(2,Math.round(th.healthRisk*(r===1?1:r===2?.65:.35)));
    if(th.win && r>=5) extra.win=r===6?th.win:th.win*.55;
    if(stockEvent){

      else if(r===5){extra.draftStockMove=2;if(G.stage==="大學")extra.boardMove=-3;if(G.stage==="高中")extra.recruitMove=-4;}
      else if(r===2){extra.draftStockMove=-2;if(G.stage==="大學")extra.boardMove=3;if(G.stage==="高中")extra.recruitMove=4;}

    if(r===4){return mk(`你穩穩處理了「${ev.t}」，沒有特別加分，也沒有付出代價。`,{},mkExtra(r,true));}
    if(r===3){a[focus[0]]=-1;return mk(`你在「${ev.t}」的執行有些勉強，效果不如預期。`,a,mkExtra(r,false));}
    if(r===2){a[focus[0]]=-2;if(focus[1])a[focus[1]]=-1;return mk(th.b,a,mkExtra(r,false));}
    a[focus[0]]=-3;if(focus[1])a[focus[1]]=-2;return mk(th.b.replace(/。$/,"，而且代價比預期更重。"),a,mkExtra(r,false));
  }};
  return {t:ev.t,x:ev.x,o:[...ev.o,risk]};

function applyEffects(e){
  if(e.attr) for(const k in e.attr){ if(!(k in G.attr)) continue;
    let d=e.attr[k];
    if(d>0){
      const cap=Math.min(99,G.potential+4);
      if(G.attr[k]>=G.potential) d=(_rng()<.5?1:0); // 已達潛力，幾乎練不動
      
      // 確保當前屬性如果已經超過 cap，不會被強制往下拉
      const actualCap = Math.max(G.attr[k], cap); 
      const nv=clamp(G.attr[k]+d, 15, actualCap);
      
      d=nv-G.attr[k]; G.attr[k]=nv;
    } else {
      const nv=clamp(G.attr[k]+d,15,99); d=nv-G.attr[k]; G.attr[k]=nv;
    }
    e.attr[k]=d; // 反映實際套用值，供 UI 顯示（潛力已滿時可能顯示較少或 0）
  }
  if(e.health) G.health=clamp(G.health+e.health,0,100);
  if(e.money) G.money+=e.money;
  if(e.morale) G.morale=clamp(G.morale+(e.morale||0),0,100);
  if(e.fame) G.fame=clamp(G.fame+(e.fame||0),0,100);
  if(e.pot){
    const beforePot=G.potential;
    G.potential=clamp(G.potential+e.pot,15,99);
    e.pot=G.potential-beforePot; // UI 顯示實際變化，99 封頂時不會誤報
  }
  if(e.injure) G._memInjury=e.injure; // "season" | "career"
  if(e.title) grantTitle(e.title);
  // 排名／選秀行情效果：事件文字說「排名上升」時，遊戲數值也真的跟著移動。
  if(G._seasonMods){
    if(e.recruitMove) G._seasonMods.recruitMove += e.recruitMove; // 負值＝高中招募順位往前
    if(e.boardMove) G._seasonMods.boardMove += e.boardMove;       // 負值＝大學 Big Board 往前
    if(e.draftStockMove) G._seasonMods.draftStockAdj += e.draftStockMove; // 正值＝選秀行情加分
  }
  // 影響戰績/季後賽/賽會的效果（不只加能力值）
  if(G._seasonMods){
    if(e.win) G._seasonMods.winBoost += e.win;
    if(e.champ) G._seasonMods.champBoost += e.champ;
    if(e.tourney) G._seasonMods.tourneyBoost += e.tourney;
    
    // --- 新增：強制錦標賽晉級與淘汰機制 ---
    if(e.tourneyMin !== undefined) G._seasonMods.tourneyMinIdx = e.tourneyMin;
    if(e.tourneyMax !== undefined) G._seasonMods.tourneyMaxIdx = e.tourneyMax;
    // ----------------------------------
    
    if(e.playoff) G._seasonMods.playoffForce = true;
    if(e.playoffOut) G._seasonMods.playoffOut = true;
  }
  if(e.transfer){ // 真正轉學：換一所同級的學校
    const lvl = e.transfer===true ? (G.stage==="高中"?"高中":G.league) : e.transfer;
    const nt=schoolPick(lvl, G.team);
    if(nt && nt!==G.team){ G._transferredTo=nt; G.team=nt; }
  }
}

function applyInjuryGamesMissed(s,injury,fullGp=leagueGP(s.league),rngFn=_rng){
  if(!s||!injury)return s;
  const baseGp=Math.max(1,Number(s.gp)||fullGp||1);
  let lo,hi;
  if(injury.career){ lo=Math.max(10,Math.round(fullGp*.42)); hi=Math.max(lo,Math.round(fullGp*.78)); }
  else if(injury.major){ lo=Math.max(8,Math.round(fullGp*.24)); hi=Math.max(lo,Math.round(fullGp*.56)); }
  else { lo=Math.max(1,Math.round(fullGp*.04)); hi=Math.max(lo,Math.round(fullGp*.14)); }
  const u=clamp(Number(rngFn()),0,.999999);
  let missed=Math.round(lo+(hi-lo)*u);
  missed=clamp(missed,1,Math.max(1,baseGp-1));
  s.gp=Math.max(1,baseGp-missed);
  injury.gamesMissed=missed;
  injury.gamesPlayed=s.gp;
  const pct=s.winPct||0; s.w=Math.round(s.gp*pct); s.l=s.gp-s.w;
  s.availabilityNote=`${injury.major?"傷病":"小傷"}影響，缺席約 ${missed} 場`;
  return s;
}
function playSeason(){
  G._newTitle=null;
  G._surgeryDone=false; G._electiveDone=false; G._surgeryResult=null; // 每季重置：手術抉擇與治療手術
  const s=simulateSeason();
  // 先決定傷病與實際出賽，再頒獎；避免「重傷卻全勤」或「只打少量場次仍拿年度獎項」。
  s.injury=seasonInjuryCheck();
  if(s.injury) applyInjuryGamesMissed(s,s.injury,leagueGP(s.league));
  const awards=computeAwards(s);
  s.awards=awards;
  G.seasonHistory.push(s);
  G.lastReview=s;
  if(isPro()&&G.contract){ G.money+=G.contract.salary; }
  if(s.injury&&s.injury.major){ G.majorInjuries=(G.majorInjuries||0)+1; if(!s.injury.career) G._recovering=true; }
  else if(G._recovering){ G._recovering=false; grantTitle("phoenix"); } // 重傷後成功復出
  // 里程碑與稱號
  checkMilestones(s);
  checkSeasonTitles(s);
  G.phase="review"; render();
}

function seasonInjuryCheck(){
  const age=G.age;
  // 由事件觸發的強制受傷（如地貼滑倒賽季報銷）
 if(G._memInjury){
    const forced=G._memInjury; G._memInjury=null;
    if(forced === "drunk_driving") {
      return {major: true, career: true, forcedEnd:true, part:"", emoji:"🚔", sevLabel:"生涯告終",
              text: "【生涯告終】你因為酒駕被逮，球團祭出重罰開除，永不錄用！你的籃球生涯就此身敗名裂。"};
    }
    ATTR_KEYS.forEach(k=>{const fast=(k==="athletic"||k==="defense")?1.6:1;
      G.attr[k]=clamp(Math.round(G.attr[k]-rnd(2,5)*fast),15,99);});
    G.health=clamp(G.health-rnd(25,45),5,100);
    const career=forced==="career"&&isPro();
    const inj=pickInjury(career?"career":"major");
    return Object.assign(inj,{major:true,career});
  }
  // ---- 連續受傷機率：健康值越低、年齡越大，受傷率越高 ----
  const hLow = (100 - clamp(G.health,0,100)) / 100;   // 0（滿血）→ 1（瀕危）
  const ageF = Math.max(0, age-30);
  const pMajor = clamp(.02 + hLow*.20 + ageF*.014, .02, .40);   // 重傷
  const pMinor = clamp(.14 + hLow*.30 + ageF*.010, .14, .55);   // 輕傷

  if(chance(pMajor)){
    // 是否為毀滅性生涯大傷（僅職業；健康越低、年紀越大越可能）
    const careerRisk = clamp(.08 + ageF*.05 + hLow*.18, .05, .78);
    const career = isPro() && chance(careerRisk);
    const inj = pickInjury(career?"career":"major");
    const heavy = career?1.5:1;
    ATTR_KEYS.forEach(k=>{const fast=(k==="athletic"||k==="defense")?1.6:1;
      G.attr[k]=clamp(Math.round(G.attr[k]-rnd(2,6)*fast*heavy),15,99);});
    G.health=clamp(G.health-rnd(career?30:20, career?55:45),5,100);
    return Object.assign(inj,{major:true, career});
  }
  if(chance(pMinor)){
    const inj = pickInjury("minor");
    G.health=clamp(G.health-rnd(6,16),15,100);
    return Object.assign(inj,{major:false, career:false});
  }
  // 沒受傷 → 自然恢復健康
  G.health=clamp(G.health+rnd(4,10),0,100);
  return null;
}

      deltas.push(`<span class="delta pos">健康 恢復至 ${Math.round(G.health)}</span>`);
    }else if(t==="mid"){

      deltas.push(`<span class="delta neg">全能力 -2</span>`);
      deltas.push(`<span class="delta pos">健康 恢復至 ${Math.round(G.health)}</span>`);

      // === 新增：完美模擬跳過兩賽季的邏輯 ===
      let rehabTeam = G.team;
      for (let i = 1; i <= 2; i++) {
        G.year++;
        G.age++;
        applyAging(); // 復健期間也會自然老化與改變能力

        // 判斷這一年是否還有合約在身
        // (因為原流程 afterReview 還沒扣受傷當季的合約，所以用 > i 來判斷是否包含復健的年份)
        if (isPro() && G.contract) {
          if (G.contract.yearsLeft > i) {
            G.money += G.contract.salary; // 照領薪資
            rehabTeam = G.team;
          } else {

          gp: 0, ppg: 0, rpg: 0, apg: 0, spg: 0, bpg: 0, fg: 0, tp: 0,
          w: 0, l: 0, winPct: 0, seasonScore: 0, ov: overall(),
          awards: ["🏥 大傷復健全季報銷"], playoff: false, champion: false, fmvp: false,
          arche: archetype()

      // 預先扣除這兩年的合約年限
      // 關鍵：最少留 1 年給原有的 afterReview 去扣，藉此完美銜接觸發自由市場
      if (isPro() && G.contract) {
        G.contract.yearsLeft -= 2;
        if (G.contract.yearsLeft < 1) {

    }else{

    }
    // 存下結果，讓切頁回來也只會看到結果
    G._surgeryResult={roll, cls, text, deltas, fail};

function skipSurgery(){

  G._surgeryDone=true; G._injuryRetire=true;

/* ---------- 治療手術：健康過低時，於賽季回顧付費恢復健康 ---------- */
function electiveSurgery(){
  if(G._electiveDone)return;
  const pro=isPro();
  // 費用：職業球員自付（依需恢復量計價，單位：萬），業餘由家人資助免費
  const need=100-G.health;
  const cost=pro?clamp(Math.round(40+need*4),40,900):0;
  if(pro && G.money<cost){ toast("資金不足，付不起手術與復健費用…"); return; }
  if(pro) G.money-=cost;
  const heal=rint(28,44);
  G.health=clamp(G.health+heal,0,100);
  G._electiveDone=true;
  render();
  toast(pro?`接受手術治療，花費 ${fmtMoney(cost)}，健康回升。`:"家人湊錢讓你接受治療，健康回升。");
}

/* ---------- 賽季回顧後 → 進入休賽期流程 ---------- */
function afterReview(){
  // 建立休賽期待辦
  const q=[];
  const s=G.lastReview;
  // 毀滅性生涯大傷 → 先進入「手術抉擇」畫面（酒駕等強制結束除外）
  if(s.injury&&s.injury.career&&!s.injury.forcedEnd&&!G._surgeryDone){
    G.phase="surgery"; render(); return;
  }
  // 手術失敗／放棄手術／酒駕等 → 生涯結束
  if(s.injury&&s.injury.career){ if(!G.retireReason) G.retireReason="生涯重傷，忍痛退役"; return endCareer(); }
  // 高齡硬上限
  if(isPro()&&G.age>=42){ G.retireReason="年事已高，正式高掛球鞋"; return endCareer(); }
  // 瓊斯盃（每年夏季的沉浸式賽事）
  if(pendingJones()) q.push("jones");
  // 其他國際賽（亞洲盃／亞運／世界盃等）
  if(pendingIntl()) q.push("intl");
  // 階段轉換
  if(G.stage==="高中"){
    // 👇 新增判斷：華裔打美國高中是 4 年制，本土是 3 年制
    const maxGrade = G.background === "asian_american" ? 4 : 3;
    if(G.grade >= maxGrade) q.push("hsDecision"); else q.push("advanceHS");
  } else if(G.stage==="大學"){
    q.push("collegeDecision");
  } else { // 職業
    // 首輪新秀 2+1+1：打完前兩季後，第三年與第四年開始前由球隊決定是否執行選項。
    const optionYear=rookieOptionDue(G.contract);
    if(optionYear && G._rookieOptionHandledYear!==G.year){
      G._rookieOptionCard=Object.assign(evaluateRookieTeamOption(s,optionYear),{team:G.team,pick:G.contract.draftPick});
      G.phase="rookieOption"; render(); return;
    }
    // 釋出檢定：能力明顯低於聯盟水準線 → 有機率被球隊釋出（需重找下家，找不到就退休）
    const ov=overall(), std=LEAGUE_STANDARD[G.league]||60, mv=marketValue();
    let waived=false;
    const justExercised=(G._rookieOptionJustExercisedYear===G.year);
    if(G.contract && !justExercised && mv < std-3){
      const gap=std-3-mv;
      const poorSeason = s.seasonScore<40;
      const wChance=clamp(.16 + gap*.08 + (poorSeason?.15:0), .16, .9);
      if(chance(wChance)){ waived=true; }
    }
    if(waived){ G._waived=true; G.contract=null; }
    else if(G.contract) G.contract.yearsLeft--;
    if(justExercised) G._rookieOptionJustExercisedYear=null;
    const contractDone = waived || !G.contract || G.contract.yearsLeft<=0;
    if(contractDone){
      // 合約到期（或被釋出）才是「老將十字路口」的時機，且排在自由市場之前
      if(isPro()&&G.age>=35) q.push("retireOption");
      q.push("freeAgency");
    } else {
      // 合約還在（多年約）：不會被要求退休，也不會吃掉剩餘年限
      if(overseasJumpAvailable()) q.push("overseasOffer");
      else if(chance(tradeRumorChance())) q.push("tradeRumor");
    }
  }
  q.push("nextSeason");
  G.offseason=q; processOffseason();
}
/* 角色球員球探報告：找出球員最頂尖、NBA 願意買單的「即戰專長」 */
function scoutRoleReport(){
  const a=G.attr;
  // 各專長的「NBA 即戰門檻」：達標才會被列入球探報告
  const specs=[
    {k:"defense", bar:83, tag:"鎖式防守"},
    {k:"three",   bar:84, tag:"外線投射"},
    {k:"rebound", bar:85, tag:"籃板卡位"},
    {k:"athletic",bar:85, tag:"運動能力"},
    {k:"iq",      bar:84, tag:"防守判讀"},
    {k:"pass",    bar:85, tag:"組織串聯"},
  ];
  const hit=specs.filter(s=>a[s.k]>=s.bar).sort((x,y)=>(a[y.k]-y.bar)-(a[x.k]-x.bar));
  if(!hit.length) return null;
  const top=hit.slice(0,2);
  return {
    keys: top.map(s=>s.k),
    labels: top.map(s=>ATTR_LABEL[s.k]),
    tags: top.map(s=>s.tag),
    margin: Math.max(...top.map(s=>a[s.k]-s.bar)), // 最突出專長超過門檻多少
  };
}

/* 海外報價：合約中、非最高聯盟、戰力/數據達標時，有機會收到往上一級的邀約 */
function overseasJumpAvailable(){
  if(!isPro())return false;
  const rank=LEAGUE_RANK;
  const cur=rank[G.league]||1; if(cur>=5)return false;
  const ps=prospectScore();
  // 發展聯盟是 NBA 的直接跳板：表現好就有機會被「call up」上 NBA，門檻較低、機率隨近期產出提升
  if(G.league==="發展聯盟"){
    const prod=recentProd(), ov=overall();
    // 路線一：統治級數據 → 明星型 call-up（能得分、能扛球隊）
    if(ov >= 84 && prod >= 26){
      const callChance = clamp(0.1 + (ov - 84) * 0.05 + (prod - 26) * 0.04, 0.1, 0.65);
      if(chance(callChance)){
        G._overseasTargets=["NBA"]; G._callUp=true; G._callUpRole=false; G._scoutReport=null;
        return true;
      }
    }
    // 路線二：角色球員 call-up（數據不漂亮，但某項 NBA 需要的專長頂尖）
    const rep=scoutRoleReport();
    if(rep && ov >= 78){
      // 專長越突出、整體越穩，被相中機率越高（但整體仍低於明星路線）
      const roleChance = clamp(0.05 + rep.margin*0.028 + (ov-78)*0.018, 0.05, 0.42);
      if(chance(roleChance)){
        G._overseasTargets=["NBA"]; G._callUp=true; G._callUpRole=true; G._scoutReport=rep;
        return true;
      }
    }
  }
  const targets=proTargetLeagues(Math.round(overall()*.5+ps*.5)).filter(l=>(rank[l]||0)>cur);
  if(!targets.length)return false;
  G._overseasTargets=targets; G._callUp=false; G._callUpRole=false; G._scoutReport=null; return chance(.5);
}
function processOffseason(){
  if(!G.offseason.length){ return; }
  const step=G.offseason.shift();
  switch(step){
    case "jones": return startJonesCup();
    case "intl": return doIntl();
    case "advanceHS": G.grade++; G.age++; G.year++; applyAging(); return processOffseason();
    case "hsDecision": return hsDecision();
    case "collegeDecision": return collegeDecision();
    case "freeAgency": return freeAgency();
    case "tradeRumor": return doTradeRumor();
    case "trade": return doTrade();
    case "overseasOffer": return doOverseasOffer();
    case "retireOption": return retireOption();
    case "nextSeason": return advanceToNextSeason();
  }
}
function advanceToNextSeason(){
  // 進職業/大學後的一般年份推進（高中在 advanceHS 已處理）
  if(G.stage!=="高中"){ G.age++; G.year++; applyAging(); }
  if(G.stage==="大學") G.collegeYears++;
  startSeason();
}

/* ---------- 高中畢業決策 ---------- */

/* ---------- 進入職業：選秀宣告（可自選台灣聯盟，最多 3 個；海外依戰力自動接觸） ---------- */
function goProFromHS(){ declareForDraft(); }
/* NBA Draft Combine 邀請評估：現實 Combine 是邀請制，球隊意向是重要篩選。
   遊戲規則特別針對「本土出發」球員加一道門檻：沒有足夠球探興趣就無法進本作 NBA 選秀流程。 */
function evaluateNbaCombineInvite(p,rngFn=_rng){
  p=p||{};
  const background=p.background||"local";
  const ov=Number(p.ov)||0, potential=Number(p.potential)||0, prod=Number(p.prod)||0;
  const awards=Number(p.awards)||0, board=Number(p.board)||999, eliteTool=Number(p.eliteTool)||0;
  // 華裔／美國高中與 NCAA 主流招募路線沿用既有流程，不額外卡第二道門。
  if(background==="asian_american") return {invited:true,guaranteed:true,score:99,chance:1,tier:"mainstream"};
  let score=ov*.50 + potential*.20 + clamp(prod,0,35)*.35 + clamp(awards,0,5)*1.8;
  if(board<=30) score+=8; else if(board<=60) score+=5; else if(board<=100) score+=2;
  if(eliteTool>=94) score+=5; else if(eliteTool>=90) score+=3; else if(eliteTool>=86) score+=1;
  // 本土球員至少要有 NBA 級整體能力，或一項非常突出的工具＋高天賦，才進入球隊興趣池。
  const hardGate = ov>=86 || (ov>=80 && potential>=84) || (ov>=79 && potential>=88 && eliteTool>=90) || (ov>=81 && board<=75);
  if(!hardGate) return {invited:false,guaranteed:false,score:round(score,1),chance:0,tier:"no-interest"};
  let inviteChance = score>=91?.96 : score>=87?.82 : score>=83?.62 : score>=79?.38 : .18;
  if(ov>=90 && potential>=90) return {invited:true,guaranteed:true,score:round(score,1),chance:1,tier:"priority"};
  const invited=rngFn()<inviteChance;
  return {invited,guaranteed:false,score:round(score,1),chance:inviteChance,tier:invited?"invited":"snubbed"};
}
function currentNbaCombineInviteProfile(){
  const last=lastSeason();
  const resumeAwards=[...((last&&last.awards)||[]),...(G.amateurAwards||[]).map(a=>a&&a.award).filter(Boolean)];
  const awards=resumeAwards.filter(a=>/MVP|最佳|得分王|助攻王|籃板王|冠軍|年度|一隊|二隊|三隊/.test(a)).length;
  return {
    background:G.background, ov:overall(), potential:G.potential||0, prod:recentProd(), awards,
    board:G._draftEntryBoard||G._collegeRank||null,
    eliteTool:Math.max(...ATTR_KEYS.map(k=>G.attr[k]||0))
  };
}
function declareForDraft(){
  G._draftEntryStage=G.stage; G._draftEntryLeague=G.league;
  G._draftEntryBoard=(G.lastReview&&G.lastReview.stage==="大學")?G.lastReview.usRank:null;
  G.proStarted=true; G.stage="pro"; G.rookieDone=false;
  // 台灣可報名聯盟（預設全選）
  const nbaDefault=!!nbaDraftProjection() || prospectScore()>=94;
  G._draftPick={"P+":true,"TPBL":true,"SBL":true,"CBL":false,"KRBL":false,"NBA":nbaDefault};
  G._combineComplete=false; G._combineData=null; G._combineStep=0; G._nbaUndrafted=false;
  G._nbaCombineRejected=false; G._nbaCombineInviteApproved=false; G._combineInviteEval=null;
  G.phase="draftDeclare"; render();
}
function refreshDraftDeclareSelection(lg){

function toggleDraftLeague(lg){

function confirmDraft(){
  const wantsNBA=!!G._draftPick["NBA"];
  if(wantsNBA && !G._combineComplete){

// NBA 落選後的發展聯盟評估：不要把「NBA 沒被選中」直接等同於「沒有職業價值」。
// 特別是 NCAA 有實績、Big Board 還在合理區間、OVR 已具職業輪替水準的球員，
// 現實上更常見的是收到 Summer League / training camp / G League 體系的後續接觸。
function evaluateUndraftedGLeaguePath(p){
  const ov=Number(p&&p.ov)||0;
  const board=Number(p&&p.board)||999;
  const ps=Number(p&&p.ps)||0;
  const awards=Number(p&&p.awards)||0;
  const combineRank=Number(p&&p.combineRank)||75;
  const ncaa=!!(p&&p.ncaa);
  let score=0;
  score += clamp((ov-66)*2.4,0,36);
  if(board<=45) score+=28;
  else if(board<=75) score+=22;
  else if(board<=100) score+=16;
  else if(board<=150) score+=9;
  if(ncaa) score+=6;
  score += clamp(awards*2.5,0,10);
  score += clamp((ps-72)*.8,0,10);
  if(combineRank<=15) score+=8;
  else if(combineRank<=30) score+=4;
  else if(combineRank>=65) score-=3;

  // 這個區間就是「NBA 不一定選，但發展聯盟很合理」的典型球員。
  if(ov>=75 && board<=100) return {eligible:true,guaranteed:true,chance:1,tier:"priority",score:round(score,1)};
  if(ov>=72 && ncaa && (board<=120 || awards>=1 || ps>=78)) return {eligible:true,guaranteed:awards>=2||board<=80,chance:.92,tier:"strong",score:round(score,1)};
  if(score>=42) return {eligible:true,guaranteed:false,chance:.78,tier:"watch",score:round(score,1)};
  if(score>=32) return {eligible:true,guaranteed:false,chance:.48,tier:"tryout",score:round(score,1)};
  return {eligible:false,guaranteed:false,chance:.12,tier:"longshot",score:round(score,1)};
}
function buildUndraftedGLeagueOffer(ov,ps){
  const board=G._draftEntryBoard||G._collegeRank||999;
  const resumeAwards=[...((G.lastReview&&G.lastReview.awards)||[]),...(G.amateurAwards||[]).map(a=>a&&a.award).filter(Boolean)];
  const awards=resumeAwards.filter(a=>/MVP|最佳|得分王|助攻王|籃板王|冠軍|年度|一隊|二隊|三隊/.test(a)).length;
  const evalr=evaluateUndraftedGLeaguePath({
    ov,board,ps,awards,
    combineRank:G._combineData?.overallRank||75,
    ncaa:!!(G._draftEntryLeague&&G._draftEntryLeague.startsWith("NCAA"))
  });
  if(!evalr.eligible || (!evalr.guaranteed && !chance(evalr.chance))) return null;
  const team=randTeam("發展聯盟");
  const [lo,hi]=ROOKIE_PAY["發展聯盟"]||[80,300];
  const t=clamp((ov-68)/18,0,1);
  const salary=Math.round(lo+(hi-lo)*t*rnd(.88,1.06));
  return {
    type:"draft",league:"發展聯盟",team,pick:0,years:1,salary,
    tag:"🇺🇸 NBA 落選後 · 發展聯盟邀約",source:"nbaUndraftedFallback",fallbackTier:evalr.tier
  };
}
function nbaDraftPickFromProfile(ps){
  const combineRank=G._combineData?.overallRank||75;
  const origin=G._draftEntryStage;
  if(origin==="高中" && G.background==="asian_american" && (G._finalHsStars||0)>=5){
    const r=G._hsRecruitRank||hsRecruitRankFromStars(5);
    let base=r<=5?rint(1,5):r<=15?rint(6,14):rint(15,30);
    return r<=5?applyCombinePickDelta(base,1,5):r<=15?applyCombinePickDelta(base,6,14):applyCombinePickDelta(base,15,30);
  }
  if(origin==="大學" && G._draftEntryLeague?.startsWith("NCAA") && G._draftEntryBoard){
    const bb=G._draftEntryBoard;
    if(bb<=14) return applyCombinePickDelta(clamp(Math.round(bb+rnd(-2,2)),1,14),1,14);
    if(bb<=30) return applyCombinePickDelta(clamp(Math.round(bb+rnd(-2,2)),15,30),15,30);
    if(bb<=45){
      const firstChance=clamp(.64-(bb-31)*.022 + (combineRank<=15?.12:combineRank>=60?-.10:0),.25,.78);
      const base=chance(firstChance)?rint(25,30):clamp(Math.round(bb+rnd(-1,7)),31,52);
      return applyCombinePickDelta(base,20,55);
    }
    if(bb<=60){
      const selectedChance=clamp(.62-(bb-46)*.02 + (combineRank<=15?.18:combineRank>=60?-.12:0),.20,.82);
      if(!chance(selectedChance))return null;
      return applyCombinePickDelta(clamp(Math.round(bb+rnd(-4,6)),31,60),28,60);
    }
  }
  if(ps>=100){
    const base=Math.round(clamp(30-(ps-100)*2.5+rnd(-4,4),1,30));
    return applyCombinePickDelta(base,1,35);
  }
  if(ps>=94){
    const p=clamp(.28+(ps-94)*.045+(combineRank<=20?.18:0),.18,.72);
    if(chance(p)) return applyCombinePickDelta(rint(31,60),25,60);
  }
  if(ps>=88 && combineRank<=12 && chance(.35)) return rint(48,60);
  return null;
}
function finalizeDraftResults(){

  if(!picked.length && !G._draftPick["CBL"] && !G._draftPick["KRBL"] && !G._draftPick["NBA"]) picked=["SBL"];
  picked.slice(0,3).forEach(lg=>{

    offers.push({type:"draft",league:lg,team:randTeam(lg),pick,years:rint(2,3),salary:draftSalary(lg,pick,ov),tag:pickLabel(pick)});

  if(G._draftPick["CBL"]){const p=draftPick("CBL",ps);if(p!=null)offers.push({type:"draft",league:"CBL",team:randTeam("CBL"),pick:p,years:rint(2,3),salary:draftSalary("CBL",p,ov),tag:`${lname("CBL")} 第 ${p} 順位`});}
  if(G._draftPick["KRBL"]){const p=draftPick("KRBL",ps);if(p!=null)offers.push({type:"draft",league:"KRBL",team:randTeam("KRBL"),pick:p,years:rint(2,3),salary:draftSalary("KRBL",p,ov),tag:`${lname("KRBL")} 第 ${p} 順位`});}
  if(G._draftPick["NBA"]){
    const npick=nbaDraftPickFromProfile(ps);

      }
    }
  }
  const devPick=()=>Math.round(clamp(42-(ps-84)*1.5+rnd(-6,6),4,80));
  if(ps>=88){offers.push({type:"draft",league:"日職 B.League",team:randTeam("日職 B.League"),pick:0,years:rint(2,3),salary:makeContract("日職 B.League","",1,ov).salary,tag:"🇯🇵 海外報價"});}
  // 一般高行情球員仍可能主動收到發展聯盟選秀／邀約；若已因 NBA 落選取得專屬邀約，就不要重複塞第二張。
  if(ps>=90&&!offers.some(o=>o.league==="發展聯盟")){
    const dp=devPick();offers.push({type:"draft",league:"發展聯盟",team:randTeam("發展聯盟"),pick:dp,years:1,salary:draftSalary("發展聯盟",dp,ov),tag:`🇺🇸 發展聯盟 第 ${dp} 順位`});
  }
  if(offers.length===0){G._undrafted=true;G.retireReason="選秀會與後續職業評估都沒有球隊提出邀約，只能暫別職業賽場";return endCareer();}
  offers.sort((a,b)=>(LEAGUE_RANK[b.league]||0)-(LEAGUE_RANK[a.league]||0));
  G._offers=offers;G._draftMode=true;
  // NBA 落選且收到發展聯盟善意時，先播放完整劇情，再讓玩家看報價。
  if(G._nbaUndrafted&&G._undraftedBridge){G.phase="nbaUndrafted";render();return;}
  G.phase="draftResults";render();
}

function careerTotals(){
  const pro=G.seasonHistory.filter(s=>s.stage==="pro");
  const all=G.seasonHistory;
  const sum=(arr,f)=>arr.reduce((a,s)=>a+f(s),0);
  const gpAll=sum(all,s=>s.gp);
  const proGP=sum(pro,s=>s.gp);
  const totalPts=Math.round(sum(all,s=>s.ppg*s.gp));
  const avg=(arr,key)=>{const g=sum(arr,s=>s.gp);return g?round(sum(arr,s=>s[key]*s.gp)/g,1):0;};
  const peakOv=Math.max(...all.map(s=>s.ov),overall());
  return {
    seasons:all.length, proSeasons:pro.length, gpAll, proGP, totalPts,
    ppg:avg(all,"ppg"),rpg:avg(all,"rpg"),apg:avg(all,"apg"),
    proPpg:avg(pro,"ppg"),proRpg:avg(pro,"rpg"),proApg:avg(pro,"apg"),
    peakOv,
  };
}
function bestLeaguePrestige(){
  const rank={"SBL":1,"P+":2,"TPBL":2,"日職 B.League":3,"NBA":4};
  let best=0;G.seasonHistory.forEach(s=>{if(s.stage==="pro")best=Math.max(best,rank[s.league]||0);});
  return best;
}

function logAward(league,award,year){ G.awardLog=G.awardLog||[]; G.awardLog.push({league,award,year}); }
// 依「聯盟＋獎項」聚合，回傳 [{league,award,years:[...],n}]
function groupedAwards(){
  const map={};
  (G.awardLog||[]).forEach(a=>{const k=a.league+"|"+a.award; (map[k]=map[k]||{league:a.league,award:a.award,years:[]}).years.push(a.year);});
  return Object.values(map).map(o=>({...o,n:o.years.length})).sort((a,b)=>a.years[0]-b.years[0]);
}
// 連續年份壓縮：[2028..2035,2038] → "2028~2035,2038"
function compressYears(years){
  const ys=[...new Set(years)].sort((a,b)=>a-b);
  const parts=[]; let i=0;
  while(i<ys.length){ let j=i; while(j+1<ys.length && ys[j+1]===ys[j]+1) j++;
    if(j-i>=2) parts.push(`${ys[i]}~${ys[j]}`); else for(let k=i;k<=j;k++) parts.push(""+ys[k]);
    i=j+1; }
  return parts.join(",");
}
// 里程碑（各聯盟累積得分等）
function checkMilestones(s){
  if(s.stage!=="pro")return;
  G.leaguePts=G.leaguePts||{}; G.milestones=G.milestones||[];
  const lg=s.league;
  const before=G.leaguePts[lg]||0, after=before+Math.round(s.ppg*s.gp);
  G.leaguePts[lg]=after;
  [1000,3000,5000,10000].forEach(th=>{ if(before<th&&after>=th){
    G.milestones.push({league:lg,text:`${lname(lg)} ${th} 分`,year:s.year}); logAward(lg,`${th}分`,s.year);
  }});
  // 生涯抄截/阻攻/助攻里程碑（跨聯盟）
  G.careerCum=G.careerCum||{ast:0,stl:0,blk:0};
  const cb={ast:s.apg*s.gp,stl:s.spg*s.gp,blk:s.bpg*s.gp};
  ["ast","stl","blk"].forEach(k=>{const bf=G.careerCum[k],af=bf+cb[k];G.careerCum[k]=af;
    const th={ast:2500,stl:1000,blk:800}[k], lab={ast:"生涯 2500 助攻",stl:"生涯 1000 抄截",blk:"生涯 800 阻攻"}[k];
    if(bf<th&&af>=th){G.milestones.push({league:"生涯",text:lab,year:s.year});}});
}

const LEAGUE_LABELS={
  "NBA":["一日球員","板凳邊緣","輪替戰力","稱職先發","明星球員","當家球星","聯盟門面","傳奇巨星"],
  "日職 B.League":["一日球員","板凳邊緣","輪替戰力","稱職先發","明星球員","當家球星","聯盟招牌","傳奇球星"],

  "CBL":["一日球員","板凳邊緣","輪替戰力","稱職先發","明星球員","當家球星","聯盟招牌","聯賽傳奇"],
  "KRBL":["一日球員","板凳邊緣","輪替戰力","稱職先發","明星球員","當家球星","聯盟招牌","聯賽傳奇"],
};
function leagueEval(lg){
  const ss=G.seasonHistory.filter(s=>s.stage==="pro"&&s.league===lg);
  if(!ss.length)return null;
  const n=ss.length, gp=ss.reduce((a,s)=>a+s.gp,0);
  const scores=ss.map(s=>s.seasonScore||0).sort((a,b)=>b-a);
  const avgSS=scores.reduce((a,v)=>a+v,0)/n;            // 生涯平均（名人堂分數沿用，門檻不變）
  // 巔峰品質：取表現最好的約 60%（至少 3 季，或全部）平均，避免菜鳥季／傷季／暮年季稀釋輝煌生涯
  const primeN=clamp(Math.ceil(n*0.6), Math.min(3,n), n);
  const primeSS=scores.slice(0,primeN).reduce((a,v)=>a+v,0)/primeN;
  const qualitySS=primeSS*0.65 + avgSS*0.35;           // 綜合品質（標籤用，以巔峰為主）
  const la=(G.awardLog||[]).filter(a=>a.league===lg);
  const cnt=name=>la.filter(a=>a.award===name).length;
  const inc=sub=>la.filter(a=>a.award.includes(sub)).length;
  const mvp=cnt("MVP"), champ=cnt("冠軍"), allStar=cnt("明星賽");
  const localMvp=mvp+cnt("本土MVP")+cnt("國內MVP");     // 各聯盟 MVP 都算「分量」（僅供標籤，不影響名人堂分）
  const allNBA1=cnt("年度一隊"), allNBAany=inc("年度")+cnt("最佳陣容");
  const scoringTitles=cnt("得分王")+cnt("籃板王")+cnt("助攻王");
  const awardPts= mvp*70 + champ*40 + allNBA1*40 + cnt("年度二隊")*28 + cnt("年度三隊")*18
    + allStar*16 + inc("王")*16 + cnt("DPOY")*22 + cnt("ROTY")*14 + (inc("新秀")&&inc("隊"))*8;
  // 評價分（名人堂沿用）：維持以生涯平均為基準，門檻不受標籤改動影響
  const score=Math.round(clamp(avgSS-30,0,90)*5 + n*7 + awardPts);
  const labels=LEAGUE_LABELS[lg]||LEAGUE_LABELS["SBL"];
  const elite=(lg==="NBA"||lg==="日職 B.League"||lg==="CBL"||lg==="KRBL");
  const T = elite ? [44,56,66,78,88,100] : [40,52,62,72,82,92]; // 分界（略降頂層，讓真正的明星／門面可及）
  // (1) 品質級別：由巔峰加權品質決定
  let qIdx = qualitySS<T[0]?0 : qualitySS<T[1]?1 : qualitySS<T[2]?2 : qualitySS<T[3]?3 : qualitySS<T[4]?4 : qualitySS<T[5]?5 : 6;
  // (2) 榮譽級別：由實際成就決定，可往上抬（讓戰績輝煌者不被平均稀釋）
  let aIdx=0;
  if(allStar>=1 || allNBAany>=1 || scoringTitles>=1) aIdx=Math.max(aIdx,3);        // 有過明星/最佳陣容/單項王 → 至少稱職先發
  if(allStar>=2 || allNBAany>=1) aIdx=Math.max(aIdx,4);                             // 常態明星 → 明星球員
  if(allStar>=3 || localMvp>=1 || allNBA1>=1 || (champ>=1&&allStar>=2)) aIdx=Math.max(aIdx,5); // 有分量 → 當家球星
  if(localMvp>=1 && (allStar>=4 || allNBA1>=1 || champ>=1)) aIdx=Math.max(aIdx,6);  // 重大榮譽 → 聯盟門面
  if(mvp>=2 || (mvp>=1&&champ>=1) || allNBA1>=3) aIdx=Math.max(aIdx,7);             // 傳奇巨星
  // (3) 取品質與榮譽的較高者
  let idx=Math.max(qIdx,aIdx);
  // (4) 資歷保護：頂層標籤需足夠樣本，避免短暫客串被灌成傳奇（同時提高門檻可信度）
  if(n<2) idx=Math.min(idx, aIdx>=5?4:3);                    // 只打 1 季：頂多明星球員（無重大榮譽則封在先發）
  if(n<3 && aIdx<5) idx=Math.min(idx,4);                     // 2 季且無重大榮譽：頂多明星球員
  if(idx>=6 && n<4 && !(localMvp>=1||allNBA1>=1)) idx=5;     // 聯盟門面需 ≥4 季或硬榮譽
  if(idx>=7 && n<5 && mvp<2) idx=6;                          // 傳奇需 ≥5 季或多座 MVP
  idx=clamp(idx,0,labels.length-1);
  return {league:lg, score, label:labels[idx], seasons:n, avgSS:Math.round(avgSS)};
}
function allLeagueEvals(){
  const order=["NBA","CBL","KRBL","日職 B.League","發展聯盟","TPBL","P+","SBL"];
  const seen=[]; G.seasonHistory.forEach(s=>{if(s.stage==="pro"&&!seen.includes(s.league))seen.push(s.league);});
  return order.filter(l=>seen.includes(l)).map(leagueEval).filter(Boolean);
}

function hasTitle(id){ return (G.titles||[]).some(t=>t.id===id); }
function grantTitle(id){
  if(!TITLE_DEFS[id]||hasTitle(id))return;
  const d=TITLE_DEFS[id];
  G.titles=G.titles||[];
  G.titles.push({id,name:d.name,good:d.good,cssClass:d.cssClass,desc:d.desc,effect:d.effect||""});
  if(d.buff){ for(const k in d.buff){
    if(k==="pot"){ G.potential=clamp(G.potential+d.buff[k],72,99); }
    else if(k in G.attr) G.attr[k]=clamp(G.attr[k]+d.buff[k],15,99);
    else if(k==="fame") G.fame=clamp(G.fame+d.buff[k],0,100);
    else if(k==="morale") G.morale=clamp(G.morale+d.buff[k],0,100); } }
  G._newTitle=d.name; // 供賽季回顧提示
}

function teamCityMatchesHome(team,home){ return team && home && team.indexOf(home)===0; }
function checkSeasonTitles(s){
  // 隊魂 / 一人一城：同隊效力賽季數
  if(s.stage==="pro"){
    G._teamTenure=G._teamTenure||{};
    G._teamTenure[s.team]=(G._teamTenure[s.team]||0)+1;
    if(G._teamTenure[s.team]>10) grantTitle("teamSoul");
    if(G._teamTenure[s.team]>12) grantTitle("oneCity");
  }
  // 鐵人：職業季全勤（未因傷減量）且健康高
  if(s.stage==="pro" && s.gp>=leagueGP(s.league) && G.health>=85) grantTitle("ironman");
  // 打鐵匠：整季命中率極低
  if(s.stage==="pro" && s.fg<=38 && s.gp>=leagueGP(s.league)*.6) grantTitle("bricklayer");
  // 更衣室隱憂：士氣長期低迷
  if(G.morale<=28) grantTitle("locker");
  // 高中封王：本土 HBL 與美國高中分開給稱號
  if(s.stage==="高中" && s.tourney && s.tourney.champ){
    if(s.league==="美國高中") grantTitle("prepChampion"); else grantTitle("hsKing");
  }
  // 冠軍基因（職業奪冠）
  if(s.stage==="pro" && s.champion) grantTitle("champDNA");
  // 玻璃人：兩次以上重傷；薄玻璃：三次以上
  if((G.majorInjuries||0)>=2) grantTitle("glass");
  if((G.majorInjuries||0)>=3) grantTitle("fragile");
  // NCAA 之光 / 全美第一
  if(s.usRank){ if(s.usRank<=25) grantTitle("ncaaStar"); if(s.usRank===1) grantTitle("usaTop"); }
  // 累積榮譽型稱號
  const c=G.careerAwards;
  if((c["得分王"]||0)>=2) grantTitle("scoringMachine");
  if((c["助攻王"]||0)>=2) grantTitle("dimeKing");
  if((c["籃板王"]||0)>=2) grantTitle("glassCleaner");
  if((c.DPOY||0)>=1) grantTitle("ironWall");
  if((c["冠軍"]||0)>=3) grantTitle("ringCollector");
  if((G.intlMedals||0)>=2) grantTitle("goldGen");
  // 日職巨星：在日職有明星等級評價
  if(s.stage==="pro" && s.league==="日職 B.League"){ const ev=leagueEval("日職 B.League");
    if(ev && (ev.label.indexOf("當家")>=0||ev.label.indexOf("明星")>=0||ev.label.indexOf("傳奇")>=0)) grantTitle("jpStar"); }
  // 世界舞台：NBA + 日職 + 任一台灣聯盟都打過
  const played=new Set(G.seasonHistory.filter(x=>x.stage==="pro").map(x=>x.league));
  if(played.has("NBA")&&played.has("日職 B.League")&&(played.has("SBL")||played.has("P+")||played.has("TPBL"))) grantTitle("worldStage");
  // 人氣王：名氣曾破 95
  if(G.fame>=95) grantTitle("fanFavorite");
  // 關鍵先生：職業聯賽、奪冠、且該季場均得分 >= 26
  if(s.stage === "pro" && s.champion && s.ppg >= 26) grantTitle("clutchAssassin");
  // 銅牆鐵壁：單季抄截 >= 2.0 且 阻攻 >= 1.5
  if(s.stage === "pro" && s.spg >= 2.0 && s.bpg >= 1.5) grantTitle("defensiveAnchor");
  // 行走印鈔機：生涯金錢大於等於 50000 萬 (5億)
  if(G.money >= 50000) grantTitle("cashCow");
  // 不老神木：年齡 >= 38 歲，且出賽場次大於聯盟總場次的 60%
  if(s.stage === "pro" && G.age >= 38 && s.gp >= leagueGP(s.league) * 0.6) grantTitle("evergreen");
  // 薪水小偷：領「頂薪」合約 (cType === "max")，但賽季表現分 (seasonScore) 低於 60
  if(s.stage === "pro" && G.contract && G.contract.cType === "max" && s.seasonScore < 60) grantTitle("overpaid");
  // 氣氛大師：士氣極低 (<= 15)
  if(G.morale <= 15) grantTitle("toxic");
  // NBA 出勤／選秀身價相關稱號
  if(s.league==="NBA" && s.gp<65 && s.seasonScore>=82) grantTitle("awardIneligible");
  const nbaRecent=G.seasonHistory.filter(h=>h.league==="NBA").slice(-3);
  if(nbaRecent.length===3 && nbaRecent.every(h=>h.gp>=70)) grantTitle("durableStar");
  if(s.league==="NBA" && G.draftInfo&&G.draftInfo.league==="NBA" && G.draftInfo.pick>=31 && s.seasonScore>=76) grantTitle("secondRoundSteal");
  if(s.league==="NBA" && s.gp>=50 && s.ppg<7 && s.seasonScore<38) grantTitle("deepBench");
  // 大滿貫：高中、大學、職業三階段皆奪冠
  const wonHS = G.seasonHistory.some(h => h.stage === "高中" && h.champion);
  const wonCollege = G.seasonHistory.some(h => h.stage === "大學" && h.champion);
  const wonPro = G.seasonHistory.some(h => h.stage === "pro" && h.champion);
  if (wonHS && wonCollege && wonPro) grantTitle("grandSlam");
}
/* ---------- 全美大學 Big Board（旅美 NCAA 球員） ---------- */
function computeUsRank(currentProd){
  if(!(G.league==="NCAA D1"||G.league==="NCAA D2"))return null;
  const stars=G._finalHsStars||3;
  if(!G._collegeEntryRank) G._collegeEntryRank=collegeEntryRankFromStars(stars);
  const prev=G._collegeRank||G._collegeEntryRank;
  const prod=currentProd===undefined?recentProd():currentProd;
  const ov=overall();
  // 以即戰能力與當季產出估算目標 Big Board；D1 的曝光略高。
  const perf=ov + clamp((prod-16)*.75,-6,18) + (G.league==="NCAA D1"?5:0);
  let target;
  if(perf>=103) target=rint(1,14);
  else if(perf>=96) target=rint(15,30);
  else if(perf>=90) target=rint(31,60);
  else if(perf>=83) target=rint(61,120);
  else if(perf>=76) target=rint(121,220);
  else target=rint(221,500);
  // 第一年保留高中星級帶來的初始定位，之後逐年更看大學實績。
  const wTarget=G.collegeYears<=1?.42:.62;
  let rank=Math.round(prev*(1-wTarget)+target*wTarget+rnd(-5,5));
  rank += (G._seasonMods&&G._seasonMods.boardMove)||0;
  rank=clamp(rank,1,500);
  G._collegeRank=rank;
  G.usRankBest=Math.min(G.usRankBest||999,rank);
  return rank;
}
function hofScore(){
  const c=G.careerAwards, t=careerTotals();
  const prestige=bestLeaguePrestige();
  const tierBonus=[0,0,18,42,75][prestige]||0; // 打到的最高殿堂
  let sc=tierBonus + c.MVP*24 + c.FMVP*9 + c["明星賽"]*2.6 + c["冠軍"]*11 + c.DPOY*8 + c.ROTY*5
    + c["最佳陣容"]*2 + (c["得分王"]+c["籃板王"]+c["助攻王"])*3
    + (c["年度一隊"]||0)*10 + (c["年度二隊"]||0)*7 + (c["年度三隊"]||0)*5 + ((c["新秀一隊"]||0)+(c["新秀二隊"]||0))*3
    + Math.max(0,(t.peakOv-80))*4 + t.totalPts/1500 + G.intlMedals*5;
  return Math.round(sc);
}

function computeHallOfFame(){
  const ev={}; allLeagueEvals().forEach(e=>ev[e.league]=e.score);
  const tw=(ev["SBL"]||0)+(ev["P+"]||0)+(ev["TPBL"]||0);
  const twClubAwards=(G.awardLog||[]).filter(a=>["SBL","P+","TPBL"].includes(a.league)).length;
  // 中華隊貢獻：依獎牌/榮譽加權（正式賽 > 瓊斯盃邀請賽），大幅提高國家隊份量——
  // 讓「就算不在台灣打球，也能靠代表國家隊拿下名人堂」成為可行路線
  let natlScore=0;
  (G.awardLog||[]).filter(a=>a.league==="中華隊").forEach(a=>{
    const w=a.award;
    natlScore += w==="金牌"?175 : w==="銀牌"?125 : w==="銅牌"?90 : w==="賽會MVP"?75 :
      w==="瓊斯盃金牌"?60 : w==="瓊斯盃銀牌"?42 : w==="瓊斯盃銅牌"?30 :
      (w.indexOf("瓊斯盃MVP")>=0?38 : 12);
  });
  const taiwanScore=Math.round(tw + natlScore + twClubAwards*10 + (G.madeNBA?160:0));
  const nba=ev["NBA"]||0;
  const nbaSeasons=G.seasonHistory.filter(s=>s.league==="NBA").length;
  const naismithScore=Math.round(nba + (G.awardLog||[]).filter(a=>a.league==="NBA").reduce((s,a)=>
    s+(a.award==="MVP"?130:a.award==="FMVP"?90:a.award==="冠軍"?60:a.award==="年度一隊"?55:a.award==="年度二隊"?35:a.award==="年度三隊"?24:a.award.includes("明星賽")?26:a.award.includes("王")?30:12),0));
  // 中國籃球名人堂：以 CBL 資歷與榮譽為主
  const cbl=ev["CBL"]||0;
  const cblSeasons=G.seasonHistory.filter(s=>s.league==="CBL").length;
  const chinaScore=Math.round(cbl + (G.awardLog||[]).filter(a=>a.league==="CBL").reduce((s,a)=>
    s+(a.award==="MVP"?90:a.award==="FMVP"?55:a.award==="冠軍"?45:a.award==="本土MVP"?40:a.award.includes("明星賽")?18:a.award.includes("王")?22:a.award==="DPOY"?24:a.award==="ROTY"?14:10),0));
  // 韓國籃球名人堂：以 KRBL 資歷與榮譽為主
  const krbl=ev["KRBL"]||0;
  const krblSeasons=G.seasonHistory.filter(s=>s.league==="KRBL").length;
  const koreaScore=Math.round(krbl + (G.awardLog||[]).filter(a=>a.league==="KRBL").reduce((s,a)=>
    s+(a.award==="MVP"?90:a.award==="FMVP"?55:a.award==="冠軍"?45:a.award==="國內MVP"?40:a.award.includes("明星賽")?18:a.award.includes("王")?22:a.award==="DPOY"?24:a.award==="ROTY"?14:10),0));
  return {
    taiwanScore, taiwan: taiwanScore>=880,
    naismithScore, nbaSeasons, naismith: G.madeNBA && nbaSeasons>=5 && naismithScore>=850,
    chinaScore, cblSeasons, china: cblSeasons>=4 && chinaScore>=560,
    koreaScore, krblSeasons, korea: krblSeasons>=4 && koreaScore>=560,
  };
}

/* ---------- 球衣退休：依「各隊」效力年資 × 戰績 × 榮譽 判定 ---------- */
function jerseyRetiredTeams(){
  const pro=G.seasonHistory.filter(s=>s.stage==="pro");
  if(!pro.length)return [];
  const byTeam={};
  pro.forEach(s=>{ const k=s.league+"|"+s.team;
    if(!byTeam[k]) byTeam[k]={team:s.team,league:s.league,seasons:0,ssSum:0,star:0,champ:0};
    const b=byTeam[k]; b.seasons++; b.ssSum+=(s.seasonScore||0);
    const starTh=(s.league==="NBA"||s.league==="日職 B.League"||s.league==="CBL"||s.league==="KRBL")?76:73;
    if((s.seasonScore||0)>=starTh) b.star++;
    if(s.champion) b.champ++;
  });
  const result=[];
  Object.values(byTeam).forEach(b=>{
    const avg=b.ssSum/b.seasons;
    // 資格：長期效力(≥6季) 且 在該隊有成就（奪冠 / 多次明星級 / 平均影響力高）
    const qualifies = b.seasons>=6 && (b.champ>=1 || b.star>=3 || avg>=(b.league==="NBA"?82:72));
    // 或：該隊生涯代表隊(≥8季)即使成就普通也退休球衣
    const loyalty = b.seasons>=8 && avg>=(b.league==="NBA"?70:60);
    if(qualifies||loyalty) result.push({team:b.team,league:b.league,seasons:b.seasons});
  });
  // 最多顯示 3 隊，年資高的優先
  return result.sort((a,b)=>b.seasons-a.seasons).slice(0,3);
}
function endCareer(){
  G.retired=true;
  // 隱藏稱號結算
  const proSeasons=G.seasonHistory.filter(s=>s.stage==="pro").length;
  const collegeSeasons=G.seasonHistory.filter(s=>s.stage==="大學").length;
  if(proSeasons<=1 && collegeSeasons>=1 && !G.madeNBA) grantTitle("flashPan"); // 大學後隨即退休
  if(proSeasons>10 && (G.careerAwards["冠軍"]||0)===0) grantTitle("ringless"); // 無冕之王
  const sc=hofScore();
  G._hofScore=sc;
  G._hallOfFame=computeHallOfFame();
  G._jerseyTeams=jerseyRetiredTeams();
  G._jerseyRetired = G._jerseyTeams.length>0 || (G._hallOfFame&&G._hallOfFame.naismith);
  G._hof=G._hallOfFame.taiwan||G._hallOfFame.naismith||G._hallOfFame.china;
  let tier=retirementTier();
  if(G._undrafted) tier="undrafted"; // 落選轉跑道專屬
  // 發展聯盟長期打拼、始終沒能真正在 NBA 站穩 → 專屬「農場老兵」退休劇情
  const devSeasons=G.seasonHistory.filter(s=>s.league==="發展聯盟").length;
  G._devGrindSeasons=devSeasons;
  if(!G.madeNBA && devSeasons>=4 && tier!=="undrafted") tier="devgrind";
  if(G.background==="asian_american" && tier!=="undrafted" && tier!=="devgrind" && !G._injuryRetire){
    tier=G._canPlayForTaiwan===false?"asianAmericanRefusedTaiwan":"asianAmericanLegacy";
  }
  if(G._injuryRetire) tier="injuryEnd"; // 傷退劇情優先
  G._retireScene=pick(RETIRE_SCENES[tier]||RETIRE_SCENES.obscure);
  G._retireTier=tier;
  G._fanForum=fanForum();
  G.phase="retireScene"; render();
}

  addF(pick(FANS), pick(shorties), rint(6,180));
  // 貼合留言優先入列，不足 8 則再用洗版短評補滿
  const shuffle=a=>{ for(let i=a.length-1;i>0;i--){const j=rint(0,i);[a[i],a[j]]=[a[j],a[i]];} };
  shuffle(posts); shuffle(filler);
  const out=posts.slice(0,8);
  for(const f of filler){ if(out.length>=8) break; out.push(f); }
  // 同一討論串避免重複 ID（保留主題性 ID 首次出現，重複者換成其他鄉民）
  const usedU=new Set();
  out.forEach(p=>{ if(usedU.has(p.user)){ let u=pick(FANS),g=0; while(usedU.has(u)&&g<40){u=pick(FANS);g++;} p.user=u; } usedU.add(p.user); });
  return out.sort((a,b)=>b.likes-a.likes);
}

    bad:["這季狀態有點掙扎啊…","是不是有傷？看起來很勉強。","加油，球迷還是相信你的。","數據下滑，該調整了。","希望教練幫他找回信心。",
      "手感整季冰冷，心疼。","被聯盟研究透了嗎？","低潮總會過去的，撐住。","上場時間變少了，可惜。","狀態回不來有點擔心。","這數據可以原地退休了吧。","YT主播應該又要開始做影片開噴了。",
      "撐住，誰都有低谷，別被酸民帶風向。","看得出來很努力，就是還沒兜起來。"],
  };
  // ---- 依「這一季實際模擬結果」量身打造的貼合評語（優先顯示） ----
  const proSeason = s.stage==="pro";
  const gpFull = proSeason ? leagueGP(s.league) : (s.gp||1);
  const aw = s.awards||[];
  const has = a=>aw.includes(a);
  const hot=[]; const seen=new Set();
  const add=arr=>{ const c=pick(arr); if(!seen.has(c)){ seen.add(c); hot.push(c); } };

  // 個人獎項（最貼合、最優先）
  if(has("MVP")) add(["MVP！MVP！這賽季整個聯盟沒人擋得住！","年度 MVP 實至名歸，這就是聯盟門面。","把 MVP 抱回家，這季神到不像話。"]);
  if(has("FMVP")) add(["總冠軍賽 MVP！系列賽整個扛起來，尊敬。","FMVP 欸，冠軍戰那幾場根本一夫當關。"]);
  else if(s.champion) add(["封王了！扛著球隊走到最後，值得！","冠軍到手，這座城市為你瘋狂。"]);
  if(has("DPOY")) add(["年度最佳防守，這防守壓迫感太窒息了。","防守端就是聯盟天花板，對位到他等於得分陣亡。"]);
  else if(proSeason && s.spg>=2 && s.bpg>=1.3) add([`場均 ${s.spg} 抄 ${s.bpg} 阻，防守端存在感爆棚。`,"抄截阻攻樣樣來，這防守太全面了。"]);
  if(has("ROTY")) add(["年度最佳新秀！這新人來頭不小，未來可期。","菜鳥就打這數據，前途無量啊。"]);
  if(has("得分王")) add([`場均 ${s.ppg} 分收下得分王，進攻火力頂到天花板。`,"得分王到手，不砍個幾十分不痛快。"]);
  else if(s.ppg>=28) add([`場均 ${s.ppg} 分，這進攻火力太恐怖了。`,"每場都在瘋狂砍分，得分是他的本能。"]);
  if(has("助攻王")) add([`場均 ${s.apg} 助攻拿助攻王，全隊靠他一手串聯。`,"助攻王，這視野跟傳球想像力太犯規。"]);
  else if(s.apg>=8) add([`場均 ${s.apg} 助攻，一手掌控全隊節奏。`,"傳球視野頂級，隊友接球都有空檔。"]);
  if(has("籃板王")) add([`場均 ${s.rpg} 板的籃板王，禁區就是他的地盤。`,"籃板王，卡位搶板的意識滿分。"]);
  else if(s.rpg>=12) add([`場均 ${s.rpg} 籃板，禁區清道夫等級。`,"籃板卡位太兇，二波進攻全靠他。"]);
  if(has("明星賽")&&!has("MVP")) add(["明星賽先發穩了，人氣實力雙收。","票投好投滿，明星賽舞台屬於你。"]);
  if(has("最佳陣容")&&!has("MVP")&&!has("明星賽")) add(["年度最佳陣容入列，聯盟頂尖的認證。"]);
  if(has("年度一隊")||has("年度二隊")||has("年度三隊")) add(G.background==="asian_american"?["華裔球員擠進 NBA 年度陣容，這已經是聯盟最頂尖那一層。","年度隊伍不是情懷票，是整季硬實力認證。"]:["NBA 年度球隊有台灣人的名字，太不真實了。","擠進 NBA 年度陣容，這是為台灣籃球寫歷史。"]);
  if(has("本土MVP")||has("國內MVP")) add(["本土 MVP！在強敵環伺的聯賽扛旗，硬。"]);

  // 命中率 / 手感
  if(s.tp>=40 && s.ppg>=14) add([`三分命中率 ${s.tp}%，投起來根本不講理。`,"外線準到對手不敢放，直接拉開空間。"]);
  if(s.fg>=56 && s.ppg>=16) add([`投籃命中率 ${s.fg}%，出手選擇又聰明又高效。`,"這麼高的命中率，每球都打在刀口上。"]);
  else if(s.fg<=38 && s.gp>=gpFull*0.6) add([`命中率只有 ${s.fg}%，手感整季冰冷，心疼。`,"打鐵打好打滿，出手選擇要再挑一點。"]);

  // 戰績 / 季後賽
  if(!s.champion && s.playoff) add(["晉級季後賽了，可惜差一步，明年再拚。","有他在季後賽就有機會，就差臨門一腳。"]);
  else if(proSeason && !s.playoff && s.winPct<0.33) add(["球隊戰績慘成這樣，個人已經很盡力了，別扛全隊的鍋。","隊友幫幫忙吧，一個人真的撐不住整支球隊。"]);

  // 傷勢 / 出賽
  if(s.injury && s.injury.career) add(["這傷太重了…看著真的鼻酸，謝謝你拚到最後一刻。"]);
  else if(s.injury && s.injury.major) add(["看到重傷好揪心，健康最重要，慢慢養別急著回來。","傷勢別勉強，我們等你健康歸來。"]);
  else if(proSeason && s.gp<=gpFull*0.55) add([`整季只打了 ${s.gp} 場，傷傷停停好可惜。`,"健康就好，滿血的他才是最可怕的。"]);

  // 階段 / 年齡（依模擬出來的球員處境）
  if(s.stage==="高中" && s.tourney && s.tourney.champ){
    if(s.league==="美國高中") add(["全美高中舞台直接封王，這個 prospect 的身價要起飛了！","從 AAU 到全國冠軍，名校教練今晚肯定睡不著。"]);
    else add(["高中就打出這種統治力，未來一定不得了！","HBL 舞台直接封神，這新星我先追爆。"]);
  } else if(s.stage==="大學" && s.usRank && s.usRank<=25){
    if(G.background==="asian_american") add([`Big Board 衝到全美前 25（#${s.usRank}），華裔新星真的打進 NBA 雷達了！`,"這排名已經不是故事性，是貨真價實的選秀行情。"]);
    else add([`打進全美前 25（#${s.usRank}），台灣囝仔在美國發光了！`,"全美排名有你的名字，旅美這步走對了。"]);
  }
  // 華裔身分專屬：仍以當季真實數據／排名為主，不只講身分故事。
  if(G.background==="asian_american"){
    if(s.league==="NBA" && s.ppg>=25) add([`華裔後衛／鋒線在 NBA 場均 ${s.ppg} 分，這已經不是「勵志故事」，是正牌明星數據。`,`別再只用華裔標籤介紹他了，場均 ${s.ppg} 分就是聯盟頂級火力。`]);
    else if(s.league==="NBA" && s.ppg>=15) add([`NBA 場均 ${s.ppg} 分、${s.apg} 助攻，華裔球員能穩定扛輪替甚至先發，含金量很高。`,`這季 ${s.ppg}/${s.rpg}/${s.apg}，不是靠話題生存，是靠內容站住腳。`]);
    if(s.league==="NBA" && s.tp>=40 && s.ppg>=12) add([`三分 ${s.tp}% 還有場均 ${s.ppg} 分，這種空間價值去哪隊都有人要。`]);
    if(s.stage==="大學" && s.usRank && s.usRank<=45) add([`Big Board #${s.usRank}，從 AAU 打上來的華裔 prospect 已經是貨真價實的選秀圈名字。`]);
    if(s.stage==="高中" && s.hsStars) add([`${"⭐".repeat(s.hsStars)} ${s.hsStars} 星高中生，這條美國高中招募路線真的被他打通了。`]);
    if(proSeason && s.seasonScore<45) add([`華裔身分帶來關注，但這季內容確實不夠好，${s.ppg} 分的產出得想辦法反彈。`]);
  }

  if(proSeason && s.age>=37 && s.gp>=gpFull*0.6) add(["這年紀還能打這種數據，根本不老神木。","看老將還在場上拚，滿滿的感動與敬意。"]);
  else if(proSeason && s.age<=21 && s.seasonScore>=66) add(["這麼年輕就這麼穩，天花板到底在哪？","小將成長曲線太美，聯盟未來是他的。"]);

  // ---- 組合輸出：貼合評語優先，再用分級池補滿 4 則 ----
  const bigNight = tierc==="champ"||tierc==="elite"||has("MVP")||has("FMVP")||s.champion;
  const like = big => big ? rint(120,900) : rint(6,320);
  const out=[]; const usedTxt=new Set(); const usedU=new Set();
  const freshU=()=>{ let u=pick(FANS),g=0; while(usedU.has(u)&&g<30){u=pick(FANS);g++;} usedU.add(u); return u; };
  hot.slice(0,3).forEach(t=>{ out.push({u:freshU(),t,likes:like(bigNight)}); usedTxt.add(t); });
  const base=pools[tierc].slice();
  let guard=0;
  while(out.length<4 && guard<50){ const c=pick(base); guard++; if(usedTxt.has(c))continue; usedTxt.add(c); out.push({u:freshU(),t:c,likes:like(bigNight&&out.length===0)}); }
  return out;
}

function isPro(){return G&&G.stage==="pro";}
function getContractText() {
  if (isPro() && G.contract) {
    const rookie=G.contract.rookieScale?` · 新秀約 ${G.contract.structure||"2+1+1"}`:"";
    return `<span style="font-size:12px; color:var(--dim); margin-left:8px; padding-left:8px; border-left:1px solid var(--line);">合約剩 ${G.contract.yearsLeft} 年 / 年薪 ${fmtMoney(G.contract.salary)}${rookie}</span>`;
  }
  return "";
}
function toast(msg,ms){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),ms||2200);}

/* ============ 地區佈景主題 ============ */
const LEAGUE_REGION={
  "美國高中":"us", "高中":"tw","UBA":"tw","SBL":"tw","P+":"tw","TPBL":"tw", 
  "NCAA D1":"us","NCAA D2":"us","發展聯盟":"us","NBA":"us",
  "日職 B.League":"jp","CBL":"cn","KRBL":"kr"
};
function regionForLeague(lg){ return LEAGUE_REGION[lg] || "tw"; }
function currentRegion(){
  if(!G) return "tw";                                   // 標題畫面：台灣主場
  if(G.phase==="jones" || G.phase==="intl") return "tw"; // 披上中華隊 → 回主場氛圍
  return regionForLeague(G.league);
}
function ensureBackdrop(){
  if(!document.getElementById("backdrop")){
    const d=document.createElement("div"); d.id="backdrop";
    d.innerHTML='<div class="bd-base"></div><div class="bd-motif"></div><div class="bd-scene"></div>';
    document.body.insertBefore(d, document.body.firstChild);
  }
}
let _regionNow=null;
function applyRegionTheme(){
  ensureBackdrop();
  const r=currentRegion();
  if(r===_regionNow) return;
  const bd=document.getElementById("backdrop");
  if(_regionNow===null){ _regionNow=r; document.body.dataset.region=r; return; } // 首次直接套用
  _regionNow=r;
  // 換地區：淡出→切換→淡入
  bd.classList.add("fade");
  setTimeout(()=>{ document.body.dataset.region=r; bd.classList.remove("fade"); }, 250);
}
function render(){
  applyRegionTheme();
  if(!G){ return renderStart(); }
  if(G.phase==="retireScene"){ return renderRetireScene(); }
  if(G.phase==="end"){ return renderEnd(); }
  if(G.phase==="stats"){ return renderStats(); }
  _actions=[]; // 每次重繪都清空底部按鈕，改由各 phase 決定（修正賽季回顧誤顯示「開始賽季」的問題）
  app.innerHTML = hudHTML() + `<div class="wrap" id="stage"></div>` + actionbarHTML();
  const stage=$("#stage");
  switch(G.phase){
    case "intro": stage.innerHTML=introHTML(); break;
    case "decline": stage.innerHTML=declineHTML(); break;
    case "commit": stage.innerHTML=commitHTML(); break;
    case "tradeRumor": stage.innerHTML=tradeRumorHTML(); break;
    case "allocate": stage.innerHTML=allocateHTML(); break;
    case "training": stage.innerHTML=trainingHTML(); bindTraining(); break;
    case "review": stage.innerHTML=reviewHTML(); break;
    case "surgery": stage.innerHTML=surgeryHTML(); break;
    case "hsDecision": stage.innerHTML=hsDecisionHTML(); break;
    case "collegeDecision": stage.innerHTML=collegeDecisionHTML(); break;
    case "freeAgency": stage.innerHTML=freeAgencyHTML(); break;
    case "trade": stage.innerHTML=tradeHTML(); break;
    case "retireOption": stage.innerHTML=retireOptionHTML(); break;
    case "intl": stage.innerHTML=intlHTML(); break;
    case "jones": stage.innerHTML=jonesHTML(); break;
    case "draftDeclare": stage.innerHTML=draftDeclareHTML(); break;
    case "nbaCombine": stage.innerHTML=nbaCombineHTML(); break;
    case "nbaCombineRejected": stage.innerHTML=nbaCombineRejectedHTML(); break;
    case "rookieOption": stage.innerHTML=rookieOptionHTML(); break;
    case "nbaUndrafted": stage.innerHTML=nbaUndraftedHTML(); break;
    case "draftResults": stage.innerHTML=draftResultsHTML(); break;
    case "overseasOffer": stage.innerHTML=overseasOfferHTML(); break;
  }
  bindActionbar();
  window.scrollTo(0,0);
}

/* ---------- HUD ---------- */
function hudHTML(){
  const ov=overall();
  const attrBars=ATTR_KEYS.map(k=>{
    const v=G.attr[k], prev=G.lastAttr?G.lastAttr[k]:v;
    const cls=v>prev?"up":v<prev?"down":"";
    return `<div class="attr ${cls}"><div class="row"><span class="an">${ATTR_LABEL[k]}</span>
      <span class="av">${v}</span></div><div class="bar"><i style="width:${v}%"></i></div></div>`;
  }).join("");
  return `<div class="hud">
    <div class="hud-top">
      <div class="jersey" style="${jerseyStyle(G.team)}">${G.jersey}</div>
      <div class="hud-name"><div class="nm">${G.name} <span class="arche">${archetype()}</span>${(G.league==="NCAA D1"||G.league==="NCAA D2")&&G.lastReview&&G.lastReview.usRank?` <span class="usrank">🇺🇸全美#${G.lastReview.usRank}</span>`:""}${G.stage==="高中"&&G.background==="asian_american"&&G.lastReview&&G.lastReview.hsStars?` <span class="usrank">🇺🇸 ${G.lastReview.hsStars}★ · #${G.lastReview.hsRecruitRank||G._hsRecruitRank||"—"}</span>`:""}</div>
        <div class="meta">${POSITIONS[G.pos].abbr}｜${G.height}cm / ${G.weight}kg｜${G.age}歲｜${G.stage==="pro"?lname(G.league):(G.stage==="大學"?lname(G.league):G.stage)} · ${G.team}</div>
        ${G.titles&&G.titles.length?`<div class="title-row">${titleBadgesHTML()}</div>`:""}</div>
      <div class="hud-ov"><div class="v">${ov}</div><div class="l">OVR</div></div>
    </div>
    <div class="hud-stats">
      <div class="hs health"><div class="v">${Math.round(G.health)}</div><div class="l">健康</div></div>
      <div class="hs"><div class="v">${Math.round(G.morale)}</div><div class="l">士氣</div></div>
      <div class="hs"><div class="v">${Math.round(G.fame)}</div><div class="l">名氣</div></div>
      <div class="hs money"><div class="v">${fmtMoney(G.money)}</div><div class="l">生涯收入</div></div>
    </div>
    <div class="wrap" style="padding-top:10px;padding-bottom:10px">
      <div class="attrs">${attrBars}</div>
    </div>
  </div>`;
}
function actionbarHTML(){ return `<div class="actionbar"><div class="inner" id="abar"></div></div>`; }

/* ---------- 能力加點（養成） ---------- */
function allocateHTML(){
  const al=G._alloc, cur=k=>al.base[k]+al.add[k];
  const prev={};ATTR_KEYS.forEach(k=>prev[k]=cur(k));
  const ovNow=overall(prev,G.pos);
  const ovBase=overall(al.base,G.pos);
  const gradeNames = G.background === "asian_american" ? ["高一(Fr.)","高二(So.)","高三(Jr.)","高四(Sr.)"] : ["高一","高二","高三"];
  const stageName=G.stage==="高中"?`高中 ${gradeNames[G.grade-1]||""}`:
    G.stage==="大學"?`${lname(G.league)} ${["大一","大二","大三","大四"][Math.min(G.collegeYears-1,3)]}`:lname(G.league);
  
  // 取得目前的硬上限 (潛力 + 4)
  const cap = allocCap(); 

  const rows=ATTR_KEYS.map(k=>{
    const v=cur(k), c=allocCost(v), added=al.add[k];
    const isMax = v >= cap; // 判斷是否已經達到上限
    const canPlus= !isMax && al.spLeft>=c, canMinus=added>0;
    
    // 如果已經達到上限，顯示紅色的 MAX，否則顯示點數花費
    const costHtml = isMax ? `<span style="color:var(--red); font-weight:700;">MAX</span>` : `${c}點/級`;

    return `<div class="alloc-row">
      <div class="alloc-name">${ATTR_LABEL[k]}</div>
      <div class="alloc-bar" style="position:relative;">
        <i style="width:${v}%"></i>
        <!-- 🌟 新增：畫出潛力硬上限的紅線與灰色無法升級區塊 -->
        <div style="position:absolute; left:${cap}%; right:0; top:0; bottom:0; background:rgba(0,0,0,0.6); border-left:2px solid var(--red); pointer-events:none;"></div>
      </div>
      <div class="alloc-val">${v}${added?`<span class="up">+${added}</span>`:""}</div>
      <div class="alloc-cost">${costHtml}</div>
      <div class="alloc-btns">
        <button class="stp" data-minus="${k}" ${canMinus?"":"disabled"}>−</button>
        <button class="stp plus" data-plus="${k}" ${canPlus?"":"disabled"}>＋</button>
      </div></div>`;
  }).join("");

  return `<div class="season-hd"><span class="stage">${stageName} · 季前特訓</span><span class="yr">${G.year} 賽季</span></div>
    <div class="team-line"><span class="team-dot" style="background:${teamColors(G.team).p}"></span>${G.team} ${getContractText()} <span class="arche">${archetype()}</span></div>
    ${al.bonus?`<div class="usrank-line" style="color:var(--gold);border-color:rgba(242,184,75,.4);background:rgba(242,184,75,.08)">🏆 上季大賽表現優異，獲得 <b>+${al.bonus}</b> 額外訓練點！</div>`:""}
    <div class="panel">
      <div class="alloc-top">
        <div class="alloc-sp"><div class="v">${al.spLeft}</div><div class="l">剩餘訓練點</div></div>
        <div class="alloc-ov"><div class="v">${ovNow}<span class="ovd">${ovNow>ovBase?` ▲${ovNow-ovBase}`:""}</span></div><div class="l">預估 OVR</div></div>
      </div>
      <!-- 🌟 修改了說明文字，明確告訴玩家上限的機制 -->
      <p class="small" style="margin:2px 0 12px">把訓練點投入想強化的能力。數值越高花費越貴，且<b style="color:var(--red)">最高無法超過潛力值上限（${cap}）</b>。</p>
      <div class="alloc-list">${rows}</div>
      <div class="alloc-actions">
        <button class="btn ghost small" id="allocAuto">⚡ 自動分配</button>
        <button class="btn ghost small" id="allocReset">↺ 重置</button>
      </div>
    </div>
    <p class="small center" style="opacity:.7;padding-bottom:6px">分配完成後，將進入本季的事件抉擇與骰子挑戰。</p>`;
}
function bindAllocate(){
  const s=$("#stage");if(!s)return;
  s.querySelectorAll("[data-plus]").forEach(b=>b.addEventListener("click",()=>allocChange(b.dataset.plus,1)));
  s.querySelectorAll("[data-minus]").forEach(b=>b.addEventListener("click",()=>allocChange(b.dataset.minus,-1)));
  const au=s.querySelector("#allocAuto");if(au)au.addEventListener("click",allocAuto);
  const rs=s.querySelector("#allocReset");if(rs)rs.addEventListener("click",allocReset);
}
function renderAllocateInPlace(){
  // 只就地更新加點面板，不重建整頁、不捲動 → 點下方能力值時不會跳回頂端
  const s=$("#stage"); if(!s){ render(); return; }
  s.innerHTML=allocateHTML();
  bindAllocate();
}
function allocCap(){ return Math.min(99, G.potential+4); } // 加點天花板：潛力+4
function allocChange(k,dir){
  const al=G._alloc, cur=al.base[k]+al.add[k];
  if(dir>0){ if(cur>=allocCap())return; const c=allocCost(cur); if(al.spLeft<c)return; al.add[k]++; al.spLeft-=c; }
  else { if(al.add[k]<=0)return; const c=allocCost(cur-1); al.add[k]--; al.spLeft+=c; }
  renderAllocateInPlace();
}
function allocAuto(){
  const w=POSITIONS[G.pos].w, order=[...ATTR_KEYS].sort((x,y)=>w[y]-w[x]);
  let guard=0;
  while(guard++<800){ let done=true;
    for(const k of order){ const cur=G._alloc.base[k]+G._alloc.add[k], c=allocCost(cur);
      if(cur<allocCap() && G._alloc.spLeft>=c){ G._alloc.add[k]++; G._alloc.spLeft-=c; done=false; break; } }
    if(done)break; }
  renderAllocateInPlace();
}
function allocReset(){ ATTR_KEYS.forEach(k=>G._alloc.add[k]=0); G._alloc.spLeft=G._alloc.sp; renderAllocateInPlace(); }
function commitAllocation(){
  ATTR_KEYS.forEach(k=>G.attr[k]=clamp(G.attr[k]+G._alloc.add[k],15,99));
  G._alloc=null; beginTraining();
}

function resolveOption(i){
  const ev=G.seasonEvents[G.eventIdx];
  const opt=ev.o[i];
  const panel=$("#evpanel");
  // 顯示骰子
  panel.innerHTML=`<div class="label">命運骰</div>
    <div class="dice-stage">
      <div class="die rolling" id="die">${pipHTML(1)}</div>
      <div class="roll-caption" id="rollcap">擲骰中…</div>
    </div>`;
  const die=$("#die");
  let ticks=0;
  const iv=setInterval(()=>{ die.innerHTML=pipHTML(1+Math.floor(rawRnd()*6)); if(++ticks>10){/*noop*/} },70);
  setTimeout(()=>{
    clearInterval(iv);
    const roll=rint(1,6);
    die.classList.remove("rolling");
    die.innerHTML=pipHTML(roll);
    const before={...G.attr};
    const outcome=opt.f(roll);
    // 低骰懲罰：骰到 1–2 時，正屬性加成歸零，且有機率倒扣（讓爛運真的有代價）
    if(roll<=2 && outcome.attr){
      for(const k in outcome.attr){ if(outcome.attr[k]>0){ outcome.attr[k]= chance(.5)?-1:0; } }
    }
    applyEffects(outcome);
    // 轉學劇情：實際換了學校 → 於結果文本帶入新學校名，提高沉浸感
    if(outcome.transfer && G._transferredTo){ outcome.text += " " + transferFlavor(G._transferredTo); }
    const deltas=[];
    if(outcome.attr) for(const k in outcome.attr){const d=outcome.attr[k]; if(!d) continue;
      deltas.push(`<span class="delta ${d>=0?"pos":"neg"}">${ATTR_LABEL[k]} ${d>=0?"+":""}${d}</span>`);}
    if(outcome.health)deltas.push(`<span class="delta ${outcome.health>=0?"pos":"neg"}">健康 ${outcome.health>=0?"+":""}${outcome.health}</span>`);
    if(outcome.money){
  const isPos = outcome.money > 0;
  // 如果是正數加上 + 號，如果是負數，fmtMoney 已經自帶 - 號了
  deltas.push(`<span class="delta ${isPos ? "pos" : "neg"}">$ ${isPos ? "+" : ""}${fmtMoney(outcome.money)}</span>`);
}
    if(outcome.fame)deltas.push(`<span class="delta ${outcome.fame>=0?"pos":"neg"}">名氣 ${outcome.fame>=0?"+":""}${outcome.fame}</span>`);
    if(outcome.morale)deltas.push(`<span class="delta ${outcome.morale>=0?"pos":"neg"}">士氣 ${outcome.morale>=0?"+":""}${outcome.morale}</span>`);
    if(outcome.pot)deltas.push(`<span class="delta ${outcome.pot>=0?"pos":"neg"}">潛力 ${outcome.pot>=0?"+":""}${outcome.pot}</span>`);
    if(outcome.recruitMove){const up=outcome.recruitMove<0;deltas.push(`<span class="delta ${up?"pos":"neg"}">全美招募順位 ${up?"↑":"↓"}${Math.abs(outcome.recruitMove)}</span>`);}
    if(outcome.boardMove){const up=outcome.boardMove<0;deltas.push(`<span class="delta ${up?"pos":"neg"}">Big Board ${up?"↑":"↓"}${Math.abs(outcome.boardMove)}</span>`);}
    if(outcome.draftStockMove)deltas.push(`<span class="delta ${outcome.draftStockMove>0?"pos":"neg"}">選秀行情 ${outcome.draftStockMove>0?"+":""}${outcome.draftStockMove}</span>`);
    const good=tier(roll)==="high", bad=tier(roll)==="low";
    $("#rollcap").innerHTML=`擲出 <b class="oswald" style="color:var(--gold);font-size:18px">${roll}</b>`;
    const oc=document.createElement("div");
    oc.className="outcome "+(good?"good":bad?"bad":"");
    oc.innerHTML=`<div class="ot">${outcome.text}</div>${deltas.length?`<div class="deltas">${deltas.join("")}</div>`:""}`;
    panel.appendChild(oc);

      G.eventIdx++; G.lastAttr={...G.attr}; render();
    }}]);
  },850);
}
function pipHTML(n){
  const map={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};

function resolveTradeRumor(choice){
  const panel=$("#evpanel"); if(!panel) return;
  panel.innerHTML=`<div class="label">命運骰</div>
    <div class="dice-stage">
      <div class="die rolling" id="die">${pipHTML(1)}</div>
      <div class="roll-caption" id="rollcap">流言擴散中…</div>
    </div>`;
  const die=$("#die"); let ticks=0;
  const iv=setInterval(()=>{ die.innerHTML=pipHTML(1+Math.floor(rawRnd()*6)); if(++ticks>10){} },70);
  setTimeout(()=>{
    clearInterval(iv);
    const roll=rint(1,6), t=tier(roll);
    die.classList.remove("rolling"); die.innerHTML=pipHTML(roll);
    // 骰高 → 降低被交易機率；骰低 → 提高（詢問高層波動較大）
    const swing = choice===1 ? 0.13 : 0.08;
    const protection=tradeProtectionScore();
    const tradeProb = clamp(0.5 - (roll-3.5)*swing - protection, 0.01, 0.90);
    const deltas=[];
    if(protection>=.18)deltas.push(`<span class="delta pos">核心地位保護 -${Math.round(protection*100)}% 交易風險</span>`);
    if(choice===1){
      if(t==="high"){ G.morale=clamp(G.morale+4,0,100); deltas.push(`<span class="delta pos">士氣 +4</span>`); }
      else if(t==="low"){ G.morale=clamp(G.morale-4,0,100); deltas.push(`<span class="delta neg">士氣 -4</span>`); }
    }
    const willTrade = chance(tradeProb);
    const head = choice===1
      ? (t==="high"?"你直接找上球團高層對質，對方拍胸脯保證：「你是我們的建隊核心，別理那些網路流言。」"
        : t==="low"?"你氣沖沖地質問管理層，換來的卻是一陣尷尬的沉默與閃爍的眼神。"
        : "你私下向教練打聽，只得到模稜兩可的答覆。")
      : (t==="high"?"你選擇冷處理，照常出現在訓練館，彷彿什麼都沒發生。"
        : t==="low"?"你嘴硬說不知情，但更衣室裡那股微妙的氣氛，騙不了任何人。"
        : "你嘴上說沒聽過，心裡卻七上八下。");
    const tail = willTrade ? "然而幾天後，交易還是敲定了——" : "最終，這只是一場虛驚，你留了下來。";
    $("#rollcap").innerHTML=`擲出 <b class="oswald" style="color:var(--gold);font-size:18px">${roll}</b>`;
    const oc=document.createElement("div");
    oc.className="outcome "+(willTrade?"bad":"good");
    oc.innerHTML=`<div class="ot">${head} ${tail}</div>${deltas.length?`<div class="deltas">${deltas.join("")}</div>`:""}`;
    panel.appendChild(oc);
    refreshHUD();
    if(willTrade){ setAction([{t:"面對交易 ▶",cls:"gold",fn:doTrade}]); }
    else { G._tradeRumor=null; setAction([{t:"繼續 ▶",cls:"gold",fn:processOffseason}]); }
  },850);
}

function jonesKeyPlay(res){
  const l = res.line, big = [];
  const diff = Math.abs(res.us - res.them); // 計算真實分差
  
  // 個人表現描述 (增加更浮誇與多元的級距)
  if(l.p >= 30) big.push("宛如砍分機器般無解");
  else if(l.p >= 24) big.push("得分火力全開");
  
  if(l.a >= 10) big.push("傳球出神入化");
  else if(l.a >= 7) big.push("精準串聯全隊");
  
  if(l.rb >= 15) big.push("稱霸禁區籃板");
  else if(l.rb >= 10) big.push("籃板卡位兇猛");
  
  if(l.s >= 4) big.push("防守端頻頻神抄截");
  else if(l.s >= 3) big.push("抄截如影隨形");
  
  if(l.b >= 4) big.push("化身禁區守護神");
  else if(l.b >= 3) big.push("送出精彩火鍋");

  // 組合個人評語
  const hi = big.length ? `此役你${big.join("、")}，` : "此役你穩紮穩打、默默做出貢獻，";
  const teamName = `中華${G._jones.team==="中華藍"?"藍":"白"}`;
  
  // 賽果描述 (依據真實分差給予不同情境)
  let tone = "";
  if (res.win) {
    if (diff >= 20) tone = `秋風掃落葉般以 ${diff} 分之差狂勝對手`;
    else if (diff >= 10) tone = `穩穩掌控局勢，以 ${diff} 分之差順利收下勝利`;
    else if (diff >= 4) tone = `在激烈拉鋸中頂住壓力，以 ${diff} 分差驚險勝出`;
    else tone = `在讀秒階段展現強大抗壓性，以 ${diff} 分之差驚險氣走對手`;
  } else {
    if (diff >= 20) tone = `全隊攻防失序，以 ${diff} 分之差慘遭對手血洗`;
    else if (diff >= 10) tone = `一路落居下風，最終以 ${diff} 分之差不敵對手`;
    else if (diff >= 4) tone = `與對手纏鬥至末節，可惜仍以 ${diff} 分之差遺憾落敗`;
    else if (diff === 1) tone = `在最後關頭錯失逆轉機會，以 1 分之差飲恨痛失好局`;
    else tone = `激戰到最後一刻，僅以 ${diff} 分之差惜敗`;
  }
  
  return `${hi}${teamName}最終${tone}。`;
}

  if(J.step==="groupResult"){

    return `<div class="season-hd"><span class="stage">瓊斯盃 · 預賽結束</span><span class="yr">${yr}</span></div>

      </div>
      <div class="panel">${jonesStandTable("A")}</div>

  }
  // 總結
  if(J.step==="done"){
    const podium=/冠軍|亞軍|季軍/.test(J.finalPlace);
    const medalIco=J.finalPlace.includes("冠")?"🥇":J.finalPlace.includes("亞")?"🥈":J.finalPlace.includes("季")?"🥉":"🏀";
    const senior=J.team==="中華藍";
    const bracket=J.results.filter(r=>/準決賽|冠軍戰|季軍戰/.test(r.stage)).map(r=>`
      <div class="bk"><span><span class="rd">${r.stage}</span><br>${(JONES_TEAMS[r.opp]||{}).flag||""} vs ${r.opp}</span>
        <b style="color:${r.win?"var(--green)":"var(--red)"}">${r.us} : ${r.them} ${r.win?"勝":"敗"}</b></div>`).join("");
    const rewardTxt = senior
      ? (podium?`🏅 登上頒獎台，本屆列為<b>正式國際獎牌</b>（生涯獎牌 ${G.intlMedals}）。`:`磨合主力陣容、累積國際經驗。`)

        ${J.mvp?`<div style="margin-top:8px"><span class="jones-mvp">🏆 賽會 MVP</span></div>`:""}
        ${J.bestFive&&!J.mvp?`<div style="margin-top:8px"><span class="jones-mvp">🏅 賽會最佳五人</span></div>`:""}
      </div>

          <div class="s"><div class="v" style="color:var(--gold)">${J.avg.p}</div><div class="l">得分</div></div>

function jonesBind(){
  const J=G._jones; if(!J) return;
  const s=$("#stage"); if(!s) return;
  if(J.step==="event"||J.step==="koEvent"){
    s.querySelectorAll("[data-jopt]").forEach(b=>b.addEventListener("click",()=>jonesResolveOption(parseInt(b.dataset.jopt))));
  }

function jonesResolveOption(i){
  const J=G._jones, ev=J.event, opt=ev.o[i];
  const panel=$("#jevpanel");
  panel.innerHTML=`<div class="label">命運骰</div>
    <div class="dice-stage"><div class="die rolling" id="jdie">${pipHTML(1)}</div>
      <div class="roll-caption" id="jrollcap">擲骰中…</div></div>`;
  const die=$("#jdie"); let ticks=0;
  const iv=setInterval(()=>{ die.innerHTML=pipHTML(1+Math.floor(rawRnd()*6)); if(++ticks>10){} },70);
  setTimeout(()=>{
    clearInterval(iv);
    const roll=rint(1,6);
    die.classList.remove("rolling"); die.innerHTML=pipHTML(roll);
    const outcome=opt.f(roll);
    if(roll<=2 && outcome.attr){ for(const k in outcome.attr){ if(outcome.attr[k]>0) outcome.attr[k]=chance(.5)?-1:0; } }
    applyEffects(outcome);
    if(typeof outcome.jb==="number") J.boost=clamp((J.boost||0)+outcome.jb, -.15, .22);
    const deltas=[];
    if(outcome.attr) for(const k in outcome.attr){const d=outcome.attr[k]; if(!d) continue;
      deltas.push(`<span class="delta ${d>=0?"pos":"neg"}">${ATTR_LABEL[k]} ${d>=0?"+":""}${d}</span>`);}
    if(outcome.health)deltas.push(`<span class="delta ${outcome.health>=0?"pos":"neg"}">健康 ${outcome.health>=0?"+":""}${outcome.health}</span>`);
    if(outcome.fame)deltas.push(`<span class="delta ${outcome.fame>=0?"pos":"neg"}">名氣 ${outcome.fame>=0?"+":""}${outcome.fame}</span>`);
    if(outcome.morale)deltas.push(`<span class="delta ${outcome.morale>=0?"pos":"neg"}">士氣 ${outcome.morale>=0?"+":""}${outcome.morale}</span>`);
    if(typeof outcome.jb==="number"&&outcome.jb)deltas.push(`<span class="delta ${outcome.jb>=0?"pos":"neg"}">氣勢 ${outcome.jb>=0?"+":""}${Math.round(outcome.jb*100)}%</span>`);
    const good=tier(roll)==="high", bad=tier(roll)==="low";
    $("#jrollcap").innerHTML=`擲出 <b class="oswald" style="color:var(--gold);font-size:18px">${roll}</b>`;
    const oc=document.createElement("div");
    oc.className="outcome "+(good?"good":bad?"bad":"");
    oc.innerHTML=`<div class="ot">${outcome.text}</div>${deltas.length?`<div class="deltas">${deltas.join("")}</div>`:""}`;
    panel.appendChild(oc);
    refreshHUD();
    setAction([{t:"進入比賽 ▶",cls:"gold",fn:jonesAdvance}]);
  },850);
}

/* ---------- 生涯時間軸：把連續同隊的賽季合併成「效力時期」 ---------- */
function careerStints(){
  const h=G.seasonHistory||[];
  const stints=[];
  h.forEach(s=>{
    const last=stints[stints.length-1];
    if(last && last.team===s.team && last.league===s.league){
      last.endYear=s.year; last.seasons++;
      (s.awards||[]).forEach(a=>last.awards.push(a));
    }else{
      stints.push({team:s.team,league:s.league,stage:s.stage,
        startYear:s.year,endYear:s.year,seasons:1,awards:[...(s.awards||[])]});
    }
  });
  return stints;
}
/* ---------- 中華隊：把國際賽經歷整理成白/藍兩件球衣 ---------- */
function nationalStints(){
  const jones=G.jonesHistory||[];
  const intl=G.intlHistory||[];
  const medalOf=p=>{ if(!p)return null; if(/冠/.test(p))return "金牌"; if(/亞/.test(p))return "銀牌"; if(/季|殿|銅/.test(p))return "銅牌"; return null; };
  const grp={ white:{team:"中華白",white:true,years:[],hon:{}}, blue:{team:"中華藍",white:false,years:[],hon:{}} };
  const add=(g,n)=>{ g.hon[n]=(g.hon[n]||0)+1; };
  // 瓊斯盃：用 jonesHistory 的 team 精準歸屬藍/白
  jones.forEach(j=>{
    const g=(j.team==="中華白")?grp.white:grp.blue;
    g.years.push(j.year);
    const m=medalOf(j.place); if(m) add(g,m);
    if(j.mvp) add(g,"瓊斯盃MVP"); else if(j.bestFive) add(g,"瓊斯盃最佳五人");
  });
  // 一般國際賽（非瓊斯盃）一律 senior → 中華藍配色
  intl.filter(r=>!/瓊斯盃|中華白|中華藍/.test(r.event||"")).forEach(r=>{
    grp.blue.years.push(r.year);
    const m=medalOf(r.place); if(m) add(grp.blue,m);
    if(r.mvp) add(grp.blue,"賽會MVP");
  });
  const H_ORDER=["金牌","銀牌","銅牌","賽會MVP","瓊斯盃MVP","瓊斯盃最佳五人"];
  const H_MAJOR=new Set(["金牌","賽會MVP","瓊斯盃MVP"]);
  const rank=a=>{const i=H_ORDER.indexOf(a);return i<0?99:i;};
  const mk=g=>{
    if(!g.years.length) return null;
    const ys=[...g.years].sort((a,b)=>a-b);
    const yr=ys[0]===ys[ys.length-1]?`${ys[0]}`:`${ys[0]}~${ys[ys.length-1]}`;
    const honors=Object.keys(g.hon).sort((a,b)=>rank(a)-rank(b))
      .map(n=>({name:n+(g.hon[n]>1?` ×${g.hon[n]}`:""),major:H_MAJOR.has(n)}));
    return {team:g.team,white:g.white,yr,apps:g.years.length,honors};
  };
  const out=[]; const w=mk(grp.white),b=mk(grp.blue);
  if(w)out.push(w); if(b)out.push(b);
  return out;
}
// 中華隊球衣配色：白隊＝白底藍框、藍隊/其他國際賽＝藍底白框

function careerTimelineHTML(){
  const stints=careerStints();
  if(!stints.length) return "";
  // 榮譽排序權重（越前面越大）＋標金色的重量級榮譽
  const ORDER=["MVP","FMVP","冠軍","DPOY","ROTY","得分王","籃板王","助攻王",
    "年度一隊","年度二隊","年度三隊","最佳陣容","新秀一隊","新秀二隊","本土MVP","國內MVP","明星賽"];
  const MAJOR=new Set(["MVP","FMVP","冠軍","DPOY","得分王","年度一隊"]);
  const rank=a=>{const i=ORDER.indexOf(a);return i<0?999:i;};
  const retiredSet=new Set((G._jerseyTeams||[]).map(j=>j.league+"|"+j.team));
  const cards=stints.map(st=>{
    // 聚合同名榮譽並計次，過濾掉非榮譽的字串（復健/報銷）
    const map={};
    st.awards.forEach(a=>{ if(!a||/報銷|復健/.test(a))return; map[a]=(map[a]||0)+1; });
    const honors=Object.keys(map).sort((a,b)=>rank(a)-rank(b));
    const yr = st.startYear===st.endYear ? `${st.startYear}` : `${st.startYear}~${st.endYear}`;
    const honorHTML = honors.length
      ? honors.map(a=>`<div class="ct-h${MAJOR.has(a)?" gold":""}">${a}${map[a]>1?`<span class="x"> ×${map[a]}</span>`:""}</div>`).join("")
      : `<div class="ct-none">—</div>`;
    const retired=retiredSet.has(st.league+"|"+st.team);
    const retireTag = retired?`<div class="ct-retire">★ 退休球衣</div>`:"";
    return `<div class="ct-stint${retired?" ret":""}">
      <div class="ct-cap">${retireTag}</div>
      <div class="ct-jersey" style="${jerseyStyle(st.team)}">${G.jersey}</div>

      <div class="ct-yr"><b>${yr}</b> · ${st.seasons}季</div>
      <div class="ct-honors">${honorHTML}</div>
    </div>`;
  }).join("");
  // 中華隊分支（白/藍球衣）
  const NAT_MAJOR=new Set(["金牌","賽會MVP","瓊斯盃MVP"]);
  const natCards=nationalStints().map(s=>{
    const c=nationalColors(s.white);
    const honorHTML=s.honors.length
      ? s.honors.map(h=>`<div class="ct-h${h.major?" gold":""}">${h.name}</div>`).join("")

  }).join("");
  const natSep = natCards ? `<div class="ct-sep"><span>中華隊</span></div>` : "";
  return `<div class="panel">
    <div class="label">生涯時間軸 · CAREER TIMELINE</div>
