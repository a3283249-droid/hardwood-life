function makeContract(league,team,years,ovForPay,cType="normal"){
  const [lo,hi]=PAY[league]||[100,500];
  const t=clamp((ovForPay-58)/40,0,1.4);
  let base=lo+(hi-lo)*Math.pow(t,1.6);
  let mult=isNBAstar(league,ovForPay)?rnd(.9,1.3):rnd(.8,1.1);
  
  // 依照合約種類動態調整薪資倍率
  if (cType === "max") mult = rnd(1.15, 1.4); 
  else if (cType === "contender") mult = rnd(0.7, 0.85); // 降薪
  else if (cType === "veteran") mult = rnd(0.5, 0.7); 
  
  const heatPremium=1+clamp((Number(G&&G.fame)||0)-20,0,80)*.001; // 最多約 +8%，只作市場溢價
  let salary=Math.round(base*mult*heatPremium);
  salary=Math.max(lo,salary);
  return {league,team,years,yearsLeft:years,salary,cType};
}
function isNBAstar(lg,ov){return lg==="NBA"&&ov>=85;}
function ensureOfferSalary(offer,ovForPay){
  if(!offer)return offer;

  const ov=Number.isFinite(Number(ovForPay))?Number(ovForPay):((G&&G.attr)?overall():72);
  const years=Math.max(1,Number(offer.years)||1),cType=offer.cType||"normal";
  offer.salary=makeContract(offer.league,offer.team,years,ov,cType).salary;
  return offer;
}

/* 自由市場：更加擬真的多維度報價邏輯 */
function proOffers(ovArg){
  const ov=overall(), mv=marketValue();
  const eff=Math.round(mv + clamp((recentProd()-24)*.32,0,5));
  let targets=proTargetLeagues(eff).filter(lg=>mv >= (LEAGUE_STANDARD[lg]||0)-6);
  const draftRights=activeNbaDraftRights();
  const exclusiveNbaRights=!!(draftRights&&draftRights.status==="overseas-active");
  // NBA 特例：自由市場不能只靠 perfFloor 灌高身價跳進來，必須有真實 OVR 撐腰。
  // 若拒簽後去其他職業聯盟，NBA 簽約權仍屬原選中球隊，不能在一般自由市場收到其他 NBA 隊報價。
  targets=targets.filter(lg=>lg!=="NBA" || (!exclusiveNbaRights&&(ov>=88 || (G.league==="NBA" && G.madeNBA && mv>=80))));
  
  if(isPro()){
    const curRank=LEAGUE_RANK[G.league]||0;
    const notLower=targets.filter(lg=>(LEAGUE_RANK[lg]||0)>=curRank-1);
    if(notLower.length) targets=notLower;
  }
  const offers=[];
  const age = G.age;
  
  // 決定合約年限基準：年輕人長約，老將短約
  const getYears = (lg, isVet) => {
    if(isVet || age >= 34) return rint(1,2);
    if(age <= 25) return lg==="NBA"?rint(3,4):rint(2,3);
    return lg==="NBA"?rint(2,4):rint(1,3);
  };

  // 1. 母隊續約邏輯：考量士氣與戰績
  let resignChance = 1;
  if (G.morale < 40) resignChance -= 0.5; // 氣氛差，不想續
  if (G.lastReview && !G.lastReview.playoff) resignChance -= 0.3; // 戰績爛，不想留
  
  if(isPro() && mv>=(LEAGUE_STANDARD[G.league]||0)-6 && chance(clamp(resignChance, 0.2, 1))){
    let cType = "normal";
    let tag = "母隊續約";
    // 奪冠且氣氛好，球隊願意砸頂薪
    if (G.morale > 75 && G.lastReview && G.lastReview.champion) { cType = "max"; tag = "母隊頂薪留人"; }
    offers.push({type:"pro",league:G.league,team:G.team,years:getYears(G.league),resign:true,tag,cType});
  }
  
  // 2. NBA 已站穩腳跟：依市場地位產生 2–4 支不同 NBA 球隊競價。
  const nbaDemand=nbaFreeAgencyDemand();
  if(!exclusiveNbaRights && G.madeNBA && (G.league==="NBA" || targets.includes("NBA")) && (nbaDemand.established||nbaDemand.elite)){
    const wanted=nbaDemand.count;
    const used=new Set([G.team]);
    for(let i=0;i<wanted;i++){
      const cType=nbaDemand.elite?(i===0?"max":i===1?"contender":"normal"):(i===0?"normal":"contender");
      let team=teamForMarketIntent("NBA",cType==="contender"?"contender":cType==="max"?"best":"balanced",used), guard=0;
      while(used.has(team)&&guard++<40) team=teamForMarketIntent("NBA",cType==="contender"?"contender":"balanced",used);
      used.add(team);
      const tag=nbaDemand.elite?(i===0?"NBA 多隊競價 · 頂薪挖角":i===1?"NBA 爭冠強隊招募":"NBA 多隊競價"):(i===0?"NBA 多隊競價 · 先發承諾":"NBA 多隊競價 · 輪替角色");
      offers.push({type:"pro",league:"NBA",team,years:getYears("NBA",cType==="contender"),tag,cType});
    }
  }

  const seen=new Set();
  targets.forEach((lg,i)=>{
    if(seen.has(lg))return; seen.add(lg);
    if(lg==="NBA" && offers.some(o=>o.league==="NBA"&&!o.resign)) return;
    
    if(i===0) { 
      // 最高殿堂的報價，根據身價細分策略
      if(mv >= (LEAGUE_STANDARD[lg]||0) + 5) {
        const maxTeam=teamForMarketIntent(lg,"best",isPro()?G.team:null);
        offers.push({type:"pro",league:lg,team:maxTeam,years:getYears(lg),tag:"頂薪挖角",cType:"max"});
        // 老將巔峰期後，真的從世界歷史中的爭冠隊挑一支，而不是隨機球隊貼上「爭冠」標籤。
        if(age >= 28) offers.push({type:"pro",league:lg,team:teamForMarketIntent(lg,"contender",[isPro()?G.team:null,maxTeam].filter(Boolean)),years:getYears(lg, true),tag:"爭冠球隊（降薪）",cType:"contender"});
      } else {
        offers.push({type:"pro",league:lg,team:teamForMarketIntent(lg,"balanced",isPro()?G.team:null),years:getYears(lg),tag:"輪替陣容",cType:"normal"});
      }
    } else {
      // 降級聯盟的報價 (去較低聯盟通常會給核心地位與高薪)
      const tag = lg==="發展聯盟"?"🇺🇸 發展聯盟" : "主力核心";
      offers.push({type:"pro",league:lg,team:teamForMarketIntent(lg,"rebuild",isPro()?G.team:null),years:getYears(lg),tag,cType:"max"});
    }
  });
  
  // 拒簽後選擇海外／其他職業：NBA 仍只有原選中球隊有資格談。球員表現維持 NBA 水準時，
  // 原隊可以用 Draft Rights 專屬報價把人帶回來；這不是一般自由市場競價。
  if(exclusiveNbaRights && draftRights.team && (ov>=80 || mv>=82 || recentProd()>=24)){
    offers.push({type:"pro",league:"NBA",team:draftRights.team,years:ov>=88?rint(2,3):1,tag:"NBA Draft Rights · 原選秀球隊",cType:"normal",rightsOffer:true,source:"nbaDraftRights"});
  }

  // 生涯末期若一般 NBA 市場已關門，仍可給長年 NBA 老將一張底薪競爭名額；
  // 但這是系統救命 fallback，整個生涯最多只出現兩個不同休賽季。正常靠實力拿到的 NBA Offer 不受影響。
  if(G.madeNBA && G.league==="NBA" && age>=34 && nbaDemand.nbaSeasons>=5 && !offers.some(o=>o.league==="NBA") && canOfferVeteranLifeline()){
    offers.push({type:"pro",league:"NBA",team:teamForMarketIntent("NBA","contender",G.team),years:1,tag:"老將底薪 · 最後一搏",cType:"vetmin",salary:veteranMinimum(age)});
    recordVeteranLifelineOffer(G.year);
  }

  const uniq=[];const key=new Set();
  offers.forEach(o=>{
    const k=o.league+"|"+o.team+"|"+o.resign;
    if(!key.has(k)){
      key.add(k);
      // ★ 關鍵修正：在產生報價時直接固定薪水寫入物件，避免 UI 與實際簽約不同步
      if(o.cType!=="vetmin") o.salary = makeContract(o.league, o.team, o.years, ov, o.cType).salary;
      uniq.push(o);
    }
  });
  
  // 排序：母隊續約優先；若玩家原本就在 NBA，NBA 合約（含老將底薪）必須排在海外報價前，避免最後機會被 slice 掉。
  uniq.sort((a,b)=>{
    if(a.resign && !b.resign) return -1;
    if(!a.resign && b.resign) return 1;
    if(G.league==="NBA" && a.league!==b.league){
      if(a.league==="NBA") return -1;
      if(b.league==="NBA") return 1;
    }
    return (b.salary||0)-(a.salary||0);
  });
  return applyFavoriteNbaTeamPreference(uniq.slice(0,5),G,_rng);
}
/* ---------- 選秀計算 ---------- */
function draftPick(league, ps){

/* ---------- NBA 選秀 / Draft Combine 專屬 ---------- */

function shuffleWithRng(arr,rngFn=_rng){

function nbaDraftStoryTier(pick){
  if(pick===1)return {key:"first",title:"狀元之夜",tag:"NO. 1 OVERALL PICK",emoji:"👑"};
  if(pick<=5)return {key:"top5",title:"前五順位 · 天之驕子",tag:"TOP 5 PICK",emoji:"🌟"};
  if(pick<=14)return {key:"lottery",title:"樂透區 · 聚光燈下的新星",tag:"LOTTERY PICK",emoji:"🎰"};
  if(pick<=30)return {key:"round1",title:"首輪上岸 · 正式踏進 NBA",tag:"FIRST ROUND",emoji:"🎟️"};
  if(pick<=45)return {key:"round2early",title:"次輪前段 · 等待後被叫到名字",tag:"SECOND ROUND",emoji:"📞"};
  if(pick<=60)return {key:"round2late",title:"次輪末段 · 最後一張入場券",tag:"LATE SECOND ROUND",emoji:"🔥"};
  return null;
}
function combineBiasedDie(attrScore,rngFn=_rng){
  const score=clamp(attrScore,20,99);
  const raw=1+Math.floor(rngFn()*6);
  const shift=score>=90?2:score>=75?1:score<45?-1:0;
  return clamp(raw+shift,1,6);
}
function combineAttrScore(key,g=G){
  const a=g.attr;
  if(key==="vertical") return clamp(a.athletic*.78+a.rebound*.22,20,99);
  if(key==="sprint") return clamp(a.athletic*.9+a.iq*.1,20,99);
  if(key==="agility") return clamp(a.athletic*.46+a.defense*.32+a.iq*.22,20,99);
  if(key==="bench"){
    const size=clamp((g.weight-72)*1.05,0,25);
    return clamp(a.athletic*.6+a.rebound*.2+size,20,99);
  }
  if(key==="shooting") return clamp(a.three*.5+a.shooting*.38+a.iq*.12,20,99);
  return 50;
}
function combineBodyEffects(g=G){
  const p=bodyProfile({height:g.height,weight:g.weight,wingspan:g.wingspan},g.pos);
  const posReach={PG:0,SG:0,SF:1,PF:2,C:3}[g.pos]||0;
  // Combine 仍以能力值為主；身材只做小幅修正，避免單靠尺寸碾壓體測。
  // Standing Reach 使用身高 + 臂展相對位置，長臂會直接反映在最高摸高。
  const standingReachCm=round(g.height*1.27+posReach+p.reachN*4,0);
  return {
    profile:p,
    standingReachCm,
    quality:{
      vertical:round(p.reachN*2.5+p.heightN*1.0,1),
      sprint:round(-p.heightN*1.4-p.weightN*2.4,1),
      agility:round(p.reachN*1.6-p.heightN*1.2-p.weightN*1.8,1),
      bench:0,
      shooting:round((p.shooting-1)*28,1),
    }
  };
}
function combineRankFromQuality(q,rngFn=_rng,fieldSize=75){
  const noise=(rngFn()-.5)*8;
  return clamp(Math.round(fieldSize+1-q*.72+noise),1,fieldSize);
}
const NBA_COMBINE_TESTS=[
  {key:"vertical",name:"最高摸高／垂直彈跳",desc:"爆發力、起跳高度與籃板能力",unit:"",better:"high"},
  {key:"sprint",name:"四分之三球場衝刺",desc:"全速加速與直線速度",unit:"秒",better:"low"},
  {key:"agility",name:"禁區敏捷度測試",desc:"變向、橫移、防守腳步與反應",unit:"秒",better:"low"},
  {key:"bench",name:"臥推測試",desc:"上肢力量與對抗基礎",unit:"下",better:"high"},
  {key:"shooting",name:"投籃測試",desc:"25 球定點／移動綜合投射",unit:"/25",better:"high"},
];
function simulateNbaCombine(rngFn=_rng){
  const fieldSize=75;
  const bodyFx=combineBodyEffects(G);
  const tests=NBA_COMBINE_TESTS.map(meta=>{
    const attrScore=combineAttrScore(meta.key,G);
    const die=combineBiasedDie(attrScore,rngFn);
    const skillQuality=clamp(attrScore*.72+(die/6)*28,20,100);
    const bodyMod=Number(bodyFx.quality[meta.key]||0);
    const quality=clamp(skillQuality+bodyMod,20,100);
    let value, display, extra="", touchCm=null;
    if(meta.key==="vertical"){
      // 臂展影響 Standing Reach / 最高摸高，但不憑空增加垂直彈跳英吋數。
      const inches=round(22+skillQuality*.23,1);
      const reach=bodyFx.standingReachCm;
      const touch=round(reach+inches*2.54,0);
      touchCm=touch; value=inches; display=`${touch} cm`; extra=`Standing Reach ${reach} cm · Max Vert ${inches} in`;
    }else if(meta.key==="sprint"){
      value=round(3.68-quality*.0064,2); display=`${value.toFixed(2)} 秒`;
    }else if(meta.key==="agility"){
      value=round(12.75-quality*.022,2); display=`${value.toFixed(2)} 秒`;
    }else if(meta.key==="bench"){
      value=clamp(Math.round((quality-30)/4.2),0,24); display=`${value} 下`;
    }else{
      value=clamp(Math.round(6+quality*.19),6,25); display=`${value}/25`;
    }
    const rank=combineRankFromQuality(quality,rngFn,fieldSize);
    return {...meta,attrScore:round(attrScore,1),die,skillQuality:round(skillQuality,1),bodyMod:round(bodyMod,1),quality:round(quality,1),value,touchCm,display,extra,rank};
  });
  const score=round(tests.reduce((sum,t)=>sum+t.quality,0)/tests.length,1);
  const overallRank=combineRankFromQuality(score,rngFn,fieldSize);
  const stockDelta=overallRank<=5?-5:overallRank<=15?-3:overallRank<=30?-1:overallRank<=50?0:overallRank<=65?2:4;
  return {fieldSize,tests,score,overallRank,stockDelta};
}
function nbaCombineStockText(d){
  if(!d)return "";
  if(d.stockDelta<=-5)return "體測轟動全場：預估選秀順位可大幅提前約 5 位。";
  if(d.stockDelta<=-3)return "體測明顯加分：預估順位可提前約 3 位。";
  if(d.stockDelta<0)return "體測小幅加分：預估順位可提前約 1 位。";
  if(d.stockDelta===0)return "體測符合預期：原有 Big Board 評價大致維持。";
  if(d.stockDelta<=2)return "部分項目失常：預估順位可能下滑約 2 位。";
  return "體測表現低於預期：球隊疑慮增加，預估順位可能下滑約 4 位。";
}

function collegeScoutingHistory(g=G){
  const rows=(g.seasonHistory||[]).filter(s=>s&&s.stage==="大學");
  return rows.map((s,i)=>({
    label:`大${["一","二","三","四","五","六"][i]||i+1}`,
    year:s.year,team:s.team,league:s.league,gp:s.gp,ppg:s.ppg,rpg:s.rpg,apg:s.apg,
    spg:s.spg,bpg:s.bpg,fg:s.fg,tp:s.tp,awards:(s.awards||[]).slice()
  }));
}
function _scoutSorted(cands,limit=3){
  const seen=new Set(), out=[];
  cands.sort((a,b)=>b.score-a.score);
  for(const c of cands){if(!c||!c.text||seen.has(c.text))continue;seen.add(c.text);out.push(c.text);if(out.length>=limit)break;}
  return out;
}

function scoutingDraftProjection(g=G){
  const lastCollege=[...(g.seasonHistory||[])].reverse().find(s=>s&&s.stage==="大學");
  let board=g._draftEntryBoard||g._collegeRank||(lastCollege&&lastCollege.usRank)||null;
  const delta=(g._combineData&&Number(g._combineData.stockDelta))||0;
  if(board) board=Math.max(1,Math.round(board+delta));
  if(board){
    if(board<=14)return {board,text:`樂透區（約 #${Math.max(1,board-2)}–${Math.min(14,board+2)}）`};
    if(board<=30)return {board,text:`首輪中後段（約 #${Math.max(15,board-3)}–${Math.min(30,board+3)}）`};
    if(board<=45)return {board,text:"首輪邊緣／次輪前段"};
    if(board<=60)return {board,text:"次輪區間"};
    return {board,text:"落選／發展聯盟觀察區"};
  }
  if(g._draftEntryStage==="高中"&&(g._finalHsStars||0)>=5){
    const r=g._hsRecruitRank||30;
    return {board:null,text:r<=5?"前 5 順位討論":r<=15?"樂透區討論":"首輪中後段討論"};
  }
  return {board:null,text:"尚無穩定共識"};
}

}

function applyCombinePickDelta(pick,minPick,maxPick){
  const delta=G._combineData?G._combineData.stockDelta:0;
  return clamp(Math.round(pick+delta),minPick,maxPick);
}

/* ---------- 賽季啟動：先進入「能力加點」，再進入事件 ---------- */
function startSeason(){
  // 生涯中後期：跨入新的下滑階段時，先播放劇情卡，再進季前特訓
  if(G._declineCard){ G.phase="decline"; render(); return; }
  beginAllocate();
}
function beginAllocate(){
  let sp=computeSP();
  const earnedBonus=G._pendingSP||0; G._pendingSP=0;
  const offerBonus=G.stage==="大學"?Math.max(0,Number(G._collegeOfferSpBonus)||0):0;
  const bonus=earnedBonus+offerBonus;
  sp+=bonus; G._spBonus=bonus;
  const add={};ATTR_KEYS.forEach(k=>add[k]=0);
  G._alloc={base:{...G.attr}, add, sp, spLeft:sp, bonus,earnedBonus,offerBonus};
  G.lastAttr={...G.attr};
  G.phase="allocate"; render();
}
function afterDeclineCard(){ G._declineCard=null; startSeason(); }
function computeSP(){
  const age=G.age;
  let base = age<=17?6 : age<=19?6 : age<=22?5 : age<=25?4 : age<=28?3 : age<=31?3 : 2;
  // 士氣高、健康好會略增訓練效率
  base += (G.morale>=75?1:0) + (G.health>=80?1:0);
  return base + rint(0,2);
}
function allocCost(cur,state=G){ // 升 1 點所需訓練點：越高越貴；超過潛力後極貴（潛力決定天花板）
  let c = cur<65?1 : cur<78?2 : cur<88?3 : 4;
  const potential=Number(state&&state.potential)||99;
  if(cur>=potential) c = c*2 + 1;
  return c;
}
function beginTraining(){
  // 準備本季事件（依聯盟條件過濾、不重複），並為每個事件加入專屬高風險選項
  let pool=EVENTS[eventPoolKey()].slice().filter(e=>(!e.cond || e.cond(G.league)) && eventEligibleForCareerStage(e,G));
  if(!pool.length)pool=EVENTS[eventPoolKey()].slice().filter(e=>!e.cond || e.cond(G.league));
  const full=pool.slice();
  const n=4; const evs=[];

  // === 新增：華裔球員 16歲(高二) 必定觸發籃協越洋徵召事件 ===
  if (G.background === "asian_american" && G.age === 16 && G._canPlayForTaiwan === undefined) {
    evs.push({
      t: "來自家鄉的越洋電話", noRisk: true, 
      x: "你在 AAU 的高光影片在台灣社群瘋傳，台灣籃協理事長親自打給你：「孩子，我們查到你有台灣血統，願意取得護照，未來替中華隊打球嗎？」",
      o: [
        { l: "答應徵召！披上中華隊戰袍", i: "🇹🇼", h: "解鎖中華隊路線", f: r => {
            G._canPlayForTaiwan=true;G.nationalPath="taiwan";
            return mk("你正式取得台灣護照，也把成年國家隊目標放在中華隊。台灣新聞連放三天頭條！",{}, {fame:15,morale:10,title:"taiwanSon"});
          }
        },
        { l: "婉拒邀請，目標美國夢幻隊", i: "🇺🇸", h: "衝潛力上限，永久關閉中華隊路線", f: r => {
            G._canPlayForTaiwan=false;G.nationalPath="usa";
            return mk("你尊重那份邀請，但決定挑戰 USA Basketball。這不是一張保證入選的門票，而是一條更窄、更競爭的路。",{iq:1},{pot:2,fame:-5,title:"usaPath"});
          }
        },
        { l: "交給經紀人處理", i: "💼", h: "保留未來機會", f: r => {
            return mk("經紀人幫你擋下追問，表示目前專注於學業與比賽。", { iq: 1 });
          }
        }
      ]
    });
  }
  // ==============================================================
  // 潛力追趕機制：低潛力、年輕球員更容易遇到一次「重新打開天花板」的契機。
  // 只加權事件出現率，不保證骰點成功；高潛力球員的出現率會自然下降。
  if(evs.length<n && chance(potentialBreakthroughChance())){
    const pCandidates=pool.map((e,i)=>({e,i})).filter(x=>x.e.potentialEvent);
    if(pCandidates.length){
      const chosen=pick(pCandidates);
      const base=pool.splice(chosen.i,1)[0];
      evs.push(base.noRisk ? {t:base.t,x:base.x,o:base.o,potentialEvent:true} : withRiskOption(base));
    }
  }
  // 讓迴圈補滿剩下的事件數量 (i 從 evs.length 開始，確保總數還是 4 個)
  for(let i=evs.length; i<n; i++){ 
    if(!pool.length) pool=full.slice();
    const idx=rint(0,pool.length-1); const base=pool.splice(idx,1)[0];
    evs.push(base.noRisk ? {t:base.t,x:base.x,o:base.o} : withRiskOption(base)); 
  }
  
  G.seasonEvents=evs; G.eventIdx=0; G.phase="training"; G.lastAttr={...G.attr};
  G._memInjury=null;
  G._seasonMods={winBoost:0, champBoost:0, tourneyBoost:0, playoffForce:false, playoffOut:false, recruitMove:0, boardMove:0, draftStockAdj:0};
  render();
}

function riskThemeFor(ev){

function sanitizeOutcomeForRoll(outcome,roll){
  if(!outcome||!outcome.attr)return outcome;
  // 高骰代表選項執行成功：技能屬性不應因資料分支寫錯而倒扣。
  // 若設計上真的要「成功但犧牲某項技能」，事件需明確標記 allowHighRollAttrLoss:true。
  if(roll>=5 && !outcome.allowHighRollAttrLoss){
    for(const k of Object.keys(outcome.attr)){
      if(Number(outcome.attr[k])<0) outcome.attr[k]=0;
    }
  }
  return outcome;
}

function applyEffects(e){
  if(e.attr) for(const k in e.attr){ if(!(k in G.attr)) continue;
    let d=e.attr[k];
    if(d>0){
      const cap=developmentCap(k,G);
      if(G.attr[k]>=cap-1)d=(_rng()<.35?1:0);
      // 舊角色若目前已經超過新版開發上限，不會被強制往下拉。
      const actualCap=Math.max(G.attr[k],cap);
      const nv=clamp(G.attr[k]+d, 15, actualCap);
      
      d=nv-G.attr[k]; G.attr[k]=nv;
    } else {
      const nv=clamp(G.attr[k]+d,15,99); d=nv-G.attr[k]; G.attr[k]=nv;
    }
    e.attr[k]=d; // 反映實際套用值，供 UI 顯示（潛力已滿時可能顯示較少或 0）
  }
  if(e.health) G.health=clamp(G.health+e.health,0,100);
  if(e.money){const commercial=e.money>0&&e.fame>0?heatCommercialMultiplier(G):1;G.money+=Math.round(e.money*commercial);}
  if(e.morale) G.morale=clamp(G.morale+(e.morale||0),0,100);
  if(e.fame)addHeat(e.fame);
  if(e.pot){
    const beforePot=G.potential;
    G.potential=clamp(G.potential+e.pot,15,99);
    e.pot=G.potential-beforePot; // UI 顯示實際變化，99 封頂時不會誤報
  }
  if(e.injure) G._memInjury=e.injure; // "season" | "career"
  if(e.title) grantTitle(e.title);
  // 排名／選秀行情效果：事件文字說「排名上升」時，遊戲數值也真的跟著移動。
  if(G._seasonMods){
    if(e.recruitMove) G._seasonMods.recruitMove += e.recruitMove; // 負值＝高中招募順位往前
    if(e.boardMove) G._seasonMods.boardMove += e.boardMove;       // 負值＝大學 Big Board 往前
    if(e.draftStockMove) G._seasonMods.draftStockAdj += e.draftStockMove; // 正值＝選秀行情加分
  }
  // 影響戰績/季後賽/賽會的效果（不只加能力值）
  if(G._seasonMods){
    if(e.win) G._seasonMods.winBoost += e.win;
    if(e.champ) G._seasonMods.champBoost += e.champ;
    if(e.tourney) G._seasonMods.tourneyBoost += e.tourney;
    
    // --- 新增：強制錦標賽晉級與淘汰機制 ---
    if(e.tourneyMin !== undefined) G._seasonMods.tourneyMinIdx = e.tourneyMin;
    if(e.tourneyMax !== undefined) G._seasonMods.tourneyMaxIdx = e.tourneyMax;
    // ----------------------------------
    
    if(e.playoff) G._seasonMods.playoffForce = true;
    if(e.playoffOut) G._seasonMods.playoffOut = true;
  }
  if(e.transfer){ // 真正轉學：換一所同級的學校
    const lvl = e.transfer===true ? (G.stage==="高中"?"高中":G.league) : e.transfer;
    const nt=schoolPick(lvl, G.team);
    if(nt && nt!==G.team){ G._transferredTo=nt; G.team=nt; }
  }
}

function applyInjuryGamesMissed(s,injury,fullGp=leagueGP(s.league),rngFn=_rng){
  if(!s||!injury)return s;
  const baseGp=Math.max(1,Number(s.gp)||fullGp||1);
  let lo,hi;
  if(injury.career){ lo=Math.max(10,Math.round(fullGp*.42)); hi=Math.max(lo,Math.round(fullGp*.78)); }
  else if(injury.major){ lo=Math.max(8,Math.round(fullGp*.24)); hi=Math.max(lo,Math.round(fullGp*.56)); }
  else { lo=Math.max(1,Math.round(fullGp*.04)); hi=Math.max(lo,Math.round(fullGp*.14)); }
  const u=clamp(Number(rngFn()),0,.999999);
  let missed=Math.round(lo+(hi-lo)*u);
  missed=clamp(missed,1,Math.max(1,baseGp-1));
  s.gp=Math.max(1,baseGp-missed);
  injury.gamesMissed=missed;
  injury.gamesPlayed=s.gp;
  const pct=s.winPct||0; s.w=Math.round(s.gp*pct); s.l=s.gp-s.w;
  s.availabilityNote=`${injury.major?"傷病":"小傷"}影響，缺席約 ${missed} 場`;
  return s;
}

function _respectForcedPostseason(s,standings){
  const limit=_postseasonEntryLimit(s.league),mods=G._seasonMods||{};if(!limit||!mods.playoffForce)return standings;
  const row=standings.find(r=>r.team===s.team);if(!row||row.seed<=limit)return standings;
  const cutoff=standings[Math.min(limit-1,standings.length-1)];
  const targetWins=Math.min(Number(s.gp)||leagueGP(s.league),Math.max(Number(row.w)||0,(Number(cutoff.w)||0)+1));
  row.w=targetWins;row.l=Math.max(0,row.gp-targetWins);row.winPct=row.gp?row.w/row.gp:0;
  s.teamW=row.w;s.teamL=row.l;s.teamWinPct=row.winPct;s.w=row.w;s.l=row.l;s.winPct=row.winPct;
  standings.sort((a,b)=>b.w-a.w||b.winPct-a.winPct||b.strength-a.strength||a.team.localeCompare(b.team));standings.forEach((r,i)=>r.seed=i+1);
  return standings;
}

function seasonInjuryCheck(){
  const age=G.age;
  // 由事件觸發的強制受傷（如地貼滑倒賽季報銷）
 if(G._memInjury){
    const forced=G._memInjury; G._memInjury=null;
    if(forced === "drunk_driving") {
      return {major: true, career: true, forcedEnd:true, part:"", emoji:"🚔", sevLabel:"生涯告終",
              text: "【生涯告終】你因為酒駕被逮，球團祭出重罰開除，永不錄用！你的籃球生涯就此身敗名裂。"};
    }
    ATTR_KEYS.forEach(k=>{const fast=(k==="athletic"||k==="defense")?1.6:1;
      G.attr[k]=clamp(Math.round(G.attr[k]-rnd(2,5)*fast),15,99);});
    G.health=clamp(G.health-rnd(25,45),5,100);
    const career=forced==="career"&&isPro();
    const inj=pickInjury(career?"career":"major");
    return Object.assign(inj,{major:true,career});
  }
  // ---- 連續受傷機率：健康值越低、年齡越大，受傷率越高 ----
  const hLow = (100 - clamp(G.health,0,100)) / 100;   // 0（滿血）→ 1（瀕危）
  const ageF = Math.max(0, age-30);
  const pMajor = clamp(.02 + hLow*.20 + ageF*.014, .02, .40);   // 重傷
  const pMinor = clamp(.14 + hLow*.30 + ageF*.010, .14, .55);   // 輕傷

  if(chance(pMajor)){
    // 是否為毀滅性生涯大傷（僅職業；健康越低、年紀越大越可能）
    const careerRisk = clamp(.08 + ageF*.05 + hLow*.18, .05, .78);
    const career = isPro() && chance(careerRisk);
    const inj = pickInjury(career?"career":"major");
    const heavy = career?1.5:1;
    ATTR_KEYS.forEach(k=>{const fast=(k==="athletic"||k==="defense")?1.6:1;
      G.attr[k]=clamp(Math.round(G.attr[k]-rnd(2,6)*fast*heavy),15,99);});
    G.health=clamp(G.health-rnd(career?30:20, career?55:45),5,100);
    return Object.assign(inj,{major:true, career});
  }
  if(chance(pMinor)){
    const inj = pickInjury("minor");
    G.health=clamp(G.health-rnd(6,16),15,100);
    return Object.assign(inj,{major:false, career:false});
  }
  // 沒受傷 → 自然恢復健康
  G.health=clamp(G.health+rnd(4,10),0,100);
  return null;
}

      // 關鍵：最少留 1 年給原有的 afterReview 去扣，藉此完美銜接觸發自由市場
      if (isPro() && G.contract) {

    }
    // 存下結果，讓切頁回來也只會看到結果
    G._surgeryResult={roll, cls, text, deltas, fail};
    G._surgeryDone=true;
    if(G.phase==="surgery") render(); // 若仍在手術頁 → 重繪出結果與正確底部按鈕
    else refreshHUD();                // 若已切到別頁（如數據總表）→ 只更新 HUD，狀態已保存
  },1500);

function skipSurgery(){

/* ---------- 治療手術：健康過低時，於賽季回顧付費恢復健康 ---------- */
function electiveSurgery(){
  if(G._electiveDone)return;
  const pro=isPro();
  // 費用：職業球員自付（依需恢復量計價，單位：萬），業餘由家人資助免費
  const need=100-G.health;
  const cost=pro?clamp(Math.round(40+need*4),40,900):0;
  if(pro && G.money<cost){ toast("資金不足，付不起手術與復健費用…"); return; }
  if(pro) G.money-=cost;
  const heal=rint(28,44);
  G.health=clamp(G.health+heal,0,100);
  G._electiveDone=true;
  render();
  toast(pro?`接受手術治療，花費 ${fmtMoney(cost)}，健康回升。`:"家人湊錢讓你接受治療，健康回升。");
}

/* 50 歲是最後一個可完整出賽的球季；該季回顧完成後退休，不開啟 51 歲球季。 */
function isAgeLimitRetirementDue(){ return G.stage==="pro" && G.age>=50; }

/* ---------- 賽季回顧後 → 進入休賽期流程 ---------- */
function afterReview(){
  // 建立休賽期待辦
  const q=[];
  const s=G.lastReview;
  // 毀滅性生涯大傷 → 先進入「手術抉擇」畫面（酒駕等強制結束除外）
  if(s.injury&&s.injury.career&&!s.injury.forcedEnd&&!G._surgeryDone){
    G.phase="surgery"; render(); return;
  }
  // 手術失敗／放棄手術／酒駕等 → 生涯結束
  if(s.injury&&s.injury.career){ if(!G.retireReason) G.retireReason="生涯重傷，忍痛退役"; return endCareer(); }
  // 50 歲球季可以完整打完；回顧結束後立即謝幕，避免任何合約／自由市場流程把年齡推到 51。
  if(isAgeLimitRetirementDue()){
    G._ageLimitRetire=true;
    G.retireReason="完成 50 歲球季後，依生涯年齡上限正式退休";
    return endCareer();
  }
  // 華裔選擇 USA 路線後，依履歷逐級觸發 Junior / Select / Player Pool / Final 12。
  if(pendingUsaBasketball())q.push("usaBasketball");
  // 瓊斯盃（每年夏季的沉浸式賽事）
  if(pendingJones())q.push("jones");
  // 其他國際賽（亞洲盃／亞運／世界盃等）
  if(pendingIntl()) q.push("intl");
  // 階段轉換
  if(G.stage==="高中"){
    // 👇 新增判斷：華裔打美國高中是 4 年制，本土是 3 年制
    const maxGrade = G.background === "asian_american" ? 4 : 3;
    if(G.grade >= maxGrade) q.push("hsDecision"); else q.push("advanceHS");
  } else if(G.stage==="大學"){
    q.push("collegeDecision");
  } else { // 職業
    // 首輪新秀 2+1+1：打完前兩季後，第三年與第四年開始前由球隊決定是否執行選項。
    const optionYear=rookieOptionDue(G.contract);
    if(optionYear && G._rookieOptionHandledYear!==G.year){
      G._rookieOptionCard=Object.assign(evaluateRookieTeamOption(s,optionYear),{team:G.team,pick:G.contract.draftPick});
      G.phase="rookieOption"; render(); return;
    }
    // 已簽的新秀延長合約在第 4 季打完後直接接續生效；不先進自由市場，也不把新合約誤扣一年。
    const extensionActivation=activatePendingRookieExtensionIfDue(s);
    if(extensionActivation.roseTriggered) q.push("roseRule");
    // 釋出檢定：能力明顯低於聯盟水準線 → 有機率被球隊釋出（需重找下家，找不到就退休）
    const ov=overall(), std=LEAGUE_STANDARD[G.league]||60, mv=marketValue();
    let waived=false;
    const justExercised=(G._rookieOptionJustExercisedYear===G.year);
    if(!extensionActivation.activated && G.contract && !justExercised && !isRookieGuaranteedPeriod(G.contract) && mv < std-3){
      const gap=std-3-mv;
      const poorSeason = s.seasonScore<40;
      const wChance=clamp(.16 + gap*.08 + (poorSeason?.15:0), .16, .9);
      if(chance(wChance)){ waived=true; }
    }
    if(waived){ G._waived=true; G.contract=null; }
    else if(G.contract && !extensionActivation.activated) G.contract.yearsLeft--;
    if(justExercised) G._rookieOptionJustExercisedYear=null;
    const contractDone = waived || !G.contract || G.contract.yearsLeft<=0;
    if(contractDone){
      // 合約到期（或被釋出）才是「老將十字路口」的時機，且排在自由市場之前
      if(isPro()&&G.age>=35) q.push("retireOption");
      q.push("freeAgency");
    } else {
      // 合約還在（多年約）：不會被要求退休，也不會吃掉剩餘年限
      if(overseasJumpAvailable()) q.push("overseasOffer");
      else if(G._tradeRumorProtectedYear!==G.year && chance(tradeRumorChance())) q.push("tradeRumor");
    }
  }
  q.push("nextSeason");
  G.offseason=q; processOffseason();
}
/* 角色球員球探報告：找出球員最頂尖、NBA 願意買單的「即戰專長」 */
function scoutRoleReport(){
  const a=G.attr;
  // 各專長的「NBA 即戰門檻」：達標才會被列入球探報告
  const specs=[
    {k:"defense", bar:83, tag:"鎖式防守"},
    {k:"three",   bar:84, tag:"外線投射"},
    {k:"rebound", bar:85, tag:"籃板卡位"},
    {k:"athletic",bar:85, tag:"運動能力"},
    {k:"iq",      bar:84, tag:"防守判讀"},
    {k:"pass",    bar:85, tag:"組織串聯"},
  ];
  const hit=specs.filter(s=>a[s.k]>=s.bar).sort((x,y)=>(a[y.k]-y.bar)-(a[x.k]-x.bar));
  if(!hit.length) return null;
  const top=hit.slice(0,2);
  return {
    keys: top.map(s=>s.k),
    labels: top.map(s=>ATTR_LABEL[s.k]),
    tags: top.map(s=>s.tag),
    margin: Math.max(...top.map(s=>a[s.k]-s.bar)), // 最突出專長超過門檻多少
  };
}

/* 海外報價：合約中、非最高聯盟、戰力/數據達標時，有機會收到往上一級的邀約 */
function overseasJumpAvailable(){
  if(!isPro())return false;
  const rank=LEAGUE_RANK;
  const cur=rank[G.league]||1; if(cur>=5)return false;
  const ps=prospectScore();
  // 發展聯盟是 NBA 的直接跳板：表現好就有機會被「call up」上 NBA，門檻較低、機率隨近期產出提升
  if(G.league==="發展聯盟"){
    const prod=recentProd(), ov=overall();
    // 路線一：統治級數據 → 明星型 call-up（能得分、能扛球隊）
    if(ov >= 84 && prod >= 26){
      const callChance = clamp(0.1 + (ov - 84) * 0.05 + (prod - 26) * 0.04, 0.1, 0.65);
      if(chance(callChance)){
        G._overseasTargets=["NBA"]; G._callUp=true; G._callUpRole=false; G._scoutReport=null;
        return true;
      }
    }
    // 路線二：角色球員 call-up（數據不漂亮，但某項 NBA 需要的專長頂尖）
    const rep=scoutRoleReport();
    if(rep && ov >= 78){
      // 專長越突出、整體越穩，被相中機率越高（但整體仍低於明星路線）
      const roleChance = clamp(0.05 + rep.margin*0.028 + (ov-78)*0.018, 0.05, 0.42);
      if(chance(roleChance)){
        G._overseasTargets=["NBA"]; G._callUp=true; G._callUpRole=true; G._scoutReport=rep;
        return true;
      }
    }
  }
  const targets=proTargetLeagues(Math.round(overall()*.5+ps*.5)).filter(l=>(rank[l]||0)>cur);
  if(!targets.length)return false;
  G._overseasTargets=targets; G._callUp=false; G._callUpRole=false; G._scoutReport=null; return chance(.5);
}
function processOffseason(){
  if(!G.offseason.length){ return; }
  const step=G.offseason.shift();
  switch(step){
    case "usaBasketball": return startUsaBasketball();
    case "jones": return startJonesCup();
    case "intl": return doIntl();
    case "advanceHS": decayHeat(); G.grade++; G.age++; G.year++; applyAging(); return processOffseason();
    case "hsDecision": return hsDecision();
    case "collegeDecision": return collegeDecision();
    case "freeAgency": return freeAgency();
    case "tradeRumor": return doTradeRumor();
    case "trade": return doTrade();
    case "overseasOffer": return doOverseasOffer();
    case "retireOption": return retireOption();
    case "roseRule": G.phase="roseRule"; render(); return;
    case "nextSeason": return advanceToNextSeason();
  }
}
function advanceToNextSeason(){
  // 防禦性檢查：正常流程會在 50 歲球季 afterReview 退休，這裡再阻止舊存檔／異常流程進入 51 歲球季。
  if(G.stage==="pro" && G.age>=50){
    G._ageLimitRetire=true;
    G.retireReason="完成 50 歲球季後，依生涯年齡上限正式退休";
    return endCareer();
  }
  // 進職業/大學後的一般年份推進（高中在 advanceHS 已處理）
  if(G.stage!=="高中"){ decayHeat(); G.age++; G.year++; applyAging(); }
  if(G.stage==="大學") G.collegeYears++;
  startSeason();
}

/* ---------- 高中畢業決策 ---------- */
function hsDecision(){
  const ov=overall();
  if(G._hsGraduationYear==null) G._hsGraduationYear=G.year;
  if(G.background==="asian_american"){
    const stars=G._finalHsStars||G._basePotentialLevel||3;
    G._finalHsStars=stars;
    G._hsRecruitRank=G._hsRecruitRank||hsRecruitRankFromStars(stars);
  }
  if (G.background === "asian_american" && G._finalHsStars && !G._hsStarTitleGranted) {
     G._hsStarTitleGranted = true;
     if (G._finalHsStars === 5) grantTitle("fiveStarRecruit");
     else if (G._finalHsStars === 4) grantTitle("fourStarRecruit");
     else grantTitle("threeStarRecruit");
  }
  G._hsOffers=collegeOffers(ov);
  G._canGoPro=true;
  G._proTargets=proTargetLeagues(ov).filter(lg=>lg!=="NBA");
  G.phase="hsDecision"; render();
}
function chooseCollege(offer){
  if(offer.league==="NCAA D1"||offer.league==="NCAA D2"){
    const stars=G._finalHsStars||G._basePotentialLevel||3;
    G._collegeEntryRank=collegeEntryRankFromStars(stars);
    G._collegeRank=G._collegeEntryRank;
  }
  const offerProfile=collegeOfferProfile(offer);
  applyCollegeOfferProfile(G,offerProfile);
  G._collegeOfferTag=offer.tag||"";
  G.stage="大學"; G.league=offer.league; G.team=offer.team; G.collegeYears=1;
  G.age++;G.year++;applyAging();
  toast(`加入 ${offer.team}（${lname(offer.league)}）｜${offerProfile.label}`);
  showCommitCard("college", offer);
}

/* ---------- 大學決策（可宣布投入職業） ---------- */
function collegeDecision(){
  const ov=overall();
  G._canGoPro=true; // 取消能力門檻：低於水準者也能參選（但很可能落選）
  G._proTargets=proTargetLeagues(draftStock());
  if(G.lastReview&&G.lastReview.usRank&&G.lastReview.usRank<=45&&!G._proTargets.includes("NBA")&&canEnterNbaDraft()) G._proTargets.unshift("NBA");
  if(!canEnterNbaDraft()) G._proTargets=G._proTargets.filter(lg=>lg!=="NBA");

/* ---------- V.2.0.18 · NBA 選秀資格 ---------- */
function nbaDraftEligibility(){
  const age=Number(G&&G.age)||0, year=Number(G&&G.year)||0;
  let grad=Number(G&&G._hsGraduationYear);
  // V.2.0.18 以前的進行中大學存檔沒有畢業年份欄位；依目前大學年級回推出高中畢業年，
  // 避免舊生涯更新後被永久鎖在 NBA 選秀資格之外。高中階段本身不做推估。
  if((!Number.isFinite(grad)||grad<=0) && G && G.stage==="大學" && (G.collegeYears||0)>=1){
    grad=year-Math.max(1,G.collegeYears||1);
    G._hsGraduationYear=grad; // 推估一次後寫回狀態，後續若進入 pro／holdout 仍能正確驗證 Subsequent Draft。
  }
  const hasGrad=Number.isFinite(grad)&&grad>0;
  const ageOk=age>=19;
  const yearOk=hasGrad && (year-grad)>=1;
  let reason="已符合 NBA 選秀資格";
  if(!hasGrad) reason="尚未完成高中畢業登記";
  else if(!ageOk) reason=`需年滿 19 歲（目前 ${age} 歲）`;
  else if(!yearOk) reason=`高中畢業後需至少滿一年（畢業：${grad}）`;
  return {eligible:hasGrad&&ageOk&&yearOk,ageOk,yearOk,graduationYear:hasGrad?grad:null,age,year,reason};
}
function canEnterNbaDraft(){ return nbaDraftEligibility().eligible; }

function isEarlyCollegeEntry(){ return G.stage==="大學" && (G.collegeYears||0)<=2 && !G._mustLeave && canEnterNbaDraft(); }
function earlyEntryDraftBonus(){
  const eligible=G._earlyEntryActive || (G.stage==="大學" && (G.collegeYears||0)<=2);
  if(!eligible)return 0;

  const awards=[...(s.awards||[]),...((s.tourney&&s.tourney.awards)||[]),
    ...(G.amateurAwards||[]).filter(a=>a&&a.year===year).map(a=>a.award)].filter(Boolean);

/* ---------- 進入職業：選秀宣告（可自選台灣聯盟，最多 3 個；海外依戰力自動接觸） ---------- */

/* NBA Draft Combine 邀請評估：現實 Combine 是邀請制，球隊意向是重要篩選。
   遊戲規則特別針對「本土出發」球員加一道門檻：沒有足夠球探興趣就無法進本作 NBA 選秀流程。 */
function evaluateNbaCombineInvite(p,rngFn=_rng){
  p=p||{};
  const background=p.background||"local";
  const ov=Number(p.ov)||0, potential=Number(p.potential)||0, prod=Number(p.prod)||0;
  const awards=Number(p.awards)||0, board=Number(p.board)||999, eliteTool=Number(p.eliteTool)||0;
  // 華裔／美國高中與 NCAA 主流招募路線沿用既有流程，不額外卡第二道門。
  if(background==="asian_american") return {invited:true,guaranteed:true,score:99,chance:1,tier:"mainstream"};

function evaluateUndraftedGLeaguePath(p){

  const board=Number(p&&p.board)||999;
  const ps=Number(p&&p.ps)||0;

  if(board<=45) score+=28;
  else if(board<=75) score+=22;
  else if(board<=100) score+=16;
  else if(board<=150) score+=9;
  if(ncaa) score+=6;
  score += clamp(awards*2.5,0,10);
  score += clamp((ps-72)*.8,0,10);
  if(combineRank<=15) score+=8;
  else if(combineRank<=30) score+=4;
  else if(combineRank>=65) score-=3;

  // 這個區間就是「NBA 不一定選，但發展聯盟很合理」的典型球員。
  if(ov>=75 && board<=100) return {eligible:true,guaranteed:true,chance:1,tier:"priority",score:round(score,1)};
  if(ov>=72 && ncaa && (board<=120 || awards>=1 || ps>=78)) return {eligible:true,guaranteed:awards>=2||board<=80,chance:.92,tier:"strong",score:round(score,1)};
  if(score>=42) return {eligible:true,guaranteed:false,chance:.78,tier:"watch",score:round(score,1)};
  if(score>=32) return {eligible:true,guaranteed:false,chance:.48,tier:"tryout",score:round(score,1)};
  return {eligible:false,guaranteed:false,chance:.12,tier:"longshot",score:round(score,1)};

  };

function nbaDraftPickFromProfile(ps){

  if(!canEnterNbaDraft()) return null;

    const r=G._hsRecruitRank||hsRecruitRankFromStars(5);

    return r<=5?applyCombinePickDelta(base,1,5):r<=15?applyCombinePickDelta(base,6,14):applyCombinePickDelta(base,15,30);

      const base=chance(firstChance)?rint(25,30):clamp(Math.round(bb+rnd(-1,7)),31,52);

  }else if(ask==="years"){

function careerContinuationProfile(s=lastSeason()){
  const ov=overall();
  const health=clamp(G.health||0,0,100);
  const prod=recentProd();
  const ss=(s&&s.seasonScore)||0;
  const gp=(s&&s.gp)||0;
  const floor=(LEAGUE_STANDARD["SBL"]||54)-6;
  const productionOK=prod>=14 || ss>=42 || (s&&s.ppg>=10);
  const abilityOK=ov>=floor;
  const bodyOK=health>=32;
  const emergencyStop=health<18 || (ov<floor-5 && prod<10 && ss<30) || (health<28 && ov<floor-2 && ss<36);
  const viable=!emergencyStop && bodyOK && (abilityOK || productionOK);
  return {ov,health,prod,seasonScore:ss,gp,abilityOK,productionOK,bodyOK,emergencyStop,viable};
}

   榮譽紀錄（含聯盟/年份）、里程碑、分聯盟評價、稱號、全美排名

function logAward(league,award,year){ G.awardLog=G.awardLog||[]; G.awardLog.push({league,award,year}); }

/*
 * 生涯榮譽唯一資料來源。
 * 新版以 awardLog 為主，再用 seasonHistory.awards / tourney.awards 補回舊存檔中
 * 「畫面計數有增加、詳細 log 卻漏記」的紀錄，最後才用 careerAwards 做總數兜底。
 * 這樣結算畫面、球員卡、下載結算圖不再各讀不同資料。
 */
function canonicalAwardEntries(){
  const out=[];
  const normYear=(year)=>{
    if(year===null || year===undefined || year==="")return null;
    const n=Number(year); return Number.isFinite(n)?n:null;
  };
  const keyOf=(league,award,year)=>`${league||"生涯"}|${award||""}|${year==null?"?":year}`;
  const counts={};
  const add=(league,award,year,recovered=false)=>{
    if(!award)return;
    const e={league:league||"生涯",award:String(award),year:normYear(year),recovered:!!recovered};
    out.push(e); const k=keyOf(e.league,e.award,e.year); counts[k]=(counts[k]||0)+1;
  };
  const ensure=(league,award,year,wanted,recovered=true)=>{
    const k=keyOf(league||"生涯",String(award||""),normYear(year));
    while((counts[k]||0)<wanted) add(league,award,year,recovered);
  };

  // 詳細紀錄是第一優先。
  (G.awardLog||[]).forEach(a=>add(a.league,a.award,a.year,false));

  // 舊存檔救援：每季 awards 其實仍保留玩家當季真正拿到的獎項。
  (G.seasonHistory||[]).forEach(s=>{
    const league=s.league||s.stage||"生涯", year=s.year;
    const seen={};
    (s.awards||[]).forEach(a=>{ const award=String(a); seen[award]=(seen[award]||0)+1; ensure(league,award,year,seen[award],true); });
    // 學生錦標賽的獎項有些版本只存在 tourney.awards。
    const tSeen={};
    ((s.tourney&&s.tourney.awards)||[]).forEach(a=>{ const award=String(a); tSeen[award]=(tSeen[award]||0)+1; ensure(league,award,year,tSeen[award],true); });
  });

  // 最後用 careerAwards 的聚合總數兜底。若舊檔連年份都缺失，就補到該獎項最常出現的聯盟，
  // 並標記 recovered，下載圖會顯示「舊存檔補登」而不捏造年份。
  const agg=G.careerAwards||{};
  Object.entries(agg).forEach(([award,targetRaw])=>{
    const target=Math.max(0,Number(targetRaw)||0); if(!target)return;
    const same=out.filter(e=>e.award===award && e.league!=="中華隊");
    let have=same.length; if(have>=target)return;
    const byLeague={}; same.forEach(e=>{byLeague[e.league]=(byLeague[e.league]||0)+1;});
    const fallback=Object.keys(byLeague).sort((a,b)=>byLeague[b]-byLeague[a])[0]||"生涯";
    while(have<target){ add(fallback,award,null,true); have++; }
  });
  return out;
}

function careerAwardCounts(){
  const base={...(G.careerAwards||{})};
  const detailed={};
  canonicalAwardEntries().forEach(e=>{
    if(e.league==="中華隊" || /^\d+分$/.test(e.award))return;
    detailed[e.award]=(detailed[e.award]||0)+1;
  });
  Object.entries(detailed).forEach(([k,v])=>{base[k]=Math.max(Number(base[k])||0,v);});
  return base;
}

// 依「聯盟＋獎項」聚合。畫面與下載圖都從 canonicalAwardEntries 取得同一份紀錄。
function groupedAwards(){
  const map={};
  canonicalAwardEntries().forEach(a=>{
    const k=a.league+"|"+a.award;
    const o=(map[k]=map[k]||{league:a.league,award:a.award,years:[],n:0,recovered:0,missingYears:0});
    o.n++; if(a.year!=null)o.years.push(a.year); else if(a.recovered)o.missingYears++; if(a.recovered)o.recovered++;
  });
  return Object.values(map).sort((a,b)=>{
    const ay=a.years.length?Math.min(...a.years):999999, by=b.years.length?Math.min(...b.years):999999;
    return ay-by || a.award.localeCompare(b.award,"zh-Hant");
  });
}
// 連續年份壓縮：[2028..2035,2038] → "2028~2035,2038"
function compressYears(years){
  const ys=[...new Set((years||[]).filter(y=>Number.isFinite(Number(y))).map(Number))].sort((a,b)=>a-b);
  const parts=[]; let i=0;
  while(i<ys.length){ let j=i; while(j+1<ys.length && ys[j+1]===ys[j]+1) j++;
    if(j-i>=2) parts.push(`${ys[i]}~${ys[j]}`); else for(let k=i;k<=j;k++) parts.push(""+ys[k]);
    i=j+1; }
  return parts.join(",");
}
function awardYearsLabel(gA){
  const yrs=compressYears(gA.years||[]);
  const missing=Math.max(0,gA.missingYears||0);
  if(yrs && missing>0)return `${yrs}；舊存檔補登×${missing}`;
  if(yrs)return yrs;
  if(gA.recovered)return `舊存檔補登×${gA.n}`;
  return "年份未記錄";
}

function checkMilestones(s){
  if(s.stage!=="pro")return;

  const lg=s.league;
  const before=G.leaguePts[lg]||0, after=before+Math.round(s.ppg*s.gp);
  G.leaguePts[lg]=after;
  [1000,3000,5000,10000].forEach(th=>{ if(before<th&&after>=th){
    G.milestones.push({league:lg,text:`${lname(lg)} ${th} 分`,year:s.year}); logAward(lg,`${th}分`,s.year);
  }});
  // 生涯抄截/阻攻/助攻里程碑（跨聯盟）
  G.careerCum=G.careerCum||{ast:0,stl:0,blk:0};
  const cb={ast:s.apg*s.gp,stl:s.spg*s.gp,blk:s.bpg*s.gp};
  ["ast","stl","blk"].forEach(k=>{const bf=G.careerCum[k],af=bf+cb[k];G.careerCum[k]=af;
    const th={ast:2500,stl:1000,blk:800}[k], lab={ast:"生涯 2500 助攻",stl:"生涯 1000 抄截",blk:"生涯 800 阻攻"}[k];
    if(bf<th&&af>=th){G.milestones.push({league:"生涯",text:lab,year:s.year});}});
}

const LEAGUE_LABELS={
  "NBA":["一日球員","板凳邊緣","輪替戰力","稱職先發","明星球員","當家球星","聯盟門面","傳奇巨星"],

function leagueEval(lg){
  const ss=G.seasonHistory.filter(s=>s.stage==="pro"&&s.league===lg);
  if(!ss.length)return null;
  const n=ss.length, gp=ss.reduce((a,s)=>a+s.gp,0);
  const scores=ss.map(s=>s.seasonScore||0).sort((a,b)=>b-a);
  const avgSS=scores.reduce((a,v)=>a+v,0)/n;            // 生涯平均（名人堂分數沿用，門檻不變）
  // 巔峰品質：取表現最好的約 60%（至少 3 季，或全部）平均，避免菜鳥季／傷季／暮年季稀釋輝煌生涯
  const primeN=clamp(Math.ceil(n*0.6), Math.min(3,n), n);
  const primeSS=scores.slice(0,primeN).reduce((a,v)=>a+v,0)/primeN;
  const qualitySS=primeSS*0.65 + avgSS*0.35;           // 綜合品質（標籤用，以巔峰為主）
  const la=(G.awardLog||[]).filter(a=>a.league===lg);
  const cnt=name=>la.filter(a=>a.award===name).length;
  const inc=sub=>la.filter(a=>a.award.includes(sub)).length;
  const mvp=cnt("MVP"), champ=cnt("冠軍"), allStar=cnt("明星賽");
  const localMvp=mvp+cnt("本土MVP")+cnt("國內MVP");     // 各聯盟 MVP 都算「分量」（僅供標籤，不影響名人堂分）
  const allNBA1=cnt("年度一隊"), allNBAany=inc("年度")+cnt("最佳陣容");
  const scoringTitles=cnt("得分王")+cnt("籃板王")+cnt("助攻王");
  const awardPts= mvp*70 + champ*40 + allNBA1*40 + cnt("年度二隊")*28 + cnt("年度三隊")*18
    + allStar*16 + inc("王")*16 + cnt("DPOY")*22 + cnt("ROTY")*14 + (inc("新秀")&&inc("隊"))*8;
  // 評價分（名人堂沿用）：維持以生涯平均為基準，門檻不受標籤改動影響
  const score=Math.round(clamp(avgSS-30,0,90)*5 + n*7 + awardPts);
  const labels=LEAGUE_LABELS[lg]||LEAGUE_LABELS["SBL"];
  const elite=(lg==="NBA"||lg==="日職 B.League"||lg==="CBL"||lg==="KRBL");
  const T = elite ? [44,56,66,78,88,100] : [40,52,62,72,82,92]; // 分界（略降頂層，讓真正的明星／門面可及）
  // (1) 品質級別：由巔峰加權品質決定
  let qIdx = qualitySS<T[0]?0 : qualitySS<T[1]?1 : qualitySS<T[2]?2 : qualitySS<T[3]?3 : qualitySS<T[4]?4 : qualitySS<T[5]?5 : 6;
  // (2) 榮譽級別：由實際成就決定，可往上抬（讓戰績輝煌者不被平均稀釋）
  let aIdx=0;
  if(allStar>=1 || allNBAany>=1 || scoringTitles>=1) aIdx=Math.max(aIdx,3);        // 有過明星/最佳陣容/單項王 → 至少稱職先發
  if(allStar>=2 || allNBAany>=1) aIdx=Math.max(aIdx,4);                             // 常態明星 → 明星球員
  if(allStar>=3 || localMvp>=1 || allNBA1>=1 || (champ>=1&&allStar>=2)) aIdx=Math.max(aIdx,5); // 有分量 → 當家球星
  if(localMvp>=1 && (allStar>=4 || allNBA1>=1 || champ>=1)) aIdx=Math.max(aIdx,6);  // 重大榮譽 → 聯盟門面
  if(mvp>=2 || (mvp>=1&&champ>=1) || allNBA1>=3) aIdx=Math.max(aIdx,7);             // 傳奇巨星
  // (3) 取品質與榮譽的較高者
  let idx=Math.max(qIdx,aIdx);
  // (4) 資歷保護：頂層標籤需足夠樣本，避免短暫客串被灌成傳奇（同時提高門檻可信度）
  if(n<2) idx=Math.min(idx, aIdx>=5?4:3);                    // 只打 1 季：頂多明星球員（無重大榮譽則封在先發）
  if(n<3 && aIdx<5) idx=Math.min(idx,4);                     // 2 季且無重大榮譽：頂多明星球員
  if(idx>=6 && n<4 && !(localMvp>=1||allNBA1>=1)) idx=5;     // 聯盟門面需 ≥4 季或硬榮譽
  if(idx>=7 && n<5 && mvp<2) idx=6;                          // 傳奇需 ≥5 季或多座 MVP
  idx=clamp(idx,0,labels.length-1);
  return {league:lg, score, label:labels[idx], seasons:n, avgSS:Math.round(avgSS)};
}
function allLeagueEvals(){
  const order=["NBA","CBL","KRBL","日職 B.League","發展聯盟","TPBL","P+","SBL"];
  const seen=[]; G.seasonHistory.forEach(s=>{if(s.stage==="pro"&&!seen.includes(s.league))seen.push(s.league);});
  return order.filter(l=>seen.includes(l)).map(leagueEval).filter(Boolean);
}

function hasTitle(id){ return (G.titles||[]).some(t=>t.id===id); }
function grantTitle(id){
  if(!TITLE_DEFS[id]||hasTitle(id))return;
  const d=TITLE_DEFS[id];
  G.titles=G.titles||[];
  G.titles.push({id,name:d.name,good:d.good,cssClass:d.cssClass,desc:d.desc,effect:d.effect||""});
  if(d.buff){ for(const k in d.buff){
    if(k==="pot"){ G.potential=clamp(G.potential+d.buff[k],72,99); }
    else if(k in G.attr) G.attr[k]=clamp(G.attr[k]+d.buff[k],15,99);
    else if(k==="fame") addHeat(d.buff[k]);
    else if(k==="morale") G.morale=clamp(G.morale+d.buff[k],0,100); } }
  G._newTitle=d.name; // 供賽季回顧提示
}
function grantCustomTitle(spec){
  if(!spec||!spec.id||!spec.name||hasTitle(spec.id))return;
  G.titles=G.titles||[];
  G.titles.push({id:spec.id,name:spec.name,good:spec.good!==false,cssClass:spec.cssClass,desc:spec.desc||"特別稱號",effect:spec.effect||"純稱號"});
  G._newTitle=spec.name;
}

function hasTaiwanBasketballIdentity(state=G){
  const st=state||{};

function isUsaNationalPath(state=G){
  const st=state||{};

}
function nationalMedalCount(league,state=G){
  const st=state||{}, log=st.awardLog||[];
  return log.filter(a=>a&&a.league===league&&/金牌|銀牌|銅牌/.test(a.award||"")).length;
}
function taiwanMedalCount(state=G){ return nationalMedalCount("中華隊",state); }
function usaMedalCount(state=G){
  const st=state||{};
  return Math.max(Number(st.usaMedals)||0,nationalMedalCount("美國隊",st));
}
function syncNationalIdentityTitles(){
  if(isUsaNationalPath(G)){
    const blocked=new Set(["twhero","goldGen","taiwanSon"]);
    G.titles=(G.titles||[]).filter(t=>!blocked.has(t.id));
    grantTitle("usaPath");
    if(G._usaFinal12) grantTitle("usaDreamTeam");
    const m=usaMedalCount(G);
    if(m>=1) grantTitle("usaHero");
    if(m>=2) grantTitle("usaDynasty");
  }else if(hasTaiwanBasketballIdentity(G)){
    const m=taiwanMedalCount(G);
    if(m>=1) grantTitle("twhero");
    if(m>=2) grantTitle("goldGen");
  }
}

function franchiseCityLabel(team){
  const t=String(team||"");for(const [prefix,label] of Object.entries(FRANCHISE_CITY_ALIASES))if(t.startsWith(prefix))return label;return t||"球隊";
}
function franchiseLegendProfile(state=G,league=null,team=null){
  const st=state||{},rows=(st.seasonHistory||[]).filter(x=>x&&x.stage==="pro"&&(!league||x.league===league)&&(!team||x.team===team));
  if(!rows.length)return {team:team||"",league:league||"",seasons:0,champ:0,star:0,major:0};
  const lg=league||rows[0].league,tm=team||rows[0].team,own=rows.filter(x=>x.league===lg&&x.team===tm),starTh=lg==="NBA"?76:["日職 B.League","CBL","KRBL"].includes(lg)?74:70;
  return {team:tm,league:lg,seasons:own.length,champ:own.filter(x=>x.champion).length,star:own.filter(x=>Number(x.seasonScore)>=starTh).length,major:own.reduce((n,x)=>n+(x.awards||[]).filter(a=>["MVP","FMVP","DPOY"].includes(a)).length,0)};
}
function franchiseLegendTitleSpecs(profile){
  const p=profile||{},city=franchiseCityLabel(p.team),out=[];
  if(Number(p.seasons)>=5)out.push({tier:"banner",name:`${city}旗幟`,desc:`在 ${p.team} 長期效力至少 5 季，名字開始與這支球隊綁在一起。`});
  if(Number(p.seasons)>=8&&(Number(p.champ)>=1||Number(p.star)>=4||Number(p.major)>=1))out.push({tier:"totem",name:`${city}圖騰`,desc:`在 ${p.team} 長期效力並留下明星／冠軍級代表作，成為一個時代的球隊象徵。`});
  if(Number(p.seasons)>=12&&Number(p.champ)>=2&&(Number(p.star)>=6||Number(p.major)>=2))out.push({tier:"immortal",name:`${city}不朽`,desc:`把巔峰與冠軍履歷長期留在 ${p.team}；這段歷史已經不是隊史一頁，而是一整個時代。`});
  return out;
}
function syncFranchiseLegendTitles(state=G){
  const st=state||G;if(!st)return;st.titles=(st.titles||[]).filter(t=>!["teamSoul","loyalFive"].includes(t.id));
  const keys=[],seen=new Set();(st.seasonHistory||[]).filter(x=>x&&x.stage==="pro"&&x.league&&x.team).forEach(x=>{const k=`${x.league}|${x.team}`;if(!seen.has(k)){seen.add(k);keys.push([x.league,x.team]);}});
  keys.forEach(([lg,tm])=>{const p=franchiseLegendProfile(st,lg,tm);franchiseLegendTitleSpecs(p).forEach(spec=>grantCustomTitle({id:`franchise:${spec.tier}:${lg}:${tm}`,name:spec.name,good:true,cssClass:spec.tier==="immortal"?"legend-yellow":spec.tier==="totem"?"legend-blue":null,desc:spec.desc,effect:"純稱號"}));});
}

function recordLeagueTeamForJourneyman(league,team){
  if(!league||!team)return;
  G._leagueTeamsPlayed=G._leagueTeamsPlayed||{};
  const arr=Array.isArray(G._leagueTeamsPlayed[league])?G._leagueTeamsPlayed[league]:[];
  if(!arr.includes(team)) arr.push(team);
  G._leagueTeamsPlayed[league]=arr;
  // 同聯盟先後待過 7 支不同球隊才算真正的「浪人」；跨聯盟旅外不累計。
  if(arr.length>=7) grantTitle("journeyman");
}
function checkSeasonTitles(s){
  // 隊魂 / 一人一城：同隊效力賽季數
  if(s.stage==="pro"){
    G._teamTenure=G._teamTenure||{};
    G._teamTenure[s.team]=(G._teamTenure[s.team]||0)+1;
    if(G._teamTenure[s.team]>12) grantTitle("oneCity");
    syncFranchiseLegendTitles(G);
  }
  // 鐵人：職業季全勤（未因傷減量）且健康高
  if(s.stage==="pro" && s.gp>=leagueGP(s.league) && G.health>=85) grantTitle("ironman");
  // 打鐵匠：整季命中率極低
  if(s.stage==="pro" && s.fg<=38 && s.gp>=leagueGP(s.league)*.6) grantTitle("bricklayer");
  // 更衣室隱憂：士氣長期低迷
  if(G.morale<=28) grantTitle("locker");
  // 高中封王：本土 HBL 與美國高中分開給稱號
  if(s.stage==="高中" && s.tourney && s.tourney.champ){
    if(s.league==="美國高中") grantTitle("prepChampion"); else grantTitle("hsKing");
  }
  // 冠軍基因（職業奪冠）
  if(s.stage==="pro" && s.champion) grantTitle("champDNA");
  // 玻璃人：兩次以上重傷；薄玻璃：三次以上
  if((G.majorInjuries||0)>=2) grantTitle("glass");
  if((G.majorInjuries||0)>=3) grantTitle("fragile");
  // NCAA 之光 / 全美第一
  if(s.usRank){ if(s.usRank<=25) grantTitle("ncaaStar"); if(s.usRank===1) grantTitle("usaTop"); }
  // 累積榮譽型稱號
  const c=G.careerAwards;
  if((c["得分王"]||0)>=2) grantTitle("scoringMachine");
  if((c["助攻王"]||0)>=2) grantTitle("dimeKing");
  if((c["籃板王"]||0)>=2) grantTitle("glassCleaner");
  if((c.DPOY||0)>=1) grantTitle("ironWall");
  if((c["冠軍"]||0)>=3) grantTitle("ringCollector");
  // 三連霸：必須同一隊、同一職業聯盟，且冠軍年份連續三季。
  if(s.stage==="pro" && s.champion){
    const champs=(G.seasonHistory||[]).filter(h=>h&&h.stage==="pro"&&h.champion&&h.league===s.league&&h.team===s.team&&Number(h.year)<=Number(s.year)).sort((a,b)=>Number(a.year)-Number(b.year));
    const last3=champs.slice(-3);
    if(last3.length===3 && Number(last3[0].year)+1===Number(last3[1].year) && Number(last3[1].year)+1===Number(last3[2].year)) grantTitle("threePeat");
  }
  // 73 勝 9 敗卻失冠：致敬歷史級例行賽，純稱號、不灌能力。
  const teamW=Number(s.teamW??s.w),teamL=Number(s.teamL??s.l);
  if(s.stage==="pro" && s.league==="NBA" && teamW===73 && teamL===9 && !s.champion) grantTitle("seventyThreeNine");
  syncNationalIdentityTitles();
  // 日職巨星：在日職有明星等級評價
  if(s.stage==="pro" && s.league==="日職 B.League"){ const ev=leagueEval("日職 B.League");
    if(ev && (ev.label.indexOf("當家")>=0||ev.label.indexOf("明星")>=0||ev.label.indexOf("傳奇")>=0)) grantTitle("jpStar"); }
  // 世界舞台：NBA + 日職 + 任一台灣聯盟都打過
  const played=new Set(G.seasonHistory.filter(x=>x.stage==="pro").map(x=>x.league));
  if(played.has("NBA")&&played.has("日職 B.League")&&(played.has("SBL")||played.has("P+")||played.has("TPBL"))) grantTitle("worldStage");
  // 人氣王：熱度曾破 95
  if(G.fame>=95) grantTitle("fanFavorite");
  // 關鍵先生：職業聯賽、奪冠、且該季場均得分 >= 26
  if(s.stage === "pro" && s.champion && s.ppg >= 26) grantTitle("clutchAssassin");
  // 銅牆鐵壁：單季抄截 >= 2.0 且 阻攻 >= 1.5
  if(s.stage === "pro" && s.spg >= 2.0 && s.bpg >= 1.5) grantTitle("defensiveAnchor");
  // 行走印鈔機：生涯金錢大於等於 50000 萬 (5億)
  if(G.money >= 50000) grantTitle("cashCow");
  // 不老神木：年齡 >= 38 歲，且出賽場次大於聯盟總場次的 60%
  if(s.stage === "pro" && G.age >= 38 && s.gp >= leagueGP(s.league) * 0.6) grantTitle("evergreen");
  // 薪水小偷：領「頂薪」合約 (cType === "max")，但賽季表現分 (seasonScore) 低於 60
  if(s.stage === "pro" && G.contract && G.contract.cType === "max" && s.seasonScore < 60) grantTitle("overpaid");
  // 氣氛大師：士氣極低 (<= 15)
  if(G.morale <= 15) grantTitle("toxic");
  // NBA 出勤／選秀身價相關稱號
  if(s.league==="NBA" && s.gp<65 && s.seasonScore>=82) grantTitle("awardIneligible");
  const nbaRecent=G.seasonHistory.filter(h=>h.league==="NBA").slice(-3);
  if(nbaRecent.length===3 && nbaRecent.every(h=>h.gp>=70)) grantTitle("durableStar");
  if(s.league==="NBA" && G.draftInfo&&G.draftInfo.league==="NBA" && G.draftInfo.pick>=31 && s.seasonScore>=76) grantTitle("secondRoundSteal");
  if(s.league==="NBA" && s.gp>=50 && s.ppg<7 && s.seasonScore<38) grantTitle("deepBench");
  // 純稱號成就：不增減能力，只留下生涯標記。
  if(s.stage==="pro" && s.ppg>=30) grantTitle("thirtyClub");
  if(s.stage==="pro" && s.ppg>=20 && s.rpg>=7 && s.apg>=7) grantTitle("allAround");
  if(s.stage==="大學" && s.champion && (s.awards||[]).includes("MVP")) grantTitle("collegeIcon");
  if(s.stage==="pro" && s.champion && ((s.awards||[]).includes("FMVP")||s.fmvp)) grantTitle("bigGamePlayer");
  if(s.stage==="pro" && overall()>=90) grantTitle("ninetyClub");
  const proLeagues=new Set(G.seasonHistory.filter(h=>h.stage==="pro").map(h=>h.league));
  if(proLeagues.size>=4) grantTitle("globetrotter");
  if(s.stage==="pro") syncFranchiseLegendTitles(G);
  // 大滿貫：高中、大學、職業三階段皆奪冠
  const wonHS = G.seasonHistory.some(h => h.stage === "高中" && h.champion);
  const wonCollege = G.seasonHistory.some(h => h.stage === "大學" && h.champion);
  const wonPro = G.seasonHistory.some(h => h.stage === "pro" && h.champion);
  if (wonHS && wonCollege && wonPro) grantTitle("grandSlam");
}
/* ---------- 全美大學 Big Board（旅美 NCAA 球員） ---------- */
function computeUsRank(currentProd){
  if(!(G.league==="NCAA D1"||G.league==="NCAA D2"))return null;
  const stars=G._finalHsStars||3;
  if(!G._collegeEntryRank) G._collegeEntryRank=collegeEntryRankFromStars(stars);
  const prev=G._collegeRank||G._collegeEntryRank;
  const prod=currentProd===undefined?recentProd():currentProd;
  const ov=overall();
  // 以即戰能力與當季產出估算目標 Big Board；D1 的曝光略高。
  const perf=ov + clamp((prod-16)*.75,-6,18) + (G.league==="NCAA D1"?5:0);
  let target;
  if(perf>=103) target=rint(1,14);
  else if(perf>=96) target=rint(15,30);
  else if(perf>=90) target=rint(31,60);
  else if(perf>=83) target=rint(61,120);
  else if(perf>=76) target=rint(121,220);
  else target=rint(221,500);
  // 第一年保留高中星級帶來的初始定位，之後逐年更看大學實績。
  const wTarget=G.collegeYears<=1?.42:.62;
  let rank=Math.round(prev*(1-wTarget)+target*wTarget+rnd(-5,5));
  rank += (G._seasonMods&&G._seasonMods.boardMove)||0;
  rank=clamp(rank,1,500);
  G._collegeRank=rank;
  G.usRankBest=Math.min(G.usRankBest||999,rank);
  return rank;
}
const HOF_TH={taiwan:680, naismith:900, china:620, korea:620};
function hofScore(){
  const c=G.careerAwards, t=careerTotals();
  const prestige=bestLeaguePrestige();
  const tierBonus=[0,0,18,42,75][prestige]||0; // 打到的最高殿堂
  let sc=tierBonus + c.MVP*24 + c.FMVP*9 + c["明星賽"]*2.6 + c["冠軍"]*11 + c.DPOY*8 + c.ROTY*5
    + c["最佳陣容"]*2 + (c["得分王"]+c["籃板王"]+c["助攻王"])*3
    + (c["年度一隊"]||0)*10 + (c["年度二隊"]||0)*7 + (c["年度三隊"]||0)*5 + ((c["新秀一隊"]||0)+(c["新秀二隊"]||0))*3
    + Math.max(0,(t.peakOv-80))*4 + t.totalPts/1500 + G.intlMedals*5;
  return Math.round(sc);
}
/* 名人堂單一資格物件：實際判定、畫面與典禮都共用，不再只顯示一個容易誤解的分數。 */
function makeHallResult(score,scoreThreshold,seasons=0,seasonRequirement=0,seasonLabel="",extraPassed=true,extraReason=""){
  const scorePassed=score>=scoreThreshold;
  const seasonsPassed=seasons>=seasonRequirement;
  const eligible=scorePassed&&seasonsPassed&&extraPassed;
  let reason="票選分與資歷皆達標";
  if(!eligible){
    if(!extraPassed) reason=extraReason||"尚未符合基本入選資格";
    else if(!scorePassed&&!seasonsPassed) reason=`票選分尚差 ${scoreThreshold-score} 分，且${seasonLabel||"聯盟"}資歷尚差 ${seasonRequirement-seasons} 季`;
    else if(!scorePassed) reason=`名人堂票選分尚差 ${scoreThreshold-score} 分`;
    else if(!seasonsPassed) reason=`票選分已達標，但${seasonLabel||"聯盟"}資歷尚差 ${seasonRequirement-seasons} 季`;
  }
  return {score,scoreThreshold,seasons,seasonRequirement,seasonLabel,scorePassed,seasonsPassed,extraPassed,eligible,reason};
}
/* 台灣名人堂把 SBL／P+／TPBL 視為同一份本土職籃履歷，基礎表現分只計算一次。 */
function taiwanHallVoteScore(){
  const twLeagues=["SBL","P+","TPBL"];
  const ss=(G.seasonHistory||[]).filter(s=>s.stage==="pro"&&twLeagues.includes(s.league));
  const n=ss.length;
  const avgSS=n?ss.reduce((sum,s)=>sum+(s.seasonScore||0),0)/n:0;
  const base=n?clamp(avgSS-30,0,90)*5+n*7:0;
  const twAwards=(G.awardLog||[]).filter(a=>twLeagues.includes(a.league));
  const awardPts=twAwards.reduce((sum,a)=>{
    const w=a.award||"";
    return sum+(w==="MVP"?70:w==="FMVP"?45:w==="冠軍"?40:w==="最佳陣容"?28:
      w==="年度一隊"?40:w==="年度二隊"?28:w==="年度三隊"?18:w.includes("明星賽")?16:
      w.includes("王")?16:w==="DPOY"?22:w==="ROTY"?14:w.includes("新秀")&&w.includes("隊")?8:0);
  },0);
  let natlScore=0;
  (G.awardLog||[]).filter(a=>a.league==="中華隊").forEach(a=>{
    const w=a.award||"";
    natlScore += w==="金牌"?175 : w==="銀牌"?125 : w==="銅牌"?90 : w==="賽會MVP"?75 :
      w==="瓊斯盃金牌"?60 : w==="瓊斯盃銀牌"?42 : w==="瓊斯盃銅牌"?30 :
      (w.indexOf("瓊斯盃MVP")>=0?38 : 12);
  });
  return {score:Math.round(base+awardPts+natlScore+(G.madeNBA?160:0)),seasons:n,avgSS:Math.round(avgSS),awardPts,natlScore};
}
/* ---------- 分聯盟名人堂 ---------- */
function computeHallOfFame(){
  const ev={}; allLeagueEvals().forEach(e=>ev[e.league]=e.score);
  const tw=taiwanHallVoteScore();
  const taiwanResult=makeHallResult(tw.score,HOF_TH.taiwan,tw.seasons,0,"台灣職籃");

  const nba=ev["NBA"]||0;
  const nbaSeasons=(G.seasonHistory||[]).filter(s=>s.league==="NBA").length;
  const naismithScore=Math.round(nba + (G.awardLog||[]).filter(a=>a.league==="NBA").reduce((s,a)=>{
    const w=a.award||"";
    return s+(w==="MVP"?130:w==="FMVP"?90:w==="冠軍"?60:w==="年度一隊"?55:w==="年度二隊"?35:w==="年度三隊"?24:w.includes("明星賽")?26:w.includes("王")?30:12);
  },0));
  const naismithResult=makeHallResult(naismithScore,HOF_TH.naismith,nbaSeasons,6,"NBA ",!!G.madeNBA,"尚未建立 NBA 正式出賽資歷");

  const cbl=ev["CBL"]||0;
  const cblSeasons=(G.seasonHistory||[]).filter(s=>s.league==="CBL").length;
  const chinaScore=Math.round(cbl + (G.awardLog||[]).filter(a=>a.league==="CBL").reduce((s,a)=>{
    const w=a.award||"";
    return s+(w==="MVP"?90:w==="FMVP"?55:w==="冠軍"?45:w==="本土MVP"?40:w.includes("明星賽")?18:w.includes("王")?22:w==="DPOY"?24:w==="ROTY"?14:10);
  },0));
  const chinaResult=makeHallResult(chinaScore,HOF_TH.china,cblSeasons,5,"CBL ");

  const krbl=ev["KRBL"]||0;
  const krblSeasons=(G.seasonHistory||[]).filter(s=>s.league==="KRBL").length;
  const koreaScore=Math.round(krbl + (G.awardLog||[]).filter(a=>a.league==="KRBL").reduce((s,a)=>{
    const w=a.award||"";
    return s+(w==="MVP"?90:w==="FMVP"?55:w==="冠軍"?45:w==="國內MVP"?40:w.includes("明星賽")?18:w.includes("王")?22:w==="DPOY"?24:w==="ROTY"?14:10);
  },0));
  const koreaResult=makeHallResult(koreaScore,HOF_TH.korea,krblSeasons,5,"KRBL ");

  return {
    taiwanScore:taiwanResult.score,taiwanSeasons:tw.seasons,taiwan:taiwanResult.eligible,taiwanResult,
    naismithScore:naismithResult.score,nbaSeasons,naismith:naismithResult.eligible,naismithResult,
    chinaScore:chinaResult.score,cblSeasons,china:chinaResult.eligible,chinaResult,
    koreaScore:koreaResult.score,krblSeasons,korea:koreaResult.eligible,koreaResult,
  };
}

/* ---------- 球衣退休：依「各隊」效力年資 × 戰績 × 榮譽 判定 ---------- */
function jerseyRetiredTeams(){
  const pro=G.seasonHistory.filter(s=>s.stage==="pro");
  if(!pro.length)return [];
  const byTeam={};
  pro.forEach(s=>{ const k=s.league+"|"+s.team;
    if(!byTeam[k]) byTeam[k]={team:s.team,league:s.league,seasons:0,ssSum:0,star:0,champ:0};
    const b=byTeam[k]; b.seasons++; b.ssSum+=(s.seasonScore||0);
    const starTh=(s.league==="NBA"||s.league==="日職 B.League"||s.league==="CBL"||s.league==="KRBL")?76:73;
    if((s.seasonScore||0)>=starTh) b.star++;
    if(s.champion) b.champ++;
  });
  const result=[];
  Object.values(byTeam).forEach(b=>{
    const avg=b.ssSum/b.seasons;
    // 資格：長期效力(≥6季) 且 在該隊有成就（奪冠 / 多次明星級 / 平均影響力高）
    const qualifies = b.seasons>=6 && (b.champ>=1 || b.star>=3 || avg>=(b.league==="NBA"?82:72));
    // 或：該隊生涯代表隊(≥8季)即使成就普通也退休球衣
    const loyalty = b.seasons>=8 && avg>=(b.league==="NBA"?70:60);
    if(qualifies||loyalty) result.push({team:b.team,league:b.league,seasons:b.seasons});
  });
  // 最多顯示 3 隊，年資高的優先
  return result.sort((a,b)=>b.seasons-a.seasons).slice(0,3);
}
function endCareer(){
  G.retired=true;
  syncNationalIdentityTitles();
  syncFranchiseLegendTitles(G);
  // 隱藏稱號結算
  const proSeasons=G.seasonHistory.filter(s=>s.stage==="pro").length;
  const collegeSeasons=G.seasonHistory.filter(s=>s.stage==="大學").length;
  if(proSeasons<=1 && collegeSeasons>=1 && !G.madeNBA) grantTitle("flashPan"); // 大學後隨即退休
  if(proSeasons>10 && (G.careerAwards["冠軍"]||0)===0) grantTitle("ringless"); // 無冕之王
  const sc=hofScore();
  G._hofScore=sc;
  G._hallOfFame=computeHallOfFame();
  G._jerseyTeams=jerseyRetiredTeams();
  G._jerseyRetired = G._jerseyTeams.length>0 || (G._hallOfFame&&G._hallOfFame.naismith);
  G._hof=G._hallOfFame.taiwan||G._hallOfFame.naismith||G._hallOfFame.china||G._hallOfFame.korea;
  let tier=retirementTier();
  if(G._undrafted) tier="undrafted"; // 落選轉跑道專屬
  // 發展聯盟長期打拼、始終沒能真正在 NBA 站穩 → 專屬「農場老兵」退休劇情
  const devSeasons=G.seasonHistory.filter(s=>s.league==="發展聯盟").length;
  G._devGrindSeasons=devSeasons;
  if(!G.madeNBA && devSeasons>=4 && tier!=="undrafted") tier="devgrind";
  if(G.background==="asian_american" && tier!=="undrafted" && tier!=="devgrind" && !G._injuryRetire){
    tier=G._usaFinal12?"usaDreamTeam":(G._canPlayForTaiwan===false?"asianAmericanRefusedTaiwan":"asianAmericanLegacy");
  }
  if(G._ageLimitRetire && !G._injuryRetire) tier="age50"; // 50 歲正常謝幕使用超長青專屬文本
  if(G._injuryRetire) tier="injuryEnd"; // 傷退劇情優先
  G._retireScene=pick(RETIRE_SCENES[tier]||RETIRE_SCENES.obscure);
  G._retireTier=tier;
  G._nbaAllTimeLegacy=nbaLegacyProfile();
  G._fanForum=fanForum();
  G.phase="retireScene"; render();
}

    add("賽季回顧考古",`我還是最愛 ${best.year} 那季：${best.ppg} 分、${best.rpg} 板、${best.apg} 助攻${best.champion?"，最後還拿冠軍":""}，那才是我心中的巔峰。`,rint(120,700));
  }

  // 通用結語（依整體評價）
  const legacyPool = hof.naismith||hof.taiwan
    ? ["生涯回顧影片我看到哭，謝謝你的每一顆球。","這種等級的球員，一個世代出一個而已。","以後帶小孩看球一定跟他說有這號人物。"]
    : proSeasons>=8
    ? ["不是巨星，但是那種你會想一直支持的球員。","兢兢業業一輩子，這種老將最讓人尊敬。","數據普通，但每場都全力以赴，這就夠了。"]
    : ["來去匆匆的一段職業生涯，還是謝謝你的努力。","起碼站上過職業舞台，很多人連這機會都沒有。","故事雖短，但也是熱血的一頁。"];
  add(pick(FANS), pick(legacyPool), rint(40,600));
  // 洗版式短評（僅補空位用）
  const shorties=G.background==="asian_american"
    ? ["一路走來辛苦了 🙏","傳奇 🐐","青春的回憶啊","感謝有你","下一代真的會記得這條路","名場面太多了","神","GOAT 之一","看他打球是一種享受","替他驕傲","AAU 到職業，respect","退休快樂 🎉","我的青春結束了 😭","以前招募榜就追過他","從小看他打到大","實至名歸"]
    : ["一路走來辛苦了 🙏","傳奇 🐐","青春的回憶啊","感謝有你","下輩子還要看你打球","名場面太多了","神","GOAT 之一","看他打球是一種享受","替他驕傲","台灣籃球因你而精彩","退休快樂 🎉","我的青春結束了 😭","這 ID 我認識，當年超猛","從小看他打到大","實至名歸"];
  addF(pick(FANS), pick(shorties), rint(10,300));
  addF(pick(FANS), pick(shorties), rint(8,220));
  addF(pick(FANS), pick(shorties), rint(6,180));
  // 貼合留言優先入列，不足 8 則再用洗版短評補滿
  const shuffle=a=>{ for(let i=a.length-1;i>0;i--){const j=rint(0,i);[a[i],a[j]]=[a[j],a[i]];} };
  shuffle(posts); shuffle(filler);
  const out=posts.slice(0,8);
  for(const f of filler){ if(out.length>=8) break; out.push(f); }
  // 同一討論串避免重複 ID（保留主題性 ID 首次出現，重複者換成其他鄉民）
  const usedU=new Set();
  out.forEach(p=>{ if(usedU.has(p.user)){ let u=pick(FANS),g=0; while(usedU.has(u)&&g<40){u=pick(FANS);g++;} p.user=u; } usedU.add(p.user); });
  return out.sort((a,b)=>b.likes-a.likes);
}

  // 命中率 / 手感
  if(s.tp>=40 && s.ppg>=14) add([`三分命中率 ${s.tp}%，投起來根本不講理。`,"外線準到對手不敢放，直接拉開空間。"]);

  // ---- 組合輸出：貼合評語優先，再用分級池補滿 4 則 ----
  const bigNight = tierc==="champ"||tierc==="elite"||has("MVP")||has("FMVP")||s.champion;
  const like = big => big ? rint(120,900) : rint(6,320);
  const out=[]; const usedTxt=new Set(); const usedU=new Set();
  const freshU=()=>{ let u=pick(FANS),g=0; while(usedU.has(u)&&g<30){u=pick(FANS);g++;} usedU.add(u); return u; };
  hot.slice(0,3).forEach(t=>{ out.push({u:freshU(),t,likes:like(bigNight)}); usedTxt.add(t); });
  const base=pools[tierc].slice();
  let guard=0;
  while(out.length<4 && guard<50){ const c=pick(base); guard++; if(usedTxt.has(c))continue; usedTxt.add(c); out.push({u:freshU(),t:c,likes:like(bigNight&&out.length===0)}); }
  return out;
}

/* ---------- 能力加點（養成） ---------- */
function allocationQuote(k,state=G){
  const st=state||{},al=st._alloc||{},base=Number(al.base&&al.base[k])||0,added=Number(al.add&&al.add[k])||0;
  const cur=base+added,cap=developmentCap(k,st),cost=allocCost(cur,st),left=Math.max(0,Number(al.spLeft)||0);
  return {cur,cap,cost,left,canPlus:cur<cap&&left>=cost};
}
function allocationCanCommit(state=G){
  const st=state||{},al=st._alloc;if(!al)return true;
  const left=Math.max(0,Number(al.spLeft)||0);if(left<=0)return true;
  for(const k of ATTR_KEYS){
    if(allocationQuote(k,st).canPlus)return false;
  }
  return true;
}
function allocateHTML(){

  }).join("");

  return `<div class="season-hd"><span class="stage">${stageName} · 季前特訓</span><span class="yr">${G.year} 賽季</span></div>
    <div class="team-line"><span class="team-dot" style="background:${teamColors(G.team).p}"></span>${G.team} ${getContractText()} <span class="arche">${archetype(prev,G.pos)}</span></div>
    ${al.bonus?`<div class="usrank-line" style="color:var(--gold);border-color:rgba(242,184,75,.4);background:rgba(242,184,75,.08)">🏆 額外訓練點 <b>+${al.bonus}</b>${al.offerBonus?`（${G._collegeOfferLabel||"入學待遇"}每季 +${al.offerBonus}${al.earnedBonus?`；其他獎勵 +${al.earnedBonus}`:""}）`:"（上季／國際賽獎勵）"}</div>`:""}
    <div class="panel">
      <div class="alloc-top">
        <div class="alloc-sp"><div class="v">${al.spLeft}</div><div class="l">剩餘訓練點</div></div>

      </div>

      <p class="small" style="margin:2px 0 12px">金色分界代表這副身材與 Build 的<b style="color:var(--gold)">理論開發區間</b>；真正天賦不公開。當成長開始卡住，只代表球探需要重新評估你，而不是開局就被一個數字判死刑。</p>
      <div class="alloc-list">${rows}</div>

      ${!allocationCanCommit(G)?`<div class="usrank-line" style="color:var(--gold);margin-top:10px">⚠ 尚有 <b>${al.spLeft}</b> 點可合法分配；使用完前不能開始賽季。</div>`:al.spLeft>0?`<div class="usrank-line" style="margin-top:10px">剩餘 ${al.spLeft} 點已無任何合法升級可購買，允許直接進入賽季。</div>`:""}
    </div>
    <p class="small center" style="opacity:.7;padding-bottom:6px">分配完成後，將進入本季的事件抉擇與骰子挑戰。</p>`;

function bindAllocate(){
  const s=$("#stage");if(!s)return;
  s.querySelectorAll("[data-plus]").forEach(b=>b.addEventListener("click",()=>allocChange(b.dataset.plus,1)));
  s.querySelectorAll("[data-minus]").forEach(b=>b.addEventListener("click",()=>allocChange(b.dataset.minus,-1)));
  const au=s.querySelector("#allocAuto");if(au)au.addEventListener("click",allocAuto);
  const rs=s.querySelector("#allocReset");if(rs)rs.addEventListener("click",allocReset);
}
function renderAllocateInPlace(){
  // 只就地更新加點面板，不重建整頁、不捲動 → 點下方能力值時不會跳回頂端
  const s=$("#stage"); if(!s){ render(); return; }
  s.innerHTML=allocateHTML();
  bindAllocate();
  // 配點後底部 action bar 也要同步重算，避免點數已用完但按鈕仍維持 disabled。
  bindActionbar();
}
function allocCap(k){ return developmentCap(k,G); }
function allocChange(k,dir){
  const al=G._alloc, q=allocationQuote(k,G),cur=q.cur;
  if(dir>0){ if(!q.canPlus)return; al.add[k]++; al.spLeft-=q.cost; }
  else { if(al.add[k]<=0)return; const c=allocCost(cur-1,G); al.add[k]--; al.spLeft+=c; }
  renderAllocateInPlace();
}
function allocAuto(){
  const w=POSITIONS[G.pos].w, order=[...ATTR_KEYS].sort((x,y)=>w[y]-w[x]);
  let guard=0;
  while(guard++<800){ let done=true;
    for(const k of order){ const q=allocationQuote(k,G);
      if(q.canPlus){ G._alloc.add[k]++; G._alloc.spLeft-=q.cost; done=false; break; } }
    if(done)break; }
  renderAllocateInPlace();
}
function allocReset(){ ATTR_KEYS.forEach(k=>G._alloc.add[k]=0); G._alloc.spLeft=G._alloc.sp; renderAllocateInPlace(); }
function commitAllocation(){
  if(!allocationCanCommit(G)){toast(`尚有 ${G._alloc&&G._alloc.spLeft||0} 點可分配，請先使用完再開始賽季。`,2800);return;}
  ATTR_KEYS.forEach(k=>G.attr[k]=clamp(G.attr[k]+G._alloc.add[k],15,99));
  G._alloc=null; beginTraining();
}

function resolveOption(i){
  const ev=G.seasonEvents[G.eventIdx];
  const opt=ev.o[i];
  const panel=$("#evpanel");
  // 顯示骰子
  panel.innerHTML=`<div class="label">命運骰</div>

  const iv=setInterval(()=>{ die.innerHTML=pipHTML(1+Math.floor(rawRnd()*6)); if(++ticks>10){/*noop*/} },70);
  setTimeout(()=>{
    clearInterval(iv);
    const roll=rint(1,6);
    die.classList.remove("rolling");
    die.innerHTML=pipHTML(roll);
    const before={...G.attr};
    const outcome=opt.f(roll);
    sanitizeOutcomeForRoll(outcome,roll);
    // 低骰懲罰：骰到 1–2 時，正屬性加成歸零，且有機率倒扣（讓爛運真的有代價）
    if(roll<=2 && outcome.attr){
      for(const k in outcome.attr){ if(outcome.attr[k]>0){ outcome.attr[k]= chance(.5)?-1:0; } }
    }
    applyEffects(outcome);
    // 轉學劇情：實際換了學校 → 於結果文本帶入新學校名，提高沉浸感
    if(outcome.transfer && G._transferredTo){ outcome.text += " " + transferFlavor(G._transferredTo); }

    if(outcome.money){
  const isPos = outcome.money > 0;
  // 如果是正數加上 + 號，如果是負數，fmtMoney 已經自帶 - 號了
  deltas.push(`<span class="delta ${isPos ? "pos" : "neg"}">$ ${isPos ? "+" : ""}${fmtMoney(outcome.money)}</span>`);
}
    if(outcome.fame)deltas.push(`<span class="delta ${outcome.fame>=0?"pos":"neg"}">熱度 ${outcome.fame>=0?"+":""}${outcome.fame}</span>`);
    if(outcome.morale)deltas.push(`<span class="delta ${outcome.morale>=0?"pos":"neg"}">士氣 ${outcome.morale>=0?"+":""}${outcome.morale}</span>`);
    if(outcome.pot)deltas.push(`<span class="delta ${outcome.pot>=0?"pos":"neg"}">天賦評估 ${outcome.pot>0?"↑":"↓"}</span>`);

function resolveTradeRumor(choice){
  const panel=$("#evpanel"); if(!panel) return;
  panel.innerHTML=`<div class="label">命運骰</div>
    <div class="dice-stage">
      <div class="die rolling" id="die">${pipHTML(1)}</div>
      <div class="roll-caption" id="rollcap">流言擴散中…</div>
    </div>`;
  const die=$("#die"); let ticks=0;
  const iv=setInterval(()=>{ die.innerHTML=pipHTML(1+Math.floor(rawRnd()*6)); if(++ticks>10){} },70);
  setTimeout(()=>{
    clearInterval(iv);
    const roll=rint(1,6), t=tier(roll);
    die.classList.remove("rolling"); die.innerHTML=pipHTML(roll);
    // 骰高 → 降低被交易機率；骰低 → 提高（詢問高層波動較大）
    const swing = choice===1 ? 0.13 : 0.08;
    const protection=tradeProtectionScore();
    const tradeProb = clamp(0.5 - (roll-3.5)*swing - protection, 0.01, 0.90);
    const deltas=[];
    if(protection>=.18)deltas.push(`<span class="delta pos">核心地位保護 -${Math.round(protection*100)}% 交易風險</span>`);
    if(choice===1){
      if(t==="high"){ G.morale=clamp(G.morale+4,0,100); deltas.push(`<span class="delta pos">士氣 +4</span>`); }
      else if(t==="low"){ G.morale=clamp(G.morale-4,0,100); deltas.push(`<span class="delta neg">士氣 -4</span>`); }
    }
    const willTrade = chance(tradeProb);
    const head = choice===1
      ? (t==="high"?"你直接找上球團高層對質，對方拍胸脯保證：「你是我們的建隊核心，別理那些網路流言。」"
        : t==="low"?"你氣沖沖地質問管理層，換來的卻是一陣尷尬的沉默與閃爍的眼神。"
        : "你私下向教練打聽，只得到模稜兩可的答覆。")
      : (t==="high"?"你選擇冷處理，照常出現在訓練館，彷彿什麼都沒發生。"
        : t==="low"?"你嘴硬說不知情，但更衣室裡那股微妙的氣氛，騙不了任何人。"
        : "你嘴上說沒聽過，心裡卻七上八下。");
    const tail = willTrade ? "然而幾天後，交易還是敲定了——" : "最終，這只是一場虛驚，你留了下來。";
    $("#rollcap").innerHTML=`擲出 <b class="oswald" style="color:var(--gold);font-size:18px">${roll}</b>`;
    const oc=document.createElement("div");
    oc.className="outcome "+(willTrade?"bad":"good");
    oc.innerHTML=`<div class="ot">${head} ${tail}</div>${deltas.length?`<div class="deltas">${deltas.join("")}</div>`:""}`;
    panel.appendChild(oc);
    refreshHUD();
    if(willTrade){ setAction([{t:"面對交易 ▶",cls:"gold",fn:doTrade}]); }
    else { G._tradeRumor=null; setAction([{t:"繼續 ▶",cls:"gold",fn:processOffseason}]); }
  },850);
}

function returnToTaiwan(){
  if(!hasTaiwanBasketballIdentity(G)){ toast("你目前沒有中華隊／台灣籃球身分路線，無法觸發回台獻技。",3000); return; }
  const ov=overall();
  // 依實力挑一個台灣聯盟（強者去 P+/TPBL，年邁能力下滑者可能只剩 SBL）
  const lg = ov>=72? pick(["P+","TPBL"]) : "SBL";
  const team=randTeam(lg);
  G.league=lg; G.team=team;
  G.contract=makeContract(lg,team,rint(1,2),ov);
  if(teamCityMatchesHome(team,G.home)) grantTitle("homecoming");
  G._teamsPlayed=(G._teamsPlayed||new Set()); G._teamsPlayed.add(team);
  recordLeagueTeamForJourneyman(G.league,G.team);
  addHeat(6); G.morale=clamp(G.morale+8,0,100);
  // 已直接簽約，跳過後續自由市場步驟（避免又重簽）
  G.offseason=(G.offseason||[]).filter(x=>x!=="freeAgency"&&x!=="overseasOffer"&&x!=="trade");
  toast(`旅外歸來！回台加盟 ${team}（${lname(lg)}）`);
  processOffseason();
}

/* ---------- 瓊斯盃畫面 ---------- */
function jonesTeamTag(team){
  const t=JONES_TEAMS[team]||{flag:"🏀",c:"#FF6A2C"};
  const light=isLightColor(t.c), ink=light?"#17171C":"#fff";
  return `<span class="jones-team-tag" style="background:${t.c};color:${ink}">${t.flag} ${team}</span>`;
}
function jonesStandTable(group){
  const J=G._jones, st=J.st, rank=jonesRank(group,st);
  const rows=rank.map((t,i)=>{
    const me=t===J.team, adv=i<=1;
    const fl=(JONES_TEAMS[t]||{}).flag||"";
    return `<tr class="${me?"me":""} ${adv?"adv":""}">
      <td>${i+1}</td>
      <td class="l"><span class="flg">${fl}</span>${t}</td>
      <td>${st[t].w}</td><td>${st[t].l}</td>
      <td>${st[t].pf-st[t].pa>0?"+":""}${st[t].pf-st[t].pa}</td>
      <td>${adv?`<span class="qual">晉級</span>`:""}</td>
    </tr>`;
  }).join("");
  return `<div class="label" style="margin-bottom:2px">${group} 組 · 預賽排名</div>
    <table class="jones-table">
      <tr><th>#</th><th class="l">隊伍</th><th>勝</th><th>敗</th><th>得失</th><th></th></tr>
      ${rows}
    </table>`;
}
function jonesScoreboard(res){
  const meT=G._jones.team, oppT=res.opp;
  const meC=(JONES_TEAMS[meT]||{}).c, opC=(JONES_TEAMS[oppT]||{}).c;
  const meFl=(JONES_TEAMS[meT]||{}).flag||"", opFl=(JONES_TEAMS[oppT]||{}).flag||"";
  return `<div class="jones-scoreboard">
    <div class="sb-team ${res.win?"win":"lose"}">
      <div class="fl">${meFl}</div><div class="nm">${meT}</div>
      <div class="sc">${res.us}</div>
    </div>
    <div class="sb-mid"><div class="vs">VS</div><div class="rs ${res.win?"w":"l"}">${res.win?"勝":"敗"}</div></div>
    <div class="sb-team ${res.win?"lose":"win"}">
      <div class="fl">${opFl}</div><div class="nm">${oppT}</div>
      <div class="sc">${res.them}</div>
    </div>
  </div>`;
}
function jonesKeyPlay(res){
  const l = res.line, big = [];
  const diff = Math.abs(res.us - res.them); // 計算真實分差
  
  // 個人表現描述 (增加更浮誇與多元的級距)
  if(l.p >= 30) big.push("宛如砍分機器般無解");
  else if(l.p >= 24) big.push("得分火力全開");
  
  if(l.a >= 10) big.push("傳球出神入化");
  else if(l.a >= 7) big.push("精準串聯全隊");
  
  if(l.rb >= 15) big.push("稱霸禁區籃板");
  else if(l.rb >= 10) big.push("籃板卡位兇猛");
  
  if(l.s >= 4) big.push("防守端頻頻神抄截");
  else if(l.s >= 3) big.push("抄截如影隨形");
  
  if(l.b >= 4) big.push("化身禁區守護神");
  else if(l.b >= 3) big.push("送出精彩火鍋");

  // 組合個人評語
  const hi = big.length ? `此役你${big.join("、")}，` : "此役你穩紮穩打、默默做出貢獻，";
  const teamName = `中華${G._jones.team==="中華藍"?"藍":"白"}`;
  
  // 賽果描述 (依據真實分差給予不同情境)
  let tone = "";
  if (res.win) {
    if (diff >= 20) tone = `秋風掃落葉般以 ${diff} 分之差狂勝對手`;
    else if (diff >= 10) tone = `穩穩掌控局勢，以 ${diff} 分之差順利收下勝利`;
    else if (diff >= 4) tone = `在激烈拉鋸中頂住壓力，以 ${diff} 分差驚險勝出`;
    else tone = `在讀秒階段展現強大抗壓性，以 ${diff} 分之差驚險氣走對手`;
  } else {
    if (diff >= 20) tone = `全隊攻防失序，以 ${diff} 分之差慘遭對手血洗`;
    else if (diff >= 10) tone = `一路落居下風，最終以 ${diff} 分之差不敵對手`;
    else if (diff >= 4) tone = `與對手纏鬥至末節，可惜仍以 ${diff} 分之差遺憾落敗`;
    else if (diff === 1) tone = `在最後關頭錯失逆轉機會，以 1 分之差飲恨痛失好局`;
    else tone = `激戰到最後一刻，僅以 ${diff} 分之差惜敗`;
  }
  
  return `${hi}${teamName}最終${tone}。`;
}

function jonesResolveOption(i){
  const J=G._jones, ev=J.event, opt=ev.o[i];
  const panel=$("#jevpanel");
  panel.innerHTML=`<div class="label">命運骰</div>
    <div class="dice-stage"><div class="die rolling" id="jdie">${pipHTML(1)}</div>
      <div class="roll-caption" id="jrollcap">擲骰中…</div></div>`;
  const die=$("#jdie"); let ticks=0;
  const iv=setInterval(()=>{ die.innerHTML=pipHTML(1+Math.floor(rawRnd()*6)); if(++ticks>10){} },70);
  setTimeout(()=>{
    clearInterval(iv);
    const roll=rint(1,6);
    die.classList.remove("rolling"); die.innerHTML=pipHTML(roll);
    const outcome=opt.f(roll);
    sanitizeOutcomeForRoll(outcome,roll);
    if(roll<=2 && outcome.attr){ for(const k in outcome.attr){ if(outcome.attr[k]>0) outcome.attr[k]=chance(.5)?-1:0; } }
    applyEffects(outcome);
    if(typeof outcome.jb==="number") J.boost=clamp((J.boost||0)+outcome.jb, -.15, .22);
    const deltas=[];
    if(outcome.attr) for(const k in outcome.attr){const d=outcome.attr[k]; if(!d) continue;
      deltas.push(`<span class="delta ${d>=0?"pos":"neg"}">${ATTR_LABEL[k]} ${d>=0?"+":""}${d}</span>`);}
    if(outcome.health)deltas.push(`<span class="delta ${outcome.health>=0?"pos":"neg"}">健康 ${outcome.health>=0?"+":""}${outcome.health}</span>`);
    if(outcome.fame)deltas.push(`<span class="delta ${outcome.fame>=0?"pos":"neg"}">熱度 ${outcome.fame>=0?"+":""}${outcome.fame}</span>`);
    if(outcome.morale)deltas.push(`<span class="delta ${outcome.morale>=0?"pos":"neg"}">士氣 ${outcome.morale>=0?"+":""}${outcome.morale}</span>`);
    if(typeof outcome.jb==="number"&&outcome.jb)deltas.push(`<span class="delta ${outcome.jb>=0?"pos":"neg"}">氣勢 ${outcome.jb>=0?"+":""}${Math.round(outcome.jb*100)}%</span>`);
    const good=tier(roll)==="high", bad=tier(roll)==="low";
    $("#jrollcap").innerHTML=`擲出 <b class="oswald" style="color:var(--gold);font-size:18px">${roll}</b>`;
    const oc=document.createElement("div");
    oc.className="outcome "+(good?"good":bad?"bad":"");
    oc.innerHTML=`<div class="ot">${outcome.text}</div>${deltas.length?`<div class="deltas">${deltas.join("")}</div>`:""}`;
    panel.appendChild(oc);
    refreshHUD();
    setAction([{t:"進入比賽 ▶",cls:"gold",fn:jonesAdvance}]);
  },850);
}
