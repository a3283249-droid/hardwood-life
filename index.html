function draftResultsHTML(){
  const hasPendingNbaPick=(G._offers||[]).some(o=>o&&o.league==="NBA"&&o.pick);
  const visibleOffers=hasPendingNbaPick?(G._offers||[]).filter(o=>o&&o.league==="NBA"&&o.pick):(G._offers||[]);
  const offersHTML=visibleOffers.map(o=>draftOfferCardHTML(o,(G._offers||[]).indexOf(o))).join("");
  const combine=G._combineData?`<div class="usrank-line">NBA Combine：綜合 <b>${G._combineData.score}</b> · 全場 <b>#${G._combineData.overallRank}/${G._combineData.fieldSize}</b> · ${nbaCombineStockText(G._combineData)}</div>`:"";
  const miss=G._nbaUndrafted?`<div class="panel" style="border-color:rgba(242,84,91,.5)"><div class="label" style="color:var(--red)">NBA DRAFT · UNDRAFTED</div><p class="muted mt8">兩輪 60 個順位沒有唱名，但職業評估沒有因此歸零。下方是選秀夜後實際出現的後續機會。</p></div>`:"";
  const rights=activeNbaDraftRights();
  const rightsNote=rights&&rights.status==="overseas-active"?`<div class="over-note"><b>🔒 NBA Draft Rights 保留：${rights.team}</b><span>你選擇改打其他職業聯盟，因此不會在下一年重新參加 NBA 選秀。未來若要進入 NBA，簽約權仍由 ${rights.team} 優先持有。</span></div>`:"";
  return `<div class="season-hd"><span class="stage">選秀結果 · 選擇下家</span><span class="yr">${G.year}</span></div>
    ${combine}${miss}${rightsNote}
    <div class="panel center"><div class="label">${hasPendingNbaPick?"NBA 選秀唱名":"各聯盟順位與報價"}</div>
      <h2 style="font-size:20px;margin:8px 0">選秀結果公布</h2>
      <p class="muted">${hasPendingNbaPick?"先處理 NBA 中選結果；其他聯盟機會會在你做完 NBA 簽約決定後才顯示。":"選擇要加盟的聯盟與球隊，展開職業生涯。"}</p></div>
    ${offersHTML}`;
}
function draftOfferCardHTML(o,i){
  const isNBA = o.league==="NBA";
  // 若本屆已被 NBA 球隊正式選中，必須先處理該隊的簽約／拒簽與 Draft Rights，
  // 不能直接點另一張海外 Offer 繞過 NBA 選秀權利流程。
  const hasPendingNbaPick=(G._offers||[]).some(x=>x&&x.league==="NBA"&&x.pick);
  const blockedByNbaRights=!isNBA&&hasPendingNbaPick;
  const pickTxt = o.league==="NBA"?(o.pick?`第 ${nbaDraftRound(o.pick)} 輪 · 總第 ${o.pick} 順位`:"落選"):
    o.pick? pickLabel(o.pick) : "海外簽約";
  const reco = o.pick===1 || o.league==="NBA" || o.league==="日職 B.League";
  const tc = teamColors(o.team);
  const btnTextCol = isLightColor(tc.p) ? "#17171C" : "#FFFFFF";
  const cardStyle = isNBA ? "" : `border-left: 5px solid ${tc.p}; background: linear-gradient(145deg, var(--surface2) 65%, ${tc.p}15 100%);`;
  const crown = isNBA ? `<span class="nba-crown">🏀 最高殿堂在招手</span>` : "";
  return `<div class="offer ${reco?"reco":""} ${isNBA?"nba":""}" style="${cardStyle}">
    <div class="offer-hd"><div><div class="offer-lg">${lname(o.league)}${crown}</div><div class="offer-team" style="color: ${tc.p}; text-shadow: 0 0 10px ${tc.p}30;">${o.team}</div></div>
      <span class="offer-tag">${o.tag||pickTxt}</span></div>
    <div class="offer-body">
      ${o.source==="nbaUndraftedFallback"?`<div>方式 <b>落選後邀約</b></div>`:`<div>順位 <b>${pickTxt}</b></div>`}
      <div>年薪 <b>${fmtMoney(o.salary)}</b></div>
      <div>合約 <b>${o.league==="NBA"&&o.pick&&nbaDraftRound(o.pick)===1?"2+1+1（4 年）":`${o.years} 年`}</b>${o.league==="NBA"&&o.pick&&nbaDraftRound(o.pick)===1?`<span style="display:block;font-size:10px;color:var(--faint)">第 3、4 年為球隊選項</span>`:""}</div>
    </div>
    <button class="btn small" data-draft="${i}" ${blockedByNbaRights?"disabled":``} style="background: ${tc.p}; color: ${btnTextCol}; box-shadow: 0 4px 12px -6px ${tc.p}; border: 1px solid ${tc.s}40;">${blockedByNbaRights?"先處理 NBA 中選球隊":o.league==="NBA"?"觀看中選時刻 ▶":o.source==="nbaUndraftedFallback"?"接受發展聯盟邀約 ▶":"加盟 "+o.team}</button>
  </div>`;
}
/* ---------- 海外報價（合約中往更高聯盟） ---------- */
function overseasOfferHTML(){
  const o=G._overseas;

      <div class="label" style="color:var(--gold)">📋 ${o.team} 球探報告</div>
      <div class="event-text" style="line-height:1.85;margin-top:6px">${scoutReportText(G._scoutReport)}</div>

    : (callUp?`你在發展聯盟的優異表現，讓 <b style="color:var(--ink)">${o.team}</b> 決定將你 <b style="color:var(--gold)">升上 ${lname("NBA")}</b>！`:`你的表現吸引了 <b style="color:var(--ink)">${lname(o.league)}</b> 球隊！`);
  const closing = roleUp

  return `<div class="season-hd"><span class="stage">${callUp?lname("NBA")+" CALL-UP":"海外報價"}</span><span class="yr">${G.year}</span></div>
    <div class="panel center">
      <div style="font-size:40px">${roleUp?"🛡️":callUp?"🎉":"✈️"}</div>
      <div class="label" style="color:var(--orange)">${roleUp?"角色球員的價值被看見了！":callUp?"發展聯盟的努力被看見了！":"更高殿堂的召喚"}</div>
      <h2 style="font-size:20px;margin:8px 0">${lname(o.league)} · ${o.team}</h2>
      ${reportBox}
      <p class="muted">${headline}他們開出 <b>${o.years}</b> 年、年薪 <b style="color:var(--gold)">${fmtMoney(o.salary)}</b> 的合約。<br>${closing}</p>
      <div class="opts mt16">
        <button class="btn gold" id="acceptOverseas">${roleUp?"簽下雙向合約 🛡️":callUp?"接受升上"+lname("NBA")+" 🏀":"接受挑戰 ✈️"}</button>
        <button class="btn ghost" id="declineOverseas">${callUp?"婉拒，留在發展聯盟":"婉拒，續留原隊"}</button>
      </div>
    </div>`;
}

/* ---------- 生涯數據總表 ---------- */
let statsTab="pro";
function renderStats(){
  app.innerHTML=hudHTML({hideAttrs:true})+`<div class="wrap" id="stage"></div>`+actionbarHTML();
  const stage=$("#stage");
  const tabs=[["pro","職業"],["amateur","學生"],["intl","國際賽"]];
  const rows=statsTab==="intl"?intlTableHTML():seasonTableHTML(statsTab);
  stage.innerHTML=`<div class="season-hd"><span class="stage">生涯數據總表</span></div>
    <div class="tab-bar">${tabs.map(([k,l])=>`<button class="tab ${statsTab===k?"on":""}" data-tab="${k}">${l}</button>`).join("")}</div>
    <div class="tbl-wrap">${rows}</div>
    <div class="panel mt12">${careerSummaryHTML()}</div>
    <div class="panel center mt12">
      <div class="label">生涯結算圖</div>
      <p class="small mt8 mb8">完整分聯盟數據、榮譽與年表，一鍵下載分享。</p>
      <div class="tab-bar" style="justify-content:center;margin-bottom:8px">
        <button class="tab sc-mode" data-scmode="hot">🔥 熱區</button>
        <button class="tab sc-mode" data-scmode="dots">🎯 落點</button>
      </div>
      <canvas id="summaryCanvas" style="width:100%;margin-top:6px"></canvas>
      <button class="btn gold mt12" id="dlSummary">下載生涯結算圖 📄</button>
    </div>`;
  stage.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{statsTab=b.dataset.tab;renderStats();}));
  const sc=$("#summaryCanvas"); if(sc) drawCareerSummary(sc);
  const dl=$("#dlSummary"); if(dl) dl.addEventListener("click",downloadSummary);
  document.querySelectorAll(".sc-mode").forEach(b=>{
    b.classList.toggle("on", b.dataset.scmode===shotChartMode);
    b.addEventListener("click",()=>{ shotChartMode=b.dataset.scmode;
      document.querySelectorAll(".sc-mode").forEach(o=>o.classList.toggle("on",o.dataset.scmode===shotChartMode));
      const c=$("#summaryCanvas"); if(c) drawCareerSummary(c); });
  });
  setAction([{t:"返回",cls:"ghost",fn:()=>{G.phase=G._prevPhase||"training";render();}}]);
  bindActionbar();
  window.scrollTo(0,0);
}
function seasonTableHTML(kind){
  const rows=G.seasonHistory.filter(s=> kind==="pro"?s.stage==="pro":s.stage!=="pro");
  if(!rows.length) return `<p class="muted center" style="padding:24px">尚無${kind==="pro"?"職業":"學生"}賽季資料。</p>`;
  const head=`<tr><th class="l">賽季</th><th class="l">隊伍</th><th>出賽</th><th>得分</th><th>籃板</th><th>助攻</th><th>抄截</th><th>阻攻</th><th>FG%</th><th>3P%</th><th class="l">榮譽 / 傷勢</th></tr>`;
  const body=rows.map(s=>{
    const inj=s.injury&&s.injury.major;
    const awards=s.awards.join(" · ");
    const awardsHtml=awards?`<span style="color:var(--gold)">${awards}</span>`:"";
    const injTag=inj?`<span style="color:var(--red);font-weight:700">🩹 ${injLabel(s.injury)}</span>`:"";
    const last=[awardsHtml,injTag].filter(Boolean).join(" · ")||"—";
    const rc=inj?"color:var(--red);font-weight:700":"";
    return `<tr class="${s.champion?"champ":""}">
    <td class="l" style="${rc}">${s.champion?`<span style="color:var(--gold)">★</span> `:""}${s.year}</td><td class="l" style="color:${inj?"var(--red)":"var(--dim)"}">${s.stage==="pro"?s.league:s.team}</td>
    <td style="${rc}">${s.gp}</td><td style="color:var(--orange);font-weight:600">${s.ppg}</td><td>${s.rpg}</td><td>${s.apg}</td>
    <td>${s.spg}</td><td>${s.bpg}</td><td>${s.fg}</td><td>${s.tp}</td>
    <td class="l" style="font-size:10.5px">${last}</td></tr>`;
  }).join("");
  return `<table class="stats">${head}${body}</table>`;
}
function intlTableHTML(){
  if(!G.intlHistory.length) return `<p class="muted center" style="padding:24px">尚未參加國際賽。</p>`;
  const head=`<tr><th class="l">年份</th><th class="l">代表隊 / 賽事</th><th>得分</th><th>籃板</th><th>助攻</th><th class="l">成績</th></tr>`;
  const body=G.intlHistory.map(r=>`<tr><td class="l">${r.year}</td><td class="l" style="color:var(--dim)">${r.team||"中華隊"} · ${r.event}</td>
    <td style="color:var(--orange);font-weight:600">${r.ppg}</td><td>${r.rpg}</td><td>${r.apg}</td>
    <td class="l" style="color:var(--gold)">${[r.medal,r.mvp?"MVP":"",r.bestFive&&!r.mvp?"最佳五人":""].filter(Boolean).join(" · ")||"—"}</td></tr>`).join("");
  return `<table class="stats" style="min-width:420px">${head}${body}</table>`;
}
function careerSummaryHTML(){
  const t=careerTotals(),c=careerAwardCounts();
  const aw=Object.entries(c).filter(([k,v])=>v>0).map(([k,v])=>`<span class="badge">${k} ×${v}</span>`).join("");
  return `<div class="label">生涯總結</div>
    <div class="statline mt8"><div class="s"><div class="v">${t.seasons}</div><div class="l">總賽季</div></div>
      <div class="s"><div class="v">${t.gpAll}</div><div class="l">總出賽</div></div>
      <div class="s"><div class="v">${t.totalPts.toLocaleString()}</div><div class="l">生涯總得分</div></div>
      <div class="s"><div class="v">${t.peakOv}</div><div class="l">巔峰OVR</div></div></div>
    <div class="statline"><div class="s"><div class="v">${t.ppg}</div><div class="l">生涯場均分</div></div>
      <div class="s"><div class="v">${t.rpg}</div><div class="l">場均籃板</div></div>
      <div class="s"><div class="v">${t.apg}</div><div class="l">場均助攻</div></div>
      <div class="s"><div class="v" style="color:var(--gold)">${fmtMoney(G.money)}</div><div class="l">生涯總薪資</div></div></div>
    <div class="statline"><div class="s"><div class="v">${Math.round(G.fame||0)}</div><div class="l">最終熱度</div></div>
      <div class="s"><div class="v" style="color:var(--gold)">${Math.round(G.legacy||0)}</div><div class="l">生涯聲望</div></div>
      <div class="s" style="grid-column:span 2"><div class="v" style="font-size:16px">${legacyTier(G.legacy||0)}</div><div class="l">聲望等級</div></div></div>

/* ---------- 生涯時間軸：把連續同隊的賽季合併成「效力時期」 ---------- */
function teamStoryForStint(st){
  if(!st||st.stage!=="pro"||!POSTSEASON_FORMATS[st.league])return null;
  const lg=st.league,team=st.team,start=Number(st.startYear),end=Number(st.endYear),now=Number(G.year)||end;
  if(start>2026)ensureLeagueSeason(lg,start-1);for(let y=start;y<=Math.min(end,now);y++)ensureLeagueSeason(lg,y);
  for(let y=end+1;y<=Math.min(end+3,now);y++)ensureLeagueSeason(lg,y);
  const hist=ensureLeagueWorld().history.filter(h=>h.league===lg).sort((a,b)=>a.year-b.year);
  const rowAt=y=>{const h=hist.find(x=>Number(x.year)===Number(y));if(!h)return null;const r=(h.teams||[]).find(x=>x.team===team);return r?{...r,year:h.year,champion:h.champion}:null;};
  const pre=rowAt(start-1),during=[];for(let y=start;y<=end;y++){const r=rowAt(y);if(r)during.push(r);}
  const after=[];for(let y=end+1;y<=Math.min(end+3,now);y++){const r=rowAt(y);if(r)after.push(r);}
  if(!during.length&&!pre&&!after.length)return null;
  const avgWins=during.length?round(during.reduce((n,r)=>n+(Number(r.w)||0),0)/during.length,1):null;
  const best=during.length?during.slice().sort((a,b)=>b.w-a.w)[0]:null,titles=during.filter(r=>r.champion===team).length;
  const first=during[0]||null,last=during[during.length-1]||null,post=after[after.length-1]||null;
  const joinDelta=pre&&first?(first.w-pre.w):null;
  const summary=[pre?`加盟前 ${pre.w}-${pre.l}`:null,avgWins!=null?`效力期均 ${avgWins} 勝`:null,best?`最高 ${best.w}-${best.l}`:null,titles?`🏆 ${titles} 冠`:null].filter(Boolean).join(" · ");
  let afterText="";if(post){const prof=franchiseProfile(lg,team,post.year+1);afterText=`離隊後 ${after.length} 季：${post.w}-${post.l} · ${prof.statusLabel}`;}
  return {pre,during,after,avgWins,best,titles,first,last,joinDelta,summary,afterText};
}
/* ---------- 生涯時間軸：把連續同隊的賽季合併成「效力時期」 ---------- */
function careerStints(){
  const h=G.seasonHistory||[],stints=[];
  h.forEach(s=>{
    const last=stints[stints.length-1];
    if(last && last.team===s.team && last.league===s.league){last.endYear=s.year;last.seasons++;(s.awards||[]).forEach(a=>last.awards.push(a));}
    else stints.push({team:s.team,league:s.league,stage:s.stage,startYear:s.year,endYear:s.year,seasons:1,awards:[...(s.awards||[])]});
  });
  stints.forEach(st=>st.teamStory=(typeof teamStoryForStint==="function"?teamStoryForStint(st):null));return stints;
}

/* ---------- 中華隊：把國際賽經歷整理成白/藍兩件球衣 ---------- */
function nationalStints(){
  const jones=G.jonesHistory||[];
  const intl=G.intlHistory||[];
  const medalOf=p=>{ if(!p)return null; if(/冠/.test(p))return "金牌"; if(/亞/.test(p))return "銀牌"; if(/季|殿|銅/.test(p))return "銅牌"; return null; };
  const add=(g,n)=>{ g.hon[n]=(g.hon[n]||0)+1; };
  const H_ORDER=["金牌","銀牌","銅牌","賽會MVP","瓊斯盃MVP","瓊斯盃最佳五人"];
  const H_MAJOR=new Set(["金牌","賽會MVP","瓊斯盃MVP"]);
  const rank=a=>{const i=H_ORDER.indexOf(a);return i<0?99:i;};
  const mk=g=>{
    if(!g.years.length) return null;
    const ys=[...g.years].sort((a,b)=>a-b);
    const yr=ys[0]===ys[ys.length-1]?`${ys[0]}`:`${ys[0]}~${ys[ys.length-1]}`;
    const honors=Object.keys(g.hon).sort((a,b)=>rank(a)-rank(b))
      .map(n=>({name:n+(g.hon[n]>1?` ×${g.hon[n]}`:""),major:H_MAJOR.has(n)}));
    return {team:g.team,white:!!g.white,usa:!!g.usa,yr,apps:g.years.length,honors};
  };

  // 美國華裔若已選擇 USA Basketball，退休頁只顯示美國隊正式國際賽履歷；舊版存檔殘留的中華藍/白資料不再混入。
  if(isUsaNationalPath(G)){
    const usa={team:"美國隊",usa:true,white:false,years:[],hon:{}};
    intl.filter(r=>r&&r.team==="美國隊").forEach(r=>{
      usa.years.push(r.year);
      const m=medalOf(r.place); if(m) add(usa,m);
      if(r.mvp) add(usa,"賽會MVP");
    });
    const u=mk(usa);
    return u?[u]:[];
  }

  const grp={ white:{team:"中華白",white:true,years:[],hon:{}}, blue:{team:"中華藍",white:false,years:[],hon:{}} };
  // 瓊斯盃：用 jonesHistory 的 team 精準歸屬藍/白
  jones.forEach(j=>{
    const g=(j.team==="中華白")?grp.white:grp.blue;
    g.years.push(j.year);
    const m=medalOf(j.place); if(m) add(g,m);
    if(j.mvp) add(g,"瓊斯盃MVP"); else if(j.bestFive) add(g,"瓊斯盃最佳五人");
  });
  // 一般中華隊國際賽一律 senior → 中華藍；明確排除美國隊紀錄。
  intl.filter(r=>r&&r.team!=="美國隊"&&!/瓊斯盃|中華白|中華藍/.test(r.event||"")).forEach(r=>{
    grp.blue.years.push(r.year);
    const m=medalOf(r.place); if(m) add(grp.blue,m);
    if(r.mvp) add(grp.blue,"賽會MVP");
  });
  const out=[]; const w=mk(grp.white),b=mk(grp.blue);
  if(w)out.push(w); if(b)out.push(b);
  return out;
}

function leagueAggregates(){
  const byLg={}; const order=[];
  G.seasonHistory.filter(s=>s.stage==="pro").forEach(s=>{
    if(!byLg[s.league]){byLg[s.league]={league:s.league,yrs:0,gp:0,sp:0,pts:0,reb:0,ast:0,stl:0,blk:0,fgN:0,tpN:0,fgD:0};order.push(s.league);}
    const b=byLg[s.league]; b.yrs++; b.gp+=s.gp; b.pts+=s.ppg*s.gp; b.reb+=s.rpg*s.gp; b.ast+=s.apg*s.gp;
    b.stl+=s.spg*s.gp; b.blk+=s.bpg*s.gp; b.fgN+=s.fg*s.gp; b.tpN+=s.tp*s.gp; b.fgD+=s.gp;
  });
  return order.map(l=>{const b=byLg[l];const g=b.gp||1;
    return {league:l,yrs:b.yrs,gp:b.gp,ppg:round(b.pts/g,1),rpg:round(b.reb/g,1),apg:round(b.ast/g,1),
      spg:round(b.stl/g,1),bpg:round(b.blk/g,1),fg:Math.round(b.fgN/b.fgD),tp:Math.round(b.tpN/b.fgD)};});

function _isInAppBrowser(){

function _openCanvasPreview(dataUrl,filename,label="圖片"){
  const safeTitle=String(filename||label).replace(/[<>&"]/g,"");
  let overlay=document.getElementById&&document.getElementById("canvasPreviewOverlay");
  if(overlay) overlay.remove();
  overlay=document.createElement("div"); overlay.id="canvasPreviewOverlay";
  overlay.style.cssText="position:fixed;inset:0;z-index:120;background:rgba(5,10,18,.98);overflow:auto;padding:14px;box-sizing:border-box;text-align:center;color:#E9EFF7";
  overlay.innerHTML=`<div style="max-width:760px;margin:0 auto"><div style="position:sticky;top:0;z-index:2;background:rgba(5,10,18,.96);padding:8px 0 12px"><button type="button" id="closeCanvasPreview" class="btn ghost" style="max-width:360px;margin:0 auto">← 返回遊戲／關閉預覽</button><p style="font-size:13px;line-height:1.6;color:#9DB0CC;margin:8px 0 0">${safeTitle}<br>長按下方${label}即可儲存到照片。</p></div><img src="${dataUrl}" alt="${safeTitle}" style="width:100%;height:auto;display:block;border-radius:12px"></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay&&overlay.remove();
  const btn=document.getElementById&&document.getElementById("closeCanvasPreview"); if(btn)btn.onclick=close;
  overlay.addEventListener&&overlay.addEventListener("click",e=>{if(e.target===overlay)close();});
  toast(`已開啟${label}預覽；儲存後可按「返回遊戲」繼續下載其他內容`);
  return true;
}
function saveCanvasPng(cv, filename, label="生涯結算圖"){
  if(!cv)return;
  let dataUrl;
  try{ dataUrl=cv.toDataURL("image/png"); }catch(e){ toast("此環境無法輸出圖片"); return; }

  // iOS Safari 與部分 LINE / IG / Facebook WebView 對 <a download> 支援不完整；
  // 直接改成可長按儲存的圖片頁，避免按鈕看似沒反應。
  const probe=document.createElement("a");
  if(_isIOS() || _isInAppBrowser() || !("download" in probe)){
    if(!_openCanvasPreview(dataUrl,filename,label)) toast("此環境無法直接下載，請使用瀏覽器開啟後再儲存");
    return;
  }

  const clickBlob=(blob)=>{
    if(!blob){
      try{ probe.href=dataUrl; probe.download=filename; document.body.appendChild(probe); probe.click(); probe.remove(); toast(`已下載${label}！`); }
      catch(e){ _openCanvasPreview(dataUrl,filename,label); }
      return;
    }
    const url=URL.createObjectURL(blob);
    try{
      const a=document.createElement("a"); a.href=url; a.download=filename; a.rel="noopener";
      document.body.appendChild(a); a.click(); a.remove(); toast(`已下載${label}！`);
      setTimeout(()=>URL.revokeObjectURL(url),2000);
    }catch(e){
      URL.revokeObjectURL(url); _openCanvasPreview(dataUrl,filename,label);
    }
  };
  try{
    if(typeof cv.toBlob==="function") cv.toBlob(clickBlob,"image/png");
    else clickBlob(null);
  }catch(e){ clickBlob(null); }
}

/* ---------- Action bar 綁定 ---------- */
let _actions=[];
function setAction(actions){_actions=actions;const bar=$("#abar");if(bar)bindActionbar();}
function bindActionbar(){
  const bar=$("#abar");if(!bar)return;
  let html="";
  // 統一的「數據總表」入口
  const showStatsBtn=(G&&G.phase!=="stats"&&G.phase!=="end"&&(G.seasonHistory.length>0));
  // 依 phase 決定主要按鈕
  const phaseBtns=defaultPhaseActions();
  const acts=_actions.length?_actions:phaseBtns;
  acts.forEach((a,i)=>{html+=`<button class="btn ${a.cls||""}" data-act="${i}" ${a.disabled?"disabled":""}>${a.t}</button>`;});
  if(showStatsBtn) html=`<button class="iconbtn" data-stats="1">📊</button>`+html;
  bar.innerHTML=html;
  bar.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>acts[parseInt(b.dataset.act)].fn()));
  const sb=bar.querySelector("[data-stats]");if(sb)sb.addEventListener("click",()=>{G._prevPhase=G.phase;G.phase="stats";render();});
  // 各 phase 專屬事件（offer/決策等）
  bindPhaseSpecific();
}
function defaultPhaseActions(){
  if(!G)return [];
  switch(G.phase){
    case "intro": return [{t:"踏上球場，開始高中生涯 ▶",cls:"gold",fn:startSeason}];
    case "decline": return [{t:"接受現實，繼續前進 ▶",cls:"gold",fn:afterDeclineCard}];
    case "commit": return [{t:"開始新篇章 ▶",cls:"gold",fn:afterCommitCard}];
    case "allocate": {const ok=allocationCanCommit(G);return [{t:ok?"完成分配，開始賽季 ▶":`尚有 ${G._alloc&&G._alloc.spLeft||0} 點可分配`,cls:"gold",fn:commitAllocation,disabled:!ok}];}

      h.min=r.height.min;h.max=r.height.max;h.value=customBody.height;const wr=bodyWeightRange(pos,Number(h.value));w.min=wr.min;w.max=wr.max;w.value=clamp(customBody.weight,wr.min,wr.max);ws.min=Number(h.value)+r.wingspan.minOffset;ws.max=Number(h.value)+r.wingspan.maxOffset;ws.value=clamp(customBody.wingspan,Number(ws.min),Number(ws.max));
      customBody=normalizeBody(pos,{height:+h.value,weight:+w.value,wingspan:+ws.value});
      $("#mpHeightVal").textContent=customBody.height+" CM";$("#mpWeightVal").textContent=customBody.weight+" KG";$("#mpWingspanVal").textContent=customBody.wingspan+" CM";
      $("#mpHeightMin").textContent=r.height.min;$("#mpHeightMax").textContent=r.height.max;$("#mpWeightMin").textContent=wr.min;$("#mpWeightMax").textContent=wr.max;$("#mpWingspanMin").textContent=ws.min;$("#mpWingspanMax").textContent=ws.max;[h,w,ws].forEach(setRangeVisual);renderImpact();renderAttrs();
    }
    ["mpHeight","mpWeight","mpWingspan"].forEach(id=>$("#"+id).oninput=()=>{customBody=normalizeBody(pos,{height:+$("#mpHeight").value,weight:+$("#mpWeight").value,wingspan:+$("#mpWingspan").value});syncBody();});syncBody();
    const resetBtn=$("#creationAttrReset");if(resetBtn)resetBtn.onclick=()=>{customAttr=resetCreationAttributes(pos,creationBg);renderAttrs();};
  }
  function renderModePanel(){
    $("#posDesc").textContent=`位置基礎側重：${ATTR_KEYS.filter(k=>POSITIONS[pos].w[k]>=1.2).map(k=>ATTR_LABEL[k]).join("、")}。${mode==="myplayer"?(creationBg==="local"?"本土高中起點的基礎成熟度較低，但 36 點自由配點、隱藏天賦與最終發展機會不因背景被削減。":"你可以用自由點數重新塑造球風。") : "CLASSIC 只選位置，其餘一切隨機。"}`;
    modePanel.innerHTML=mode==="myplayer"?myPlayerHTML():classicHTML();if(mode==="myplayer")renderMyPlayerBindings();
    const nextBtn=$("#builderNext");if(nextBtn)nextBtn.textContent=mode==="classic"?"開始籃球人生 ▶":"查看 Build 結果 ▶";
  }
  renderPositions();renderModePanel();
  app.querySelectorAll("[data-career-mode]").forEach(b=>b.onclick=()=>{const next=b.dataset.careerMode;if(next===mode)return;mode=next;_startMode=mode;app.querySelectorAll("[data-career-mode]").forEach(x=>x.classList.toggle("on",x===b));if(mode==="myplayer"&&(!existingDraft||existingDraft.mode!=="myplayer")){customBody=defaultBodyForPosition(pos);customAttr=creationBaseAttr(pos,creationBg);}classicProfile=null;renderModePanel();});
  $("#builderBack").onclick=()=>{_creationDraft={identity:{...identity},mode,pos,creation:mode==="myplayer"?{mode:"myplayer",...customBody,attr:{...customAttr},favoriteNbaTeam:identity.favoriteNbaTeam||""}:{mode:"classic",favoriteNbaTeam:identity.favoriteNbaTeam||""}};renderStart(identity)};
  $("#builderNext").onclick=()=>{
    if(mode==="classic"){
      const creation={...prepareClassicCreation(pos,identity.bg,identity.seed),favoriteNbaTeam:identity.favoriteNbaTeam||""};
      _creationDraft={identity:{...identity},mode,pos,creation};
      newGame(identity.name,pos,identity.home,identity.jersey,identity.seed,identity.bg,creation);
      _creationDraft=null;
      return;
    }
    const body=normalizeBody(pos,customBody),attr=normalizeCreationAttributes(pos,body,customAttr,creationBg),analysis=analyzeCreationBuild(pos,body,attr),creationComp=creationComparison(pos,body,attr,analysis),legendaryMatch=matchLegendarySignature(pos,body,attr,analysis);
    const creation={mode:"myplayer",...body,attr,creationBuild:analysis,creationBuildName:analysis.name,creationComp,legendaryMatch,favoriteNbaTeam:identity.favoriteNbaTeam||""};
    _creationDraft={identity:{...identity},mode,pos,creation};renderBuildComplete(_creationDraft);
  };
  window.scrollTo(0,0);
}
function renderBuildComplete(draft=_creationDraft){
  if(!draft||!draft.creation){renderStart();return;}_creationDraft=draft;const {identity,mode,pos,creation}=draft,body=normalizeBody(pos,creation),attr=mode==="classic"?(creation.previewAttr||creation.attr):creation.attr,analysis=creation.creationBuild||analyzeCreationBuild(pos,body,attr),comp=creation.creationComp||creationComparison(pos,body,attr,analysis);
  const myLegend=mode==="myplayer"?creation.legendaryMatch:null,classicDef=mode==="classic"&&creation.eggTitle&&typeof TITLE_DEFS!=="undefined"?TITLE_DEFS[creation.eggTitle]:null;
  const legendHTML=myLegend?`<div class="legendary-discovery"><div class="ld-k">✨ LEGENDARY SIGNATURE DISCOVERED</div><div class="ld-title">${_escCreation(myLegend.title)}</div><div class="ld-player">NBA 原型：${_escCreation(formatPlayerTemplateName(myLegend.player))} · 僅為建立紀錄，不增加能力或 Potential。</div></div>`:classicDef?`<div class="legendary-discovery"><div class="ld-k">✨ CLASSIC LEGENDARY EASTER EGG</div><div class="ld-title">${_escCreation(classicDef.name)}</div><div class="ld-player">CLASSIC 命運彩蛋；正式生涯會保留原有效果。</div></div>`:"";
  app.innerHTML=`<div class="wrap creation-compact-page"><div class="creation-step"><span>01 IDENTITY</span><i></i><span>02 BUILDER</span><i></i><b>03 RESULT</b></div><div class="build-complete"><div class="bc-kicker">BUILD COMPLETE</div><div class="bc-name">${_escCreation(identity.name)}</div><div class="bc-meta">#${identity.jersey} · ${POSITIONS[pos].abbr} ${POSITIONS[pos].name} · ${body.height} CM · ${body.weight} KG · WINGSPAN ${body.wingspan} CM</div>
    <div class="bc-build"><div class="bc-kicker">CREATION BUILD</div><div class="title">${_escCreation(analysis.name||creation.creationBuildName||"未定型")}</div><div class="bc-types">主類型：${_escCreation(analysis.primaryLabel||"")}　·　副類型：${_escCreation(analysis.secondaryLabel||"")}</div><div class="ba-tags">${(analysis.strengths||[]).map(x=>`<span class="ba-tag">＋ ${_escCreation(x)}</span>`).join("")}${(analysis.weaknesses||[]).map(x=>`<span class="ba-tag weak">－ ${_escCreation(x)}</span>`).join("")}</div></div>
    <div class="bc-section-title">NBA 球風參考 · CREATION COMPARISON</div>${_creationCompHTML(comp)}<p class="creation-disclaimer">僅代表建立時的身材與場上球風相似，不代表天賦、實力或生涯發展。這套 Creation Comparison 與生涯中的球探報告是兩個獨立系統。</p>
    ${legendHTML}<div class="hidden-talent-card"><span>HIDDEN TALENT · 真正天賦</span><b>???</b></div>
  </div><div class="builder-nav"><button class="btn ghost" id="resultBack">← 返回調整</button><button class="btn gold" id="confirmCreation">開始籃球人生 ▶</button></div></div>`;
  $("#resultBack").onclick=()=>renderCreationBuilderScreen(identity,draft);
  $("#confirmCreation").onclick=()=>{newGame(identity.name,pos,identity.home,identity.jersey,identity.seed,identity.bg,creation);_creationDraft=null;};
  window.scrollTo(0,0);
}

if(!(typeof window!=="undefined" && window.__HARDWOOD_TEST__)) render();

if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}
